      <button type="button" class="btn btn-secondary" id="signal-inputs-same">${tx('amount gleich setzen','Set same amount')}</button>
      <button type="button" class="btn btn-secondary" id="signal-inputs-variant">${tx('compact-Variante wechseln','Switch compact variant')}</button>
    </div>
    <label class="check-row signal-inputs-miss"><input type="checkbox" id="signal-inputs-miss"> <span>${tx('<code>label</code> weglassen','Leave out <code>label</code>')}</span></label>
  </div>
  <div class="sim-card"><h3>PriceTag <span class="hint">(${tx('Kind','child')})</span></h3>
    <div id="signal-inputs-child" aria-live="polite"></div>
    <button type="button" class="btn btn-ghost signal-inputs-write" id="signal-inputs-write">${tx('Im Kind: this.amount.set(0)','In the child: this.amount.set(0)')}</button>
  </div>
  <div class="sim-card"><h3>${tx('Was Angular tut','What Angular does')}</h3>
    <ul class="sim-log" id="signal-inputs-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: „compact-Variante wechseln“ – das nackte Attribut <code>compact</code> liefert den String <code>\'\'</code>, <code>booleanAttribute</code> macht daraus <code>true</code>; <code>compact="false"</code> wird zu <code>false</code>. „amount gleich setzen“ löst nichts aus. Schreiben im Kind scheitert schon beim Kompilieren, ein fehlender Pflicht-Input ebenso.','Try: “Switch compact variant” – the bare attribute <code>compact</code> delivers the string <code>\'\'</code>, <code>booleanAttribute</code> turns it into <code>true</code>; <code>compact="false"</code> becomes <code>false</code>. “Set same amount” triggers nothing. Writing in the child fails at compile time already, and so does a missing required input.')}</p>`,
  init(root){
    const {signal,computed,effect,untracked,watch,log,flash}=NG;
    const ul=$('#signal-inputs-log',root),miss=$('#signal-inputs-miss',root);
    const fmt=v=>new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}).format(v);
    const booleanAttribute=v=>typeof v==='boolean'?v:v!=null&&v!=='false';
    /* Varianten, wie das Eltern-Template compact setzen kann: [Template-Text, gebundener Wert] */
    const VARIANTS=[[null,undefined],['compact',''],['compact="false"','false'],['[compact]="true"',true]];
    let vi=0;
    const amount=signal(3.5,{name:'amount'});            // Signal im Elternteil
    const inAmount=signal(untracked(amount),{name:'input amount'}); // Input-Signal im Kind, von Angular geschrieben
    const inCompact=signal(false,{name:'input compact'});
    const missing=signal(false,{name:'missing'});
    const formatted=computed(()=>fmt(inAmount()),{name:'formatted'});
    const off=watch(ev=>{
      if(ev.type==='same'&&ev.name==='amount')log(ul,`<span class="t">set</span> amount = ${ev.value} – ${tx('gleicher Wert, nichts passiert','same value, nothing happens')}`);
      if(ev.type==='compute'&&ev.name==='formatted')log(ul,`<span class="t">computed</span> formatted = ${esc(ev.value)}`);
    });
    const tpl=()=>{
      const v=VARIANTS[vi][0];
      $('#signal-inputs-tpl',root).textContent=`<app-price-tag\n  [amount]="amount()"${miss.checked?'':'\n  label="Coffee"'}${v?'\n  '+v:''}\n/>`;
    };
    /* Die Bindung [amount]="amount()": Angular schreibt den Wert ins Input-Signal des Kinds */
    const binding=effect(()=>{const v=amount();untracked(()=>{if(v!==inAmount.node.value){inAmount.set(v);log(ul,`<span class="hl">input</span> amount ← ${v}`)}})},{name:'binding'});
    const view=effect(()=>{
      const box=$('#signal-inputs-child',root);
      if(missing()){box.innerHTML=`<p class="signal-inputs-err">NG8008: Required input 'label' from component PriceTag must be specified.</p><p class="hint">${tx('Build bricht ab – die Komponente wird nie erzeugt.','The build fails – the component is never created.')}</p>`;return}
      const c=inCompact();
      box.innerHTML=`<p class="signal-inputs-tag${c?' signal-inputs-compact':''}"><span>Coffee</span> <b>${formatted()}</b></p><p class="hint">compact() = <b>${c}</b></p>`;
      flash(box.firstElementChild);
    },{name:'template'});
    const setVariant=()=>{
      const [txt,val]=VARIANTS[vi];
      if(val===undefined){inCompact.set(false);log(ul,`${tx('keine Bindung','no binding')} → compact() = false (${tx('Startwert','initial value')})`)}
      else{const t=booleanAttribute(val);log(ul,`<span class="hl">input</span> compact ← ${typeof val==='string'?`'${val}'`:val} → booleanAttribute → ${t}`);inCompact.set(t)}
      tpl();
    };
    tpl();
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='signal-inputs-more')amount.update(a=>Math.round((a+1)*100)/100);
      if(b.id==='signal-inputs-same')amount.set(untracked(amount));
      if(b.id==='signal-inputs-variant'){vi=(vi+1)%VARIANTS.length;setVariant()}
      if(b.id==='signal-inputs-write')log(ul,`<span class="signal-inputs-errlog">TS2339: Property 'set' does not exist on type 'InputSignal&lt;number&gt;'.</span>`);
    });
    miss.addEventListener('change',()=>{missing.set(miss.checked);tpl();log(ul,miss.checked?tx('Template ohne label → Compilerfehler','Template without label → compiler error'):tx('label wieder da → Build ok','label back → build ok'))});
    return ()=>{off();binding.destroy();view.destroy()};
  },
  css:`.signal-inputs-tpl{margin:0 0 12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);font:500 .8125rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}.signal-inputs-miss{margin-top:12px}.signal-inputs-tag{display:inline-flex;gap:10px;align-items:baseline;margin:0 0 8px;padding:12px 16px;border:1.5px solid var(--line-strong);border-radius:var(--radius-lg);font-size:1.25rem}.signal-inputs-tag.flash{border-color:var(--brand)}.signal-inputs-compact{padding:4px 10px;font-size:.9375rem}.signal-inputs-err,.signal-inputs-errlog{color:var(--danger);font-weight:700;font-family:var(--font-mono);font-size:.8125rem;overflow-wrap:anywhere}.signal-inputs-err{margin:0 0 6px}.signal-inputs-write{margin-top:8px}`,
  bad:{code:`export class PriceTag implements OnChanges {
  @Input({ required: true }) amount!: number;
  @Input() compact = false;
  formatted = '';

  ngOnChanges(changes: SimpleChanges) {
    if (changes['amount']) {
      this.formatted = format(this.amount);
    }
  }
}`,
    note:tx('Funktioniert, ist aber das alte Muster: <code>!</code> belügt den Typ, <code>formatted</code> muss von Hand nachgezogen werden, und <code>&lt;app-price-tag compact&gt;</code> liefert hier den String <code>\'\'</code> statt <code>true</code>. <code>@Input()</code> ist nicht veraltet, für neuen Code aber nicht mehr die Empfehlung.','Works, but it’s the old pattern: <code>!</code> lies to the type, <code>formatted</code> has to be updated by hand, and <code>&lt;app-price-tag compact&gt;</code> delivers the string <code>\'\'</code> here instead of <code>true</code>. <code>@Input()</code> isn’t deprecated, but it’s no longer the recommendation for new code.')},
  good:{code:`export class PriceTag {
  amount = input.required<number>();
  label = input.required<string>();
  compact = input(false, { transform: booleanAttribute });
  size = input<'s' | 'm'>('m', { alias: 'tagSize' });

  formatted = computed(() => format(this.amount()));
}

// <app-price-tag [amount]="price()" label="Coffee" compact tagSize="s" />`,
    note:tx('Typsicher ohne <code>!</code>, Ableitungen per <code>computed</code>, Attribut-Komfort per <code>transform</code>. Im Template ruft das Kind <code>amount()</code> auf.','Type-safe without <code>!</code>, derivations via <code>computed</code>, attribute convenience via <code>transform</code>. In its template the child calls <code>amount()</code>.')},
  do:tx(['<code>input.required()</code> für alles, ohne das die Komponente keinen Sinn ergibt.','Werte, die aus Inputs folgen, als <code>computed()</code> ableiten.','<code>booleanAttribute</code> für Schalter-Inputs, damit <code>&lt;x disabled&gt;</code> wie in HTML funktioniert.','Brauchst du einen lokal änderbaren Wert, der mit dem Input startet: <code>linkedSignal(() => this.value())</code> oder <code>model()</code>.'],
        ['Use <code>input.required()</code> for everything the component makes no sense without.','Derive values that follow from inputs as <code>computed()</code>.','Use <code>booleanAttribute</code> for switch inputs, so <code>&lt;x disabled&gt;</code> works like in HTML.','If you need a locally changeable value that starts with the input: <code>linkedSignal(() => this.value())</code> or <code>model()</code>.']),
  dont:tx(['Nicht versuchen, ein Input-Signal im Kind zu setzen – es hat kein <code>set()</code>.','Required Inputs nicht im Konstruktor lesen – dort sind sie noch nicht gesetzt (NG0950).','Keine Transforms mit Seiteneffekten oder Zugriff auf <code>this</code> – sie müssen rein und statisch analysierbar sein.','Alias nicht zum Umbenennen aus Geschmack nutzen – zwei Namen für dasselbe verwirren.'],
        ['Don’t try to set an input signal in the child – it has no <code>set()</code>.','Don’t read required inputs in the constructor – they aren’t set yet (NG0950).','No transforms with side effects or access to <code>this</code> – they must be pure and statically analysable.','Don’t use alias to rename out of taste – two names for the same thing confuse.']),
  why:tx('<p>Ein Signal-Input ist ein Signal, das Angular bei jeder Änderung der Bindung im Elternteil schreibt – nach dem <code>transform</code> und mit der üblichen Gleichheitsprüfung. Weil es ein Signal ist, trackt jedes <code>computed</code>, jeder Effect und das Template automatisch, was gelesen wird: Das ersetzt die Buchhaltung mit <code>ngOnChanges</code> und <code>SimpleChanges</code>.</p><p>Schreibgeschützt ist es mit Absicht: Daten fließen von oben nach unten, genau eine Stelle bestimmt den Wert. Soll das Kind den Wert ändern und der Elternteil davon erfahren, ist das ein <code>model()</code>; soll es nur lokal abweichen dürfen, ein <code>linkedSignal()</code>.</p>',
           '<p>A signal input is a signal Angular writes every time the parent’s binding changes – after the <code>transform</code> and with the usual equality check. Because it’s a signal, every <code>computed</code>, every effect and the template automatically track what’s read: that replaces the bookkeeping with <code>ngOnChanges</code> and <code>SimpleChanges</code>.</p><p>It’s read-only on purpose: data flows top-down, exactly one place decides the value. If the child should change the value and the parent should know, that’s a <code>model()</code>; if it may only deviate locally, a <code>linkedSignal()</code>.</p>'),
  test:{code:`it('shows the label and reacts to input changes', async () => {
  const fixture = TestBed.createComponent(PriceTag);
  fixture.componentRef.setInput('amount', 3.5);
  fixture.componentRef.setInput('label', 'Coffee');
  await fixture.whenStable();
  expect(fixture.nativeElement.textContent).toContain('Coffee');

  fixture.componentRef.setInput('compact', '');   // like the bare attribute
  expect(fixture.componentInstance.compact()).toBe(true);
});`,note:tx('<code>setInput()</code> geht durch die echte Input-Logik inklusive <code>transform</code> – besser, als das Feld direkt zu überschreiben.','<code>setInput()</code> goes through the real input logic including <code>transform</code> – better than overwriting the field directly.')}
});

LESSONS.push({
  id:'signal-outputs', cat:'components', order:20,
  title:tx('Ereignisse mit output()','Events with output()'),
  short:tx('output() meldet dem Elternteil ein Ereignis – synchron, ohne Gleichheitsprüfung, ohne RxJS. Aus Observables wird es mit outputFromObservable().','output() tells the parent about an event – synchronously, without an equality check, without RxJS. From observables use outputFromObservable().'),
  keys:'output emit event ereignis outputemitterref outputfromobservable outputtoobservable @output eventemitter alias subscribe ng0953',
  since:'Angular 17.3', status:'stable',
  refs:[[tx('Angular-Doku: Custom events with outputs','Angular docs: Custom events with outputs'),'https://angular.dev/guide/components/outputs#emitting-event-data'],
        [tx('Angular-Doku: Ereignisnamen wählen','Angular docs: Choosing event names'),'https://angular.dev/guide/components/outputs#choosing-event-names'],
        [tx('Angular-Doku: Outputs mit RxJS','Angular docs: Using outputs with RxJS'),'https://angular.dev/guide/components/outputs#using-outputs-with-rxjs']],
  rule:tx('Ein Kind meldet Ereignisse mit <code>output()</code> und <code>emit()</code>; der Elternteil hört mit <code>(name)="handler($event)"</code>. Ein Output ist <strong>kein</strong> Zustand: Es hat keinen aktuellen Wert, jedes <code>emit</code> ruft die Listener sofort auf – auch mit demselben Wert wie zuvor.','A child reports events with <code>output()</code> and <code>emit()</code>; the parent listens with <code>(name)="handler($event)"</code>. An output is <strong>not</strong> state: it has no current value, every <code>emit</code> calls the listeners right away – even with the same value as before.'),
  apis:[['output<T>()','output<T = void>({ alias? }): OutputEmitterRef<T>',tx('Deklariert ein Ereignis. Ohne Typ ist es <code>void</code>: <code>closed = output()</code>.','Declares an event. Without a type it’s <code>void</code>: <code>closed = output()</code>.')],
        ['.emit(value)','emit(value: T): void',tx('Ruft alle Listener synchron auf. Nach dem Zerstören nur eine Warnung (NG0953), kein Aufruf.','Calls all listeners synchronously. After destroy just a warning (NG0953), no call.')],
        ['outputFromObservable(obs$)','outputFromObservable<T>(obs: Observable<T>, { alias? }): OutputRef<T>',tx('Macht ein Observable zum Output (aus <code>@angular/core/rxjs-interop</code>). Fehler musst du selbst abfangen.','Turns an observable into an output (from <code>@angular/core/rxjs-interop</code>). You have to catch errors yourself.')],
        ['OutputRef.subscribe()','subscribe(cb): OutputRefSubscription',tx('Programmatisch zuhören, z. B. bei dynamisch erzeugten Komponenten. Wird beim Zerstören automatisch aufgeräumt.','Listen programmatically, e.g. for dynamically created components. Cleaned up automatically on destroy.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>StarRating <span class="hint">(${tx('Kind','child')})</span></h3>
    <p class="hint">rated = output&lt;number&gt;()</p>
    <div class="sim-row" role="group" aria-label="${tx('Bewertung abgeben','Give a rating')}">
      ${[1,2,3,4,5].map(n=>`<button type="button" class="btn btn-secondary signal-outputs-star" data-n="${n}" aria-label="${tx(`${n} Sterne`,`${n} stars`)}">${n} ★</button>`).join('')}
    </div>
    <p class="signal-outputs-state"><span class="sim-node" id="signal-outputs-n-child">StarRating: <b id="signal-outputs-alive">${tx('lebt','alive')}</b></span></p>
    <button type="button" class="btn btn-ghost" id="signal-outputs-life">${tx('Kind zerstören','Destroy child')}</button>
  </div>
  <div class="sim-card"><h3>${tx('Elternteil','Parent')}</h3>
    <pre class="signal-outputs-tpl">&lt;app-star-rating
  (rated)="onRated($event)" /&gt;</pre>
    <label class="check-row"><input type="checkbox" id="signal-outputs-listen" checked> <span>${tx('Elternteil hört auf <code>(rated)</code>','Parent listens to <code>(rated)</code>')}</span></label>
    <p class="signal-outputs-res" aria-live="polite">${tx('Letzte Bewertung','Last rating')}: <b id="signal-outputs-last">–</b> · ${tx('Handler-Aufrufe','handler calls')}: <b id="signal-outputs-calls">0</b></p>
  </div>
  <div class="sim-card"><h3>${tx('Ablauf','Sequence')}</h3>
    <ul class="sim-log" id="signal-outputs-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Zweimal dieselbe Sternzahl – der Handler läuft zweimal, anders als bei einem Signal. Im Protokoll siehst du, dass <code>emit()</code> erst zurückkehrt, wenn der Handler fertig ist. Ohne Listener passiert nichts; nach „Kind zerstören“ gibt es nur noch eine Warnung.','Try: the same star count twice – the handler runs twice, unlike with a signal. The log shows that <code>emit()</code> only returns once the handler is done. Without a listener nothing happens; after “Destroy child” there’s only a warning.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const ul=$('#signal-outputs-log',root),listen=$('#signal-outputs-listen',root);
    /* Kleines Modell von OutputEmitterRef: synchron, keine Gleichheitsprüfung, nach destroy nur Warnung */
    function output(){
      let listeners=[],destroyed=false;
      return {
        subscribe(cb){listeners.push(cb);return {unsubscribe(){listeners=listeners.filter(l=>l!==cb)}}},
        emit(v){
          if(destroyed){log(ul,`<span class="signal-outputs-warn">console.warn: NG0953: Unexpected emit for destroyed \`OutputRef\`.</span>`);return}
          if(!listeners.length){log(ul,`<span class="t">emit(${v})</span> – ${tx('kein Listener, nichts passiert','no listener, nothing happens')}`);return}
          listeners.forEach(l=>l(v));
        },
        destroy(){destroyed=true;listeners=[]},
        get destroyed(){return destroyed}
      };
    }
    let rated=output(),sub=null,calls=0;
    const onRated=v=>{calls++;$('#signal-outputs-calls',root).textContent=calls;$('#signal-outputs-last',root).textContent=`${v} ★`;log(ul,`&nbsp;&nbsp;<span class="hl">parent.onRated(${v})</span>`)};
    const bind=()=>{sub?.unsubscribe();sub=listen.checked&&!rated.destroyed?rated.subscribe(onRated):null};
    bind();
    listen.addEventListener('change',()=>{bind();log(ul,listen.checked?tx('Elternteil bindet (rated)','parent binds (rated)'):tx('keine Bindung an (rated)','no binding to (rated)'))});
    root.addEventListener('click',e=>{
      const star=e.target.closest('.signal-outputs-star');
      if(star){const n=+star.dataset.n;flash($('#signal-outputs-n-child',root));
        log(ul,`this.rated.emit(${n}) →`);rated.emit(n);log(ul,`← emit ${tx('kehrt zurück','returns')}`)}
      const life=e.target.closest('#signal-outputs-life');
      if(life){
        if(!rated.destroyed){rated.destroy();sub=null;log(ul,tx('Kind zerstört – Listener entfernt','child destroyed – listeners removed'));life.textContent=tx('Kind neu erzeugen','Create child again');$('#signal-outputs-alive',root).textContent=tx('zerstört','destroyed')}
        else{rated=output();bind();log(ul,tx('Kind neu erzeugt','child created again'));life.textContent=tx('Kind zerstören','Destroy child');$('#signal-outputs-alive',root).textContent=tx('lebt','alive')}
      }
    });
  },
  css:`.signal-outputs-star{min-width:56px}.signal-outputs-state{margin:12px 0 8px}.signal-outputs-tpl{margin:0 0 12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);font:500 .8125rem/1.5 var(--font-mono);white-space:pre-wrap}.signal-outputs-res{margin:12px 0 0}.signal-outputs-warn{color:var(--warn)}`,
  bad:{code:`export class StarRating {
  @Output() onRated = new EventEmitter<number>();
  @Output() click = new EventEmitter<void>();   // collides with DOM click

  rate(n: number) {
    this.onRated.emit(n);
  }
}`,
    note:tx('Das alte Muster mit <code>EventEmitter</code> (einem RxJS-Subject). Dazu zwei Namensfehler: Outputs bekommen kein „on“-Präfix, und ein Output namens <code>click</code> vermischt sich mit dem nativen DOM-Ereignis.','The old pattern with <code>EventEmitter</code> (an RxJS subject). Plus two naming mistakes: outputs get no “on” prefix, and an output called <code>click</code> mixes with the native DOM event.')},
  good:{code:`export class StarRating {
  rated = output<number>();
  closed = output();                          // OutputEmitterRef<void>

  // from an observable (e.g. debounced input):
  private query$ = new Subject<string>();
  search = outputFromObservable(this.query$.pipe(debounceTime(300)));

  rate(n: number) {
    this.rated.emit(n);
  }
}

// <app-star-rating (rated)="save($event)" (closed)="hide()" />`,
    note:tx('Keine Imports aus RxJS nötig, der Name beschreibt das Ereignis in camelCase. <code>outputFromObservable</code> hängt ein bestehendes Observable an – abonniert wird erst, wenn jemand zuhört, und beim Zerstören wieder abgemeldet.','No RxJS imports needed, the name describes the event in camelCase. <code>outputFromObservable</code> attaches an existing observable – subscribed only when someone listens, and unsubscribed on destroy.')},
  do:tx(['Ereignisse im Präteritum oder als Substantiv benennen: <code>rated</code>, <code>closed</code>, <code>selectionChange</code>.','Nutzdaten als ein Objekt senden, wenn es mehr als ein Wert ist: <code>emit({ id, rating })</code>.','Für „Wert ändern und Elternteil informieren“ lieber <code>model()</code> nehmen statt Input + Output von Hand.'],
        ['Name events in the past tense or as a noun: <code>rated</code>, <code>closed</code>, <code>selectionChange</code>.','Send the payload as one object if it’s more than one value: <code>emit({ id, rating })</code>.','For “change a value and tell the parent” prefer <code>model()</code> over input + output by hand.']),
  dont:tx(['Kein „on“-Präfix und keine Namen nativer DOM-Ereignisse (<code>click</code>, <code>change</code>).','Einen Output nicht als Zustand behandeln – er hat keinen Wert, den man lesen könnte.','Nicht nach dem Zerstören noch <code>emit()</code> aufrufen (z. B. aus einem Timer) – räume vorher mit <code>DestroyRef</code> auf.'],
        ['No “on” prefix and no names of native DOM events (<code>click</code>, <code>change</code>).','Don’t treat an output as state – it has no value you could read.','Don’t call <code>emit()</code> after destroy (e.g. from a timer) – clean up with <code>DestroyRef</code> first.']),
  why:tx('<p><code>output()</code> ist bewusst schlicht: eine Liste von Listenern, die <code>emit()</code> der Reihe nach synchron aufruft – ohne Signal-Tracking und ohne Vergleich mit dem letzten Wert. Das passt zu Ereignissen, bei denen jede Meldung zählt („zweimal geklickt“ ist nicht „einmal geklickt“). Wirft ein Listener, landet der Fehler beim <code>ErrorHandler</code>, die anderen Listener laufen trotzdem.</p><p>Gegenüber <code>@Output()</code> mit <code>EventEmitter</code> fällt RxJS als Pflicht weg, der Typ stimmt ohne <code>new</code>, und das Aufräumen beim Zerstören ist eingebaut. <code>@Output()</code> ist nicht veraltet – für neuen Code ist <code>output()</code> die Empfehlung.</p>',
           '<p><code>output()</code> is deliberately simple: a list of listeners that <code>emit()</code> calls in order, synchronously – without signal tracking and without comparing to the last value. That fits events where every notification counts (“clicked twice” isn’t “clicked once”). If a listener throws, the error goes to the <code>ErrorHandler</code>, the other listeners still run.</p><p>Compared to <code>@Output()</code> with <code>EventEmitter</code>, RxJS is no longer required, the type is right without <code>new</code>, and cleanup on destroy is built in. <code>@Output()</code> isn’t deprecated – for new code <code>output()</code> is the recommendation.</p>'),
  test:{code:`it('emits the rating', () => {
  const fixture = TestBed.createComponent(StarRating);
  const emitted: number[] = [];
  fixture.componentInstance.rated.subscribe(v => emitted.push(v));

  fixture.componentInstance.rate(4);
  fixture.componentInstance.rate(4);
  expect(emitted).toEqual([4, 4]);   // no equality check
});`,note:tx('<code>subscribe()</code> auf dem Output reicht – kein Host-Template und kein Spy nötig.','<code>subscribe()</code> on the output is enough – no host template and no spy needed.')}
});

LESSONS.push({
  id:'signal-queries', cat:'components', order:60,
  title:tx('Signal-Queries: viewChild() und contentChild()','Signal queries: viewChild() and contentChild()'),
  short:tx('Zugriff auf Elemente und Kind-Komponenten als Signal – immer aktuell, auch wenn @if oder @for sie erzeugen und entfernen.','Access to elements and child components as a signal – always current, even when @if or @for create and remove them.'),
  keys:'viewchild viewchildren contentchild contentchildren query queries elementref required read templateref @viewchild ngafterviewinit ng0951',
  since:'Angular 17.2', status:'stable',
  refs:[[tx('Angular-Doku: View queries','Angular docs: View queries'),'https://angular.dev/guide/components/queries#view-queries'],
        [tx('Angular-Doku: Content queries','Angular docs: Content queries'),'https://angular.dev/guide/components/queries#content-queries'],
        [tx('Angular-Doku: Required queries','Angular docs: Required queries'),'https://angular.dev/guide/components/queries#required-queries']],
  rule:tx('Frag Elemente und Kind-Komponenten mit <code>viewChild()</code>/<code>viewChildren()</code> (eigenes Template) oder <code>contentChild()</code>/<code>contentChildren()</code> (projizierter Inhalt) ab. Das Ergebnis ist ein Signal: Es ist <code>undefined</code>, solange nichts passt, und aktualisiert sich, wenn <code>@if</code> oder <code>@for</code> etwas hinzufügen oder entfernen. <code>.required</code> garantiert einen Treffer.','Query elements and child components with <code>viewChild()</code>/<code>viewChildren()</code> (own template) or <code>contentChild()</code>/<code>contentChildren()</code> (projected content). The result is a signal: it’s <code>undefined</code> while nothing matches, and it updates when <code>@if</code> or <code>@for</code> add or remove something. <code>.required</code> guarantees a match.'),
  apis:[['viewChild(locator)','viewChild<T>(\'ref\' | Type, { read? }): Signal<T | undefined>',tx('Ein Treffer aus dem eigenen Template – per Template-Referenz (<code>#name</code>) oder Typ.','One match from the own template – by template reference (<code>#name</code>) or type.')],
        ['viewChildren(locator)','viewChildren<T>(…): Signal<readonly T[]>',tx('Alle Treffer, z. B. aus einem <code>@for</code>. Neues Array bei jeder Änderung.','All matches, e.g. from a <code>@for</code>. A new array on every change.')],
        ['contentChild / contentChildren','contentChild<T>(…, { descendants?, read? })',tx('Dasselbe für projizierten Inhalt. <code>contentChildren</code> sucht standardmäßig nur direkte Kinder, <code>contentChild</code> alle Nachfahren.','The same for projected content. By default <code>contentChildren</code> only searches direct children, <code>contentChild</code> all descendants.')],
        ['.required','viewChild.required<T>(…): Signal<T>',tx('Kein <code>undefined</code> im Typ; fehlt der Treffer beim Lesen, wirft Angular NG0951.','No <code>undefined</code> in the type; if the match is missing when read, Angular throws NG0951.')],
        ['read','{ read: ElementRef | TemplateRef | ViewContainerRef }',tx('Liest etwas anderes vom Treffer, etwa das <code>ElementRef</code> einer Komponente.','Reads something else from the match, e.g. a component’s <code>ElementRef</code>.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Template der Komponente','Component template')}</h3>
    <button type="button" class="btn btn-secondary" id="signal-queries-toggle" aria-expanded="false">${tx('Details anzeigen','Show details')}</button>
    <div id="signal-queries-details" class="signal-queries-details"></div>
    <p class="hint signal-queries-h">@for (item of items(); track item) { &lt;app-item /&gt; }</p>
    <ul class="signal-queries-items" id="signal-queries-items"></ul>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="signal-queries-add">${tx('Eintrag hinzufügen','Add item')}</button>
      <button type="button" class="btn btn-secondary" id="signal-queries-rm">${tx('Eintrag entfernen','Remove item')}</button>
    </div>
  </div>
  <div class="sim-card"><h3>${tx('Query-Signals','Query signals')}</h3>
    <dl class="signal-queries-dl">
      <dt>nameInput()</dt><dd><span class="sim-node" id="signal-queries-q1"></span></dd>
      <dt>items().length</dt><dd><span class="sim-node" id="signal-queries-q2"></span></dd>
    </dl>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="signal-queries-focus">nameInput()?.nativeElement.focus()</button>
      <button type="button" class="btn btn-secondary" id="signal-queries-req">${tx('Mit .required lesen','Read with .required')}</button>
    </div>
    <ul class="sim-log" id="signal-queries-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Blende die Details ein und aus – <code>nameInput()</code> wechselt zwischen einem neuen <code>ElementRef</code> und <code>undefined</code>, weil <code>@if</code> das Element jedes Mal neu erzeugt. „Mit .required lesen“ bei ausgeblendeten Details zeigt den Laufzeitfehler.','Try: show and hide the details – <code>nameInput()</code> switches between a new <code>ElementRef</code> and <code>undefined</code>, because <code>@if</code> creates the element anew every time. “Read with .required” with hidden details shows the runtime error.')}</p>`,
  init(root){
    const {signal,computed,effect,untracked,log,flash}=NG;
    const ul=$('#signal-queries-log',root),tg=$('#signal-queries-toggle',root);
    const show=signal(false,{name:'show'}),items=signal(['A','B'],{name:'items'});
    let next=3,refNo=0;
    /* Query-Ergebnisse: werden nach jedem Rendern der View aktualisiert, wie in Angular */
    const qInput=signal(undefined,{name:'nameInput'}),qItems=signal([],{name:'items query'});
    const count=computed(()=>qItems().length,{name:'count'});
    const view=effect(()=>{
      const s=show(),list=items();
      const box=$('#signal-queries-details',root);
      untracked(()=>{
        /* @if: Element wird bei jedem Einblenden neu erzeugt */
        if(s&&!box.firstChild){refNo++;box.innerHTML=`<div class="field"><label for="signal-queries-name">Name</label><input class="input" id="signal-queries-name" autocomplete="off" data-ref="${refNo}"></div>`}
        if(!s)box.innerHTML='';
        $('#signal-queries-items',root).innerHTML=list.map(i=>`<li class="sim-node">app-item ${esc(i)}</li>`).join('');
        /* Query-Refresh nach dem Rendern */
        const inp=$('#signal-queries-name',root);
        const prev=qInput();const nextVal=inp?{ref:+inp.dataset.ref,el:inp}:undefined;
        if((prev&&prev.el)!==(nextVal&&nextVal.el)){qInput.set(nextVal);log(ul,`<span class="t">${tx('Query aktualisiert','query refreshed')}</span> nameInput → ${nextVal?`ElementRef #${nextVal.ref}`:'undefined'}`)}
        const els=$$('#signal-queries-items li',root);
        if(els.length!==qItems().length){qItems.set(els);log(ul,`<span class="t">${tx('Query aktualisiert','query refreshed')}</span> items → ${tx('neues Array','new array')} (${els.length})`)}
      });
      tg.setAttribute('aria-expanded',String(s));tg.textContent=s?tx('Details ausblenden','Hide details'):tx('Details anzeigen','Show details');
    },{name:'template'});
    const qview=effect(()=>{
      const i=qInput(),n=count();
      const a=$('#signal-queries-q1',root),b=$('#signal-queries-q2',root);
      a.textContent=i?`ElementRef<input> #${i.ref}`:'undefined';b.textContent=String(n);flash(a);flash(b);
    },{name:'query view'});
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='signal-queries-toggle')show.update(v=>!v);
      if(b.id==='signal-queries-add')items.update(l=>[...l,String.fromCharCode(64+next++)]);
      if(b.id==='signal-queries-rm')items.update(l=>l.slice(0,-1));
      if(b.id==='signal-queries-focus'){const i=untracked(qInput);if(i){i.el.focus();log(ul,`<span class="hl">focus()</span> ${tx('auf','on')} ElementRef #${i.ref}`)}else log(ul,`nameInput() = undefined – <code>?.</code> ${tx('verhindert den Fehler, nichts passiert','prevents the error, nothing happens')}`)}
      if(b.id==='signal-queries-req'){const i=untracked(qInput);log(ul,i?`nameInput() → ElementRef #${i.ref}`:`<span class="signal-queries-err">NG0951: Child query result is required but no value is available.</span>`)}
    });
    return ()=>{view.destroy();qview.destroy()};
  },
  css:`.signal-queries-details{margin:12px 0 0}.signal-queries-h{margin:14px 0 6px;font-family:var(--font-mono);font-size:.75rem}.signal-queries-items{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-height:34px}.signal-queries-dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:0 0 12px;font:500 .8125rem/1.4 var(--font-mono)}.signal-queries-dl dt{color:var(--muted)}.signal-queries-dl dd{margin:0}.signal-queries-dl .sim-node{max-width:100%;overflow-wrap:anywhere}#signal-queries-focus{font-family:var(--font-mono);font-size:.8125rem}.signal-queries-err{color:var(--danger);font-weight:700}.sim-log .signal-queries-err{font-weight:700}#signal-queries-log{margin-top:12px}`,
  bad:{code:`export class Profile implements AfterViewInit {
  @ViewChild('nameInput') nameInput?: ElementRef<HTMLInputElement>;
  @ViewChildren(ItemComponent) items!: QueryList<ItemComponent>;

  ngAfterViewInit() {
    this.nameInput?.nativeElement.focus();     // only once, only if visible then
    this.items.changes.subscribe(() => this.count = this.items.length);
  }
}`,
    note:tx('Decorator-Queries sind erst in <code>ngAfterViewInit</code> befüllt, ändern sich still im Hintergrund und brauchen <code>QueryList.changes</code> plus Abo, um Änderungen mitzubekommen. Nicht veraltet, aber umständlich.','Decorator queries are only filled in <code>ngAfterViewInit</code>, change silently in the background and need <code>QueryList.changes</code> plus a subscription to notice changes. Not deprecated, but cumbersome.')},
  good:{code:`// template: @if (showDetails()) { <input #nameInput> }
//           @for (entry of entries(); track entry.id) { <app-item [entry]="entry" /> }
//           <footer #footer>…</footer>
export class Profile {
  showDetails = signal(false);
  nameInput = viewChild<ElementRef<HTMLInputElement>>('nameInput');
  items = viewChildren(ItemComponent);
  footer = viewChild.required<ElementRef>('footer');   // always in the template

  count = computed(() => this.items().length);

  constructor() {
    // runs after rendering, whenever the input appears again
    afterRenderEffect(() => this.nameInput()?.nativeElement.focus());
  }
}`,
    note:tx('Die Query ist ein Signal: <code>computed</code> und <code>afterRenderEffect</code> reagieren automatisch, wenn <code>@if</code> das Element neu erzeugt oder entfernt. Für DOM-Zugriffe <code>afterRenderEffect</code> statt <code>effect</code>, weil das DOM dann sicher fertig ist.','The query is a signal: <code>computed</code> and <code>afterRenderEffect</code> react automatically when <code>@if</code> recreates or removes the element. For DOM access use <code>afterRenderEffect</code> instead of <code>effect</code>, because the DOM is then guaranteed to be ready.')},
  do:tx(['<code>.required</code> nur für Elemente, die <em>immer</em> im Template stehen (nicht hinter <code>@if</code>).','Optional-Chaining nutzen: <code>this.panel()?.nativeElement</code>.','Aus <code>viewChildren()</code> mit <code>computed()</code> ableiten (Anzahl, Auswahl) statt <code>QueryList.changes</code> zu abonnieren.','<code>{ read: ElementRef }</code>, wenn du vom Treffer einer Komponente das DOM-Element brauchst.'],
        ['Use <code>.required</code> only for elements that are <em>always</em> in the template (not behind <code>@if</code>).','Use optional chaining: <code>this.panel()?.nativeElement</code>.','Derive from <code>viewChildren()</code> with <code>computed()</code> (count, selection) instead of subscribing to <code>QueryList.changes</code>.','Use <code>{ read: ElementRef }</code> when you need the DOM element of a matched component.']),
  dont:tx(['Queries nicht im Konstruktor auswerten – dort ist noch nichts gerendert.','Kein <code>.required</code> für Elemente hinter <code>@if</code> oder <code>@defer</code> – das endet in NG0951.','Nicht über Queries in Kind-Komponenten hineinregieren (Felder setzen, Methoden aufrufen), wenn ein Input oder <code>model()</code> genügt.'],
        ['Don’t evaluate queries in the constructor – nothing has been rendered there yet.','No <code>.required</code> for elements behind <code>@if</code> or <code>@defer</code> – that ends in NG0951.','Don’t reach into child components via queries (setting fields, calling methods) when an input or <code>model()</code> is enough.']),
  why:tx('<p>Angular aktualisiert Query-Ergebnisse während der Change Detection, nachdem die View gerendert wurde. Bei Signal-Queries ist das Ergebnis ein Signal, das nur dann einen neuen Wert bekommt, wenn sich die Treffer wirklich geändert haben – alle Leser (Template, <code>computed</code>, Effects) werden dadurch automatisch benachrichtigt.</p><p>Das löst das alte Timing-Problem der Decorator-Queries: Man musste wissen, ab welchem Lifecycle-Hook sie befüllt sind (<code>static: true</code> oder <code>ngAfterViewInit</code>) und Änderungen über <code>QueryList.changes</code> abonnieren. Jetzt liest du einfach das Signal, wo und wann du es brauchst.</p>',
           '<p>Angular updates query results during change detection, after the view has been rendered. With signal queries the result is a signal that only gets a new value when the matches really changed – all readers (template, <code>computed</code>, effects) are notified automatically.</p><p>That solves the old timing problem of decorator queries: you had to know from which lifecycle hook on they are filled (<code>static: true</code> or <code>ngAfterViewInit</code>) and subscribe to changes via <code>QueryList.changes</code>. Now you just read the signal where and when you need it.</p>'),
  test:{code:`it('finds the input only while details are shown', async () => {
  const fixture = TestBed.createComponent(Profile);
  const cmp = fixture.componentInstance;
  await fixture.whenStable();
  expect(cmp.nameInput()).toBeUndefined();

  cmp.showDetails.set(true);
  await fixture.whenStable();
  expect(cmp.nameInput()?.nativeElement.tagName).toBe('INPUT');
});`,note:tx('Queries füllen sich erst mit der Change Detection – darum nach jeder Änderung auf <code>whenStable()</code> warten.','Queries only fill with change detection – so wait for <code>whenStable()</code> after every change.')}
});

LESSONS.push({
  id:'component-providers', cat:'di', order:40,
  title:tx('Eine Instanz pro Komponente: providers und viewProviders','One instance per component: providers and viewProviders'),
  short:tx('Zustand, der zu einer Komponente gehört, bekommt seinen Service in deren providers – und stirbt mit ihr.','State that belongs to one component gets its service in that component’s providers – and dies with it.'),
  keys:'providers viewProviders komponente component element injector instanz instance ngOnDestroy scope ng-content projection store',
  status:'stable',
  refs:[[tx('Angular-Doku: Komponenten-Provider','Angular docs: Component providers'),'https://angular.dev/guide/di/defining-dependency-providers#component-or-directive-providers'],
        [tx('Angular-Doku: providers vs. viewProviders','Angular docs: providers vs. viewProviders'),'https://angular.dev/guide/di/hierarchical-dependency-injection#providers-vs-viewproviders'],
        [tx('Angular-Doku: Service-Isolation','Angular docs: Service isolation'),'https://angular.dev/guide/di/hierarchical-dependency-injection#scenario-service-isolation']],
  rule:tx('Steht ein Service in den <code>providers</code> einer Komponente, bekommt <strong>jede Instanz dieser Komponente ihre eigene</strong> Service-Instanz – sichtbar für die Komponente und alles darunter, zerstört zusammen mit ihr. <code>viewProviders</code> wirken genauso, sind aber nur im eigenen Template sichtbar, nicht für projizierten Inhalt.',
          'If a service is in a component’s <code>providers</code>, <strong>every instance of that component gets its own</strong> service instance – visible to the component and everything below it, destroyed together with it. <code>viewProviders</code> work the same way, but are only visible in the component’s own template, not to projected content.'),
  apis:[['providers','@Component({ providers: [Store] })',tx('Eigene Instanz pro Komponenten-Instanz, im Element Injector. Sichtbar für Template-Kinder und projizierten Inhalt.','Own instance per component instance, in the element injector. Visible to template children and projected content.')],
        ['viewProviders','@Component({ viewProviders: [Store] })',tx('Wie <code>providers</code>, aber nur für das eigene Template – <code>&lt;ng-content&gt;</code> sieht sie nicht.','Like <code>providers</code>, but only for the own template – <code>&lt;ng-content&gt;</code> doesn’t see them.')],
        ['ngOnDestroy','ngOnDestroy(): void · inject(DestroyRef)',tx('Im Service: läuft, wenn die Komponente zerstört wird, die ihn bereitstellt.','In the service: runs when the component that provides it is destroyed.')],
        ['@Service','@Service({ autoProvided: false })',tx('Angular 22: Service, der nicht automatisch im Root landet – du stellst ihn selbst in <code>providers</code> bereit.','Angular 22: a service that isn’t put into root automatically – you provide it yourself in <code>providers</code>.')]],
  demo:`<fieldset class="seg"><legend>${tx('Wo wird <code>CounterStore</code> bereitgestellt?','Where is <code>CounterStore</code> provided?')}</legend><div class="seg-opts">
  <label><input type="radio" name="component-providers-m" value="root" checked> ${tx('Root (@Service)','Root (@Service)')}</label>
  <label><input type="radio" name="component-providers-m" value="cmp"> ${tx('providers der Komponente','component providers')}</label></div></fieldset>
<div class="sim-grid component-providers-grid">
  <div class="sim-card"><h3>&lt;app-counter&gt; A</h3><p class="component-providers-val" id="component-providers-a"></p><button type="button" class="btn btn-secondary" data-inc="a">+1<span class="sr-only"> ${tx('Zähler','counter')} A</span></button></div>
  <div class="sim-card" id="component-providers-cardb"><h3>&lt;app-counter&gt; B</h3><p class="component-providers-val" id="component-providers-b"></p><button type="button" class="btn btn-secondary" data-inc="b">+1<span class="sr-only"> ${tx('Zähler','counter')} B</span></button></div>
  <div class="sim-card"><h3>${tx('Lebenszyklus','Lifecycle')}</h3><button type="button" class="btn btn-secondary" id="component-providers-toggle">${tx('B entfernen','Remove B')}</button>
    <ul class="sim-log component-providers-log" id="component-providers-log" aria-label="${tx('Protokoll','Log')}"></ul></div>
</div>
<div class="sim-card component-providers-view"><h3>${tx('providers oder viewProviders?','providers or viewProviders?')}</h3>
  <fieldset class="seg"><legend>${tx('<code>&lt;app-panel&gt;</code> stellt <code>Theme</code> („dark“) bereit in','<code>&lt;app-panel&gt;</code> provides <code>Theme</code> (“dark”) in')}</legend><div class="seg-opts">
    <label><input type="radio" name="component-providers-v" value="providers" checked> providers</label>
    <label><input type="radio" name="component-providers-v" value="viewProviders"> viewProviders</label></div></fieldset>
  <pre class="component-providers-tree" id="component-providers-tree" aria-live="polite"></pre>
</div>
<p class="demo-note">${tx('Probier: Zähl in A hoch – im Root-Modus zählt B mit, weil beide dieselbe Instanz haben. Schalte auf „providers der Komponente“: Jeder Zähler hat seine eigene. Entferne B und füge ihn wieder ein – sein Store wird zerstört und neu erzeugt. Unten: Mit <code>viewProviders</code> sieht der projizierte Inhalt das „dark“-Theme nicht.','Try: count up in A – in root mode B counts along, because both have the same instance. Switch to “component providers”: each counter has its own. Remove B and add it back – its store is destroyed and created anew. Below: with <code>viewProviders</code> the projected content doesn’t see the “dark” theme.')}</p>`,
  init(root){
    const {log,flash}=NG,D=NGDI;
    const ul=$('#component-providers-log',root);
    let mode='root',rootInj,Store,cmps={},hasB=true;
    const on=ev=>{
      if(ev.type==='create')log(ul,`<span class="hl">${tx('erzeugt','creates')}</span> ${esc(D.label(ev.value))} ${tx('in','in')} ${esc(ev.injector)}`);
      if(ev.type==='hit')log(ul,`<span class="t">${tx('gleiche Instanz','same instance')}</span> ${esc(D.label(ev.value))} ${tx('aus','from')} ${esc(ev.injector)}`);
      if(ev.type==='destroy')log(ul,`<span class="hl">ngOnDestroy</span> ${esc(D.label(ev.value))}`);
    };
    const create=k=>{
      const inj=mode==='cmp'?D.injector(`<app-counter> ${k.toUpperCase()}`,[Store],rootInj,{on}):D.injector(`<app-counter> ${k.toUpperCase()}`,[],rootInj,{on});
      log(ul,`<span class="t">new</span> Counter ${k.toUpperCase()}`);
      cmps[k]={inj,store:D.runIn(inj,()=>D.inject(Store))};
    };
    const paint=()=>['a','b'].forEach(k=>{
      const el=$(`#component-providers-${k}`,root);
      if(!cmps[k]){el.textContent=tx('(entfernt)','(removed)');return}
      el.innerHTML=`<code>${esc(D.label(cmps[k].store))}</code><b>${cmps[k].store.count}</b>`;
    });
    const boot=()=>{
      D.reset();cmps={};
      rootInj=D.injector('Root',[],null,{root:true,on});
      Store=D.service('CounterStore',{providedIn:mode==='root'?'root':null,init:v=>{v.count=0}});
      log(ul,`<span class="t">— ${mode==='root'?'@Service()':'providers: [CounterStore]'} —</span>`);
      create('a');if(hasB)create('b');paint();
    };
    const toggle=$('#component-providers-toggle',root);
    root.addEventListener('change',e=>{
      if(e.target.name==='component-providers-m'){mode=e.target.value;boot()}
      if(e.target.name==='component-providers-v')view(e.target.value);
    });
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-inc]');
      if(b&&cmps[b.dataset.inc]){cmps[b.dataset.inc].store.count++;paint();['a','b'].forEach(k=>{if(cmps[k]&&cmps[k].store===cmps[b.dataset.inc].store)flash($(`#component-providers-${k}`,root))})}
      if(e.target.closest('#component-providers-toggle')){
        if(hasB){log(ul,`<span class="t">destroy</span> Counter B`);cmps.b.inj.destroy();if(mode==='root')log(ul,`<span class="t">${esc(D.label(cmps.b.store))} ${tx('bleibt – gehört dem Root-Injector','stays – it belongs to the root injector')}</span>`);delete cmps.b;hasB=false}
        else{create('b');hasB=true}
        toggle.textContent=hasB?tx('B entfernen','Remove B'):tx('B wieder einfügen','Add B back');
        $('#component-providers-cardb',root).classList.toggle('component-providers-gone',!hasB);
        paint();
      }
    });
    /* providers vs. viewProviders: projizierter Inhalt hängt am Host-Element, sieht also nur providers */
    const view=kind=>{
      const Theme=D.token('Theme',{factory:()=>'light'});
      const r=D.injector('Root',[],null,{root:true});
      const mine={provide:Theme,useValue:{__label:"'dark' ← app-panel"}};
      const inView=D.injector('app-panel (view)',[mine],r);
      const forContent=D.injector('app-panel (host)',kind==='providers'?[mine]:[],r);
      const a=D.label(inView.get(Theme)),b=D.label(forContent.get(Theme));
      const fmt=v=>v==='light'?`'light' ← Root`:v;
      $('#component-providers-tree',root).textContent=`<app-panel>            ${kind}: [Theme]
  ${tx('Template','template')}:
    <app-panel-header>   Theme = ${fmt(a)}
  <ng-content> ${tx('von außen','from outside')}:
    <app-user-badge>     Theme = ${fmt(b)}`;
    };
    view('providers');boot();
  },
  css:`.component-providers-grid{margin-top:14px}.component-providers-val{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.component-providers-val b{font-size:1.5rem}.component-providers-val.flash{background:var(--brand-soft);border-color:var(--brand)}
.component-providers-gone{opacity:.55;border-style:dashed}.component-providers-log{margin-top:10px}.component-providers-view{margin-top:16px}
.component-providers-tree{margin:12px 0 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}`,
  bad:{code:`// one instance for the whole app
@Service()
export class DraftStore {
  readonly draft = signal<Draft|null>(null);
}

@Component({ selector: 'app-editor', … })
export class Editor {
  store = inject(DraftStore);
}
// two editors overwrite each other's
// draft, and it outlives a closed editor`,
    note:tx('Der Zustand gehört eigentlich zu <em>einem</em> Editor, lebt aber app-weit: Zwei Editoren teilen sich den Entwurf, und nach dem Schließen bleibt er im Speicher.','The state actually belongs to <em>one</em> editor, but lives app-wide: two editors share the draft, and after closing it stays in memory.')},
  good:{code:`@Service({ autoProvided: false })
export class DraftStore
    implements OnDestroy {
  readonly draft = signal<Draft|null>(null);
  ngOnDestroy() { /* save, clean up */ }
}

@Component({
  selector: 'app-editor',
  // one store per <app-editor>
  providers: [DraftStore],
  …
})
export class Editor {
  store = inject(DraftStore);
}`,
    note:tx('Jeder Editor hat seinen eigenen Store; Kind-Komponenten im Editor bekommen per <code>inject(DraftStore)</code> genau diesen. Wird der Editor zerstört, läuft <code>ngOnDestroy</code> des Stores. Vor Angular 22: <code>@Injectable()</code> ohne <code>providedIn</code>.','Each editor has its own store; child components inside the editor get exactly this one via <code>inject(DraftStore)</code>. When the editor is destroyed, the store’s <code>ngOnDestroy</code> runs. Before Angular 22: <code>@Injectable()</code> without <code>providedIn</code>.')},
  do:tx(['Zustand, der zu <em>einer</em> Komponenten-Instanz gehört (Formular-Entwurf, Tabs, Auswahl), in einen Store in deren <code>providers</code> legen.','Kind-Komponenten den Store per <code>inject()</code> holen lassen, statt ihn über viele Inputs durchzureichen.','Aufräumen im Store per <code>ngOnDestroy</code> oder <code>inject(DestroyRef).onDestroy()</code>.','<code>viewProviders</code> nehmen, wenn projizierter Inhalt von außen den Service nicht sehen soll.'],
        ['Put state that belongs to <em>one</em> component instance (form draft, tabs, selection) into a store in its <code>providers</code>.','Let child components get the store via <code>inject()</code> instead of passing it through many inputs.','Clean up in the store with <code>ngOnDestroy</code> or <code>inject(DestroyRef).onDestroy()</code>.','Use <code>viewProviders</code> when projected content from outside shouldn’t see the service.']),
  dont:tx(['Einen app-weiten Service nicht „zur Sicherheit“ zusätzlich in <code>providers</code> einer Komponente eintragen – das erzeugt eine zweite Instanz.','Keine <code>EnvironmentProviders</code> (z. B. <code>provideHttpClient()</code>) in Komponenten-<code>providers</code> – das ist ein Fehler (NG0207).','Nicht erwarten, dass der Zustand das Zerstören der Komponente überlebt.'],
        ['Don’t additionally list an app-wide service in a component’s <code>providers</code> “just in case” – that creates a second instance.','No <code>EnvironmentProviders</code> (e.g. <code>provideHttpClient()</code>) in component <code>providers</code> – that’s an error (NG0207).','Don’t expect the state to survive the component being destroyed.']),
  why:tx('<p>Jedes Element mit Komponente oder Direktive hat einen <strong>Element Injector</strong>. Steht dort ein Provider, beantwortet dieser Injector die Anfrage, bevor sie den Root-Injector erreicht – und weil jede Komponenten-Instanz ihren eigenen Element Injector hat, gibt es auch je eine Service-Instanz. Der Element Injector lebt so lange wie die Komponente; beim Zerstören ruft Angular <code>ngOnDestroy</code> der Services auf, die er erzeugt hat.</p><p><code>viewProviders</code> hängen in derselben Stelle, sind aber nur für Anfragen aus dem eigenen Template (der „View“) sichtbar. Projizierter Inhalt gehört logisch zum Template des Elternteils, also sucht er außen weiter – im Beispiel landet er beim Root-Theme.</p>',
           '<p>Every element with a component or directive has an <strong>element injector</strong>. If there’s a provider on it, that injector answers the request before it reaches the root injector – and because every component instance has its own element injector, there is one service instance each. The element injector lives as long as the component; on destroy, Angular calls <code>ngOnDestroy</code> of the services it created.</p><p><code>viewProviders</code> sit in the same place, but are only visible to requests from the own template (the “view”). Projected content logically belongs to the parent’s template, so it keeps looking outside – in the example it ends up with the root theme.</p>'),
  test:{code:`it('gives each editor its own store', () => {
  const a = TestBed.createComponent(Editor);
  const b = TestBed.createComponent(Editor);
  expect(a.componentInstance.store)
    .not.toBe(b.componentInstance.store);
});`,note:tx('Komponenten-Provider holst du über die Komponente (oder <code>fixture.debugElement.injector.get(DraftStore)</code>), nicht über <code>TestBed.inject()</code> – der sieht nur den Root.','You get component providers through the component (or <code>fixture.debugElement.injector.get(DraftStore)</code>), not through <code>TestBed.inject()</code> – that only sees the root.')}
});

LESSONS.push({
  id:'environment-providers', cat:'di', order:60,
  title:tx('provideX(): Provider-Funktionen und multi','provideX(): provider functions and multi'),
  short:tx('Bibliotheken und Features liefern eine provideX()-Funktion statt einer Liste zum Abtippen.','Libraries and features ship a provideX() function instead of a list to copy.'),
  keys:'provide makeEnvironmentProviders EnvironmentProviders multi provider provideAppInitializer APP_INITIALIZER provideEnvironmentInitializer library bibliothek feature with NG0207',
  since:'Angular 15', status:'stable',
  refs:[[tx('Angular-Doku: Das provide-Muster','Angular docs: The provide pattern'),'https://angular.dev/guide/di/defining-dependency-providers#the-provide-pattern'],
        [tx('Angular-Doku: Mehrere Provider (multi)','Angular docs: Multiple providers (multi)'),'https://angular.dev/guide/di/defining-dependency-providers#multiple-providers'],
        [tx('API: makeEnvironmentProviders','API: makeEnvironmentProviders'),'https://angular.dev/api/core/makeEnvironmentProviders']],
  rule:tx('Was eine Bibliothek oder ein Feature an Providern braucht, verpackst du in eine Funktion <code>provideX(config, ...features)</code>, die <code>makeEnvironmentProviders()</code> zurückgibt. Nutzer schreiben eine Zeile in <code>app.config.ts</code>, und der Typ <code>EnvironmentProviders</code> verhindert, dass es versehentlich in Komponenten-<code>providers</code> landet.',
          'Whatever providers a library or feature needs, you wrap them in a function <code>provideX(config, ...features)</code> that returns <code>makeEnvironmentProviders()</code>. Users write one line in <code>app.config.ts</code>, and the <code>EnvironmentProviders</code> type prevents it from accidentally ending up in component <code>providers</code>.'),
  apis:[['makeEnvironmentProviders()','makeEnvironmentProviders(providers): EnvironmentProviders',tx('Verpackt Provider so, dass sie nur in Environment Injectors (App, Route) erlaubt sind.','Wraps providers so they’re only allowed in environment injectors (app, route).')],
        ['multi: true','{ provide: TOKEN, useClass, multi: true }',tx('Mehrere Provider für dasselbe Token – <code>inject(TOKEN)</code> liefert ein Array aller Beiträge.','Several providers for the same token – <code>inject(TOKEN)</code> returns an array of all contributions.')],
        ['provideAppInitializer()','provideAppInitializer(() => void | Promise | Observable)',tx('Läuft beim Start im Injection Context; ein Promise oder Observable hält den Start an, bis es fertig ist. Ersetzt das deprecated <code>APP_INITIALIZER</code>.','Runs at startup in an injection context; a promise or observable holds startup until it’s done. Replaces the deprecated <code>APP_INITIALIZER</code>.')],
        ['provideEnvironmentInitializer()','provideEnvironmentInitializer(() => void)',tx('Läuft, wenn der Environment Injector entsteht (z. B. auch für eine lazy Route) – synchron, ohne zu warten.','Runs when the environment injector is created (e.g. also for a lazy route) – synchronously, without waiting.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>app.config.ts</h3>
    <p class="hint">${tx('Features für <code>provideAnalytics()</code>:','Features for <code>provideAnalytics()</code>:')}</p>
    <label class="check-row"><input type="checkbox" data-f="console" checked> <code>withConsoleSink()</code></label>
    <label class="check-row"><input type="checkbox" data-f="http"> <code>withHttpSink('/track')</code></label>
    <label class="check-row"><input type="checkbox" data-f="debug"> <code>withDebugSink()</code></label>
    <pre class="environment-providers-code" id="environment-providers-code"></pre>
    <div class="sim-row"><button type="button" class="btn btn-primary" id="environment-providers-boot">${tx('App starten','Start app')}</button><button type="button" class="btn btn-secondary" id="environment-providers-cmp">${tx('In Komponente eintragen','Put into a component')}</button></div>
  </div>
  <div class="sim-card"><h3>${tx('Was daraus wird','What it turns into')}</h3>
    <ol class="environment-providers-list" id="environment-providers-list" aria-label="${tx('Flache Provider-Liste','Flat provider list')}"></ol>
    <output class="environment-providers-out" id="environment-providers-out"></output>
    <ul class="sim-log" id="environment-providers-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Schalte Features an und aus – eine Zeile im Code, aber die flache Provider-Liste wächst. Starte die App: Der Initializer läuft, und <code>inject(ANALYTICS_SINKS)</code> liefert ein Array aus allen <code>multi</code>-Beiträgen. „In Komponente eintragen“ zeigt, warum <code>EnvironmentProviders</code> ein eigener Typ ist.','Try: toggle features – one line of code, but the flat provider list grows. Start the app: the initializer runs, and <code>inject(ANALYTICS_SINKS)</code> returns an array of all <code>multi</code> contributions. “Put into a component” shows why <code>EnvironmentProviders</code> is a type of its own.')}</p>`,
  init(root){
    const {log,flash}=NG,D=NGDI;
    const ul=$('#environment-providers-log',root),out=$('#environment-providers-out',root);
    const CONFIG=D.token('ANALYTICS_CONFIG'),SINKS=D.token('ANALYTICS_SINKS');
    const Analytics=D.service('Analytics',{deps:[CONFIG]});
    const FEAT={console:{code:'withConsoleSink()',p:{provide:SINKS,useClass:D.service('ConsoleSink'),multi:true}},
                http:{code:"withHttpSink('/track')",p:{provide:SINKS,useFactory:()=>D.instance('HttpSink'),multi:true}},
                debug:{code:'withDebugSink()',p:{provide:SINKS,useClass:D.service('DebugSink'),multi:true}}};
    const on=ev=>{
      if(ev.type==='create')log(ul,`<span class="hl">${tx('erzeugt','creates')}</span> ${esc(D.label(ev.value))}`);
      if(ev.type==='factory')log(ul,`<span class="hl">Factory</span> ${ev.token} += ${esc(D.label(ev.value))}`);
      if(ev.type==='value')log(ul,`<span class="t">useValue</span> ${ev.token}`);
    };
    const feats=()=>Object.keys(FEAT).filter(k=>$(`[data-f="${k}"]`,root).checked);
    /* Die Bibliotheksfunktion – gibt eine verpackte Liste zurück, wie makeEnvironmentProviders() */
    const provideAnalytics=(cfg,...features)=>({__env:true,providers:[{provide:CONFIG,useValue:cfg},Analytics,...features,{init:true}]});
    const render=()=>{
      const fs=feats();
      $('#environment-providers-code',root).textContent=`providers: [
  provideAnalytics(
    { appId: 'shop' },${fs.map(k=>`\n    ${FEAT[k].code},`).join('')}
  ),
]`;
      const env=provideAnalytics({appId:'shop'},...fs.map(k=>FEAT[k].p));
      $('#environment-providers-list',root).innerHTML=env.providers.map(p=>`<li><code>${p.init?'provideAppInitializer(…)':p.isClass?p.name:`${p.provide.name}${p.multi?' · multi':''}${'useValue' in p?' · useValue':''}${p.useClass?` · ${p.useClass.name}`:''}${p.useFactory?' · useFactory':''}`}</code></li>`).join('');
      out.textContent='';out.className='environment-providers-out';
    };
    const boot=()=>{
      D.reset();
      const env=provideAnalytics({appId:'shop'},...feats().map(k=>FEAT[k].p));
      log(ul,`<span class="t">— bootstrapApplication —</span>`);
      const inj=D.injector('Root',env.providers.filter(p=>!p.init),null,{root:true,on});
      log(ul,`<span class="hl">provideAppInitializer</span> → inject(Analytics).start()`);
      D.runIn(inj,()=>D.inject(Analytics));
      const sinks=inj.get(SINKS,{optional:true});
      out.className='environment-providers-out environment-providers-ok';
      out.textContent=`inject(ANALYTICS_SINKS, { optional: true }) → ${sinks?D.label(sinks):tx('null – kein Sink registriert','null – no sink registered')}`;
      flash(out);
    };
    root.addEventListener('change',render);
    root.addEventListener('click',e=>{
      if(e.target.closest('#environment-providers-boot'))boot();
      if(e.target.closest('#environment-providers-cmp')){
        out.className='environment-providers-out environment-providers-err';
        out.textContent=`TS2322: Type 'EnvironmentProviders' is not assignable to type 'Provider'.\n${tx('Und zur Laufzeit','And at runtime')}: NG0207: Invalid providers present in a non-environment injector. 'EnvironmentProviders' can't be used for component providers.`;
        log(ul,`<span class="t">@Component({ providers: [provideAnalytics(…)] })</span> ✗`);
      }
    });
    render();
  },
  css:`.environment-providers-code{margin:12px 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.45 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.environment-providers-list{margin:0 0 10px;padding-left:1.6em;display:grid;gap:4px;font-size:.8125rem}.environment-providers-list code{overflow-wrap:anywhere}
.environment-providers-out{display:block;margin:0 0 10px;padding:4px 6px;border-radius:var(--radius-sm);font:700 .8125rem/1.45 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}
.environment-providers-out.flash{background:var(--brand-soft)}.environment-providers-ok{color:var(--success)}.environment-providers-err{color:var(--danger)}`,
  bad:{code:`// README: "please add all of these"
providers: [
  Analytics,
  { provide: ANALYTICS_CONFIG,
    useValue: { appId: 'shop' } },
  { provide: ANALYTICS_SINKS,
    useClass: ConsoleSink, multi: true },
  { provide: APP_INITIALIZER, multi: true,
    useFactory: initAnalytics,
    deps: [Analytics] },
]`,
    note:tx('Jede App tippt dieselbe Liste ab, ein vergessenes <code>multi: true</code> überschreibt still die anderen Sinks, und <code>APP_INITIALIZER</code> ist seit Angular 19 deprecated.','Every app copies the same list, a forgotten <code>multi: true</code> silently overwrites the other sinks, and <code>APP_INITIALIZER</code> has been deprecated since Angular 19.')},
  good:{code:`// analytics/provide-analytics.ts
export function withConsoleSink(): Provider {
  return {
    provide: ANALYTICS_SINKS,
    useClass: ConsoleSink,
    multi: true,
  };
}

export function provideAnalytics(
  config: AnalyticsConfig,
  ...features: Provider[]
): EnvironmentProviders {
  return makeEnvironmentProviders([
    { provide: ANALYTICS_CONFIG,
      useValue: config },
    ...features,
    provideAppInitializer(
      () => inject(Analytics).start()),
  ]);
}

// app.config.ts
providers: [
  provideAnalytics({ appId: 'shop' },
    withConsoleSink()),
]`,
    note:tx('Genau so sind <code>provideRouter(routes, withX())</code> und <code>provideHttpClient(withInterceptors(…))</code> gebaut: eine Funktion, optionale Features, Details bleiben in der Bibliothek.','This is exactly how <code>provideRouter(routes, withX())</code> and <code>provideHttpClient(withInterceptors(…))</code> are built: one function, optional features, details stay inside the library.')},
  do:tx(['Für wiederverwendbare Features eine <code>provideX()</code>-Funktion exportieren, die <code>EnvironmentProviders</code> zurückgibt.','Optionales als <code>withY()</code>-Funktionen anbieten, die <code>provideX()</code> als Rest-Parameter annimmt.','Für Plug-in-Listen (Sinks, Validatoren, Interceptoren) ein <code>InjectionToken&lt;T[]&gt;</code> mit <code>multi: true</code> nutzen.','Start-Logik mit <code>provideAppInitializer()</code> – auch Feature-Provider dürfen eine mitbringen.'],
        ['Export a <code>provideX()</code> function returning <code>EnvironmentProviders</code> for reusable features.','Offer optional parts as <code>withY()</code> functions that <code>provideX()</code> accepts as rest parameters.','For plug-in lists (sinks, validators, interceptors) use an <code>InjectionToken&lt;T[]&gt;</code> with <code>multi: true</code>.','Startup logic with <code>provideAppInitializer()</code> – feature providers may bring their own.']),
  dont:tx(['Nutzern keine langen Provider-Listen zum Abtippen geben.','Kein <code>APP_INITIALIZER</code> und kein <code>ENVIRONMENT_INITIALIZER</code> mehr – beide sind seit Angular 19 deprecated.','<code>EnvironmentProviders</code> nicht in Komponenten-<code>providers</code> stecken – TypeScript meckert, zur Laufzeit folgt NG0207.'],
        ['Don’t hand users long provider lists to copy.','No more <code>APP_INITIALIZER</code> or <code>ENVIRONMENT_INITIALIZER</code> – both have been deprecated since Angular 19.','Don’t put <code>EnvironmentProviders</code> into component <code>providers</code> – TypeScript complains, at runtime NG0207 follows.']),
  why:tx('<p>Provider sind nur Daten: eine flache Liste von „Token → Rezept“. Eine <code>provideX()</code>-Funktion ist deshalb nichts Magisches – sie baut diese Liste zusammen, je nachdem, welche Features du übergibst. Der Gewinn ist die <strong>Kapselung</strong>: Tokens, Standardwerte und Initialisierung ändern sich in der Bibliothek, nicht in jeder App.</p><p><code>makeEnvironmentProviders()</code> packt die Liste in einen eigenen Typ. Manche Provider ergeben nur einmal pro App oder Route Sinn (Router, HTTP-Client, Initializer); in einer Komponente würden sie pro Instanz neu entstehen. Der Typ sorgt dafür, dass das schon beim Kompilieren auffällt. <code>multi: true</code> sammelt Beiträge mehrerer Provider in einem Array – so können Features etwas zu einer Liste hinzufügen, ohne sich gegenseitig zu überschreiben.</p>',
           '<p>Providers are just data: a flat list of “token → recipe”. A <code>provideX()</code> function is therefore nothing magical – it assembles this list depending on which features you pass. The gain is <strong>encapsulation</strong>: tokens, defaults and initialisation change inside the library, not in every app.</p><p><code>makeEnvironmentProviders()</code> wraps the list in a type of its own. Some providers only make sense once per app or route (router, HTTP client, initialisers); in a component they would be created again per instance. The type makes sure this is caught at compile time. <code>multi: true</code> collects contributions of several providers into an array – so features can add something to a list without overwriting each other.</p>'),
  test:{code:`it('collects all sinks', () => {
  TestBed.configureTestingModule({
    providers: [provideAnalytics({ appId: 'test' },
      withConsoleSink(), withDebugSink())],
  });
  expect(TestBed.inject(ANALYTICS_SINKS)).toHaveLength(2);
});`,note:tx('Die <code>provideX()</code>-Funktion lässt sich direkt in <code>TestBed</code> verwenden – so testest du die Bibliothek genau so, wie Apps sie einbinden.','The <code>provideX()</code> function can be used directly in <code>TestBed</code> – so you test the library exactly the way apps use it.')}
});

LESSONS.push({
  id:'inject-fn', cat:'di', order:10,
  title:tx('inject() und der Injection Context','inject() and the injection context'),
  short:tx('Abhängigkeiten per inject() holen – und wissen, wo das geht und wo nicht.','Get dependencies with inject() – and know where that works and where it doesn’t.'),
  keys:'inject injection context konstruktor constructor runInInjectionContext NG0203 assertInInjectionContext injector feld field',
  since:'Angular 14', status:'stable',
  refs:[[tx('Angular-Doku: Injection Context','Angular docs: Injection context'),'https://angular.dev/guide/di/dependency-injection-context#stack-frame-in-context'],
        [tx('Angular-Doku: runInInjectionContext','Angular docs: runInInjectionContext'),'https://angular.dev/guide/di/dependency-injection-context#run-within-an-injection-context'],
        [tx('API: inject()','API: inject()'),'https://angular.dev/api/core/inject']],
  rule:tx('Hol Abhängigkeiten mit <code>inject()</code> in Feld-Initialisierern. Das geht nur <strong>synchron im Injection Context</strong>: während Angular eine Klasse erzeugt, in Provider-Factories, in funktionalen Guards, Resolvern und Interceptoren und in <code>runInInjectionContext()</code>. In <code>ngOnInit</code>, in Callbacks oder nach einem <code>await</code> wirft es NG0203.',
          'Get dependencies with <code>inject()</code> in field initialisers. It only works <strong>synchronously inside an injection context</strong>: while Angular creates a class, in provider factories, in functional guards, resolvers and interceptors, and inside <code>runInInjectionContext()</code>. In <code>ngOnInit</code>, in callbacks or after an <code>await</code> it throws NG0203.'),
  apis:[['inject()','inject<T>(token, options?): T',tx('Liefert die Instanz zum Token aus dem gerade aktiven Injector. Optionen: <code>optional</code>, <code>self</code>, <code>skipSelf</code>, <code>host</code>.','Returns the instance for the token from the currently active injector. Options: <code>optional</code>, <code>self</code>, <code>skipSelf</code>, <code>host</code>.')],
        ['runInInjectionContext()','runInInjectionContext(injector, fn): T',tx('Führt <code>fn</code> synchron im Context eines Injectors aus – für Code, der später läuft.','Runs <code>fn</code> synchronously in the context of an injector – for code that runs later.')],
        ['inject(Injector)','Injector',tx('Den aktuellen Injector merken, um ihn später an <code>runInInjectionContext()</code> oder an eine <code>{ injector }</code>-Option zu geben.','Keep the current injector to hand it to <code>runInInjectionContext()</code> or an <code>{ injector }</code> option later.')],
        ['assertInInjectionContext()','assertInInjectionContext(debugFn): void',tx('Für eigene <code>injectX()</code>-Helfer: wirft außerhalb des Context eine klare Fehlermeldung.','For your own <code>injectX()</code> helpers: throws a clear error outside the context.')]],
  demo:`<div class="sim-grid inject-fn-grid" id="inject-fn-cases"></div>
<div class="sim-card inject-fn-logcard"><h3>${tx('Was der Injector tut','What the injector does')}</h3>
  <ul class="sim-log" id="inject-fn-log" aria-label="${tx('Protokoll','Log')}"></ul>
</div>
<p class="demo-note">${tx('Probier alle acht Stellen. Grün heißt: <code>inject()</code> lief, während ein Injector aktiv war – und du bekommst immer dieselbe <code>Logger</code>-Instanz, weil sie ein Singleton im Root-Injector ist. Achte bei „nach await“ darauf, dass der Aufruf <em>vor</em> dem <code>await</code> noch klappt.','Try all eight places. Green means: <code>inject()</code> ran while an injector was active – and you always get the same <code>Logger</code> instance, because it’s a singleton in the root injector. In “after await”, notice that the call <em>before</em> the <code>await</code> still works.')}</p>`,
  init(root){
    const {log}=NG,D=NGDI;D.reset();
    const ul=$('#inject-fn-log',root);let alive=true;const timers=[];
    const on=ev=>{
      if(ev.type==='auto')log(ul,`<span class="t">Root</span> ${tx('registriert','registers')} ${ev.token} (providedIn: 'root')`);
      if(ev.type==='create')log(ul,`<span class="hl">${tx('erzeugt','creates')}</span> ${esc(D.label(ev.value))}`);
      if(ev.type==='factory')log(ul,`<span class="hl">${tx('Factory liefert','factory returns')}</span> ${ev.token} = ${esc(D.label(ev.value))}`);
      if(ev.type==='hit')log(ul,`<span class="t">${tx('schon da','already there')}</span> ${esc(D.label(ev.value))}`);
    };
    const inj=D.injector('Root',[],null,{root:true,on});
    const Logger=D.service('Logger',{providedIn:'root'});
    const Config=D.token('APP_CONFIG',{factory:()=>({apiUrl:'/api'})});
    const API_URL=D.token('API_URL');
    inj.provide({provide:API_URL,useFactory:()=>D.inject(Config).apiUrl});
    const tryIt=(t=Logger)=>{try{return {ok:true,v:D.inject(t)}}catch(e){return {ok:false,e}}};
    const create=C=>D.runIn(inj,()=>new C());
    const wait=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
    const CASES=[
      {k:'field',t:tx('Feld-Initialisierer','Field initialiser'),code:`export class Profile {
  logger = inject(Logger);
}`,run:()=>{class Profile{logger=tryIt()};return [create(Profile).logger]}},
      {k:'ctor',t:tx('Konstruktor','Constructor'),code:`constructor() {
  this.logger = inject(Logger);
}`,run:()=>{class Profile{constructor(){this.r=tryIt()}};return [create(Profile).r]}},
      {k:'init',t:'ngOnInit',code:`ngOnInit() {
  this.logger = inject(Logger);
}`,run:()=>{class Profile{ngOnInit(){this.r=tryIt()}};const c=create(Profile);c.ngOnInit();return [c.r]}},
      {k:'timeout',t:tx('Callback','Callback'),code:`constructor() {
  setTimeout(() => inject(Logger));
}`,run:async()=>{let p;class Profile{constructor(){p=new Promise(r=>timers.push(setTimeout(()=>r(tryIt()),300)))}};create(Profile);return [await p]}},
      {k:'await',t:tx('Nach await','After await'),code:`async save() {  // ${tx('aus dem Konstruktor','called from constructor')}
  const a = inject(Logger);
  await api.save();
  const b = inject(Logger);
}`,run:async()=>{let p;class Profile{constructor(){p=this.save()}async save(){const a=tryIt();await wait(300);const b=tryIt();return [a,b]}};create(Profile);return await p}},
      {k:'run',t:'runInInjectionContext',code:`injector = inject(Injector);
onClick() {

    () => inject(Logger));
}`,run:()=>{class Profile{injector=D.inject(D.Injector);onClick(){return D.runIn(this.injector,()=>tryIt())}};return [create(Profile).onClick()]}},
      {k:'factory',t:tx('Provider-Factory','Provider factory'),code:`{ provide: API_URL,
  useFactory: () => inject(APP_CONFIG).apiUrl }`,run:()=>{try{return [{ok:true,v:inj.get(API_URL)}]}catch(e){return [{ok:false,e}]}}},
      {k:'guard',t:tx('Funktionaler Guard','Functional guard'),code:`canActivate: [() => {
  inject(Logger).log('check');
  return true;
}]`,run:()=>[D.runIn(inj,()=>tryIt())]}
    ];
    const box=$('#inject-fn-cases',root);
    box.innerHTML=CASES.map(c=>`<div class="sim-card inject-fn-case"><h3>${c.t}</h3><pre class="inject-fn-code"><code>${esc(c.code)}</code></pre>
      <button type="button" class="btn btn-secondary" data-k="${c.k}">${tx('Ausführen','Run')}<span class="sr-only">: ${c.t}</span></button>
      <output class="inject-fn-out" id="inject-fn-out-${c.k}"></output></div>`).join('');
    const show=r=>r.ok?`<span class="inject-fn-ok">✓ ${esc(D.label(r.v))}</span>`:`<span class="inject-fn-err">✗ ${esc(r.e.message.split('.')[0])}</span>`;
    box.addEventListener('click',async e=>{

  css:`.inject-fn-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}.inject-fn-case{display:grid;gap:10px;align-content:start}.inject-fn-case h3{margin:0}
.inject-fn-code{margin:0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.45 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.inject-fn-case .btn{justify-self:start}.inject-fn-out{display:block;min-height:1.5em;font:600 .8125rem/1.45 var(--font-mono);overflow-wrap:anywhere}
