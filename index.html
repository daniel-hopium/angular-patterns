    note:tx('Der Gruppen-Validator läuft bei jeder Änderung eines Kinds, sieht beide Werte und meldet den Fehler an <code>form.errors</code>. Im Template: <code>@if (form.hasError(\'passwordMismatch\'))</code>.','The group validator runs on every child change, sees both values and reports the error on <code>form.errors</code>. In the template: <code>@if (form.hasError(\'passwordMismatch\'))</code>.')},
  do:tx(['Validatoren als reine, exportierte Funktionen schreiben – leicht zu testen und wiederzuverwenden.','Leere Werte im eigenen Validator durchlassen und <code>required</code> separat setzen.','Feldübergreifende Regeln auf die Gruppe (<code>{ validators: … }</code>).','Bei async: <code>updateOn: \'blur\'</code>, Serverfehler mit <code>catchError</code> abfangen und <code>PENDING</code> im UI zeigen.'],
        ['Write validators as pure, exported functions – easy to test and reuse.','Let empty values pass in custom validators and set <code>required</code> separately.','Cross-field rules go on the group (<code>{ validators: … }</code>).','For async: <code>updateOn: \'blur\'</code>, catch server errors with <code>catchError</code> and show <code>PENDING</code> in the UI.']),
  dont:tx(['Kein Zugriff auf <code>this.form</code> aus einem Feld-Validator.','Keine asynchronen Validatoren, deren Observable nie endet (z. B. ein <code>valueChanges</code>) – das Feld bleibt ewig <code>PENDING</code>.','Nicht absenden, solange das Formular <code>PENDING</code> ist.'],
        ['No access to <code>this.form</code> from a field validator.','No async validators whose observable never completes (e.g. a <code>valueChanges</code>) – the field stays <code>PENDING</code> forever.','Don’t submit while the form is <code>PENDING</code>.']),
  why:tx('<p>Angular berechnet den Status in fester Reihenfolge: deaktiviert → eigene Fehler → läuft ein async-Validator (hier oder in einem Kind)? → ist ein Kind ungültig? Darum ist eine Gruppe mit einem wartenden Kind <code>PENDING</code>, auch wenn ein anderes Kind ungültig ist. Asynchrone Validatoren starten erst, wenn die synchronen <code>null</code> liefern – ein zu kurzer Name kostet keinen Request.</p><p>Jeder neue Wert kündigt die laufende asynchrone Prüfung (wie <code>switchMap</code>). <code>updateOn: \'blur\'</code> reduziert die Anzahl der Werte von „jeder Tastendruck“ auf „einmal beim Verlassen“ – der einfachste Weg, den Server zu schonen.</p>',
           '<p>Angular computes the status in a fixed order: disabled → own errors → is an async validator running (here or in a child)? → is a child invalid? That’s why a group with a waiting child is <code>PENDING</code> even if another child is invalid. Async validators only start once the sync ones return <code>null</code> – a too-short name costs no request.</p><p>Every new value cancels the running async check (like <code>switchMap</code>). <code>updateOn: \'blur\'</code> reduces the number of values from “every keystroke” to “once on leaving” – the simplest way to spare the server.</p>'),
  test:{code:`it('reports a mismatch on the group', () => {
  const form = new FormGroup(
    { password: new FormControl('secret123'), confirm: new FormControl('secret124') },
    { validators: passwordsMatch },
  );
  expect(form.errors).toEqual({ passwordMismatch: true });

  form.controls.confirm.setValue('secret123');
  expect(form.valid).toBe(true);
});

it('noWhitespace', () => {
  expect(noWhitespace(new FormControl('a b'))).toEqual({ whitespace: true });
  expect(noWhitespace(new FormControl('ab'))).toBeNull();
});`,note:tx('Validatoren sind Funktionen – ein <code>new FormControl()</code> reicht als Eingabe, kein TestBed nötig.','Validators are functions – a <code>new FormControl()</code> is enough as input, no TestBed needed.')}
});

LESSONS.push({
  id:'container-presentational', cat:'perf', order:30,
  title:tx('Container und Präsentations-Komponenten','Container and presentational components'),
  short:tx('Daten fließen per Input nach unten, Ereignisse per Output nach oben – nur der Container kennt Services.','Data flows down via inputs, events flow up via outputs – only the container knows services.'),
  keys:'smart dumb container presentational präsentation input output architektur architecture wiederverwendbar reusable data flow datenfluss',
  status:'stable',
  refs:[[tx('Styleguide: Komponenten auf Darstellung fokussieren','Style guide: Keep components focused on presentation'),'https://angular.dev/style-guide#keep-components-and-directives-focused-on-presentation'],
        [tx('Angular-Doku: Outputs','Angular docs: Outputs'),'https://angular.dev/guide/components/outputs#emitting-event-data']],
  rule:tx('Teile Komponenten in zwei Rollen: <strong>Container</strong> holen Daten aus Services und entscheiden, was passiert. <strong>Präsentations-Komponenten</strong> bekommen alles per <code>input()</code>, melden Nutzeraktionen per <code>output()</code> und injizieren keine Fach-Services. So sind sie wiederverwendbar, leicht testbar und passen perfekt zu OnPush.','Split components into two roles: <strong>containers</strong> get data from services and decide what happens. <strong>Presentational components</strong> receive everything via <code>input()</code>, report user actions via <code>output()</code> and inject no domain services. That makes them reusable, easy to test and a perfect fit for OnPush.'),
  apis:[['input()','input.required<T>()',tx('Daten nach unten: vom Container in die Präsentations-Komponente.','Data down: from the container into the presentational component.')],
        ['output()','output<T>()',tx('Ereignisse nach oben: „Nutzer hat X gewählt“ – was dann passiert, entscheidet der Container.','Events up: “user chose X” – the container decides what happens next.')],
        ['inject()','inject(ProductStore)',tx('Nur im Container. Präsentations-Komponenten bleiben frei von Fach-Services.','Only in the container. Presentational components stay free of domain services.')]],
  demo:`<div class="sim-row container-presentational-top">
  ${TPL.seg('container-presentational-mode',tx('ProductList …','ProductList …'),[['good',tx('bekommt input(), meldet output()','gets input(), emits output()')],['bad',tx('injiziert den Store selbst','injects the store itself')]],'good')}
</div>
<div class="sim-grid">
  <div class="sim-card container-presentational-wide"><h3>ProductsPage <span class="sim-tag">${tx('Container','container')}</span></h3>
    <p class="hint" id="container-presentational-inject"></p>
    <div class="sim-grid container-presentational-kids">
      <div class="container-presentational-cmp" id="container-presentational-l1"></div>
      <div class="container-presentational-cmp" id="container-presentational-l2"></div>
      <div class="container-presentational-cmp" id="container-presentational-d"></div>
    </div>
  </div>
</div>
<ul class="sim-log container-presentational-log" id="container-presentational-log" aria-label="${tx('Datenfluss','Data flow')}"></ul>
<p class="demo-note">${tx('Probier: Wähl ein Produkt und schalte es als Favorit um – im Protokoll siehst du Daten nach unten (↓ input) und Ereignisse nach oben (↑ output). Dieselbe ProductList zeigt einmal alle Produkte und einmal nur Favoriten. Schalt dann auf „injiziert den Store selbst“: Beide Listen zeigen dasselbe, denn die Komponente kann nicht mehr von außen gesteuert werden.','Try: pick a product and toggle it as a favourite – the log shows data flowing down (↓ input) and events flowing up (↑ output). The same ProductList shows all products once and only favourites once. Then switch to “injects the store itself”: both lists show the same thing, because the component can no longer be controlled from outside.')}</p>`,
  init(root){
    const {signal,computed,log,flash}=NG;
    const ul=$('#container-presentational-log',root);
    /* ProductStore – der Service */
    const products=signal([{id:1,name:tx('Tastatur','Keyboard'),fav:true},{id:2,name:tx('Maus','Mouse'),fav:false},{id:3,name:'Monitor',fav:true},{id:4,name:'Headset',fav:false}],{name:'products'});
    const selectedId=signal(1,{name:'selectedId'});
    const favorites=computed(()=>products().filter(p=>p.fav));
    const selected=computed(()=>products().find(p=>p.id===selectedId())??null);
    const store={select:id=>selectedId.set(id),toggleFavorite:id=>products.update(ps=>ps.map(p=>p.id===id?{...p,fav:!p.fav}:p))};
    let mode='good';
    const L=html=>log(ul,html);
    function list(el,title,items,who){
      el.innerHTML=`<h4>ProductList <span class="container-presentational-who">${esc(title)}</span></h4>
        <p class="container-presentational-io">${mode==='good'?`[products] · [selectedId] · (select)`:`inject(ProductStore)`}</p>
        ${items.length?`<ul class="container-presentational-items">${items.map(p=>`<li><button type="button" class="btn ${p.id===selectedId()?'btn-primary':'btn-secondary'}" data-pick="${p.id}" data-who="${who}" aria-pressed="${p.id===selectedId()}">${esc(p.name)}${p.fav?' ★':''}</button></li>`).join('')}</ul>`:`<p class="hint">${tx('Keine Einträge','No items')}</p>`}`;
    }
    function render(){
      $('#container-presentational-inject',root).innerHTML=mode==='good'?`<code>store = inject(ProductStore)</code> – ${tx('nur hier','only here')}`:`<code>store = inject(ProductStore)</code> – ${tx('hier und in jeder ProductList','here and in every ProductList')}`;
      /* good: der Container reicht unterschiedliche Daten an dieselbe Komponente */
      list($('#container-presentational-l1',root),tx('„Alle“','“All”'),products(),'l1');
      list($('#container-presentational-l2',root),tx('„Favoriten“','“Favourites”'),mode==='good'?favorites():products(),'l2');
      const p=selected(),d=$('#container-presentational-d',root);
      d.innerHTML=`<h4>ProductDetail</h4><p class="container-presentational-io">[product] · (toggleFavorite)</p>${p?`<p><b>${esc(p.name)}</b> ${p.fav?`★ ${tx('Favorit','favourite')}`:''}</p><button type="button" class="btn btn-secondary" id="container-presentational-fav">${p.fav?tx('Kein Favorit mehr','Remove favourite'):tx('Als Favorit merken','Mark as favourite')}</button>`:`<p class="hint">${tx('Nichts gewählt','Nothing selected')}</p>`}`;
    }
    function down(){
      if(mode==='good'){
        L(`<span class="t">↓ input</span> ProductList ${tx('„Alle“','“All”')}: products (${products().length}), selectedId = ${selectedId()}`);
        L(`<span class="t">↓ input</span> ProductList ${tx('„Favoriten“','“Favourites”')}: products (${favorites().length}), selectedId = ${selectedId()}`);
      }else L(`<span class="t">${tx('beide Listen lesen','both lists read')}</span> store.products() (${products().length}) – ${tx('der Titel „Favoriten“ ist wirkungslos','the “Favourites” title has no effect')}`);
      L(`<span class="t">↓ input</span> ProductDetail: product = ${esc(selected()?.name??'null')}`);
      render();$$('.container-presentational-cmp',root).forEach(flash);
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-pick]');
      if(b){
        const id=+b.dataset.pick,who=b.dataset.who==='l1'?tx('„Alle“','“All”'):tx('„Favoriten“','“Favourites”');
        if(mode==='good'){L(`<span class="hl">↑ output</span> ProductList ${who}: select.emit(${id})`);L(`ProductsPage → store.select(${id})`)}
        else L(`<span class="hl">ProductList ${who}</span> ${tx('ruft selbst','calls itself')} store.select(${id}) – ${tx('Container weiß nichts davon','container knows nothing')}`);
        store.select(id);down();
        $(`[data-pick="${id}"][data-who="${b.dataset.who}"]`,root)?.focus();
      }
      if(e.target.closest('#container-presentational-fav')){
        const id=selectedId();
        L(`<span class="hl">↑ output</span> ProductDetail: toggleFavorite.emit(${id})`);L(`ProductsPage → store.toggleFavorite(${id})`);
        store.toggleFavorite(id);down();$('#container-presentational-fav',root)?.focus();
      }
    });
    root.addEventListener('change',e=>{if(e.target.name!=='container-presentational-mode')return;mode=e.target.value;L(`<span class="t">${mode==='good'?tx('Präsentations-Komponente mit input/output','presentational component with input/output'):tx('ProductList injiziert den Store','ProductList injects the store')}</span>`);down()});
    render();
    log(ul,`<span class="t">${tx('Wähl ein Produkt – hier erscheint der Datenfluss.','Pick a product – the data flow appears here.')}</span>`);
  },
  css:`.container-presentational-top{margin-bottom:14px}.container-presentational-wide{grid-column:1/-1}.container-presentational-log{margin-top:16px}
.container-presentational-kids{margin-top:10px}
.container-presentational-cmp{border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.container-presentational-cmp.flash{border-color:var(--brand);border-style:solid}
.container-presentational-cmp h4{margin:0 0 4px;font-size:1rem}
.container-presentational-who{font-weight:400;color:var(--muted)}
.container-presentational-io{font:500 .75rem/1.4 var(--font-mono);color:var(--brand);margin:0 0 8px;overflow-wrap:anywhere}
.container-presentational-items{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.container-presentational-cmp p{margin:0 0 8px}`,
  bad:{code:`@Component({
  selector: 'app-product-list',
  template: \`
    @for (p of store.products(); track p.id) {
      <button (click)="store.select(p.id)">{{ p.name }}</button>
    }
  \`,
})
export class ProductList {
  protected readonly store = inject(ProductStore);
}`,
    note:tx('Die Liste weiß, woher ihre Daten kommen und was ein Klick bedeutet. Für eine zweite Liste (Favoriten, Suchergebnis) brauchst du eine zweite Komponente, und im Test musst du den ganzen Store nachbauen.','The list knows where its data comes from and what a click means. For a second list (favourites, search results) you need a second component, and in tests you have to rebuild the whole store.')},
  good:{code:`// presentational: inputs down, outputs up
@Component({
  selector: 'app-product-list',
  changeDetection: ChangeDetectionStrategy.OnPush,
  template: \`
    @for (p of products(); track p.id) {
      <button [attr.aria-pressed]="p.id === selectedId()"
              (click)="select.emit(p.id)">{{ p.name }}</button>
    }
  \`,
})
export class ProductList {
  readonly products = input.required<readonly Product[]>();
  readonly selectedId = input<number | null>(null);
  readonly select = output<number>();
}

// container
@Component({
  imports: [ProductList, ProductDetail],
  template: \`
    <app-product-list [products]="store.products()"
                      [selectedId]="store.selectedId()"
                      (select)="store.select($event)" />
    <app-product-list [products]="store.favorites()"
                      (select)="store.select($event)" />
  \`,
})
export class ProductsPage {
  protected readonly store = inject(ProductStore);
}`,
    note:tx('Dieselbe <code>ProductList</code> dient für alle Listen. Sie hat keine Abhängigkeiten, bekommt nur neue Referenzen über Signal-Inputs und ist damit ideal für OnPush.','The same <code>ProductList</code> serves every list. It has no dependencies, only receives new references via signal inputs and is therefore ideal for OnPush.')},
  do:tx(['Präsentations-Komponenten nur mit <code>input()</code>, <code>output()</code> und <code>model()</code> ansprechen.','Outputs nach dem benennen, was der Nutzer will (<code>select</code>, <code>toggleFavorite</code>), nicht nach dem DOM-Event.','Container pro Route oder Feature-Bereich anlegen; dort Services injizieren und Aktionen verdrahten.','UI-Services (z. B. für Fokus oder Overlays) dürfen auch Präsentations-Komponenten nutzen – gemeint sind Fach- und Daten-Services.'],
        ['Talk to presentational components only via <code>input()</code>, <code>output()</code> and <code>model()</code>.','Name outputs after what the user wants (<code>select</code>, <code>toggleFavorite</code>), not after the DOM event.','Create containers per route or feature area; inject services and wire up actions there.','UI services (e.g. for focus or overlays) are fine in presentational components too – this is about domain and data services.']),
  dont:tx(['Inputs in der Kind-Komponente nicht verändern (kein <code>push</code> auf ein Input-Array) – Änderungen gehen per Output nach oben.','Keine HTTP-Aufrufe in Präsentations-Komponenten.','Nicht jede Mini-Komponente in Container und Präsentation aufteilen – die Trennung lohnt sich bei wiederverwendeter oder komplexer UI.'],
        ['Don’t change inputs in the child component (no <code>push</code> onto an input array) – changes go up via an output.','No HTTP calls in presentational components.','Don’t split every tiny component into container and presentation – the split pays off for reused or complex UI.']),
  why:tx('<p>Der Datenfluss in eine Richtung – Daten nach unten, Ereignisse nach oben – macht nachvollziehbar, wer was ändert. Zustand lebt an einer Stelle (Service oder Container), die Kinder spiegeln ihn nur. Das verhindert, dass zwei Komponenten denselben Zustand unabhängig voneinander verändern.</p><p>Nebenbei passt das Muster genau zu OnPush: Eine Präsentations-Komponente ändert sich nur, wenn ein Input eine neue Referenz bekommt oder in ihr ein Event passiert. Angular kann sie in allen anderen Fällen überspringen, und im Test reichen <code>setInput()</code> und ein Blick auf das ausgelöste Output.</p>',
           '<p>One-way data flow – data down, events up – makes it traceable who changes what. State lives in one place (service or container), the children only mirror it. That prevents two components from changing the same state independently.</p><p>On top of that, the pattern fits OnPush exactly: a presentational component only changes when an input gets a new reference or an event happens inside it. Angular can skip it in all other cases, and in tests <code>setInput()</code> and a look at the emitted output are enough.</p>'),
  test:{code:`it('emits the selected id', async () => {
  const fixture = TestBed.createComponent(ProductList);
  fixture.componentRef.setInput('products', [{ id: 7, name: 'Mouse' }]);
  await fixture.whenStable();

  let picked: number | undefined;
  fixture.componentInstance.select.subscribe(id => (picked = id));
  fixture.nativeElement.querySelector('button').click();

  expect(picked).toBe(7);
});`,note:tx('Keine Provider, kein Store-Mock: Eine Präsentations-Komponente testest du nur über Inputs und Outputs.','No providers, no store mock: you test a presentational component only through inputs and outputs.')}
});

LESSONS.push({
  id:'hydration', cat:'perf', order:50,
  title:tx('SSR, Hydration und Event Replay','SSR, hydration and event replay'),
  short:tx('Der Server liefert fertiges HTML, der Client übernimmt es – ganz, schrittweise per @defer (hydrate …) und ohne verlorene Klicks.','The server delivers finished HTML, the client takes it over – fully, step by step via @defer (hydrate …) and without lost clicks.'),
  keys:'ssr server side rendering hydration hydrierung incremental inkrementell event replay providerclienthydration withEventReplay withNoIncrementalHydration hydrate defer ngSkipHydration',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Hydration aktivieren','Angular docs: Enabling hydration'),'https://angular.dev/guide/hydration#how-do-you-enable-hydration-in-angular'],
        [tx('Angular-Doku: Event Replay','Angular docs: Capturing and replaying events'),'https://angular.dev/guide/hydration#capturing-and-replaying-events'],
        [tx('Angular-Doku: Hydrate-Trigger','Angular docs: Hydrate triggers'),'https://angular.dev/guide/incremental-hydration#controlling-hydration-of-content-with-triggers']],
  rule:tx('Mit SSR zeigt der Browser sofort das HTML vom Server. <strong>Hydration</strong> heißt: Angular übernimmt dieses DOM, statt es neu zu bauen, und hängt die Listener an. <strong>Event Replay</strong> puffert Klicks, die vorher passieren, und spielt sie danach ab. Seit Angular 22 schaltet <code>provideClientHydration()</code> auch <strong>inkrementelle Hydration</strong> ein: <code>@defer (hydrate on …)</code>-Blöcke bleiben reines Server-HTML, bis ihr Trigger feuert – Event Replay ist dabei automatisch aktiv.','With SSR the browser shows the server’s HTML right away. <strong>Hydration</strong> means Angular takes over this DOM instead of rebuilding it and attaches the listeners. <strong>Event replay</strong> buffers clicks that happen before that and replays them afterwards. Since Angular 22, <code>provideClientHydration()</code> also turns on <strong>incremental hydration</strong>: <code>@defer (hydrate on …)</code> blocks stay plain server HTML until their trigger fires – with event replay switched on automatically.'),
  apis:[['provideClientHydration','provideClientHydration(...features)',tx('Aktiviert Hydration inkl. HTTP-Transfer-Cache und (seit v22) inkrementeller Hydration.','Enables hydration incl. the HTTP transfer cache and (since v22) incremental hydration.')],
        ['withEventReplay','withEventReplay()',tx('Puffert Events bis zur Hydration. Mit inkrementeller Hydration ohnehin aktiv.','Buffers events until hydration. Active anyway with incremental hydration.')],
        ['withNoIncrementalHydration','withNoIncrementalHydration()',tx('Neu in v22: schaltet die inkrementelle Hydration ab. <code>withIncrementalHydration()</code> ist seit v22 deprecated.','New in v22: turns incremental hydration off. <code>withIncrementalHydration()</code> is deprecated since v22.')],
        ['hydrate on','@defer (hydrate on interaction) { … }',tx('Wann ein server-gerenderter Block hydriert wird: <code>idle</code>, <code>viewport</code>, <code>interaction</code>, <code>hover</code>, <code>immediate</code>, <code>timer(…)</code>; dazu <code>hydrate when</code> und <code>hydrate never</code>.','When a server-rendered block is hydrated: <code>idle</code>, <code>viewport</code>, <code>interaction</code>, <code>hover</code>, <code>immediate</code>, <code>timer(…)</code>; plus <code>hydrate when</code> and <code>hydrate never</code>.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>app.config.ts</h3>
    ${TPL.seg('hydration-cfg',tx('Konfiguration','Configuration'),[['none',tx('ohne Replay','no replay')],['replay','+ withEventReplay()'],['incr',tx('v22-Standard','v22 default')]],'incr')}
    <pre class="hydration-code" id="hydration-code"></pre>
    <p class="sim-row"><button type="button" class="btn btn-primary" id="hydration-reload">${tx('Seite neu laden','Reload page')}</button></p>
    <p class="hint">${tx('Klick gleich nach dem Neuladen auf die Buttons in der Seite – bevor Angular fertig ist.','Click the buttons in the page right after reloading – before Angular is done.')}</p>
  </div>
  <div class="sim-card"><h3>${tx('Die Seite im Browser','The page in the browser')}</h3>
    <div class="hydration-page">
      <section class="hydration-region" id="hydration-r-main"><p class="hydration-st"></p><p class="hydration-title">${tx('Artikel','Article')}</p><button type="button" class="btn btn-secondary" id="hydration-like"><span>${tx('Gefällt mir','Like')} (<span class="hydration-n">0</span>)</span></button></section>
      <section class="hydration-region" id="hydration-r-comments"><p class="hydration-st"></p><p class="hydration-tag" id="hydration-tag-comments"></p><p class="hydration-title">${tx('Kommentare','Comments')}</p><button type="button" class="btn btn-secondary" id="hydration-reply"><span>${tx('Antworten','Reply')} (<span class="hydration-n">0</span>)</span></button></section>
      <section class="hydration-region" id="hydration-r-footer"><p class="hydration-st"></p><p class="hydration-tag" id="hydration-tag-footer"></p><p class="hydration-title">Footer</p><p class="hint">${tx('Impressum · Datenschutz (nur Links)','Imprint · Privacy (links only)')}</p></section>
    </div>
    <ul class="sim-log" id="hydration-log" aria-label="${tx('Zeitleiste','Timeline')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: „ohne Replay“, neu laden und sofort mehrmals „Gefällt mir“ – die Klicks verpuffen, weil noch kein Listener da ist. Mit <code>withEventReplay()</code> werden sie nach der Hydration nachgeholt. Im v22-Standard ist das Start-Bundle kleiner, Kommentare bleiben Server-HTML, bis du hineinklickst, und der Footer wird nie hydriert.','Try: “no replay”, reload and immediately click “Like” several times – the clicks are lost because there is no listener yet. With <code>withEventReplay()</code> they are replayed after hydration. In the v22 default the initial bundle is smaller, comments stay server HTML until you click into them, and the footer is never hydrated.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const ul=$('#hydration-log',root),timers=new Set();
    const MAIN={none:1300,replay:1300,incr:700},CHUNK=500;
    let cfg='incr',t0=0,run=0;
    const R={main:{},comments:{},footer:{}};
    const counts={like:0,reply:0};
    const later=(f,ms)=>{const my=run;const t=setTimeout(()=>{timers.delete(t);if(my===run)f()},ms);timers.add(t)};
    const L=h=>log(ul,`<span class="t">+${Math.round(performance.now()-t0)} ms</span> ${h}`);
    const codes={
      none:`provideClientHydration(
  withNoIncrementalHydration(),
)`,
      replay:`provideClientHydration(
  withNoIncrementalHydration(),
  withEventReplay(),
)`,
      incr:`provideClientHydration()
// template:
@defer (hydrate on interaction) {
  <app-comments />
}
@defer (hydrate never) {
  <app-footer />
}`};
    const label={server:tx('Server-HTML – noch keine Listener','server HTML – no listeners yet'),loading:tx('JS lädt …','JS loading …'),hydrated:tx('hydriert','hydrated'),never:tx('bleibt Server-HTML','stays server HTML')};
    function setState(k,s){
      R[k].state=s;const el=$(`#hydration-r-${k}`,root);
      el.dataset.state=s;$('.hydration-st',el).textContent=label[s];
      if(s==='hydrated')flash(el);
    }
    const replayable=()=>cfg!=='none';
    function hydrate(k){
      setState(k,'hydrated');L(`<span class="hl">${tx('hydriert','hydrated')}</span> ${k==='main'?'AppComponent':k==='comments'?'@defer: app-comments':'app-footer'}`);
      const q=R[k].queue.splice(0);
      if(q.length)L(`Event Replay: ${q.length}× click ${tx('nachgeholt','replayed')}`);
      q.forEach(fn=>fn());
    }
    const bump=(id,key)=>{counts[key]++;const b=$(`#${id} .hydration-n`,root);b.textContent=counts[key];flash($(`#${id}`,root))};
    function start(){
      run++;timers.forEach(clearTimeout);timers.clear();t0=performance.now();ul.replaceChildren();
      counts.like=counts.reply=0;$('#hydration-like .hydration-n',root).textContent=0;$('#hydration-reply .hydration-n',root).textContent=0;
      Object.values(R).forEach(r=>r.queue=[]);
      $('#hydration-code',root).textContent=codes[cfg];
      const incr=cfg==='incr';
      $('#hydration-tag-comments',root).textContent=incr?'@defer (hydrate on interaction)':'';
      $('#hydration-tag-footer',root).textContent=incr?'@defer (hydrate never)':'';
      setState('main','server');setState('comments','server');setState('footer',incr?'never':'server');
      L(tx('HTML vom Server da – Seite ist sofort sichtbar','HTML from the server arrived – the page is visible right away'));
      L(`GET main.js <span class="t">(${incr?tx('kleiner: Kommentare und Footer sind eigene Chunks','smaller: comments and footer are separate chunks'):tx('alles in einem Bundle','everything in one bundle')})</span>`);
      setState('main','loading');if(!incr){setState('comments','loading');setState('footer','loading')}
      later(()=>{
        L(tx('main.js geladen, App bootstrapt','main.js loaded, app bootstraps'));
        hydrate('main');
        if(!incr){hydrate('comments');hydrate('footer')}
      },MAIN[cfg]);
    }
    function click(k,id,key){
      const r=R[k];
      if(r.state==='hydrated'){bump(id,key);return}
      if(r.state==='never')return;
      if(!replayable()){L(`<span class="hl">${tx('Klick verpufft','click lost')}</span> – ${tx('noch kein Angular-Listener am Button','no Angular listener on the button yet')}`);return}
      r.queue.push(()=>bump(id,key));
      L(`Event Replay: ${tx('Klick gepuffert','click buffered')} (${r.queue.length})`);
      if(cfg==='incr'&&k==='comments'&&r.state==='server'){
        setState('comments','loading');
        L(`<span class="hl">hydrate on interaction</span> → GET comments.chunk.js`);
        /* Ein Kind-Block wird erst hydriert, wenn die App selbst hydriert ist */
        const wait=()=>{if(R.main.state==='hydrated')later(()=>hydrate('comments'),CHUNK);else later(wait,50)};
        wait();
      }
    }
    root.addEventListener('click',e=>{
      if(e.target.closest('#hydration-reload'))start();
      if(e.target.closest('#hydration-like'))click('main','hydration-like','like');
      if(e.target.closest('#hydration-reply'))click('comments','hydration-reply','reply');
    });
    root.addEventListener('change',e=>{if(e.target.name==='hydration-cfg'){cfg=e.target.value;start()}});
    start();
    return ()=>{run++;timers.forEach(clearTimeout)};
  },
  css:`.hydration-code{margin:12px 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.hydration-page{display:grid;gap:8px;margin-bottom:12px}
.hydration-region{border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);padding:8px 12px;background:var(--surface-2)}
.hydration-region[data-state="hydrated"]{border-style:solid;border-color:var(--success);background:var(--success-bg)}
.hydration-region[data-state="loading"]{border-color:var(--warn);background:var(--warn-bg)}
.hydration-region p{margin:0 0 6px}
.hydration-st{font:700 .75rem/1.3 var(--font-mono);color:var(--muted)}
.hydration-tag{font:600 .75rem/1.3 var(--font-mono);color:var(--brand)}.hydration-tag:empty{display:none}
.hydration-title{font-weight:700}`,
  bad:{code:`// app.config.ts
providers: [provideClientHydration()]

// component
ngOnInit() {
  // runs on the server too – 'window' does not exist there
  const width = window.innerWidth;
  // direct DOM change: the client DOM no longer matches the server HTML
  this.el.nativeElement.innerHTML = '<b>Hi</b>';
}`,
    note:tx('Browser-APIs im Konstruktor oder <code>ngOnInit</code> brechen das Rendern auf dem Server; direkte DOM-Manipulation führt zu Hydration-Fehlern (Mismatch). Als Notausgang gibt es <code>ngSkipHydration</code> – dann wird die Komponente auf dem Client neu gerendert.','Browser APIs in the constructor or <code>ngOnInit</code> break rendering on the server; direct DOM manipulation causes hydration errors (mismatch). As an escape hatch there is <code>ngSkipHydration</code> – the component is then re-rendered on the client.')},
  good:{code:`// app.config.ts (v22): hydration, HTTP transfer cache,
// incremental hydration and event replay in one call
providers: [provideClientHydration()]

// component: browser-only code after rendering
constructor() {
  afterNextRender(() => {
    this.width.set(window.innerWidth);
  });
}

// template: hydrate heavy, rarely used parts on demand
@defer (hydrate on viewport) {
  <app-product-reviews />
}`,
    note:tx('<code>afterNextRender()</code> läuft nur im Browser. <code>hydrate on …</code> lädt den Code eines server-gerenderten Blocks erst, wenn er gebraucht wird – der Inhalt ist trotzdem sofort sichtbar. Hast du von früher <code>withEventReplay()</code> in der Liste, schadet es nicht.','<code>afterNextRender()</code> only runs in the browser. <code>hydrate on …</code> only loads the code of a server-rendered block when it’s needed – the content is visible right away anyway. If you still have <code>withEventReplay()</code> in the list from earlier, it does no harm.')},
  do:tx(['Browser-only-Code in <code>afterNextRender()</code> oder <code>afterEveryRender()</code> legen.','Gültiges HTML schreiben (<code>&lt;tbody&gt;</code> in Tabellen, keine <code>&lt;div&gt;</code> in <code>&lt;p&gt;</code>) – sonst weicht das DOM des Browsers vom Server-HTML ab.','Selten genutzte, schwere Bereiche mit <code>@defer (hydrate on viewport | interaction)</code> versehen.','Statische Bereiche ohne Interaktion mit <code>hydrate never</code> markieren.'],
        ['Put browser-only code into <code>afterNextRender()</code> or <code>afterEveryRender()</code>.','Write valid HTML (<code>&lt;tbody&gt;</code> in tables, no <code>&lt;div&gt;</code> inside <code>&lt;p&gt;</code>) – otherwise the browser’s DOM differs from the server HTML.','Mark rarely used, heavy areas with <code>@defer (hydrate on viewport | interaction)</code>.','Mark static areas without interaction with <code>hydrate never</code>.']),
  dont:tx(['Kein <code>innerHTML</code>, <code>appendChild</code> oder andere direkte DOM-Änderungen in hydrierten Komponenten.','<code>withIncrementalHydration()</code> nicht mehr neu hinzufügen – in v22 deprecated, weil Standard.','Nicht per <code>isPlatformBrowser()</code> im Template unterschiedliche Inhalte rendern – das erzeugt Mismatches.','<code>ngSkipHydration</code> nicht als Dauerlösung sehen – die Komponente verliert alle Vorteile der Hydration.'],
        ['No <code>innerHTML</code>, <code>appendChild</code> or other direct DOM changes in hydrated components.','Don’t add <code>withIncrementalHydration()</code> any more – deprecated in v22 because it’s the default.','Don’t render different content in the template via <code>isPlatformBrowser()</code> – that creates mismatches.','Don’t treat <code>ngSkipHydration</code> as a permanent fix – the component loses all benefits of hydration.']),
  why:tx('<p>Ohne Hydration würde Angular das Server-HTML wegwerfen und alles neu rendern – die Seite flackert, und der Layout Shift steigt. Mit Hydration geht Angular das vorhandene DOM durch, ordnet es den Views zu und hängt nur noch die Listener an. Bis das JavaScript geladen ist, ist die Seite zwar sichtbar, reagiert aber nicht. Event Replay schließt diese Lücke: Ein kleines Skript im HTML fängt Events ab und spielt sie nach der Hydration ab.</p><p>Inkrementelle Hydration geht einen Schritt weiter: Ein <code>@defer</code>-Block mit <code>hydrate</code>-Trigger wird auf dem Server vollständig gerendert, sein Code aber wie bei normalem <code>@defer</code> in einen eigenen Chunk ausgelagert und erst beim Trigger geladen. In v22 ist das mit <code>provideClientHydration()</code> automatisch an; <code>ng update</code> setzt bei Apps, die es vorher nicht nutzten, <code>withNoIncrementalHydration()</code>, damit sich nichts ändert.</p>',
           '<p>Without hydration Angular would throw away the server HTML and re-render everything – the page flickers and layout shift goes up. With hydration Angular walks the existing DOM, matches it to its views and only attaches the listeners. Until the JavaScript has loaded, though, the page is visible but doesn’t react. Event replay closes this gap: a small script in the HTML captures events and replays them after hydration.</p><p>Incremental hydration goes one step further: a <code>@defer</code> block with a <code>hydrate</code> trigger is fully rendered on the server, but its code is split into its own chunk like with normal <code>@defer</code> and only loaded on the trigger. In v22 this is on automatically with <code>provideClientHydration()</code>; <code>ng update</code> adds <code>withNoIncrementalHydration()</code> to apps that didn’t use it before, so nothing changes.</p>')
});

LESSONS.push({
  id:'optimized-image', cat:'perf', order:60,
  title:tx('Bilder mit NgOptimizedImage','Images with NgOptimizedImage'),
  short:tx('ngSrc statt src: Pflichtmaße gegen Layout Shift, Lazy Loading für den Rest und priority für das LCP-Bild.','ngSrc instead of src: required sizes against layout shift, lazy loading for the rest and priority for the LCP image.'),
  keys:'image bild img ngsrc ngoptimizedimage priority fill lcp cls layout shift lazy loading srcset sizes',
  status:'stable',
  refs:[[tx('Angular-Doku: Bilder als priority markieren','Angular docs: Mark images as priority'),'https://angular.dev/guide/image-optimization#mark-images-as-priority'],
        [tx('Angular-Doku: Breite und Höhe angeben','Angular docs: Include width and height'),'https://angular.dev/guide/image-optimization#include-width-and-height'],
        [tx('Angular-Doku: fill-Modus','Angular docs: Using fill mode'),'https://angular.dev/guide/image-optimization#using-fill-mode']],
  rule:tx('Schreib <code>&lt;img ngSrc="…" width="…" height="…"&gt;</code> statt <code>src</code>. Die Maße reservieren den Platz, alle Bilder laden lazy, und das wichtigste Bild über dem Falz (meist das LCP-Element) bekommt <code>priority</code>. Kennst du die Maße nicht, nimm <code>fill</code> mit einem positionierten Elternelement.','Write <code>&lt;img ngSrc="…" width="…" height="…"&gt;</code> instead of <code>src</code>. The sizes reserve the space, all images load lazily, and the most important image above the fold (usually the LCP element) gets <code>priority</code>. If you don’t know the size, use <code>fill</code> with a positioned parent element.'),
  apis:[['ngSrc','<img ngSrc="hero.jpg">',tx('Aktiviert die Direktive (Selektor <code>img[ngSrc]</code>). Mit einem Loader werden daraus CDN-URLs und ein <code>srcset</code>.','Activates the directive (selector <code>img[ngSrc]</code>). With a loader it becomes CDN URLs and a <code>srcset</code>.')],
        ['width / height','width="800" height="450"',tx('Pflicht (außer bei <code>fill</code>). Verhindern Layout Shift.','Required (except with <code>fill</code>). Prevent layout shift.')],
        ['priority','<img ngSrc="…" priority>',tx('Setzt <code>fetchpriority="high"</code>, <code>loading="eager"</code> und bei SSR einen Preload-Link.','Sets <code>fetchpriority="high"</code>, <code>loading="eager"</code> and, with SSR, a preload link.')],
        ['fill','<img ngSrc="…" fill>',tx('Füllt das Elternelement (braucht <code>position: relative</code>, <code>absolute</code> oder <code>fixed</code>) – für unbekannte Maße.','Fills the parent element (needs <code>position: relative</code>, <code>absolute</code> or <code>fixed</code>) – for unknown sizes.')],
        ['sizes','sizes="(max-width: 600px) 100vw, 50vw"',tx('Für responsive Bilder: Angular erzeugt dann ein passendes <code>srcset</code>.','For responsive images: Angular then generates a matching <code>srcset</code>.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Einstellungen','Settings')}</h3>
    ${TPL.seg('optimized-image-mode',tx('Bild im Template','Image in the template'),[['plain','&lt;img src&gt;'],['ng','&lt;img ngSrc&gt;']],'plain')}
    <pre class="optimized-image-code" id="optimized-image-code"></pre>
    <p class="sim-row"><button type="button" class="btn btn-primary" id="optimized-image-load">${tx('Seite laden','Load page')}</button></p>
    <p class="sim-row"><span class="sim-node" id="optimized-image-lcp">LCP <b>–</b></span><span class="sim-node" id="optimized-image-cls">${tx('Layout Shifts','layout shifts')} <b>0</b></span><span class="sim-node" id="optimized-image-req">Requests <b>0</b></span></p>
  </div>
  <div class="sim-card"><h3>${tx('Die Seite','The page')}</h3>
    <div class="optimized-image-page" id="optimized-image-page" tabindex="0" role="region" aria-label="${tx('Simulierte Seite, scrollbar','Simulated page, scrollable')}"></div>
    <ul class="sim-log optimized-image-log" id="optimized-image-log" aria-label="${tx('Netzwerk','Network')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Mit <code>&lt;img src&gt;</code> laden alle vier Bilder sofort und gleichzeitig, der Text springt bei jedem fertigen Bild nach unten, und das Titelbild kommt spät. Mit <code>ngSrc</code> ist der Platz reserviert, das Titelbild lädt zuerst, und die Galeriebilder erst, wenn du hinscrollst.','Try: with <code>&lt;img src&gt;</code> all four images load immediately and at once, the text jumps down with every finished image, and the hero image arrives late. With <code>ngSrc</code> the space is reserved, the hero loads first, and the gallery images only when you scroll to them.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const page=$('#optimized-image-page',root),ul=$('#optimized-image-log',root),code=$('#optimized-image-code',root);
    const imgs=[{id:'hero',file:'hero.jpg',w:800,h:400,hue:'var(--brand)'},{id:'g1',file:'gallery-1.jpg',w:600,h:400,hue:'var(--success)'},{id:'g2',file:'gallery-2.jpg',w:600,h:400,hue:'var(--warn)'},{id:'g3',file:'gallery-3.jpg',w:600,h:400,hue:'var(--danger)'}];
    let mode='plain',run=0,t0=0,io=null,shifts=0,reqs=0;const timers=new Set();
    const later=(f,ms)=>{const my=run;const t=setTimeout(()=>{timers.delete(t);if(my===run)f()},ms);timers.add(t)};
    const L=h=>log(ul,`<span class="t">+${Math.round(performance.now()-t0)} ms</span> ${h}`);
    const stat=(id,v)=>{const el=$(`#optimized-image-${id}`,root);$('b',el).textContent=v;flash(el)};
    const drawCode=()=>{code.textContent=mode==='plain'?`<img src="hero.jpg" alt="…">
…
<img src="gallery-1.jpg" alt="…">`:`<img ngSrc="hero.jpg" width="800" height="400"
     priority alt="…">
…
<img ngSrc="gallery-1.jpg" width="600" height="400" alt="…">`};
    function build(){
      page.innerHTML=imgs.map((m,i)=>`${i?`<p class="optimized-image-text">${tx('Absatz','Paragraph')} ${i}: Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>`:`<p class="optimized-image-text"><b>${tx('Überschrift','Headline')}</b></p>`}<div class="optimized-image-img" id="optimized-image-${m.id}" role="img" aria-label="${m.file}" style="--hue:${m.hue};${mode==='ng'?`aspect-ratio:${m.w}/${m.h}`:'height:0'}"><span>${m.file}</span></div>`).join('')+`<p class="optimized-image-text">${tx('Ende der Seite.','End of the page.')}</p>`;
    }
    function fetchImg(m,ms,note){
      reqs++;stat('req',reqs);L(`GET ${m.file} <span class="t">${note}</span>`);
      later(()=>{
        const el=$(`#optimized-image-${m.id}`,root);
        if(mode==='plain'){el.style.height='';el.style.aspectRatio=`${m.w}/${m.h}`;shifts++;stat('cls',shifts);L(`<span class="hl">${tx('Layout Shift','layout shift')}</span> – ${tx('alles darunter springt','everything below jumps')}`);}
        el.classList.add('optimized-image-loaded');L(`${m.file} ${tx('geladen','loaded')}`);
        if(m.id==='hero')stat('lcp',`${Math.round(performance.now()-t0)} ms`);
      },ms);
    }
    function start(){
      run++;timers.forEach(clearTimeout);timers.clear();io?.disconnect();io=null;
      t0=performance.now();ul.replaceChildren();shifts=0;reqs=0;
      stat('lcp','–');stat('cls',0);stat('req',0);
      drawCode();build();page.scrollTop=0;
      if(mode==='plain'){
        /* alle sofort, gleiche Priorität – sie teilen sich die Bandbreite */
        [1100,700,900,1000].forEach((ms,i)=>fetchImg(imgs[i],ms,tx('(ohne loading- und fetchpriority-Attribut)','(no loading or fetchpriority attribute)')));
      }else{
        fetchImg(imgs[0],400,tx('(priority: fetchpriority="high", loading="eager")','(priority: fetchpriority="high", loading="eager")'));
        io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const m=imgs.find(x=>`optimized-image-${x.id}`===e.target.id);fetchImg(m,500,tx('(loading="lazy" – jetzt in der Nähe des Viewports)','(loading="lazy" – now near the viewport)'))}),{root:page,rootMargin:'40px'});
        imgs.slice(1).forEach(m=>io.observe($(`#optimized-image-${m.id}`,root)));
      }
    }
    root.addEventListener('click',e=>{if(e.target.closest('#optimized-image-load'))start()});
    root.addEventListener('change',e=>{if(e.target.name==='optimized-image-mode'){mode=e.target.value;start()}});
    start();
    return ()=>{run++;timers.forEach(clearTimeout);io?.disconnect()};
  },
  css:`.optimized-image-code{margin:12px 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.optimized-image-page{height:260px;overflow:auto;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface-2);margin-bottom:10px}
.optimized-image-text{margin:0 0 12px}
.optimized-image-img{width:100%;margin:0 0 12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font:600 .75rem/1.2 var(--font-mono);color:var(--muted)}
.optimized-image-img span{padding:4px}
.optimized-image-img.optimized-image-loaded{background:linear-gradient(135deg,var(--hue),var(--surface));color:var(--ink)}
.optimized-image-log{max-height:150px}`,
  bad:{code:`<img src="/assets/hero.jpg" alt="Our new collection">

<img [src]="product.imageUrl" [alt]="product.name">`,
    note:tx('Ohne Maße ist das Bild beim Laden 0 px hoch – danach springt der Inhalt (Layout Shift). Alle Bilder laden sofort mit gleicher Priorität, auch die weit unten, und das Titelbild konkurriert mit ihnen um Bandbreite.','Without dimensions the image is 0 px high while loading – then the content jumps (layout shift). All images load immediately with the same priority, including those far down, and the hero competes with them for bandwidth.')},
  good:{code:`// imports: [NgOptimizedImage]

<\!-- above the fold, LCP candidate -->
<img ngSrc="/assets/hero.jpg" width="1200" height="600"
     priority alt="Our new collection">

<\!-- below the fold: lazy by default -->
<img [ngSrc]="product.imageUrl" width="400" height="400"
     [alt]="product.name">

<\!-- unknown size: fill a positioned parent -->
<div class="banner" style="position: relative; height: 240px">
  <img ngSrc="/assets/banner.jpg" fill alt="">
</div>`,
    note:tx('Die Maße sind die echten Pixelmaße des Bildes (bzw. die gewünschte Anzeigegröße bei fixen Bildern) – das CSS darf es trotzdem skalieren. Im Dev-Mode warnt Angular, wenn das LCP-Bild kein <code>priority</code> hat oder das Seitenverhältnis nicht stimmt.','The sizes are the image’s real pixel dimensions (or the desired rendered size for fixed images) – CSS may still scale it. In dev mode Angular warns when the LCP image has no <code>priority</code> or the aspect ratio doesn’t match.')},
  do:tx(['Genau das Bild mit <code>priority</code> markieren, das beim Laden oben sichtbar ist – meist eins, höchstens wenige.','<code>width</code> und <code>height</code> immer angeben, oder <code>fill</code> mit positioniertem Elternelement.','Bei Bildern vom CDN einen Loader konfigurieren (z. B. <code>provideImgixLoader()</code>), damit <code>srcset</code> und passende Größen entstehen.','Mit <code>sizes</code> arbeiten, wenn das Bild je nach Breite unterschiedlich groß angezeigt wird.'],
        ['Mark exactly the image with <code>priority</code> that is visible at the top on load – usually one, a few at most.','Always set <code>width</code> and <code>height</code>, or <code>fill</code> with a positioned parent.','Configure a loader for CDN images (e.g. <code>provideImgixLoader()</code>) so a <code>srcset</code> and matching sizes are generated.','Use <code>sizes</code> when the image is displayed at different sizes depending on the width.']),
  dont:tx(['Nicht jedes Bild als <code>priority</code> markieren – Angular warnt ab mehr als fünf Preloads.','Nicht <code>loading="eager"</code> statt <code>priority</code> setzen – dann fehlt die hohe Priorität.','Keine riesigen Data-URLs als <code>placeholder</code> ins Bundle packen.'],
        ['Don’t mark every image as <code>priority</code> – Angular warns above five preloads.','Don’t set <code>loading="eager"</code> instead of <code>priority</code> – the high priority is missing then.','Don’t put huge data URLs into the bundle as a <code>placeholder</code>.']),
  why:tx('<p>Zwei Kennzahlen der Core Web Vitals hängen stark an Bildern: <strong>LCP</strong> (wann das größte Element oben sichtbar ist – oft ein Titelbild) und <strong>CLS</strong> (wie sehr das Layout springt). <code>NgOptimizedImage</code> setzt dafür bewährte Attribute automatisch: <code>loading="lazy"</code> für alles ohne <code>priority</code>, <code>fetchpriority="high"</code> und einen Preload-Link für das LCP-Bild.</p><p>Die Pflichtmaße sind der wichtigste Teil: Aus <code>width</code> und <code>height</code> kennt der Browser das Seitenverhältnis, bevor ein einziges Byte des Bildes da ist, und reserviert den Platz. Nichts verschiebt sich, wenn das Bild ankommt.</p>',
           '<p>Two Core Web Vitals depend heavily on images: <strong>LCP</strong> (when the largest element at the top becomes visible – often a hero image) and <strong>CLS</strong> (how much the layout jumps). <code>NgOptimizedImage</code> sets proven attributes automatically: <code>loading="lazy"</code> for everything without <code>priority</code>, <code>fetchpriority="high"</code> and a preload link for the LCP image.</p><p>The required sizes are the most important part: from <code>width</code> and <code>height</code> the browser knows the aspect ratio before a single byte of the image has arrived, and reserves the space. Nothing shifts when the image arrives.</p>')
});

LESSONS.push({
  id:'onpush', cat:'perf', order:10,
  title:tx('OnPush: nur prüfen, was sich geändert haben kann','OnPush: only check what may have changed'),
  short:tx('Welche Komponenten Angular bei einem Durchlauf prüft – und was eine OnPush-Komponente „dirty“ macht.','Which components Angular checks in a pass – and what makes an OnPush component “dirty”.'),
  keys:'onpush eager default change detection changedetectionstrategy dirty markforcheck async input referenz reference performance',
  status:'stable',
  refs:[[tx('Angular-Doku: OnPush verwenden','Angular docs: Using OnPush'),'https://angular.dev/best-practices/skipping-subtrees#using-onpush'],
        [tx('Angular-Doku: Häufige Szenarien','Angular docs: Common change detection scenarios'),'https://angular.dev/best-practices/skipping-subtrees#common-change-detection-scenarios'],
        [tx('Angular-Doku: Signals in OnPush-Komponenten','Angular docs: Reading signals in OnPush components'),'https://angular.dev/guide/signals#reading-signals-in-onpush-components']],
  rule:tx('Eine OnPush-Komponente wird nur geprüft, wenn sie „dirty“ ist: ein Input bekommt eine <em>neue Referenz</em>, ein Event in ihrem Template (oder darunter) feuert, ein Signal aus ihrem Template ändert sich, oder <code>markForCheck()</code> wird aufgerufen – das tut z. B. die <code>async</code>-Pipe. Seit Angular 22 ist OnPush der Standard; die alte Strategie heißt jetzt <code>Eager</code>.','An OnPush component is only checked when it is “dirty”: an input gets a <em>new reference</em>, an event fires in its template (or below it), a signal from its template changes, or <code>markForCheck()</code> is called – the <code>async</code> pipe does that, for example. Since Angular 22 OnPush is the default; the old strategy is now called <code>Eager</code>.'),
  apis:[['OnPush','ChangeDetectionStrategy.OnPush',tx('Prüfen nur bei Bedarf. Standard seit v22 – die Angabe schadet nicht und macht die Absicht sichtbar.','Check only when needed. Default since v22 – stating it doesn’t hurt and makes the intent visible.')],
        ['Eager','ChangeDetectionStrategy.Eager',tx('Bei jedem Durchlauf prüfen, der die Komponente erreicht. <code>Default</code> ist der alte, <em>deprecated</em> Name dafür.','Check on every pass that reaches the component. <code>Default</code> is its old, <em>deprecated</em> name.')],
        ['markForCheck()','inject(ChangeDetectorRef).markForCheck()',tx('Markiert die Komponente und alle Vorfahren als dirty. Selten nötig, wenn du Signals nutzt.','Marks the component and all ancestors as dirty. Rarely needed when you use signals.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Auslöser','Triggers')}</h3>
    ${TPL.seg('onpush-strat',tx('Strategie aller Komponenten','Strategy of all components'),[['onpush','OnPush'],['eager','Eager']],'onpush')}
    <div class="onpush-btns">
      <button type="button" class="btn btn-secondary" data-op="row">${tx('(click) in Row','(click) in Row')}</button>
      <button type="button" class="btn btn-secondary" data-op="signal">${tx('Signal in Chart ändern','Change signal in Chart')}</button>
      <button type="button" class="btn btn-secondary" data-op="async">${tx('async-Pipe in Header bekommt Wert','async pipe in Header emits')}</button>
      <button type="button" class="btn btn-secondary" data-op="newarr">${tx('Dashboard: neues Array an List','Dashboard: new array to List')}</button>
      <button type="button" class="btn btn-secondary" data-op="push">${tx('Dashboard: Array per push() ändern','Dashboard: change array via push()')}</button>
    </div>
  </div>
  <div class="sim-card onpush-treecard"><h3>${tx('Komponentenbaum','Component tree')}</h3>
    <div id="onpush-tree"></div>
    <p class="hint onpush-legend"><span><span class="onpush-key onpush-checked"></span> ${tx('in diesem Durchlauf geprüft','checked in this pass')}</span><span><span class="onpush-key"></span> ${tx('übersprungen','skipped')}</span></p>
  </div>
</div>
<ul class="sim-log onpush-log" id="onpush-log" aria-label="${tx('Protokoll','Log')}"></ul>
<p class="demo-note">${tx('Probier: „Signal in Chart ändern“ – mit OnPush wird nur Chart geprüft, die Vorfahren werden bloß durchlaufen. „(click) in Row“ macht Row und alle Vorfahren dirty. „Array per push() ändern“: Die Referenz bleibt gleich, List wird nicht geprüft und zeigt eine veraltete Zahl. Schalte auf Eager und vergleich, wie viel mehr geprüft wird.','Try: “Change signal in Chart” – with OnPush only Chart is checked, the ancestors are merely traversed. “(click) in Row” makes Row and all its ancestors dirty. “Change array via push()”: the reference stays the same, List isn’t checked and shows a stale number. Switch to Eager and compare how much more gets checked.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const T=TPL,ul=$('#onpush-log',root),box=$('#onpush-tree',root);
    const tree=T.tree({name:'App',children:[{name:'Header'},{name:'Dashboard',children:[{name:'Chart'},{name:'List',children:[{name:'Row'}]}]}]});
    /* Zustand in den Klassen – und was zuletzt gerendert wurde */
    const s={notifs:0,chart:1,clicks:0,items:['a','b','c']};
    const listIn={value:s.items};
    const shown={};
    const views={
      App:()=>'',
      Header:()=>tx(`${s.notifs} neue Meldungen`,`${s.notifs} new notifications`),
      Dashboard:()=>'',
      Chart:()=>`chart() = ${s.chart}`,
      List:()=>tx(`${listIn.value.length} Einträge`,`${listIn.value.length} items`),
      Row:()=>tx(`${s.clicks} Klicks`,`${s.clicks} clicks`)
    };
    const truth={Header:()=>views.Header(),Chart:()=>views.Chart(),List:()=>tx(`${s.items.length} Einträge`,`${s.items.length} items`),Row:()=>views.Row()};
    function draw(n,depth=0){
      return `<li><div class="onpush-node" id="onpush-n-${n.name}"><b>${n.name}</b><span class="onpush-strat">${n.strategy==='eager'?'Eager':'OnPush'}</span><span class="onpush-view"></span><span class="onpush-count"></span></div>${n.children.length?`<ul>${n.children.map(c=>draw(c,depth+1)).join('')}</ul>`:''}</li>`;
    }
    function paint(checked){
      T.walk(tree,n=>{
        const el=$(`#onpush-n-${n.name}`,root);
        const v=$('.onpush-view',el);v.textContent=shown[n.name]||'';
        const stale=truth[n.name]&&truth[n.name]()!==shown[n.name];
        v.classList.toggle('onpush-stale',!!stale);v.dataset.stale=stale?tx('veraltet','stale'):'';
        $('.onpush-count',el).textContent=tx(`geprüft ${n.checks}×`,`checked ${n.checks}×`);
        const hit=checked&&checked.includes(n);
        el.classList.toggle('onpush-checked',!!hit);
        if(hit)flash(el);
      });
    }
    function build(){
      box.innerHTML=`<ul class="onpush-tree">${draw(tree)}</ul>`;
      T.walk(tree,n=>{n.checks=1;shown[n.name]=views[n.name]()});
      paint(null);
    }
    function tick(why){
      const {checked}=T.tick(tree,n=>{
        shown[n.name]=views[n.name]();
        /* Binding [items]="items" im Dashboard-Template: neue Referenz → List wird dirty */
        if(n.name==='Dashboard'){const list=T.find(tree,'List');if(listIn.value!==s.items){listIn.value=s.items;list.dirty=true;log(ul,`<span class="t">[items]</span> ${tx('neue Referenz → List dirty','new reference → List dirty')}`)}}
      });
      const names=checked.map(n=>n.name);
      const skipped=[];T.walk(tree,n=>{if(!names.includes(n.name))skipped.push(n.name)});
      log(ul,`<span class="hl">tick</span> ${tx('geprüft','checked')}: ${names.join(', ')||'–'}${skipped.length?` · <span class="t">${tx('übersprungen','skipped')}: ${skipped.join(', ')}</span>`:''}`);
      paint(checked);
    }
    const chain=n=>{const a=[];for(let x=n;x;x=x.parent)a.push(x.name);return a.join(' → ')};
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-op]')?.dataset.op;if(!k)return;
      if(k==='row'){s.clicks++;const n=T.find(tree,'Row');T.markViewDirty(n);log(ul,`(click) Row · markViewDirty: ${chain(n)}`)}
      if(k==='signal'){s.chart++;const n=T.find(tree,'Chart');T.markSignal(n);log(ul,`chart.set(${s.chart}) · ${tx('nur Chart zum Rendern markiert, Vorfahren nur zum Durchlaufen','only Chart marked for refresh, ancestors only for traversal')}`)}
      if(k==='async'){s.notifs++;const n=T.find(tree,'Header');T.markViewDirty(n);log(ul,`async → markForCheck(): ${chain(n)}`)}
      if(k==='newarr'){s.items=[...s.items,'x'];const n=T.find(tree,'Dashboard');T.markViewDirty(n);log(ul,`(click) Dashboard · items = [...items, x]`)}
      if(k==='push'){s.items.push('x');const n=T.find(tree,'Dashboard');T.markViewDirty(n);log(ul,`(click) Dashboard · items.push(x) – ${tx('gleiche Referenz','same reference')}`)}
      tick();
    });
    root.addEventListener('change',e=>{
      if(e.target.name!=='onpush-strat')return;
      T.walk(tree,n=>n.strategy=e.target.value);
      build();log(ul,`<span class="t">${tx('Strategie','strategy')}: ${e.target.value==='eager'?'Eager':'OnPush'}</span>`);
    });
    build();
    log(ul,`<span class="t">${tx('Erster Durchlauf: alle Komponenten einmal gerendert.','First pass: every component rendered once.')}</span>`);
  },
  css:`.onpush-btns{display:grid;gap:8px;margin-top:14px}.onpush-btns .btn{justify-content:flex-start;text-align:left}
.onpush-log{margin-top:16px}
.onpush-tree,.onpush-tree ul{list-style:none;margin:0;padding:0}
.onpush-tree ul{margin-left:14px;padding-left:12px;border-left:2px solid var(--line)}
.onpush-tree li{margin:6px 0}
.onpush-node{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);opacity:.75}
.onpush-node.onpush-checked{opacity:1;border-color:var(--brand);background:var(--brand-soft)}
.onpush-strat{font:700 .6875rem/1.2 var(--font-mono);padding:2px 6px;border-radius:4px;border:1px solid var(--line-strong);color:var(--muted)}
.onpush-view{font-size:.875rem}.onpush-view.onpush-stale{color:var(--danger);font-weight:700}.onpush-view.onpush-stale::after{content:" · " attr(data-stale)}
.onpush-count{margin-left:auto;font:600 .75rem/1.2 var(--font-mono);color:var(--muted)}
.onpush-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:10px}.onpush-legend>span{display:inline-flex;align-items:center;gap:6px}
.onpush-key{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);background:var(--surface)}.onpush-key.onpush-checked{border-color:var(--brand);background:var(--brand-soft)}
@media (prefers-reduced-motion:no-preference){.onpush-node{transition:background .3s,border-color .3s,opacity .3s}}`,
  bad:{code:`@Component({
  selector: 'app-list',
  changeDetection: ChangeDetectionStrategy.OnPush,
  template: \`{{ items.length }} items\`,
})
export class List {
  @Input() items: string[] = [];
}

// parent
addItem(item: string) {
  this.items.push(item);   // same array – List is not checked
}`,
    note:tx('Mit OnPush vergleicht Angular Inputs per <code>===</code>. Ein mutiertes Array ist „dasselbe“ – List bleibt stehen. Mit <code>Eager</code> wäre der Bug versteckt, dafür würde bei jedem Event der ganze Baum geprüft.','With OnPush Angular compares inputs with <code>===</code>. A mutated array is “the same” – List stays stale. With <code>Eager</code> the bug would be hidden, but the whole tree would be checked on every event.')},
  good:{code:`@Component({
  selector: 'app-list',
  changeDetection: ChangeDetectionStrategy.OnPush, // default since v22
  template: \`{{ items().length }} items\`,
})
export class List {
  readonly items = input.required<readonly string[]>();
}

// parent
readonly items = signal<readonly string[]>([]);
addItem(item: string) {
  this.items.update(list => [...list, item]);   // new array
}`,
    note:tx('Neue Referenzen, Signal-Inputs und Signals im Template – dann weiß Angular genau, welche Komponente es prüfen muss. <code>ng update</code> auf v22 setzt bei bestehenden Komponenten ohne Angabe automatisch <code>Eager</code>, damit sich ihr Verhalten nicht ändert.','New references, signal inputs and signals in the template – then Angular knows exactly which component to check. <code>ng update</code> to v22 automatically adds <code>Eager</code> to existing components without a strategy so their behaviour doesn’t change.')},
  do:tx(['Zustand als Signals halten und im Template lesen – dann markiert Angular gezielt die richtige Komponente.','Arrays und Objekte unveränderlich aktualisieren, damit Inputs eine neue Referenz bekommen.','Für Observables die <code>async</code>-Pipe oder <code>toSignal()</code> nutzen statt manuell zu abonnieren.','Nach dem Update auf v22 die per Migration gesetzten <code>Eager</code>-Angaben nach und nach entfernen.'],
        ['Keep state as signals and read them in the template – Angular then marks exactly the right component.','Update arrays and objects immutably so inputs get a new reference.','Use the <code>async</code> pipe or <code>toSignal()</code> for observables instead of subscribing manually.','After updating to v22, gradually remove the <code>Eager</code> settings added by the migration.']),
  dont:tx(['Inputs nicht mutieren und dann wundern, dass nichts passiert.','Nicht in <code>subscribe()</code> ein normales Feld setzen und <code>markForCheck()</code> vergessen – besser gleich ein Signal.','<code>ChangeDetectionStrategy.Default</code> nicht mehr schreiben – es ist deprecated; wenn nötig, <code>Eager</code>.','Nicht erwarten, dass eine Eager-Komponente unter einem nicht-dirty OnPush-Elternteil geprüft wird.'],
        ['Don’t mutate inputs and then wonder why nothing happens.','Don’t set a plain field in <code>subscribe()</code> and forget <code>markForCheck()</code> – better use a signal right away.','Don’t write <code>ChangeDetectionStrategy.Default</code> any more – it’s deprecated; if needed, <code>Eager</code>.','Don’t expect an Eager component under a non-dirty OnPush parent to be checked.']),
  why:tx('<p>Change Detection läuft von der Wurzel den Baum hinunter. Eine Eager-Komponente wird jedes Mal geprüft, wenn der Durchlauf sie erreicht; eine OnPush-Komponente nur mit Dirty-Flag. Events, <code>markForCheck()</code> und die <code>async</code>-Pipe setzen dieses Flag bei der Komponente <em>und allen Vorfahren</em> – sonst käme der Durchlauf gar nicht bis zu ihr. Ein neuer Input-Wert setzt es beim Kind, während der Elternteil gerendert wird.</p><p>Signals sind feiner: Ändert sich ein Signal, das ein Template liest, wird nur diese eine Komponente zum Rendern markiert. Die Vorfahren bekommen bloß einen Hinweis „hier unten gibt es etwas zu tun“ und werden durchlaufen, ohne selbst geprüft zu werden. So entsteht fast lokale Change Detection.</p>',
           '<p>Change detection runs from the root down the tree. An eager component is checked every time the pass reaches it; an OnPush component only with a dirty flag. Events, <code>markForCheck()</code> and the <code>async</code> pipe set this flag on the component <em>and all its ancestors</em> – otherwise the pass wouldn’t even reach it. A new input value sets it on the child while the parent is being rendered.</p><p>Signals are finer-grained: when a signal read by a template changes, only that one component is marked for refresh. The ancestors merely get a hint “there is something to do down here” and are traversed without being checked themselves. That gives almost local change detection.</p>'),
  test:{code:`it('updates when the parent passes a new array', async () => {
  const fixture = TestBed.createComponent(List);
  fixture.componentRef.setInput('items', ['a']);
  await fixture.whenStable();
  fixture.componentRef.setInput('items', ['a', 'b']);
  await fixture.whenStable();
  expect(fixture.nativeElement.textContent).toContain('2 items');
});`,note:tx('<code>setInput()</code> verhält sich wie ein Eltern-Template und markiert eine OnPush-Komponente korrekt. Ein direkt gesetztes Feld am <code>componentInstance</code> tut das nicht.','<code>setInput()</code> behaves like a parent template and marks an OnPush component correctly. Setting a field directly on <code>componentInstance</code> doesn’t.')}
});

LESSONS.push({
  id:'state-service', cat:'perf', order:40,
  title:tx('Zustand im Service mit Signals','State in a service with signals'),
  short:tx('Privates schreibbares Signal, öffentlich nur lesbar plus computed(), Änderungen nur über Methoden.','Private writable signal, publicly read-only plus computed(), changes only through methods.'),
  keys:'state store service signal asreadonly readonly zustand computed methoden methods kapselung encapsulation',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Schreibbare Signals schreibgeschützt machen','Angular docs: Converting writable signals to readonly'),'https://angular.dev/guide/signals#converting-writable-signals-to-readonly'],
        [tx('Styleguide: readonly verwenden','Style guide: Use readonly'),'https://angular.dev/style-guide#use-readonly-for-properties-that-shouldnt-change']],
  rule:tx('Gemeinsamen Zustand hält ein Service in einem <strong>privaten</strong> <code>signal()</code>. Nach außen gibt er nur <code>asReadonly()</code> und <code>computed()</code>-Werte frei, geändert wird ausschließlich über Methoden wie <code>add()</code> oder <code>clear()</code> – immer mit einem neuen Array oder Objekt.','A service keeps shared state in a <strong>private</strong> <code>signal()</code>. To the outside it only exposes <code>asReadonly()</code> and <code>computed()</code> values; changes happen only through methods like <code>add()</code> or <code>clear()</code> – always with a new array or object.'),
  apis:[['signal()','private readonly _items = signal<readonly T[]>([])',tx('Die einzige Quelle der Wahrheit, nur im Service schreibbar.','The single source of truth, writable only inside the service.')],
        ['asReadonly()','readonly items = this._items.asReadonly()',tx('Liefert ein <code>Signal&lt;T&gt;</code> ohne <code>set</code>/<code>update</code>.','Returns a <code>Signal&lt;T&gt;</code> without <code>set</code>/<code>update</code>.')],
        ['computed()','readonly count = computed(() => …)',tx('Abgeleitete Werte für alle Verbraucher, einmal berechnet.','Derived values for all consumers, calculated once.')],
        ['update()','this._items.update(list => [...list, x])',tx('Unveränderlich aktualisieren: neue Referenz, sonst merkt niemand etwas.','Update immutably: new reference, otherwise nobody notices.')]],
  demo:`<div class="sim-row state-service-top">
  ${TPL.seg('state-service-mode','CartStore',[['good',tx('privat + asReadonly()','private + asReadonly()')],['bad',tx('öffentliches WritableSignal','public WritableSignal')]],'good')}
</div>
<div class="sim-grid">
  <div class="sim-card"><h3>HeaderComponent</h3>
    <p class="state-service-badge" id="state-service-badge"></p>

    <div class="sim-row">

    <div class="state-service-btns">

      <button type="button" class="btn btn-secondary" data-ss="set"><code>store.items.set([])</code></button>

    <p class="hint state-service-real">${tx('Tatsächlich im Array','Actually in the array')}: <b id="state-service-real"></b></p>
