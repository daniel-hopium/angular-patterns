  product = httpResource<Product>(
    () => \`/api/products/\${this.id()}\`);
}

@if (product.isLoading()) {
  <app-skeleton />
} @else if (product.error()) {
  <p>Could not load the product.</p>
} @else if (product.hasValue()) {
  <h1>{{ product.value().name }}</h1>
}`,
    note:tx('Die Seite erscheint sofort, lädt selbst und zeigt Laden und Fehler genau dort, wo die Daten fehlen. Wechselt <code>id</code>, lädt <code>httpResource</code> automatisch neu und bricht die alte Anfrage ab.','The page appears right away, loads by itself and shows loading and errors exactly where the data is missing. When <code>id</code> changes, <code>httpResource</code> reloads automatically and cancels the old request.')},
  do:tx(['Standard: sofort navigieren und in der Komponente mit <code>httpResource()</code>/<code>resource()</code> laden – mit Skeleton und Fehlerzustand.','Resolver nur für schnelle Daten, ohne die die Seite keinen Sinn ergibt (z. B. Berechtigungsdaten aus einem Cache).','Wenn Resolver, dann Fehler abfangen: im Resolver per <code>RedirectCommand</code> oder zentral mit <code>withNavigationErrorHandler()</code>.','Während Resolver laufen, globales Feedback zeigen, z. B. über <code>router.currentNavigation()</code>.'],
        ['Default: navigate right away and load in the component with <code>httpResource()</code>/<code>resource()</code> – with a skeleton and an error state.','Resolvers only for fast data without which the page makes no sense (e.g. permission data from a cache).','If you use resolvers, catch errors: in the resolver via <code>RedirectCommand</code> or centrally with <code>withNavigationErrorHandler()</code>.','While resolvers run, show global feedback, e.g. via <code>router.currentNavigation()</code>.']),
  dont:tx(['Keine langsamen Listen oder großen Datenmengen per Resolver laden – der Klick fühlt sich kaputt an.','Nicht vergessen: Ohne Fehlerbehandlung endet ein werfender Resolver in einem <code>NavigationError</code>, und die Seite bleibt, wie sie war.','Keine Klassen mit <code>Resolve</code>-Interface mehr als Token – funktionale <code>ResolveFn</code> sind der aktuelle Weg.'],
        ['Don’t load slow lists or large data via resolvers – the click feels broken.','Don’t forget: without error handling a throwing resolver ends in a <code>NavigationError</code>, and the page stays as it was.','No more classes with the <code>Resolve</code> interface as tokens – functional <code>ResolveFn</code>s are the current way.']),
  why:tx('<p>Resolver sind ein Teil der Navigations-Pipeline: <code>ResolveStart</code> kommt nach den Guards, und erst nach <code>ResolveEnd</code> aktiviert der Router die neue Seite und ändert die Adresszeile. Die Angular-Doku warnt selbst davor, dass Nutzer dabei Verzögerungen zwischen Klick und neuer Seite erleben. Der Vorteil – die Komponente hat ihre Daten garantiert – wird mit einer „toten“ Wartezeit bezahlt.</p><p>Lädt die Komponente selbst, trennt sich beides: Die Navigation ist sofort fertig, Laden und Fehler werden Zustände der Seite, die du gestalten kannst. <code>httpResource()</code> (stabil seit Angular 22) verbindet das mit Signals: Hängt die URL an einem Input wie <code>id</code>, lädt sie bei jedem Parameterwechsel neu.</p>',
           '<p>Resolvers are part of the navigation pipeline: <code>ResolveStart</code> comes after the guards, and only after <code>ResolveEnd</code> does the router activate the new page and change the address bar. The Angular docs themselves warn that users may experience delays between the click and the new page. The advantage – the component is guaranteed to have its data – is paid for with a “dead” waiting time.</p><p>If the component loads by itself, the two are separated: navigation finishes right away, loading and errors become states of the page that you can design. <code>httpResource()</code> (stable since Angular 22) connects this with signals: if the URL depends on an input like <code>id</code>, it reloads on every parameter change.</p>'),
  test:{code:`const productResolver: ResolveFn<Product> = async route => {
  const router = inject(Router); // before the first await!
  try {
    return await inject(ProductApi).load(route.paramMap.get('id')!);
  } catch {
    return new RedirectCommand(router.parseUrl('/404'));
  }
};

it('redirects to /404 when the product is missing', async () => {
  TestBed.configureTestingModule({
    providers: [provideRouter([]),
      { provide: ProductApi, useValue: { load: () => Promise.reject() } }],
  });
  const route = { paramMap: convertToParamMap({ id: '1' }) } as ActivatedRouteSnapshot;
  const result = await TestBed.runInInjectionContext(
    () => productResolver(route, {} as RouterStateSnapshot));
  expect(result).toBeInstanceOf(RedirectCommand);
});`,note:tx('Ein Resolver, der Fehler selbst per <code>RedirectCommand</code> abfängt. Achte auf <code>inject(Router)</code> <em>vor</em> dem <code>await</code> – im <code>catch</code> wäre es zu spät (NG0203). Wie ein Guard ist er nur eine Funktion, <code>TestBed.runInInjectionContext()</code> reicht.','A resolver that catches errors itself with a <code>RedirectCommand</code>. Note <code>inject(Router)</code> <em>before</em> the <code>await</code> – inside <code>catch</code> it would be too late (NG0203). Like a guard it’s just a function, <code>TestBed.runInInjectionContext()</code> is enough.')}
});

LESSONS.push({
  id:'router-setup', cat:'router', order:10,
  title:tx('Routen und provideRouter()','Routes and provideRouter()'),
  short:tx('Der erste passende Pfad gewinnt – Reihenfolge, pathMatch und Features in provideRouter().','The first matching path wins – order, pathMatch and features in provideRouter().'),
  keys:'provideRouter routes route path redirectTo pathMatch full wildcard ** matching reihenfolge order withComponentInputBinding withInMemoryScrolling withViewTransitions withPreloading features RouterModule',
  since:'Angular 14.2', status:'stable',
  refs:[[tx('Angular-Doku: Wie Angular URLs abgleicht','Angular docs: How Angular matches URLs'),'https://angular.dev/guide/routing/define-routes#how-angular-matches-urls'],
        [tx('Angular-Doku: Redirects','Angular docs: Redirects'),'https://angular.dev/guide/routing/define-routes#redirects'],
        [tx('API: provideRouter','API: provideRouter'),'https://angular.dev/api/router/provideRouter']],
  rule:tx('Der Router prüft das <code>Routes</code>-Array <strong>von oben nach unten, der erste Treffer gewinnt</strong>. Darum: spezifische Pfade vor allgemeinen, <code>**</code> ans Ende, und ein Redirect vom leeren Pfad braucht <code>pathMatch: \'full\'</code>. Zusatzfunktionen schaltest du als <code>withX()</code>-Features in <code>provideRouter()</code> zu.',
          'The router checks the <code>Routes</code> array <strong>from top to bottom, the first match wins</strong>. So: specific paths before general ones, <code>**</code> at the end, and a redirect from the empty path needs <code>pathMatch: \'full\'</code>. You switch on extras as <code>withX()</code> features in <code>provideRouter()</code>.'),
  apis:[['provideRouter()','provideRouter(routes, ...features)',tx('Registriert den Router in <code>app.config.ts</code>; gibt <code>EnvironmentProviders</code> zurück.','Registers the router in <code>app.config.ts</code>; returns <code>EnvironmentProviders</code>.')],
        ['pathMatch','\'prefix\' | \'full\'',tx('Standard <code>\'prefix\'</code>: Der Pfad muss nur den Anfang abdecken. Ein leerer Pfad ist Präfix von <em>allem</em>.','Default <code>\'prefix\'</code>: the path only needs to cover the start. An empty path is a prefix of <em>everything</em>.')],
        ['withInMemoryScrolling()','withInMemoryScrolling({ scrollPositionRestoration, anchorScrolling })',tx('<code>\'enabled\'</code>: beim Zurück die alte Scrollposition, sonst nach oben bzw. zum Anker. Standard ist <code>\'disabled\'</code>.','<code>\'enabled\'</code>: restores the old scroll position on back, otherwise top or the anchor. Default is <code>\'disabled\'</code>.')],
        ['withViewTransitions()','withViewTransitions({ skipInitialTransition?, onViewTransitionCreated? })',tx('Developer Preview: Routenwechsel läuft in <code>document.startViewTransition()</code>; ohne Browser-Support einfach ohne Animation.','Developer preview: route changes run inside <code>document.startViewTransition()</code>; without browser support simply without animation.')],
        ['with…()','withComponentInputBinding(), withPreloading(…), withRouterConfig(…), withNavigationErrorHandler(…)',tx('Weitere Features – in den nächsten Lektionen.','More features – in the next lessons.')]],
  demo:`<div class="sim-grid router-setup-top">
  <div class="sim-card"><h3>app.routes.ts</h3>
    <label class="check-row"><input type="checkbox" id="router-setup-full" checked> <code>pathMatch: 'full'</code> ${tx('am Redirect','on the redirect')}</label>
    <label class="check-row"><input type="checkbox" id="router-setup-wild"> <code>**</code> ${tx('ganz nach oben','at the very top')}</label>
    <pre class="router-setup-code" id="router-setup-code"></pre>
  </div>
  <div class="sim-card"><h3>${tx('Browser','Browser')}</h3>
    ${NGRT.chrome('router-setup')}
    <p class="hint router-setup-try">${tx('Adresse eintippen:','Type an address:')}</p>
    <div class="sim-row" id="router-setup-quick">${['/','/products','/products/42','/about','/abc'].map(u=>`<button type="button" class="btn btn-ghost" data-url="${u}"><code>${u}</code></button>`).join('')}</div>
  </div>
</div>
<div class="sim-card router-setup-logcard"><h3>${tx('So prüft der Router','How the router checks')}</h3><ul class="sim-log router-setup-log" id="router-setup-log" aria-label="${tx('Protokoll','Log')}"></ul></div>
<p class="demo-note">${tx('Probier <code>/products/42</code>: <code>\'products\'</code> passt nur als Präfix, es bleibt ein Segment übrig – also weiter zur nächsten Route. Schieb <code>**</code> nach oben: Jetzt landet alles auf NotFound. Nimm <code>pathMatch: \'full\'</code> weg: Der leere Pfad passt auf jede URL, der Redirect ruft sich endlos selbst auf.','Try <code>/products/42</code>: <code>\'products\'</code> only matches as a prefix, one segment is left over – so on to the next route. Move <code>**</code> to the top: now everything lands on NotFound. Remove <code>pathMatch: \'full\'</code>: the empty path matches every URL, and the redirect keeps calling itself.')}</p>`,
  init(root){
    const {log}=NG,R=NGRT;
    const ul=$('#router-setup-log',root),view=$('#router-setup-view',root),url=$('#router-setup-url',root),tab=$('#router-setup-tab',root);
    let router;
    const build=()=>{
      const full=$('#router-setup-full',root).checked,wild=$('#router-setup-wild',root).checked;
      const redirect=full?{path:'',redirectTo:'/products',pathMatch:'full'}:{path:'',redirectTo:'/products'};
      const rest=[{path:'products',component:'ProductList'},{path:'products/:id',component:'ProductDetail'},{path:'about',component:'About'}];
      const nf={path:'**',component:'NotFound'};
      const routes=wild?[nf,redirect,...rest]:[redirect,...rest,nf];
      $('#router-setup-code',root).textContent=`export const routes: Routes = [\n${routes.map(r=>`  { path: '${r.path}',\n    ${r.redirectTo?`redirectTo: '${r.redirectTo}'${r.pathMatch?`,\n    pathMatch: 'full'`:''}`:`component: ${r.component}`} },`).join('\n')}\n];`;
      router=R.create({routes,on:ev=>{if(ev.type==='NavigationEnd'){const s=ev.state;url.value=s.url;tab.textContent=s.name;view.innerHTML=`<div class="ngrt-page"><h4>${s.name}</h4><p class="hint">${Object.keys(s.params).length?`params: ${esc(JSON.stringify(s.params))}`:tx('keine Parameter','no params')}</p></div>`}
        if(ev.type==='NavigationError'){tab.textContent=tx('Fehler','Error');view.innerHTML=`<p class="ngrt-bad router-setup-err">${esc(ev.error)}</p>`}
        log(ul,R.fmt(ev));}});
    };
    const go=u=>{log(ul,`<span class="t">——</span>`);router.navigate(u)};
    root.addEventListener('change',()=>{build();go(url.value||'/')});
    $('#router-setup-bar',root).addEventListener('submit',e=>{e.preventDefault();go(url.value)});
    root.addEventListener('click',e=>{const b=e.target.closest('[data-url]');if(b)go(b.dataset.url)});
    build();go('/');
    return ()=>router.cancelAll();
  },
  css:`.router-setup-top{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.router-setup-code{margin:12px 0 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.router-setup-try{margin:12px 0 4px}.router-setup-logcard{margin-top:16px}.router-setup-log{max-height:240px;white-space:pre-wrap}.router-setup-err{margin:0;overflow-wrap:anywhere}`,
  bad:{code:`@NgModule({
  imports: [RouterModule.forRoot([
    { path: '**', component: NotFound },
    { path: '', redirectTo: '/products' },
    { path: 'products',
      component: ProductList },
  ])],
})
export class AppRoutingModule {}`,
    note:tx('<code>**</code> steht oben und schluckt jede URL. Der Redirect ohne <code>pathMatch: \'full\'</code> passt auf alles und leitet sich endlos selbst um (NG04016). <code>RouterModule.forRoot()</code> funktioniert weiterhin, ist aber der NgModule-Weg.','<code>**</code> is at the top and swallows every URL. The redirect without <code>pathMatch: \'full\'</code> matches everything and redirects to itself forever (NG04016). <code>RouterModule.forRoot()</code> still works, but it’s the NgModule way.')},
  good:{code:`// app.routes.ts
export const routes: Routes = [
  { path: '', redirectTo: '/products',
    pathMatch: 'full' },
  { path: 'products',
    component: ProductList },
  { path: 'products/:id',
    component: ProductDetail },
  { path: '**', component: NotFound },
];

// app.config.ts
providers: [
  provideRouter(routes,
    withComponentInputBinding(),
    withInMemoryScrolling({
      scrollPositionRestoration:
        'enabled',
    }),
  ),
]`,
    note:tx('Leerer Pfad mit <code>pathMatch: \'full\'</code>, spezifische Pfade oben, <code>**</code> zuletzt. Features kommen als Argumente dazu, statt in einem großen Options-Objekt.','Empty path with <code>pathMatch: \'full\'</code>, specific paths on top, <code>**</code> last. Features are added as arguments instead of one big options object.')},
  do:tx(['Routen in einer eigenen Datei <code>app.routes.ts</code> als <code>Routes</code> exportieren und mit <code>provideRouter()</code> registrieren.','Spezifische Pfade vor allgemeine stellen und <code>**</code> als letzte Route.','Jeden Redirect vom leeren Pfad mit <code>pathMatch: \'full\'</code> schreiben.','<code>withInMemoryScrolling({ scrollPositionRestoration: \'enabled\' })</code> für ein Zurück wie auf normalen Websites.'],
        ['Export routes as <code>Routes</code> from their own file <code>app.routes.ts</code> and register them with <code>provideRouter()</code>.','Put specific paths before general ones and <code>**</code> as the last route.','Write every redirect from the empty path with <code>pathMatch: \'full\'</code>.','<code>withInMemoryScrolling({ scrollPositionRestoration: \'enabled\' })</code> for a back button like on normal websites.']),
  dont:tx(['<code>**</code> nicht vor andere Routen stellen – danach wird nichts mehr geprüft.','Nicht erwarten, dass <code>\'products\'</code> auch <code>/products/42</code> abdeckt – ohne <code>children</code> muss der Pfad die ganze URL verbrauchen.','<code>withViewTransitions()</code> nicht als stabil behandeln – es ist Developer Preview, und nicht jeder Browser kann View Transitions.'],
        ['Don’t put <code>**</code> before other routes – nothing is checked after it.','Don’t expect <code>\'products\'</code> to also cover <code>/products/42</code> – without <code>children</code> the path has to consume the whole URL.','Don’t treat <code>withViewTransitions()</code> as stable – it’s developer preview, and not every browser supports view transitions.']),
  why:tx('<p>Beim Abgleich zerlegt der Router die URL in Segmente und geht die Routen der Reihe nach durch. Eine Route „passt“, wenn ihr Pfad die ersten Segmente abdeckt (<code>prefix</code>) und der Rest von <code>children</code> verbraucht wird – bleibt etwas übrig, geht es mit der nächsten Route weiter. Sobald alles verbraucht ist, hört er auf: <strong>first match wins</strong>.</p><p>Der leere Pfad ist Präfix jeder URL. Ohne <code>pathMatch: \'full\'</code> greift ein Redirect von <code>\'\'</code> also immer – auch auf seinem eigenen Ziel. Angular bricht solche Schleifen im Dev-Modus mit NG04016 ab. <code>**</code> passt ebenfalls auf alles, darum gehört es ans Ende.</p>',
           '<p>When matching, the router splits the URL into segments and walks through the routes in order. A route “matches” if its path covers the first segments (<code>prefix</code>) and the rest is consumed by <code>children</code> – if something is left over, it continues with the next route. As soon as everything is consumed, it stops: <strong>first match wins</strong>.</p><p>The empty path is a prefix of every URL. Without <code>pathMatch: \'full\'</code>, a redirect from <code>\'\'</code> always applies – even to its own target. Angular stops such loops in dev mode with NG04016. <code>**</code> also matches everything, which is why it belongs at the end.</p>'),
  test:{code:`it('redirects / to /products', async () => {
  TestBed.configureTestingModule({ providers: [provideRouter(routes)] });
  const harness = await RouterTestingHarness.create();
  await harness.navigateByUrl('/');
  expect(TestBed.inject(Router).url).toBe('/products');
});`,note:tx('<code>RouterTestingHarness</code> aus <code>@angular/router/testing</code> navigiert echt und rendert die Zielkomponente – ohne eigene Test-Hostkomponente.','<code>RouterTestingHarness</code> from <code>@angular/router/testing</code> really navigates and renders the target component – without your own test host component.')}
});

LESSONS.push({
  id:'route-titles', cat:'router', order:70,
  title:tx('Seitentitel mit title und TitleStrategy','Page titles with title and TitleStrategy'),
  short:tx('Jede Route bekommt einen title – eine eigene TitleStrategy hängt den App-Namen an.','Every route gets a title – a custom TitleStrategy appends the app name.'),
  keys:'title titel document.title TitleStrategy DefaultTitleStrategy Title seitentitel page title ResolveFn buildTitle tab verlauf history a11y',
  since:'Angular 14', status:'stable',
  refs:[[tx('Angular-Doku: Seitentitel','Angular docs: Page titles'),'https://angular.dev/guide/routing/define-routes#page-titles'],
        [tx('Angular-Doku: TitleStrategy','Angular docs: Using TitleStrategy'),'https://angular.dev/guide/routing/define-routes#using-titlestrategy-for-page-titles'],
        [tx('API: TitleStrategy','API: TitleStrategy'),'https://angular.dev/api/router/TitleStrategy']],
  rule:tx('Gib jeder Route ein <code>title</code> – als Text oder als <code>ResolveFn&lt;string&gt;</code> für dynamische Titel. Der Router setzt nach jeder Navigation den Titel der <strong>tiefsten</strong> Route, die einen hat. Den App-Namen hängst du zentral mit einer eigenen <code>TitleStrategy</code> an.',
          'Give every route a <code>title</code> – as text or as a <code>ResolveFn&lt;string&gt;</code> for dynamic titles. After every navigation the router sets the title of the <strong>deepest</strong> route that has one. Append the app name centrally with a custom <code>TitleStrategy</code>.'),
  apis:[['title','title: string | ResolveFn<string>',tx('Titel der Route. Eine Funktion läuft wie ein Resolver – sie verzögert also die Navigation.','The route’s title. A function runs like a resolver – so it delays the navigation.')],
        ['TitleStrategy','abstract updateTitle(snapshot): void',tx('Eigene Klasse ableiten und als <code>{ provide: TitleStrategy, useClass: … }</code> bereitstellen.','Extend it with your own class and provide it as <code>{ provide: TitleStrategy, useClass: … }</code>.')],
        ['buildTitle()','buildTitle(snapshot): string | undefined',tx('Liefert den Titel der tiefsten Route mit <code>title</code> – oder <code>undefined</code>.','Returns the title of the deepest route with a <code>title</code> – or <code>undefined</code>.')],
        ['Title','inject(Title).setTitle(text)',tx('Service aus <code>@angular/platform-browser</code>, der <code>document.title</code> setzt.','Service from <code>@angular/platform-browser</code> that sets <code>document.title</code>.')]],
  demo:`<div class="sim-grid route-titles-top">
  <div class="sim-card"><h3>${tx('Konfiguration','Configuration')}</h3>
    <label class="check-row"><input type="checkbox" id="route-titles-strat" checked> ${tx('eigene <code>TitleStrategy</code> (<code>… · Shop</code>)','custom <code>TitleStrategy</code> (<code>… · Shop</code>)')}</label>
    <label class="check-row"><input type="checkbox" id="route-titles-about"> ${tx('<code>/about</code> hat ein <code>title</code>','<code>/about</code> has a <code>title</code>')}</label>
    <pre class="route-titles-code" id="route-titles-code"></pre>
  </div>
  <div class="sim-card"><h3>${tx('Browser','Browser')}</h3>
    ${NGRT.chrome('route-titles')}
    <div class="sim-row route-titles-links">${['/','/products','/products/42','/about'].map(u=>`<button type="button" class="btn btn-ghost" data-url="${u}"><code>${u}</code></button>`).join('')}</div>
    <h4 class="route-titles-h">${tx('Verlauf (so sieht ihn der Nutzer)','History (as the user sees it)')}</h4>
    <ol class="route-titles-hist" id="route-titles-hist" reversed></ol>
  </div>
</div>
<p class="demo-note">${tx('Probier: <code>/products</code> nimmt den Titel der Eltern-Route, <code>/products/42</code> den der tieferen Kind-Route – der kommt aus einem Resolver und erscheint erst nach dem Laden. Schalte die eigene Strategie aus und geh auf <code>/about</code> ohne eigenen Titel: Der Tab behält den alten Titel, und der Verlauf zeigt zwei Einträge mit demselben Namen. Mit Strategie greift wenigstens der Fallback „Shop“.','Try: <code>/products</code> takes the parent route’s title, <code>/products/42</code> the deeper child route’s – that one comes from a resolver and only appears after loading. Turn off the custom strategy and go to <code>/about</code> without its own title: the tab keeps the old title, and the history shows two entries with the same name. With the strategy, at least the “Shop” fallback applies.')}</p>`,
  init(root){
    const R=NGRT;
    const url=$('#route-titles-url',root),tab=$('#route-titles-tab',root),view=$('#route-titles-view',root),hist=$('#route-titles-hist',root);
    let alive=true,router,docTitle='Shop';const past=[];
    const productTitle=async c=>{await R.wait(400);return tx(`Wanderschuh ${c.params.id}`,`Hiking boot ${c.params.id}`)};productTitle.toString=()=>'productTitle';
    const build=()=>{
      const about=$('#route-titles-about',root).checked;
      const routes=[{path:'',pathMatch:'full',component:'Home',title:'Start'},
        {path:'products',title:tx('Produkte','Products'),children:[{path:'',component:'ProductList'},{path:':id',component:'ProductDetail',title:productTitle}]},
        {path:'about',component:'About',...(about?{title:tx('Über uns','About us')}:{})}];
      $('#route-titles-code',root).textContent=`{ path: '', component: Home,\n  title: 'Start' },\n{ path: 'products', title: '${tx('Produkte','Products')}',\n  children: [\n    { path: '', component: ProductList },\n    { path: ':id', component: ProductDetail,\n      title: productTitle },\n  ] },\n{ path: 'about', component: About${about?`,\n  title: '${tx('Über uns','About us')}'`:''} },`;
      router=R.create({routes,on:ev=>{
        if(!alive||ev.type!=='NavigationEnd')return;
        const s=ev.state,strat=$('#route-titles-strat',root).checked;
        /* DefaultTitleStrategy: nur setzen, wenn buildTitle() etwas liefert */
        if(strat)docTitle=s.title?`${s.title} · Shop`:'Shop';
        else if(s.title!==undefined)docTitle=s.title;
        url.value=s.url;tab.textContent=docTitle;
        view.innerHTML=`<div class="ngrt-page"><h4>${s.name}</h4><p class="hint">buildTitle() → ${s.title===undefined?'undefined':`'${esc(s.title)}'`}</p></div>`;
        past.unshift(docTitle);if(past.length>6)past.pop();
        hist.innerHTML=past.map(t=>`<li>${esc(t)}</li>`).join('');
      }});
    };
    const go=u=>router.navigate(u);
    root.addEventListener('change',e=>{if(e.target.id==='route-titles-about'){router.cancelAll();build()}go(url.value||'/')});
    $('#route-titles-bar',root).addEventListener('submit',e=>{e.preventDefault();go(url.value)});
    root.addEventListener('click',e=>{const b=e.target.closest('[data-url]');if(b)go(b.dataset.url)});
    build();go('/');
    return ()=>{alive=false;router.cancelAll()};
  },
  css:`.route-titles-top{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.route-titles-code{margin:12px 0 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.route-titles-links{margin-top:12px}.route-titles-h{margin:14px 0 6px;font-size:.9375rem}
.route-titles-hist{margin:0;padding-left:1.8em;display:grid;gap:3px;font-size:.875rem}.route-titles-hist li:first-child{font-weight:700}`,
  bad:{code:`export class ProductDetail
    implements OnInit {
  private title = inject(Title);
  ngOnInit() {
    this.title.setTitle('Product – Shop');
  }
}
// About sets nothing → the tab
// keeps the previous page's title`,
    note:tx('Jede Komponente kümmert sich selbst – und die, die es vergessen, erben still den alten Titel. Das Namensschema („… – Shop“) steht an zwanzig Stellen.','Every component takes care of it itself – and those that forget silently inherit the old title. The naming scheme (“… – Shop”) lives in twenty places.')},
  good:{code:`{ path: 'products', title: 'Products',
  children: [
    { path: '', component: ProductList },
    { path: ':id',
      component: ProductDetail,
      title: productTitle },
  ] }

export const productTitle:
  ResolveFn<string> = route =>
    inject(ProductApi).name(
      route.paramMap.get('id')!);

@Injectable({ providedIn: 'root' })
export class ShopTitleStrategy
    extends TitleStrategy {
  private title = inject(Title);
  override updateTitle(
      s: RouterStateSnapshot) {
    const page = this.buildTitle(s);
    this.title.setTitle(
      page ? \`\${page} · Shop\` : 'Shop');
  }
}
// { provide: TitleStrategy,
//   useClass: ShopTitleStrategy }`,
    note:tx('Titel stehen dort, wo die Seiten definiert sind; das Schema lebt an genau einer Stelle. Weil die Strategie auch ohne Routen-Titel etwas setzt, bleibt nie ein veralteter Titel stehen.','Titles live where the pages are defined; the scheme lives in exactly one place. Because the strategy also sets something without a route title, no stale title is ever left.')},
  do:tx(['Jeder Route, die eine Seite ist, ein <code>title</code> geben – er steht in Tab, Verlauf und Lesezeichen, und Screenreader-Nutzer orientieren sich daran.','Titel vom Spezifischen zum Allgemeinen: „Wanderschuh 42 · Shop“ statt „Shop – Wanderschuh 42“.','Dynamische Titel per <code>ResolveFn&lt;string&gt;</code> – aber schnell halten, denn sie verzögern die Navigation.','App-Namen und Fallback in einer eigenen <code>TitleStrategy</code> bündeln.'],
        ['Give every route that is a page a <code>title</code> – it shows up in tabs, history and bookmarks, and screen reader users orient themselves by it.','Titles from specific to general: “Hiking boot 42 · Shop” instead of “Shop – Hiking boot 42”.','Dynamic titles via <code>ResolveFn&lt;string&gt;</code> – but keep them fast, because they delay the navigation.','Bundle the app name and a fallback in a custom <code>TitleStrategy</code>.']),
  dont:tx(['<code>document.title</code> nicht in einzelnen Komponenten setzen.','Keine Seite ohne Titel lassen – die <code>DefaultTitleStrategy</code> ändert dann nichts, und der alte Titel bleibt stehen.','Nicht für jede Seite denselben Titel („Shop“) verwenden – Verlauf und Tabs werden unbrauchbar.'],
        ['Don’t set <code>document.title</code> in individual components.','Don’t leave a page without a title – the <code>DefaultTitleStrategy</code> then changes nothing, and the old title stays.','Don’t use the same title (“Shop”) for every page – history and tabs become useless.']),
  why:tx('<p>Nach jeder erfolgreichen Navigation ruft der Router <code>TitleStrategy.updateTitle()</code> auf. Die eingebaute <code>DefaultTitleStrategy</code> läuft den Routen-Baum hinunter, nimmt den Titel der tiefsten Route, die einen hat (<code>buildTitle()</code>), und setzt ihn mit dem <code>Title</code>-Service – liefert <code>buildTitle()</code> nichts, fasst sie <code>document.title</code> gar nicht an. Genau daher kommt der „geerbte“ Titel in der Simulation.</p><p>In einer Single-Page-App lädt der Browser nie eine neue Seite; der Titel ist deshalb eines der wenigen Signale, dass sich der Inhalt geändert hat – für Screenreader, für den Verlauf und für Nutzer mit vielen Tabs. Eine eigene Strategie ist der zentrale Ort für das Namensschema und einen Fallback.</p>',
           '<p>After every successful navigation the router calls <code>TitleStrategy.updateTitle()</code>. The built-in <code>DefaultTitleStrategy</code> walks down the route tree, takes the title of the deepest route that has one (<code>buildTitle()</code>) and sets it with the <code>Title</code> service – if <code>buildTitle()</code> returns nothing, it doesn’t touch <code>document.title</code> at all. That’s exactly where the “inherited” title in the simulation comes from.</p><p>In a single-page app the browser never loads a new page; the title is therefore one of the few signals that the content changed – for screen readers, for the history and for users with many tabs. A custom strategy is the central place for the naming scheme and a fallback.</p>'),
  test:{code:`it('sets the page title', async () => {
  TestBed.configureTestingModule({
    providers: [provideRouter(routes),
      { provide: TitleStrategy, useClass: ShopTitleStrategy }],
  });
  const harness = await RouterTestingHarness.create();
  await harness.navigateByUrl('/products');
  expect(TestBed.inject(Title).getTitle()).toBe('Products · Shop');
});`,note:tx('Der <code>Title</code>-Service liest <code>document.title</code> – nach der Navigation prüfst du einfach das Ergebnis.','The <code>Title</code> service reads <code>document.title</code> – after the navigation you simply check the result.')}
});

LESSONS.push({
  id:'catcherror', cat:'rxjs', order:50,
  title:tx('Fehler abfangen: catchError und retry','Handling errors: catchError and retry'),
  short:tx('Ein Fehler beendet einen Stream für immer – außer du fängst ihn im inneren Observable ab.','An error ends a stream forever – unless you catch it inside the inner observable.'),
  keys:'catchError retry fehler error handling stream stirbt dies inner observable fallback delay count retryWhen',
  status:'stable',
  refs:[[tx('API: catchError','API: catchError'),'https://rxjs.dev/api/operators/catchError'],
        [tx('API: retry','API: retry'),'https://rxjs.dev/api/operators/retry'],
        [tx('Angular-Doku: Fehler bei Requests','Angular docs: Handling request failure'),'https://angular.dev/guide/http/making-requests#handling-request-failure']],
  rule:tx('Nach einem <code>error</code> kommt in einem Stream nichts mehr. <code>catchError</code> ersetzt den kaputten Stream durch einen neuen – steht es am Ende der äußeren Kette, ist danach Schluss. Darum gehören <code>retry</code> und <code>catchError</code> <strong>in</strong> das innere Observable von <code>switchMap</code> &amp; Co.: Dann scheitert nur dieser eine Request, der äußere Stream lebt weiter.','After an <code>error</code> nothing else comes through a stream. <code>catchError</code> replaces the broken stream with a new one – placed at the end of the outer chain, that’s the end of it. That’s why <code>retry</code> and <code>catchError</code> belong <strong>inside</strong> the inner observable of <code>switchMap</code> &amp; co.: then only this one request fails and the outer stream lives on.'),
  apis:[['catchError(fn)','catchError((err, caught) => ObservableInput)',tx('Fängt den Fehler und macht mit dem zurückgegebenen Observable weiter (z. B. <code>of([])</code> oder <code>EMPTY</code>).','Catches the error and continues with the returned observable (e.g. <code>of([])</code> or <code>EMPTY</code>).')],
        ['retry(config)','retry({ count, delay, resetOnSuccess })',tx('Abonniert die Quelle nach einem Fehler neu – höchstens <code>count</code>-mal, optional mit Pause in ms oder einer Funktion.','Resubscribes to the source after an error – at most <code>count</code> times, optionally with a pause in ms or a function.')],
        ['delay (fn)','delay: (error, retryCount) => ObservableInput',tx('Eigene Wartelogik, z. B. exponentiell: <code>timer(2 ** retryCount * 100)</code>. Wirft das Notifier-Observable, gibt <code>retry</code> auf.','Custom wait logic, e.g. exponential: <code>timer(2 ** retryCount * 100)</code>. If the notifier errors, <code>retry</code> gives up.')],
        ['throwError(fn)','throwError(() => new Error())',tx('Observable, das sofort mit dem Fehler endet – zum Weiterreichen eines umgewandelten Fehlers.','Observable that ends immediately with the error – to pass on a mapped error.')]],
  demo:`<div class="sim-grid catcherror-opts">
  <fieldset class="seg"><legend>${tx('Wo sitzt catchError?','Where is catchError?')}</legend><div class="seg-opts">
    <label><input type="radio" name="catcherror-v" value="outer" checked> ${tx('außen','outer')}</label>
    <label><input type="radio" name="catcherror-v" value="inner"> ${tx('innen','inner')}</label>
    <label><input type="radio" name="catcherror-v" value="retry"> ${tx('innen + retry','inner + retry')}</label></div></fieldset>
  <fieldset class="seg"><legend>Server</legend><div class="seg-opts">
    <label><input type="radio" name="catcherror-s" value="flaky" checked> ${tx('wackelig','flaky')}</label>
    <label><input type="radio" name="catcherror-s" value="ok">${tx('gesund','healthy')}</label>
    <label><input type="radio" name="catcherror-s" value="down"> ${tx('kaputt','down')}</label></div></fieldset>
</div>
<pre class="rx-json catcherror-code" id="catcherror-code"></pre>
<div class="sim-row catcherror-ctrl"><button type="button" class="btn btn-primary" id="catcherror-load">${tx('Neu laden','Reload')}</button><button type="button" class="btn btn-ghost" id="catcherror-reset">${tx('Stream neu aufbauen','Rebuild stream')}</button></div>
<p class="catcherror-state" id="catcherror-state" aria-live="polite"></p>
<div id="catcherror-dia"></div>
${RX.legend(['in','run','done','error','out','complete'])}
<p class="demo-note">${tx('Probier: „außen“ + „wackelig“ – der erste Fehler liefert den Ersatzwert, dann ist der Stream beendet (|), weitere Klicks verpuffen. „innen“: jeder Klick funktioniert wieder. „innen + retry“: Der wackelige Server klappt beim dritten Versuch, der kaputte liefert nach zwei Wiederholungen den Ersatzwert.','Try: “outer” + “flaky” – the first error delivers the fallback, then the stream is finished (|), further clicks fizzle out. “inner”: every click works again. “inner + retry”: the flaky server succeeds on the third attempt, the broken one gives the fallback after two retries.')}</p>`,
  init(root){
    const val=n=>$(`input[name="${n}"]:checked`,root).value;
    const CODE={
      outer:`reload$.pipe(
  switchMap(() => this.http.get(url)),
  catchError(() => of(FALLBACK)),   // ${tx('beendet den Stream','ends the stream')}
)`,
      inner:`reload$.pipe(
  switchMap(() => this.http.get(url).pipe(
    catchError(() => of(FALLBACK)),  // ${tx('nur dieser Request','only this request')}
  )),
)`,
      retry:`reload$.pipe(
  switchMap(() => this.http.get(url).pipe(
    retry({ count: 2, delay: 300 }),
    catchError(() => of(FALLBACK)),
  )),
)`};
    let d,sub,click$,alive,n,attempt;
    const state=$('#catcherror-state',root);
    function build(){
      sub&&sub.unsubscribe();d&&d.destroy();
      d=RX.diagram($('#catcherror-dia',root),{lanes:[{id:'click',label:tx('Klicks','clicks')},{id:'req',label:tx('Versuche','attempts'),rows:2},{id:'out',label:tx('Ausgabe','output')}],span:6000});
      const v=val('catcherror-v');$('#catcherror-code',root).textContent=CODE[v];
      click$=new RX.Subject();alive=true;n=0;
      const load=k=>RX.defer(()=>{
        attempt++;
        const s=val('catcherror-s'),fail=s==='down'||(s==='flaky'&&attempt<3);let bar;
        return RX.request({ms:400,value:tx('Daten ','data ')+k,fail,error:new Error('500'),onStart:()=>{bar=d.bar('req',`#${k}.${attempt}`)},onEnd:st=>bar.end(st)});
      });
      const fb=()=>RX.of(tx('Ersatz','fallback'));
      const inner=k=>v==='outer'?load(k):v==='inner'?load(k).pipe(RX.catchError(fb)):load(k).pipe(RX.retry({count:2,delay:300}),RX.catchError(fb));
      let obs=click$.pipe(RX.switchMap(k=>{attempt=0;return inner(k)}));
      if(v==='outer')obs=obs.pipe(RX.catchError(fb));
      sub=obs.subscribe({
        next:x=>d.marble('out',x.split(' ').pop()===tx('Ersatz','fallback')?'!':x.split(' ').pop(),/Ersatz|fallback/.test(x)?'rx-err':'rx-out',x),
        complete:()=>{alive=false;d.mark('out','|','',tx('beendet','completed'));say()},
        error:()=>{alive=false;d.mark('out','✕','rx-err');say()}
      });
      say();
    }
    function say(){state.innerHTML=alive?`<span class="catcherror-ok">${tx('Stream lebt','Stream is alive')}</span> – ${tx('Klicks lösen Requests aus.','clicks trigger requests.')}`:`<span class="catcherror-dead">${tx('Stream beendet','Stream completed')}</span> – ${tx('neue Klicks bewirken nichts mehr.','new clicks do nothing anymore.')}`}
    root.addEventListener('click',e=>{
      if(e.target.closest('#catcherror-load')){n++;d.marble('click','#'+n,alive?'':'rx-ignored',alive?'':tx('niemand hört zu','nobody listening'));click$.next(n)}
      if(e.target.closest('#catcherror-reset'))build();
    });
    root.addEventListener('change',e=>{if(e.target.name==='catcherror-v')build()});
    build();
    return ()=>{sub.unsubscribe();d.destroy()};
  },
  css:`.catcherror-opts{margin-bottom:12px}.catcherror-code{margin-bottom:12px}.catcherror-ctrl{margin-bottom:8px}.catcherror-state{margin:0 0 12px;font-weight:700}.catcherror-ok{color:var(--success)}.catcherror-dead{color:var(--danger)}`,
  bad:{code:`readonly products = toSignal(
  this.reload$.pipe(
    switchMap(() => this.http.get<Product[]>('/api/products')),
    retry(3),                      // wiederholt – aber abonniert reload$ neu
    catchError(() => of([])),      // erster Fehler = Ende, „Neu laden“ ist tot
  ),
  { initialValue: [] },
);`.replace('wiederholt – aber abonniert reload$ neu',tx('wiederholt – aber abonniert reload$ neu','retries – but resubscribes to reload$')).replace('erster Fehler = Ende, „Neu laden“ ist tot',tx('erster Fehler = Ende, „Neu laden“ ist tot','first error = the end, “reload” is dead')),
    note:tx('Am Ende der äußeren Kette ersetzt <code>catchError</code> den ganzen Stream durch <code>of([])</code>, das sofort abschließt. Und <code>retry</code> außen abonniert nicht den Request neu, sondern <code>reload$</code> – bei einem <code>Subject</code> heißt das: warten auf den nächsten Klick.','At the end of the outer chain <code>catchError</code> replaces the whole stream with <code>of([])</code>, which completes immediately. And an outer <code>retry</code> doesn’t resubscribe to the request but to <code>reload$</code> – with a <code>Subject</code> that means: wait for the next click.')},
  good:{code:`readonly products = toSignal(
  this.reload$.pipe(
    switchMap(() =>
      this.http.get<Product[]>('/api/products').pipe(
        retry({ count: 2, delay: 500 }),
        catchError(err => {
          this.toast.error('Could not load products');
          return of([]);
        }),
      ),
    ),
  ),
  { initialValue: [] },
);`,
    note:tx('<code>retry</code> wiederholt genau den einen Request, <code>catchError</code> macht aus dem endgültigen Fehler einen Wert – und <code>reload$</code> hört weiter zu.','<code>retry</code> repeats exactly that one request, <code>catchError</code> turns the final error into a value – and <code>reload$</code> keeps listening.')},
  do:tx(['<code>retry</code> und <code>catchError</code> in die <code>pipe</code> des inneren Observables legen.','<code>retry</code> vor <code>catchError</code> – sonst gibt es keinen Fehler mehr zum Wiederholen.','<code>retry</code> immer mit <code>count</code> begrenzen und mit <code>delay</code> dem Server Luft lassen.','Nur wiederholen, was sich lohnt: 5xx und Netzwerkfehler ja, 4xx (Validierung, 404, 401) nein – dafür eine <code>delay</code>-Funktion, die bei 4xx <code>throwError</code> liefert.'],
        ['Put <code>retry</code> and <code>catchError</code> into the inner observable’s <code>pipe</code>.','<code>retry</code> before <code>catchError</code> – otherwise there’s no error left to retry.','Always limit <code>retry</code> with <code>count</code> and give the server room with <code>delay</code>.','Only retry what’s worth it: 5xx and network errors yes, 4xx (validation, 404, 401) no – use a <code>delay</code> function that returns <code>throwError</code> for 4xx.']),
  dont:tx(['Kein <code>catchError</code> am Ende eines langlebigen Streams, wenn er danach weiterleben soll.','Kein <code>retry()</code> ohne Limit – bei einem kaputten Server entsteht eine Endlosschleife.','Keine nicht-idempotenten POSTs blind wiederholen (doppelte Bestellung).'],
        ['No <code>catchError</code> at the end of a long-lived stream that should keep living.','No <code>retry()</code> without a limit – a broken server creates an endless loop.','Don’t blindly retry non-idempotent POSTs (duplicate orders).']),
  why:tx('<p>Das Observable-Protokoll kennt <code>next*</code>, dann höchstens ein <code>error</code> <em>oder</em> <code>complete</code>. Danach ist der Stream vorbei – für immer. <code>catchError</code> repariert nichts, es <em>ersetzt</em>: Ab dem Fehler kommt alles aus dem Observable, das du zurückgibst. Steht es außen, ersetzt es den Klick-Stream selbst.</p><p>Im inneren Observable ist das genau richtig: Der eine Request ist gescheitert, er wird durch einen Ersatzwert ersetzt, <code>switchMap</code> sieht ein ganz normales Ende und wartet auf den nächsten Klick. <code>retry</code> funktioniert, weil HTTP-Observables kalt sind: Jedes neue Abonnement schickt einen neuen Request.</p>',
           '<p>The observable protocol knows <code>next*</code>, then at most one <code>error</code> <em>or</em> <code>complete</code>. After that the stream is over – forever. <code>catchError</code> doesn’t repair anything, it <em>replaces</em>: from the error on, everything comes from the observable you return. Placed outside, it replaces the click stream itself.</p><p>Inside the inner observable that’s exactly right: the one request failed, it’s replaced by a fallback, <code>switchMap</code> sees a perfectly normal completion and waits for the next click. <code>retry</code> works because HTTP observables are cold: every new subscription sends a new request.</p>'),
  test:{code:`it('keeps the stream alive after an error', () => {
  const reload$ = new Subject<void>();
  let fail = true;
  const api = () => (fail ? throwError(() => new Error('500')) : of(['ok']));

  const values: string[][] = [];
  reload$.pipe(
    switchMap(() => api().pipe(catchError(() => of([])))),
  ).subscribe(v => values.push(v));

  reload$.next();          // error → fallback
  fail = false;
  reload$.next();          // still alive
  expect(values).toEqual([[], ['ok']]);
});`,note:tx('Synchrone Quellen wie <code>of</code> und <code>throwError</code> machen solche Tests ganz ohne Zeit möglich.','Synchronous sources like <code>of</code> and <code>throwError</code> make such tests possible without any timing.')}
});

LESSONS.push({
  id:'flattening', cat:'rxjs', order:10,
  title:tx('switchMap, mergeMap, concatMap, exhaustMap','switchMap, mergeMap, concatMap, exhaustMap'),
  short:tx('Vier Operatoren, die aus jedem Wert einen Request machen – und sich nur darin unterscheiden, was mit dem vorigen passiert.','Four operators that turn every value into a request – and only differ in what happens to the previous one.'),
  keys:'switchMap mergeMap concatMap exhaustMap flattening higher-order observable verschachtelt nested subscribe request abbrechen cancel race',
  status:'stable',
  refs:[[tx('RxJS-Doku: Higher-order Observables','RxJS docs: Higher-order observables'),'https://rxjs.dev/guide/operators#higher-order-observables'],
        [tx('API: switchMap','API: switchMap'),'https://rxjs.dev/api/operators/switchMap'],
        [tx('API: exhaustMap','API: exhaustMap'),'https://rxjs.dev/api/operators/exhaustMap']],
  rule:tx('Wird aus einem Wert ein neues Observable (meist ein HTTP-Request), nimm einen Flattening-Operator statt <code>subscribe()</code> im <code>subscribe()</code>. Die Wahl ist eine fachliche Entscheidung: <strong>switchMap</strong> = nur der neueste zählt, <strong>mergeMap</strong> = alle parallel, <strong>concatMap</strong> = der Reihe nach, <strong>exhaustMap</strong> = ignorieren, solange einer läuft.','When a value turns into a new observable (usually an HTTP request), use a flattening operator instead of <code>subscribe()</code> inside <code>subscribe()</code>. The choice is a product decision: <strong>switchMap</strong> = only the latest counts, <strong>mergeMap</strong> = all in parallel, <strong>concatMap</strong> = one after another, <strong>exhaustMap</strong> = ignore while one is running.'),
  apis:[['switchMap(fn)','(value, index) => ObservableInput<R>',tx('Kündigt das laufende innere Observable, sobald ein neuer Wert kommt. Für Suche, Filter, Routenparameter.','Unsubscribes the running inner observable as soon as a new value arrives. For search, filters, route params.')],
        ['mergeMap(fn, concurrent?)','(value, index) => ObservableInput<R>',tx('Alle inneren laufen parallel, Ergebnisse kommen in der Reihenfolge der Antworten. Optional mit Limit <code>concurrent</code>.','All inners run in parallel, results arrive in response order. Optional <code>concurrent</code> limit.')],
        ['concatMap(fn)','(value, index) => ObservableInput<R>',tx('Stellt neue Werte in eine Warteschlange und startet das nächste erst, wenn das vorige fertig ist. Reihenfolge bleibt erhalten.','Queues new values and only starts the next one when the previous one completed. Order is preserved.')],
        ['exhaustMap(fn)','(value, index) => ObservableInput<R>',tx('Ignoriert neue Werte, solange ein inneres läuft. Für „Speichern“- oder Login-Buttons gegen Doppelklicks.','Ignores new values while an inner is running. For “save” or login buttons against double clicks.')]],
  demo:`<div class="sim-row flattening-ctrl">
  <button type="button" class="btn btn-primary" id="flattening-one">${tx('Klick: Request starten','Click: start request')}</button>
  <button type="button" class="btn btn-secondary" id="flattening-burst">${tx('3 schnelle Klicks','3 quick clicks')}</button>
  <button type="button" class="btn btn-ghost" id="flattening-reset">${tx('Zurücksetzen','Reset')}</button>
</div>
<div id="flattening-dia" class="flattening-dia"></div>
${RX.legend(['in','run','done','cancelled','queued','ignored'])}
<div class="sim-grid flattening-cards" id="flattening-cards"></div>
<p class="demo-note">${tx('Probier: „3 schnelle Klicks“. Jeder Klick bekommt eine zufällige Antwortzeit – aber für alle vier Operatoren dieselbe. <code>switchMap</code> kündigt die alten Requests (rot gestrichelt), <code>mergeMap</code> liefert in der Reihenfolge der Antworten, <code>concatMap</code> wartet brav, <code>exhaustMap</code> ignoriert Klicks 2 und 3.','Try: “3 quick clicks”. Every click gets a random response time – but the same one for all four operators. <code>switchMap</code> cancels the old requests (red dashed), <code>mergeMap</code> delivers in response order, <code>concatMap</code> waits its turn, <code>exhaustMap</code> ignores clicks 2 and 3.')}</p>`,
  init(root){
    const OPS=[['switchMap',tx('Nur der neueste zählt.','Only the latest counts.')],['mergeMap',tx('Alle parallel.','All in parallel.')],['concatMap',tx('Der Reihe nach.','One after another.')],['exhaustMap',tx('Ignoriert, solange einer läuft.','Ignores while one runs.')]];
    const host=$('#flattening-dia',root),cards=$('#flattening-cards',root);
    let d,src,subs=[],n=0,stats,timers=[];
    const lat={},called={};
    function render(){
      cards.innerHTML=OPS.map(([op,desc])=>{const s=stats[op];return `<div class="sim-card"><h3><code>${op}</code></h3><p class="hint">${desc}</p>
      <p class="flattening-stat">${tx('gestartet','started')} <b>${s.started}</b> · ${tx('gekündigt','cancelled')} <b>${s.cancelled}</b>${op==='exhaustMap'?` · ${tx('ignoriert','ignored')} <b>${s.ignored}</b>`:''}${op==='concatMap'?` · ${tx('wartend','queued')} <b>${s.queued}</b>`:''}</p>
      <p class="flattening-out">${tx('Ausgabe','Output')}: <b>${s.out.length?s.out.join(' → '):'—'}</b></p></div>`}).join('');
    }
    function setup(){
      subs.forEach(s=>s.unsubscribe());timers.forEach(clearTimeout);timers=[];d&&d.destroy();
      d=RX.diagram(host,{lanes:[{id:'src',label:tx('Klicks','clicks')},...OPS.map(([op])=>({id:op,label:op,rows:op==='mergeMap'?3:1,marks:op==='concatMap'||op==='exhaustMap'}))],span:6500});
      src=new RX.Subject();n=0;stats={};
      subs=OPS.map(([op])=>{
        stats[op]={started:0,cancelled:0,ignored:0,queued:0,out:[]};
        return src.pipe(RX[op](v=>{
          called[op]=true;
          let bar;
          return RX.request({ms:lat[v],value:v,
            onStart:()=>{stats[op].started++;if(op==='concatMap'&&!called.now)stats[op].queued--;bar=d.bar(op,'#'+v);render()},
            onEnd:st=>{bar.end(st);if(st==='cancelled')stats[op].cancelled++;render()}});
        })).subscribe(v=>{stats[op].out.push('#'+v);render()});
      });
      render();
    }
    function click(){
      const v=++n;lat[v]=RX.rand(400,1400);
      d.marble('src','#'+v);
      OPS.forEach(([op])=>called[op]=false);
      called.now=true;src.next(v);called.now=false;
      if(!called.exhaustMap){stats.exhaustMap.ignored++;d.marble('exhaustMap','#'+v,'rx-ignored',tx('ignoriert','ignored'))}
      if(!called.concatMap){stats.concatMap.queued++;d.marble('concatMap','#'+v,'rx-queued',tx('wartet','queued'))}
      render();
    }
    setup();
    root.addEventListener('click',e=>{
      if(e.target.closest('#flattening-one'))click();
      if(e.target.closest('#flattening-burst')){click();timers.push(setTimeout(click,300),setTimeout(click,600))}
      if(e.target.closest('#flattening-reset'))setup();
    });
    return ()=>{subs.forEach(s=>s.unsubscribe());timers.forEach(clearTimeout);d.destroy()};
  },
  css:`.flattening-ctrl{margin-bottom:12px}.flattening-dia{margin-bottom:4px}.flattening-cards{margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}.flattening-cards h3{font-size:1rem}.flattening-stat,.flattening-out{margin:6px 0 0;font-size:.875rem}.flattening-out b{font-family:var(--font-mono)}`,
  bad:{code:`this.searchTerm.valueChanges.subscribe(term => {
  // subscribe im subscribe: nichts wird gekündigt,
  // langsame alte Antworten überschreiben neue
  this.http.get<Result[]>(\`/api/search?q=\${term}\`)
    .subscribe(results => this.results = results);
});`.replace('subscribe im subscribe: nichts wird gekündigt,',tx('subscribe im subscribe: nichts wird gekündigt,','subscribe inside subscribe: nothing is cancelled,')).replace('langsame alte Antworten überschreiben neue',tx('langsame alte Antworten überschreiben neue','slow old responses overwrite new ones')),
    note:tx('Verschachtelte Subscriptions verhalten sich wie <code>mergeMap</code> ohne Aufräumen: Jede Antwort gewinnt, die zuletzt ankommt – nicht die zur letzten Eingabe. Und die inneren Subscriptions hängen an keiner Lebensdauer.','Nested subscriptions behave like <code>mergeMap</code> without cleanup: whichever response arrives last wins – not the one for the last input. And the inner subscriptions aren’t tied to any lifetime.')},
  good:{code:`// Suche: nur die neueste Eingabe zählt
results = toSignal(
  this.searchTerm.valueChanges.pipe(
    switchMap(term => this.http.get<Result[]>('/api/search', { params: { q: term } })),
  ),
  { initialValue: [] },
);

// Speichern: Doppelklicks ignorieren
save$ = new Subject<void>();
constructor() {
  this.save$.pipe(
    exhaustMap(() => this.http.post('/api/order', this.order())),
    takeUntilDestroyed(),
  ).subscribe();
}`.replace('Suche: nur die neueste Eingabe zählt',tx('Suche: nur die neueste Eingabe zählt','Search: only the latest input counts')).replace('Speichern: Doppelklicks ignorieren',tx('Speichern: Doppelklicks ignorieren','Save: ignore double clicks')),
    note:tx('Ein Stream, ein Operator, eine bewusste Entscheidung. <code>switchMap</code> kündigt den alten HTTP-Request wirklich (der Browser bricht ihn ab), <code>exhaustMap</code> verhindert doppelte Bestellungen.','One stream, one operator, one deliberate decision. <code>switchMap</code> really cancels the old HTTP request (the browser aborts it), <code>exhaustMap</code> prevents duplicate orders.')},
  do:tx(['Lesen (Suche, Details zu einer ID, Routenparameter): <code>switchMap</code>.','Schreiben, das in Reihenfolge ankommen muss (Autosave, Warteschlange): <code>concatMap</code>.','Aktion, die nicht doppelt laufen darf (Absenden, Login): <code>exhaustMap</code>.','Unabhängige Aufgaben parallel (Uploads): <code>mergeMap</code>, bei Bedarf mit <code>concurrent</code>-Limit.'],
        ['Reading (search, details for an ID, route params): <code>switchMap</code>.','Writes that must arrive in order (autosave, a queue): <code>concatMap</code>.','Actions that must not run twice (submit, login): <code>exhaustMap</code>.','Independent tasks in parallel (uploads): <code>mergeMap</code>, with a <code>concurrent</code> limit if needed.']),
  dont:tx(['Kein <code>subscribe()</code> innerhalb von <code>subscribe()</code>.','Kein <code>switchMap</code> für Schreibzugriffe: Das Kündigen bricht nur die Antwort ab – der Server hat den POST womöglich schon verarbeitet.','Nicht <code>mergeMap</code> aus Gewohnheit: Bei Lesezugriffen gewinnt sonst die langsamste Antwort.'],
        ['No <code>subscribe()</code> inside <code>subscribe()</code>.','No <code>switchMap</code> for writes: cancelling only drops the response – the server may already have processed the POST.','Don’t use <code>mergeMap</code> out of habit: for reads, the slowest response would win.']),
  why:tx('<p>Ein <em>Higher-order Observable</em> ist ein Stream, dessen Werte selbst Streams sind – etwa „für jeden Klick ein Request“. Flattening-Operatoren abonnieren diese inneren Observables und reichen ihre Werte nach außen durch. Sie unterscheiden sich nur in einer Frage: Was passiert, wenn ein neuer Wert kommt, während ein inneres noch läuft? Kündigen, parallel starten, anstellen oder ignorieren.</p><p>Das ist keine Stilfrage, sondern Verhalten, das Nutzer merken: Bei <code>mergeMap</code> kann eine alte, langsame Suchantwort die neue überschreiben (Race Condition). Bei <code>switchMap</code> auf einem „Bestellen“-Button kann eine Bestellung ankommen, deren Antwort verworfen wurde. Weil alle vier Operatoren ihre inneren Subscriptions verwalten, werden sie beim Beenden des äußeren Streams auch mit aufgeräumt.</p>',
           '<p>A <em>higher-order observable</em> is a stream whose values are streams themselves – like “a request for every click”. Flattening operators subscribe to these inner observables and pass their values on. They only differ in one question: what happens when a new value arrives while an inner one is still running? Cancel, start in parallel, queue or ignore.</p><p>That’s not a matter of style but behaviour users notice: with <code>mergeMap</code> an old, slow search response can overwrite the new one (a race condition). With <code>switchMap</code> on an “order” button an order may reach the server whose response was thrown away. Because all four operators manage their inner subscriptions, they are also cleaned up when the outer stream ends.</p>'),
  test:{code:`import { TestScheduler } from 'rxjs/testing';
import { switchMap } from 'rxjs';

it('switchMap cancels the previous request', () => {
  const scheduler = new TestScheduler((actual, expected) =>
    expect(actual).toEqual(expected));

  scheduler.run(({ hot, cold, expectObservable, expectSubscriptions }) => {
    const clicks = hot('-a-b-----|');
    const request = cold('---r|');

    expectObservable(clicks.pipe(switchMap(() => request))).toBe('------r--|');
    // a: subscribed at 1, cancelled at 3 – b: runs to the end
    expectSubscriptions(request.subscriptions).toBe(['-^-!', '---^---!']);
  });
});`,note:tx('Marble-Tests mit dem <code>TestScheduler</code> aus <code>rxjs/testing</code> laufen in virtueller Zeit – ohne Warten, ohne <code>fakeAsync</code>, auch unter Vitest.','Marble tests with the <code>TestScheduler</code> from <code>rxjs/testing</code> run in virtual time – no waiting, no <code>fakeAsync</code>, also under Vitest.')}
});

LESSONS.push({
  id:'http-interceptors', cat:'rxjs', order:70,
  title:tx('HttpClient mit funktionalen Interceptors','HttpClient with functional interceptors'),
  short:tx('provideHttpClient(withInterceptors([…])): Auth-Header anhängen und Fehler an einer Stelle übersetzen.','provideHttpClient(withInterceptors([…])): attach the auth header and translate errors in one place.'),
  keys:'HttpClient provideHttpClient withInterceptors HttpInterceptorFn HttpHandlerFn interceptor auth token bearer authorization header fehler error 401 HttpErrorResponse withFetch withXhr',
  since:'Angular 15', status:'stable',
  refs:[[tx('Angular-Doku: Interceptor definieren','Angular docs: Defining an interceptor'),'https://angular.dev/guide/http/interceptors#defining-an-interceptor'],
        [tx('Angular-Doku: Interceptors konfigurieren','Angular docs: Configuring interceptors'),'https://angular.dev/guide/http/interceptors#configuring-interceptors'],
        [tx('Angular-Doku: HttpClient einrichten','Angular docs: Setting up HttpClient'),'https://angular.dev/guide/http/setup#withinterceptors']],
  rule:tx('Querschnittsaufgaben rund um HTTP – Token anhängen, Fehler übersetzen, Logging – gehören in <strong>funktionale Interceptors</strong> (<code>HttpInterceptorFn</code>), registriert mit <code>provideHttpClient(withInterceptors([…]))</code>. Die Reihenfolge im Array ist die Reihenfolge auf dem Hinweg; die Antwort läuft rückwärts durch.','Cross-cutting HTTP tasks – attaching tokens, translating errors, logging – belong in <strong>functional interceptors</strong> (<code>HttpInterceptorFn</code>), registered with <code>provideHttpClient(withInterceptors([…]))</code>. The order in the array is the order on the way out; the response travels back in reverse.'),
  apis:[['provideHttpClient()','provideHttpClient(...features)',tx('Konfiguriert <code>HttpClient</code> mit Features. In Angular 22 ist <code>HttpClient</code> auch ohne diesen Aufruf injizierbar und nutzt standardmäßig <code>fetch</code> (<code>withFetch()</code> ist deprecated, <code>withXhr()</code> schaltet zurück).','Configures <code>HttpClient</code> with features. In Angular 22 <code>HttpClient</code> is injectable even without this call and uses <code>fetch</code> by default (<code>withFetch()</code> is deprecated, <code>withXhr()</code> switches back).')],
        ['withInterceptors()','withInterceptors(fns: HttpInterceptorFn[])',tx('Registriert funktionale Interceptors – in genau dieser Reihenfolge.','Registers functional interceptors – in exactly this order.')],
        ['HttpInterceptorFn','(req, next: HttpHandlerFn) => Observable<HttpEvent<unknown>>',tx('Eine Funktion; läuft im Injection Context, darf also <code>inject()</code> nutzen.','A function; runs in an injection context, so it may use <code>inject()</code>.')],
        ['req.clone()','req.clone({ setHeaders: { … } })',tx('Requests sind unveränderlich – ändern heißt klonen.','Requests are immutable – changing means cloning.')],
        ['HttpErrorResponse','err.status, err.error',tx('Fehlerobjekt von <code>HttpClient</code>; <code>status</code> 0 heißt Netzwerk-/CORS-Fehler.','Error object from <code>HttpClient</code>; <code>status</code> 0 means a network/CORS error.')]],
  demo:`<div class="sim-grid http-interceptors-opts">
  <div><label class="check-row"><input type="checkbox" id="http-interceptors-token" checked> ${tx('Angemeldet (Token vorhanden)','Signed in (token present)')}</label></div>
  <fieldset class="seg"><legend>${tx('Server antwortet','Server responds')}</legend><div class="seg-opts">
    <label><input type="radio" name="http-interceptors-s" value="200" checked> 200</label>
    <label><input type="radio" name="http-interceptors-s" value="401"> 401</label>
    <label><input type="radio" name="http-interceptors-s" value="500"> 500</label>
    <label><input type="radio" name="http-interceptors-s" value="0"> ${tx('offline','offline')}</label></div></fieldset>
</div>
<p class="sim-row http-interceptors-chain" aria-hidden="true"><span class="sim-node" id="http-interceptors-n-c">${tx('Komponente','component')}</span>→<span class="sim-node" id="http-interceptors-n-a">authInterceptor</span>→<span class="sim-node" id="http-interceptors-n-e">errorInterceptor</span>→<span class="sim-node" id="http-interceptors-n-b">${tx('Backend (fetch)','backend (fetch)')}</span></p>
<div class="sim-row"><button type="button" class="btn btn-primary" id="http-interceptors-api">http.get('/api/orders')</button><button type="button" class="btn btn-secondary" id="http-interceptors-cdn">http.get('https://cdn.example.com/…')</button></div>
<p class="http-interceptors-result" id="http-interceptors-result" aria-live="polite"></p>
<ul class="sim-log http-interceptors-log" id="http-interceptors-log" aria-label="${tx('Weg des Requests','Path of the request')}"></ul>
<p class="demo-note">${tx('Probier: Schick einen Request an <code>/api</code> und einen ans CDN – das Token geht nur an die eigene API. Stell dann auf 401 oder 500: Der errorInterceptor übersetzt den <code>HttpErrorResponse</code> in eine verständliche Meldung, bei 401 leitet er zum Login.','Try: send one request to <code>/api</code> and one to the CDN – the token only goes to your own API. Then switch to 401 or 500: the errorInterceptor translates the <code>HttpErrorResponse</code> into a readable message, on 401 it redirects to login.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const ul=$('#http-interceptors-log',root),out=$('#http-interceptors-result',root);
    const node=k=>$('#http-interceptors-n-'+k,root);
    let sub=null;
    const hdrs=h=>Object.keys(h).length?Object.entries(h).map(([k,v])=>`${k}: ${v}`).join(', '):tx('keine Header','no headers');
    /* HttpRequest-Modell: unveränderlich, clone() liefert eine Kopie */
    const request=(url,headers={})=>Object.freeze({url,headers:Object.freeze({...headers}),clone:({setHeaders={}})=>request(url,{...headers,...setHeaders})});
    /* Die beiden Interceptors – derselbe Aufbau wie im echten Code unten */
    const authInterceptor=(req,next)=>{
      flash(node('a'));
      const token=$('#http-interceptors-token',root).checked?'eyJhbGciOi…':null;
      if(!token||!req.url.startsWith('/api/')){log(ul,`→ authInterceptor: ${!token?tx('kein Token','no token'):tx('fremder Host','foreign host')} – ${tx('unverändert weiter','passed on unchanged')}`);return next(req)}
      const authReq=req.clone({setHeaders:{Authorization:`Bearer ${token}`}});
      log(ul,`→ authInterceptor: clone() + <span class="hl">Authorization</span>`);
      return next(authReq);
    };
    const errorInterceptor=(req,next)=>{
      flash(node('e'));log(ul,`→ errorInterceptor: ${tx('reicht weiter, hört auf die Antwort','passes on, listens to the response')}`);
      return next(req).pipe(RX.catchError(err=>{
        flash(node('e'));
        const msg=err.status===0?tx('Keine Verbindung – bist du offline?','No connection – are you offline?'):err.status===401?tx('Sitzung abgelaufen – bitte neu anmelden.','Session expired – please sign in again.'):tx('Da ist etwas schiefgegangen. Bitte versuch es gleich noch einmal.','Something went wrong. Please try again in a moment.');
        log(ul,`← errorInterceptor: HttpErrorResponse ${err.status} → AppError`+(err.status===401?` · router.navigate(['/login'])`:''));
        return RX.throwError(()=>({appError:true,status:err.status,message:msg}));
      }));
    };
    const backend=req=>{
      const s=+$('input[name="http-interceptors-s"]:checked',root).value;
      return RX.defer(()=>{
        flash(node('b'));log(ul,`⇢ ${tx('Backend','backend')}: GET ${esc(req.url)} · <span class="t">${esc(hdrs(req.headers))}</span>`);
        const code=req.url.startsWith('/api/')&&!req.headers.Authorization?401:s;
        return RX.request({ms:500,value:{status:200,body:['#1041','#1042']},fail:code!==200,error:{name:'HttpErrorResponse',status:code}}).pipe(
          RX.tap({next:()=>log(ul,`← ${tx('Backend','backend')}: 200 OK`),error:e=>log(ul,`← ${tx('Backend','backend')}: ${e.status===0?tx('Netzwerkfehler (status 0)','network error (status 0)'):e.status}`)}));
      });
    };
    /* withInterceptors([authInterceptor, errorInterceptor]): das erste ist das äußerste */
    const chain=[authInterceptor,errorInterceptor].reduceRight((next,fn)=>req=>fn(req,next),backend);
    function send(url){
      sub&&sub.unsubscribe();ul.innerHTML='';out.textContent=tx('Lädt …','Loading …');
      flash(node('c'));log(ul,`${tx('Komponente','component')}: http.get('${esc(url)}')`);
      sub=chain(request(url)).subscribe({
        next:r=>{flash(node('c'));out.innerHTML=`<span class="http-interceptors-ok">${tx('Daten','Data')}: ${r.body.join(', ')}</span>`;log(ul,`${tx('Komponente','component')}: ${tx('Daten erhalten','data received')}`)},
        error:e=>{flash(node('c'));out.innerHTML=`<span class="http-interceptors-err">${esc(e.message)}</span>`;log(ul,`${tx('Komponente','component')}: ${tx('zeigt','shows')} ${tx('„','“')}${esc(e.message)}${tx('“','”')}`)}
      });
    }
    root.addEventListener('click',e=>{
      if(e.target.closest('#http-interceptors-api'))send('/api/orders');
      if(e.target.closest('#http-interceptors-cdn'))send('https://cdn.example.com/config.json');
    });
    return ()=>sub&&sub.unsubscribe();
  },
  css:`.http-interceptors-opts{margin-bottom:12px;align-items:end}.http-interceptors-chain{margin:0 0 12px;color:var(--muted)}.http-interceptors-result{margin:12px 0;font-weight:700;min-height:1.5em}.http-interceptors-ok{color:var(--success)}.http-interceptors-err{color:var(--danger)}.http-interceptors-log{max-height:240px}`,
  bad:{code:`// app.module.ts – alter Weg
@NgModule({
  imports: [HttpClientModule],                       // deprecated
  providers: [
    { provide: HTTP_INTERCEPTORS, useClass: AuthInterceptor, multi: true },
  ],
})
export class AppModule {}

@Injectable()
export class AuthInterceptor implements HttpInterceptor {
  intercept(req: HttpRequest<any>, next: HttpHandler) {
    req.headers.set('Authorization', 'Bearer ' + token); // ändert nichts!
    return next.handle(req);
  }
}`.replace('alter Weg',tx('alter Weg','old way')).replace('ändert nichts!',tx('ändert nichts!','changes nothing!')),
    note:tx('<code>HttpClientModule</code> ist deprecated. Klassen-Interceptors über <code>HTTP_INTERCEPTORS</code> funktionieren noch (mit <code>withInterceptorsFromDi()</code>), laut Doku kann ihre Unterstützung aber auslaufen. Und <code>headers.set()</code> liefert eine <em>neue</em> Instanz – ohne <code>clone()</code> geht der Header verloren.','<code>HttpClientModule</code> is deprecated. Class interceptors via <code>HTTP_INTERCEPTORS</code> still work (with <code>withInterceptorsFromDi()</code>), but the docs say support may be phased out. And <code>headers.set()</code> returns a <em>new</em> instance – without <code>clone()</code> the header is lost.')},
  good:{code:`export const authInterceptor: HttpInterceptorFn = (req, next) => {
  const token = inject(AuthService).token();
  if (!token || !req.url.startsWith('/api/')) return next(req);
  return next(req.clone({ setHeaders: { Authorization: \`Bearer \${token}\` } }));
};

export const errorInterceptor: HttpInterceptorFn = (req, next) => {
  const router = inject(Router);
  return next(req).pipe(
    catchError((err: unknown) => {
      if (err instanceof HttpErrorResponse && err.status === 401) {
        router.navigate(['/login']);
      }
      return throwError(() => toAppError(err));
    }),
  );
};

// app.config.ts
export const appConfig: ApplicationConfig = {
  providers: [provideHttpClient(withInterceptors([authInterceptor, errorInterceptor]))],
};`,
    note:tx('Zwei kleine Funktionen, jede mit einer Aufgabe. <code>inject()</code> ist erlaubt, weil Interceptors im Injection Context laufen. Das Token geht nur an die eigene API.','Two small functions, each with one job. <code>inject()</code> is allowed because interceptors run in an injection context. The token only goes to your own API.')},
  do:tx(['Pro Aufgabe ein Interceptor; die Reihenfolge im Array bewusst wählen.','Header nur für die eigene Origin/API setzen – nie Tokens an Drittanbieter schicken.','Im Error-Interceptor Fehler in ein eigenes, UI-taugliches Format übersetzen und mit <code>throwError</code> weiterreichen.','Pro Request Sonderfälle über <code>HttpContextToken</code> steuern (z. B. „diesen Request nicht wiederholen“).'],
        ['One interceptor per job; choose the order in the array deliberately.','Only set headers for your own origin/API – never send tokens to third parties.','In the error interceptor, translate errors into your own UI-friendly format and pass them on with <code>throwError</code>.','Control per-request special cases via <code>HttpContextToken</code> (e.g. “don’t retry this request”).']),
  dont:tx(['Nicht den Request mutieren – immer <code>req.clone()</code>.','Fehler im Interceptor nicht einfach schlucken (<code>EMPTY</code>) – die Komponente wartet dann ewig.','Kein neues <code>HttpClientModule</code> in Standalone-Apps.'],
        ['Don’t mutate the request – always <code>req.clone()</code>.','Don’t just swallow errors in the interceptor (<code>EMPTY</code>) – the component then waits forever.','No new <code>HttpClientModule</code> in standalone apps.']),
  why:tx('<p>Interceptors sind eine Kette aus Funktionen: Jede bekommt den Request und <code>next</code>, den Rest der Kette. Was sie <code>next(req)</code> übergibt, geht weiter; was sie aus dem zurückgegebenen Observable macht, betrifft die Antwort. Darum laufen Requests in Array-Reihenfolge hin und Antworten rückwärts zurück – wie Zwiebelschalen.</p><p>Funktionale Interceptors brauchen keine Klasse, kein <code>@Injectable</code> und keinen Multi-Provider; sie sind tree-shakeable und lassen sich direkt als Funktion testen. <code>HttpClient</code> selbst ist in Angular 22 ohnehin verfügbar – <code>provideHttpClient()</code> brauchst du, um Features wie Interceptors einzuschalten.</p>',
           '<p>Interceptors are a chain of functions: each receives the request and <code>next</code>, the rest of the chain. Whatever it passes to <code>next(req)</code> goes on; whatever it does with the returned observable affects the response. That’s why requests travel in array order and responses come back in reverse – like layers of an onion.</p><p>Functional interceptors need no class, no <code>@Injectable</code> and no multi-provider; they are tree-shakable and can be tested directly as a function. <code>HttpClient</code> itself is available in Angular 22 anyway – you need <code>provideHttpClient()</code> to switch on features like interceptors.</p>'),
  test:{code:`it('adds the bearer token to API requests', () => {
  TestBed.configureTestingModule({
    providers: [
      { provide: AuthService, useValue: { token: () => 'abc' } },
      provideHttpClient(withInterceptors([authInterceptor])),
      provideHttpClientTesting(),
    ],
  });
  const http = TestBed.inject(HttpClient);
  const ctrl = TestBed.inject(HttpTestingController);

  http.get('/api/orders').subscribe();
  const req = ctrl.expectOne('/api/orders');
  expect(req.request.headers.get('Authorization')).toBe('Bearer abc');
  req.flush([]);
});`,note:tx('<code>provideHttpClientTesting()</code> nach <code>provideHttpClient()</code> ersetzt nur das Backend – deine Interceptors laufen im Test mit.','<code>provideHttpClientTesting()</code> after <code>provideHttpClient()</code> only replaces the backend – your interceptors run in the test too.')}
});

LESSONS.push({
  id:'interop', cat:'rxjs', order:40,
  title:tx('toSignal() und toObservable() im Detail','toSignal() and toObservable() in depth'),
  short:tx('Die Brücke zwischen RxJS und Signals: Anfangswert, requireSync, Fehler und warum toObservable Werte zusammenfasst.','The bridge between RxJS and signals: initial value, requireSync, errors and why toObservable batches values.'),
  keys:'toSignal toObservable rxjs-interop initialValue requireSync NG0601 fehler error bridge brücke signal observable manualCleanup',
