</div>
<p class="demo-note">${tx('Probier: Stell auf „sofort“ – beide Fehler stehen da, bevor du etwas getan hast. „beim Tippen“: Schon beim ersten Buchstaben der E-Mail meckert das Formular. „touched oder submitted“: Fehler kommen nach dem Verlassen des Feldes – und „Absenden“ zeigt alle und springt ins erste fehlerhafte Feld. Achte im Kasten „Was der Screenreader bekommt“ auf <code>invalid</code> und die Beschreibung.','Try: switch to “immediately” – both errors are there before you did anything. “while typing”: the form complains at the first letter of the email. “touched or submitted”: errors appear after leaving the field – and “Submit” shows all of them and jumps into the first invalid field. Watch <code>invalid</code> and the description in the box “What the screen reader gets”.')}</p>`,
  init(root){
    const {FormControl,FormGroup,Validators:V,bind,flags}=RF;
    const form=new FormGroup({name:new FormControl('',{nonNullable:true,validators:V.required}),email:new FormControl('',{nonNullable:true,validators:[V.required,V.email]})});
    const F={name:{input:$('#form-errors-name',root),err:$('#form-errors-name-err',root),hint:null},email:{input:$('#form-errors-mail',root),err:$('#form-errors-mail-err',root),hint:'form-errors-mail-hint'}};
    const offs=Object.keys(F).map(k=>bind(F[k].input,form.get(k)));
    let submitted=false;
    const mode=()=>$('input[name="form-errors-m"]:checked',root).value;
    const show=c=>c.invalid&&(mode()==='now'||(mode()==='dirty'?c.dirty||submitted:c.touched||submitted));
    const msg=(k,c)=>c.hasError('required')?(k==='name'?tx('Gib deinen Namen ein.','Enter your name.'):tx('Gib deine E-Mail-Adresse ein.','Enter your email address.')):tx('Gib eine E-Mail-Adresse wie name@example.com ein.','Enter an email address like name@example.com.');
    function render(){
      Object.entries(F).forEach(([k,f])=>{
        const c=form.get(k),on=show(c);
        f.err.hidden=!on;f.err.textContent=on?msg(k,c):'';f.err.id=`form-errors-${k==='name'?'name':'mail'}-err`;
        f.input.setAttribute('aria-invalid',String(on));
        const ids=[f.hint,on?f.err.id:null].filter(Boolean).join(' ');
        if(ids)f.input.setAttribute('aria-describedby',ids);else f.input.removeAttribute('aria-describedby');
      });
      const c=form.get('email'),on=show(c);
      $('#form-errors-ax',root).innerHTML=`<dt>role</dt><dd>textbox</dd><dt>name</dt><dd>${tx('E-Mail','Email')}</dd><dt>invalid</dt><dd class="${on?'form-errors-bad':''}">${on}</dd><dt>description</dt><dd>${esc([tx('Nur für die Rückmeldung.','Only for our reply.'),on?msg('email',c):''].filter(Boolean).join(' '))}</dd>`;
      $('#form-errors-say',root).textContent=`${tx('E-Mail','Email')}, ${tx('Eingabefeld','edit text')}${on?tx(', ungültige Eingabe',', invalid entry'):''}, ${tx('Nur für die Rückmeldung.','Only for our reply.')}${on?' '+msg('email',c):''}`;
      $('#form-errors-flags',root).innerHTML=`email: ${flags(c)} <span class="rf-flags"><span class="${submitted?'on':''}">submitted: ${submitted}</span></span>`;
    }
    const off=form.watch(render);render();
    $('#form-errors-form',root).addEventListener('submit',e=>{
      e.preventDefault();submitted=true;
      const st=$('#form-errors-status',root);
      if(form.invalid){
        form.markAllAsTouched();render();
        const first=Object.keys(F).find(k=>form.get(k).invalid);
        const n=Object.keys(F).filter(k=>form.get(k).invalid).length;
        st.textContent=tx(n===1?'1 Feld braucht noch deine Aufmerksamkeit.':`${n} Felder brauchen noch deine Aufmerksamkeit.`,n===1?'1 field still needs your attention.':`${n} fields still need your attention.`);
        F[first].input.focus();
      }else st.textContent=tx('Gesendet – danke!','Sent – thank you!');
    });
    root.addEventListener('click',e=>{if(e.target.closest('#form-errors-reset')){submitted=false;form.reset();$('#form-errors-status',root).textContent='';render()}});
    root.addEventListener('change',e=>{if(e.target.name==='form-errors-m')render()});
    return ()=>{off();offs.forEach(f=>f())};
  },
  css:`.form-errors-seg{margin-bottom:14px}.form-errors-f{margin-bottom:12px}.form-errors-f .err{margin-top:2px}.form-errors-status{margin:12px 0 0;font-weight:700;min-height:1.5em}.form-errors-ax{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 10px;font:500 .8125rem/1.5 var(--font-mono)}.form-errors-ax dt{color:var(--muted)}.form-errors-ax dd{margin:0;overflow-wrap:anywhere}.form-errors-bad{color:var(--danger);font-weight:700}.form-errors-say q{font-style:italic}`,
  bad:{code:`<input formControlName="email" [class.error]="email.invalid" />
@if (email.invalid) {
  <span class="red">Invalid!</span>
}`,
    note:tx('Der Fehler steht schon beim Laden da, ist nur farblich markiert und mit dem Feld nicht verbunden – ein Screenreader hört „E-Mail, Eingabefeld“ und nichts von einem Problem. „Invalid!“ sagt außerdem nicht, was zu tun ist.','The error is there on load, only marked by colour and not connected to the field – a screen reader hears “Email, edit text” and nothing about a problem. “Invalid!” also doesn’t say what to do.')},
  good:{code:`<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label for="email">Email</label>
  <input id="email" type="email" formControlName="email" autocomplete="email"
         [attr.aria-invalid]="showError(email)"
         [attr.aria-describedby]="showError(email) ? 'email-hint email-error' : 'email-hint'" />
  <p id="email-hint">Only for our reply.</p>
  @if (showError(email)) {
    <p id="email-error" class="error">
      @if (email.hasError('required')) { Enter your email address. }
      @else { Enter an email address like name@example.com. }
    </p>
  }
  <button type="submit">Submit</button>
</form>

// Komponente
readonly submitted = signal(false);
showError(c: AbstractControl) {
  return c.invalid && (c.touched || this.submitted());
}
submit() {
  this.submitted.set(true);
  if (this.form.invalid) {
    this.form.markAllAsTouched();
    const first = Object.keys(this.form.controls).find(k => this.form.get(k)!.invalid);
    this.host.nativeElement.querySelector<HTMLElement>(\`[formControlName="\${first}"]\`)?.focus();
    return;
  }
  // …
}`.replace('// Komponente',tx('// Komponente','// component')),
    note:tx('Die Meldung sagt, was zu tun ist, erscheint zur richtigen Zeit und ist per <code>aria-describedby</code> am Feld. <code>novalidate</code> schaltet die Browser-Blasen ab, damit nur deine Meldungen erscheinen. (<code>host</code> ist <code>inject(ElementRef)</code>.)','The message says what to do, appears at the right time and is attached to the field via <code>aria-describedby</code>. <code>novalidate</code> turns off the browser bubbles so only your messages show. (<code>host</code> is <code>inject(ElementRef)</code>.)')},
  do:tx(['Fehler nach <code>touched</code> oder nach dem Absenden zeigen – nicht beim Laden, nicht beim ersten Tastendruck.','Meldungen formulieren, die sagen, was zu tun ist – mit Beispiel.','<code>aria-invalid</code> und <code>aria-describedby</code> nur setzen, wenn die Meldung sichtbar ist.','Beim Absenden <code>markAllAsTouched()</code> und Fokus aufs erste fehlerhafte Feld; bei langen Formularen zusätzlich eine Fehlerzusammenfassung.'],
        ['Show errors after <code>touched</code> or after submitting – not on load, not on the first keystroke.','Write messages that say what to do – with an example.','Only set <code>aria-invalid</code> and <code>aria-describedby</code> while the message is visible.','On submit, <code>markAllAsTouched()</code> and focus the first invalid field; for long forms add an error summary.']),
  dont:tx(['Nicht nur Farbe (rote Umrandung) als Fehlerhinweis.','Keinen deaktivierten Absenden-Button, solange das Formular ungültig ist – dann erfährt niemand, warum.','Keine <code>aria-live</code>-Region pro Feld – bei jedem Tastendruck würde vorgelesen.'],
        ['Not only colour (red border) as the error cue.','No disabled submit button while the form is invalid – then nobody learns why.','No <code>aria-live</code> region per field – it would announce on every keystroke.']),
  why:tx('<p>Eine Fehlermeldung, bevor der Nutzer überhaupt etwas eingeben konnte, ist Lärm; eine beim ersten Buchstaben einer E-Mail-Adresse ist falsch („a“ ist eben noch keine Adresse). <code>touched</code> heißt „fertig mit diesem Feld“ – der richtige Moment. Das Absenden ist der zweite: Wer absendet, will wissen, was fehlt.</p><p>Für Screenreader zählt die Verknüpfung: <code>aria-invalid</code> sagt „ungültig“, <code>aria-describedby</code> hängt Hinweis und Meldung an den Namen des Feldes. Der Fokus aufs erste fehlerhafte Feld sorgt dafür, dass genau das vorgelesen wird. Mehr dazu im ARIA-Kompass unter Formulare.</p>',
           '<p>An error message before the user could type anything is noise; one at the first letter of an email address is wrong (“a” just isn’t an address yet). <code>touched</code> means “done with this field” – the right moment. Submitting is the second: whoever submits wants to know what’s missing.</p><p>For screen readers, the connection matters: <code>aria-invalid</code> says “invalid”, <code>aria-describedby</code> attaches hint and message to the field’s name. Moving focus to the first invalid field makes sure exactly that is read out. More in the ARIA Compass under forms.</p>'),
  test:{code:`it('connects the error message after blur', async () => {
  const fixture = TestBed.createComponent(ContactForm);
  await fixture.whenStable();
  const input: HTMLInputElement = fixture.nativeElement.querySelector('#email');

  expect(input.getAttribute('aria-invalid')).toBe('false');

  input.dispatchEvent(new Event('blur'));
  await fixture.whenStable();

  expect(input.getAttribute('aria-invalid')).toBe('true');
  expect(input.getAttribute('aria-describedby')).toContain('email-error');
});`,note:tx('<code>blur</code> markiert das Control als touched. In zoneless Projekten (Standard für neue Projekte seit Angular 21) wartet <code>await fixture.whenStable()</code> auf das Rendern – ohne <code>fakeAsync</code>.','<code>blur</code> marks the control as touched. In zoneless projects (the default for new projects since Angular 21) <code>await fixture.whenStable()</code> waits for rendering – without <code>fakeAsync</code>.')}
});

LESSONS.push({
  id:'formarray', cat:'forms', order:30,
  title:tx('Dynamische Zeilen mit FormArray','Dynamic rows with FormArray'),
  short:tx('Positionen hinzufügen und entfernen: FormArray, formArrayName, @for mit track auf das Control.','Adding and removing rows: FormArray, formArrayName, @for with track on the control.'),
  keys:'FormArray formArrayName formGroupName push removeAt at dynamisch dynamic rows zeilen liste list track',
  status:'stable',
  refs:[[tx('Angular-Doku: Dynamische Formulare','Angular docs: Creating dynamic forms'),'https://angular.dev/guide/forms/reactive-forms#creating-dynamic-forms'],
        [tx('Angular-Doku: FormArray (typisiert)','Angular docs: FormArray (typed)'),'https://angular.dev/guide/forms/typed-forms#formarray-dynamic-homogenous-collections']],
  rule:tx('Eine Liste gleichartiger Einträge, deren Anzahl sich zur Laufzeit ändert, ist ein <code>FormArray</code>. Du änderst sie nur über seine Methoden (<code>push</code>, <code>insert</code>, <code>removeAt</code>), renderst mit <code>@for (item of items.controls; track item)</code> und bindest jede Zeile mit <code>[formGroupName]="i"</code>. Die Regel „mindestens eine Zeile“ gehört als Validator an das Array.','A list of similar entries whose number changes at runtime is a <code>FormArray</code>. You only change it through its methods (<code>push</code>, <code>insert</code>, <code>removeAt</code>), render with <code>@for (item of items.controls; track item)</code> and bind every row with <code>[formGroupName]="i"</code>. The rule “at least one row” goes on the array as a validator.'),
  apis:[['FormArray','fb.array([...], validators?)',tx('Typisiert: <code>FormArray&lt;FormGroup&lt;…&gt;&gt;</code>. <code>value</code> ist ein Array der aktivierten Einträge.','Typed: <code>FormArray&lt;FormGroup&lt;…&gt;&gt;</code>. <code>value</code> is an array of the enabled entries.')],
        ['push / insert / removeAt','items.push(ctrl) · items.removeAt(i)',tx('Ändern das Array und lösen Validierung und <code>valueChanges</code> aus.','Change the array and trigger validation and <code>valueChanges</code>.')],
        ['formArrayName','<div formArrayName="items">',tx('Verbindet einen Template-Bereich mit dem Array; darin <code>[formGroupName]="i"</code> je Zeile.','Connects a template area to the array; inside, <code>[formGroupName]="i"</code> per row.')],
        ['Validators.required','fb.array([], Validators.required)',tx('Auf einem Array: Fehler bei 0 Einträgen. <code>Validators.minLength(1)</code> greift bei leerem Array <em>nicht</em>.','On an array: error with 0 entries. <code>Validators.minLength(1)</code> does <em>not</em> fire on an empty array.')]],
  demo:`<div class="sim-grid formarray-grid">
  <div class="sim-card"><h3>${tx('Rechnungspositionen','Invoice items')}</h3>
    <div id="formarray-rows" class="formarray-rows"></div>
    <p class="err formarray-empty" id="formarray-empty" hidden>${tx('Mindestens eine Position anlegen.','Add at least one item.')}</p>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="formarray-add">+ ${tx('Position hinzufügen','Add item')}</button></div>
    <p class="formarray-total">${tx('Summe','Total')}: <b id="formarray-total"></b></p>
  </div>
  <div class="sim-card"><h3>${tx('Was Angular weiß','What Angular knows')}</h3>
    <p>items ${'<span id="formarray-st"></span>'} · length <b id="formarray-len"></b></p>
    <p class="hint">errors: <code id="formarray-err"></code></p>
    <pre class="rx-json" id="formarray-value"></pre>
    <ul class="sim-log formarray-log" id="formarray-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Füg zwei Positionen hinzu, tipp in die mittlere etwas und entferne dann die erste. Die mittlere Zeile behält ihren Inhalt und Fokus-Zustand, weil <code>track item</code> ihren DOM-Knoten wiederverwendet. Entfernst du alle, meldet das Array <code>required</code>.','Try: add two items, type into the middle one and then remove the first. The middle row keeps its content and state because <code>track item</code> reuses its DOM node. Remove all and the array reports <code>required</code>.')}</p>`,
  init(root){
    const {FormControl,FormGroup,FormArray,Validators:V,bind,statusHTML,json}=RF;
    const {log}=NG;
    const ul=$('#formarray-log',root),box=$('#formarray-rows',root);
    const fmt=v=>new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}).format(v);
    let uid=0;
    const newItem=(d='')=>new FormGroup({description:new FormControl(d,{nonNullable:true,validators:V.required}),qty:new FormControl(1,{nonNullable:true,validators:[V.required,V.min(1)]}),price:new FormControl(10,{nonNullable:true,validators:V.min(0)})});
    const items=new FormArray([newItem(tx('Beratung','Consulting'))],{validators:V.required});
    const rows=new Map(); // Control → DOM-Zeile, wie @for mit track item
    function rowEl(g){
      const id=++uid,el=document.createElement('fieldset');el.className='formarray-row';
      el.innerHTML=`<legend></legend>
        <div class="field"><label for="formarray-d${id}">${tx('Beschreibung','Description')}</label><input class="input" id="formarray-d${id}" autocomplete="off"></div>
        <div class="formarray-nums"><div class="field"><label for="formarray-q${id}">${tx('Menge','Qty')}</label><input class="input" type="number" id="formarray-q${id}" min="1"></div>
        <div class="field"><label for="formarray-p${id}">${tx('Preis','Price')}</label><input class="input" type="number" id="formarray-p${id}" min="0"></div></div>
        <button type="button" class="btn btn-ghost formarray-rm"></button>`;
      const offs=[bind($('#formarray-d'+id,el),g.get('description')),bind($('#formarray-q'+id,el),g.get('qty'),{number:true}),bind($('#formarray-p'+id,el),g.get('price'),{number:true})];
      el._off=()=>offs.forEach(f=>f());el._g=g;
      return el;
    }
    /* Beim Umhängen eines fokussierten Knotens feuert blur → touched → render: nicht verschachtelt rendern */
    let busy=false,again=false;
    function render(){if(busy){again=true;return}busy=true;try{draw()}finally{busy=false}if(again){again=false;render()}}
    function draw(){
      items.controls.forEach((g,i)=>{
        if(!rows.has(g))rows.set(g,rowEl(g));
        const el=rows.get(g);
        $('legend',el).textContent=tx(`Position ${i+1}`,`Item ${i+1}`);
        const rm=$('.formarray-rm',el);rm.textContent=tx(`Position ${i+1} entfernen`,`Remove item ${i+1}`);rm.dataset.i=i;
        $('input',el).setAttribute('aria-invalid',String(g.get('description').invalid&&g.get('description').touched));
        if(box.children[i]!==el)box.insertBefore(el,box.children[i]||null);
      });
      for(const [g,el] of rows)if(!items.controls.includes(g)){el._off();el.remove();rows.delete(g)}
      const raw=items.getRawValue();
      $('#formarray-total',root).textContent=fmt(raw.reduce((s,r)=>s+(r.qty||0)*(r.price||0),0));
      $('#formarray-st',root).innerHTML=statusHTML(items);$('#formarray-len',root).textContent=items.length;
      $('#formarray-err',root).textContent=items.errors?json(items.errors):'null';
      $('#formarray-value',root).textContent='items.value = '+JSON.stringify(items.value,null,1).replace(/\n\s*/g,' ');
      $('#formarray-empty',root).hidden=!items.hasError('required');
    }
    const off=items.watch(render);render();
    root.addEventListener('click',e=>{
      if(e.target.closest('#formarray-add')){items.push(newItem());log(ul,`items.push(newItem()) → length ${items.length}`);render();$('input',rows.get(items.at(items.length-1))).focus()}
      const rm=e.target.closest('.formarray-rm');
      if(rm){const i=+rm.dataset.i;items.removeAt(i);log(ul,`items.removeAt(${i}) → length ${items.length}`);render();
        const next=items.at(Math.min(i,items.length-1));(next?$('.formarray-rm',rows.get(next)):$('#formarray-add',root)).focus()}
    });
    return ()=>{off();rows.forEach(el=>el._off())};
  },
  css:`.formarray-rows{display:grid;gap:10px;margin-bottom:12px}.formarray-row{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px 10px;margin:0;display:grid;gap:8px;min-width:0}.formarray-row legend{font-weight:700;padding:0 4px}.formarray-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formarray-rm{justify-self:start;color:var(--danger)}.formarray-total{margin:12px 0 0;font-size:1.125rem}.formarray-empty{margin:0 0 10px}.formarray-log{margin-top:12px}`,
  bad:{code:`// Array von außen ersetzen, Zeilen per Index tracken
this.form.setControl('items', this.fb.array(
  [...this.items.controls].filter((_, j) => j !== i),
));

@for (item of items.controls; track $index) { … }

// "mindestens eine" mit minLength – schlägt bei 0 nicht an
items: this.fb.array([], Validators.minLength(1)),`.replace('Array von außen ersetzen, Zeilen per Index tracken',tx('Array von außen ersetzen, Zeilen per Index tracken','replace the array from outside, track rows by index')).replace('"mindestens eine" mit minLength – schlägt bei 0 nicht an',tx('"mindestens eine" mit minLength – schlägt bei 0 nicht an','"at least one" with minLength – doesn’t fire at 0')),
    note:tx('Das neue Array verliert Subscriptions auf <code>items.valueChanges</code>. <code>track $index</code> verschiebt beim Entfernen die DOM-Knoten: Fokus und Eingabezustand landen in der falschen Zeile. Und <code>minLength</code> lässt leere Werte durch – auch ein leeres Array.','The new array loses subscriptions to <code>items.valueChanges</code>. <code>track $index</code> shifts DOM nodes on removal: focus and input state end up in the wrong row. And <code>minLength</code> lets empty values pass – including an empty array.')},
  good:{code:`@Component({
  selector: 'app-invoice-form',
  imports: [ReactiveFormsModule],
  template: \`
    <form [formGroup]="form">
      <div formArrayName="items">
        @for (item of items.controls; track item; let i = $index) {
          <fieldset [formGroupName]="i">
            <legend>Item {{ i + 1 }}</legend>
            <label>Description <input formControlName="description" /></label>
            <label>Qty <input type="number" formControlName="qty" /></label>
            <button type="button" (click)="remove(i)">Remove item {{ i + 1 }}</button>
          </fieldset>
        }
      </div>
      <button type="button" (click)="add()">Add item</button>
    </form>
  \`,
})
export class InvoiceForm {
  private readonly fb = inject(NonNullableFormBuilder);
  readonly form = this.fb.group({
    items: this.fb.array([this.newItem()], Validators.required),
  });
  readonly items = this.form.controls.items;

  newItem() {
    return this.fb.group({
      description: ['', Validators.required],
      qty: [1, [Validators.required, Validators.min(1)]],
    });
  }
  add() { this.items.push(this.newItem()); }
  remove(i: number) { this.items.removeAt(i); }
}`,
    note:tx('Ein Array, das nur über seine Methoden geändert wird; eine Fabrikfunktion für neue Zeilen; Buttons mit eindeutigem Namen („Remove item 2“) statt fünfmal „Entfernen“.','One array, changed only through its methods; a factory function for new rows; buttons with a unique name (“Remove item 2”) instead of five times “Remove”.')},
  do:tx(['Eine Fabrikmethode (<code>newItem()</code>) für neue Zeilen – gleiche Validatoren überall.','<code>track item</code> (das Control-Objekt) statt <code>track $index</code>.','Jede Zeile als <code>fieldset</code> mit <code>legend</code>, Entfernen-Buttons mit Zeilennummer im Namen.','Nach dem Hinzufügen den Fokus ins neue Feld setzen, nach dem Entfernen auf die nächste Zeile oder den Hinzufügen-Button.'],
        ['A factory method (<code>newItem()</code>) for new rows – same validators everywhere.','<code>track item</code> (the control object) instead of <code>track $index</code>.','Every row as a <code>fieldset</code> with a <code>legend</code>, remove buttons with the row number in their name.','After adding, move focus into the new field; after removing, to the next row or the add button.']),
  dont:tx(['Nicht <code>items.value</code> direkt verändern (<code>value.push(…)</code>) – das ist eine Kopie ohne Controls.','Kein <code>setControl()</code> für jede Änderung, wenn <code>push</code>/<code>removeAt</code> reichen.','Kein <code>Validators.minLength(1)</code> für „mindestens eine Zeile“.'],
        ['Don’t change <code>items.value</code> directly (<code>value.push(…)</code>) – it’s a copy without controls.','No <code>setControl()</code> for every change when <code>push</code>/<code>removeAt</code> will do.','No <code>Validators.minLength(1)</code> for “at least one row”.']),
  why:tx('<p><code>FormArray</code> ist ein Container wie <code>FormGroup</code>, nur mit Indizes statt Namen. Status und Wert werden aus den Kindern berechnet, jede Änderung über <code>push</code> oder <code>removeAt</code> validiert neu und meldet sich über <code>valueChanges</code>. Das Template spiegelt die Controls; die Direktiven (<code>formArrayName</code>, <code>formGroupName</code>) finden ihr Control über den Pfad.</p><p><code>track item</code> sagt Angular, welcher DOM-Knoten zu welchem Control gehört. Entfernst du Zeile 1, bleiben die DOM-Knoten der anderen Zeilen erhalten – mit Fokus, Cursorposition und Screenreader-Kontext. Mit <code>track $index</code> würde Angular die Knoten umnummerieren und neu befüllen.</p>',
           '<p><code>FormArray</code> is a container like <code>FormGroup</code>, just with indices instead of names. Status and value are computed from the children; every change through <code>push</code> or <code>removeAt</code> revalidates and reports via <code>valueChanges</code>. The template mirrors the controls; the directives (<code>formArrayName</code>, <code>formGroupName</code>) find their control via the path.</p><p><code>track item</code> tells Angular which DOM node belongs to which control. Remove row 1 and the DOM nodes of the other rows are kept – with focus, cursor position and screen reader context. With <code>track $index</code> Angular would renumber and refill the nodes.</p>'),
  test:{code:`it('requires at least one item', () => {
  const fb = TestBed.inject(NonNullableFormBuilder);

LESSONS.push({
  id:'signal-forms', cat:'forms', order:70,
  title:tx('Signal Forms: form(), Schema und [formField]','Signal forms: form(), schema and [formField]'),
  short:tx('Dein signal() ist das Modell, ein Schema beschreibt die Regeln, jedes Feld hat seinen Zustand als Signals.','Your signal() is the model, a schema describes the rules, every field has its state as signals.'),
  keys:'signal forms form() FormField formField schema required email minLength validate valueOf submit FormRoot formRoot FieldTree FieldState @angular/forms/signals',
  status:'stable',
  refs:[[tx('Angular-Doku: Signal Forms','Angular docs: Signal forms'),'https://angular.dev/guide/forms/signals/overview#setup'],
        [tx('Angular-Doku: Feldübergreifende Validierung','Angular docs: Cross-field validation'),'https://angular.dev/guide/forms/signals/validation#cross-field-validation'],
        [tx('Angular-Doku: Feldzustand','Angular docs: Field state'),'https://angular.dev/guide/forms/signals/field-state-management#field-state-signals']],
  rule:tx('Mit Signal Forms (<code>@angular/forms/signals</code>) legst du das Modell als <code>signal()</code> an und machst daraus mit <code>form(model, schema)</code> einen Baum aus Feldern. Regeln wie <code>required()</code> oder <code>validate()</code> stehen im Schema, <code>[formField]</code> verbindet ein Feld mit dem Input, und jeder Zustand (<code>value</code>, <code>valid</code>, <code>touched</code>, <code>errors</code>) ist ein Signal. Laut <code>@publicApi 22.0</code> ist die API in Angular 22 stabil (in Angular 21 war sie experimentell).','With signal forms (<code>@angular/forms/signals</code>) you create the model as a <code>signal()</code> and turn it into a tree of fields with <code>form(model, schema)</code>. Rules like <code>required()</code> or <code>validate()</code> live in the schema, <code>[formField]</code> connects a field to the input, and every piece of state (<code>value</code>, <code>valid</code>, <code>touched</code>, <code>errors</code>) is a signal. According to <code>@publicApi 22.0</code> the API is stable in Angular 22 (it was experimental in Angular 21).'),
  apis:[['form()','form(model: WritableSignal<T>, schema?, options?): FieldTree<T>',tx('Erzeugt den Feldbaum über deinem Signal. Kein eigener Zustand: Feld ändern heißt Modell ändern.','Creates the field tree over your signal. No own state: changing a field means changing the model.')],
        ['FormField','[formField]="myForm.email"',tx('Direktive: bindet ein Feld an <code>&lt;input&gt;</code>, eigene <code>FormValueControl</code>-Komponenten oder (zur Kompatibilität) Controls mit <code>ControlValueAccessor</code>.','Directive: binds a field to <code>&lt;input&gt;</code>, custom <code>FormValueControl</code> components or (for compatibility) controls with <code>ControlValueAccessor</code>.')],
        ['required / email / minLength …','required(p.name, { message })',tx('Eingebaute Regeln im Schema; Fehler haben <code>kind</code> und optional <code>message</code>.','Built-in rules in the schema; errors have a <code>kind</code> and an optional <code>message</code>.')],
        ['validate()','validate(p.confirm, ({ value, valueOf }) => …)',tx('Eigene Regel; <code>valueOf(p.password)</code> liest ein anderes Feld – reaktiv.','Custom rule; <code>valueOf(p.password)</code> reads another field – reactively.')],
        ['FormRoot / submit()','<form [formRoot]="f"> · submit(f, action)',tx('Absenden: markiert alles als touched, führt die Aktion nur bei gültigem Formular aus.','Submitting: marks everything as touched, only runs the action if the form is valid.')]],
  demo:`<div class="sim-grid">
  <form class="sim-card" id="signal-forms-form" novalidate><h3>${tx('Registrierung','Sign-up')}</h3>
    ${[['name','Name','text'],['email',tx('E-Mail','Email'),'email'],['password',tx('Passwort','Password'),'text'],['confirm',tx('Passwort wiederholen','Repeat password'),'text']].map(([k,l,t])=>`<div class="field signal-forms-f"><label for="signal-forms-${k}">${l}</label><input class="input" id="signal-forms-${k}" type="${t}" autocomplete="off"><div id="signal-forms-${k}-err"></div></div>`).join('')}
    <div class="sim-row"><button type="submit" class="btn btn-primary" id="signal-forms-submit">${tx('Registrieren','Sign up')}</button><button type="button" class="btn btn-secondary" id="signal-forms-set">${tx('Modell von außen setzen','Set model from outside')}</button></div>
    <p class="signal-forms-status" id="signal-forms-status" role="status"></p>
  </form>
  <div class="sim-card"><h3>${tx('Modell und Feldzustand','Model and field state')}</h3>
    <p class="hint"><code>model()</code></p>
    <pre class="rx-json" id="signal-forms-model"></pre>
    <div id="signal-forms-state" class="signal-forms-state"></div>
    <p class="hint">${tx('Neu berechnete Fehler-Signals','Recomputed error signals')}: <b id="signal-forms-count">0</b></p>
  </div>
</div>
<p class="demo-note">${tx('Probier: Tipp ins Passwortfeld, nachdem „Passwort wiederholen“ schon ausgefüllt ist – der Fehler bei <code>confirm</code> verschwindet oder erscheint sofort, weil <code>valueOf(p.password)</code> eine reaktive Abhängigkeit ist. „Modell von außen setzen“ schreibt ins Signal – die Inputs folgen. „Registrieren“ markiert alle Felder als touched.','Try: type into the password field after “repeat password” is filled – the error on <code>confirm</code> disappears or appears immediately, because <code>valueOf(p.password)</code> is a reactive dependency. “Set model from outside” writes to the signal – the inputs follow. “Sign up” marks every field as touched.')}</p>`,
  init(root){
    const {signal,computed,effect}=NG;
    let recomputes=0;
    /* ---- Mini-Nachbau von form(): Feldbaum über einem Signal, Regeln aus dem Schema ---- */
    function form(model,schema){
      const keys=Object.keys(model()),rules=Object.fromEntries(keys.map(k=>[k,[]]));
      const paths=Object.fromEntries(keys.map(k=>[k,{key:k}]));
      const ctxFor=k=>({value:()=>model()[k],valueOf:p=>model()[p.key]});
      const api={
        required:(p,{message}={})=>rules[p.key].push(c=>c.value()===''?{kind:'required',message}:null),
        email:(p,{message}={})=>rules[p.key].push(c=>c.value()&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.value())?{kind:'email',message}:null),
        minLength:(p,n,{message}={})=>rules[p.key].push(c=>c.value()&&c.value().length<n?{kind:'minLength',message}:null),
        validate:(p,fn)=>rules[p.key].push(fn)
      };
      schema(paths,api);
      const fields={};
      keys.forEach(k=>{
        const value=computed(()=>model()[k],{name:k+'.value'});
        value.set=v=>model.update(m=>({...m,[k]:v}));
        const touched=signal(false,{name:k+'.touched'});
        const errors=computed(()=>{recomputes++;const ctx=ctxFor(k);return rules[k].map(r=>r(ctx)).filter(Boolean)},{name:k+'.errors',equal:(a,b)=>JSON.stringify(a)===JSON.stringify(b)});
        const valid=computed(()=>errors().length===0);
        const state={value,touched,errors,valid,invalid:computed(()=>!valid()),markAsTouched:()=>touched.set(true)};
        fields[k]=()=>state;
      });
      const rootValid=computed(()=>keys.every(k=>fields[k]().valid()));
      const root=()=>({valid:rootValid(),value:model,markAsTouched:()=>keys.forEach(k=>fields[k]().markAsTouched())});
      keys.forEach(k=>Object.defineProperty(root,k,{value:fields[k]})); // Funktionen haben ein schreibgeschütztes „name“
      return root;
    }
    /* ---- Genau das Schema aus dem Code unten ---- */
    const model=signal({name:'',email:'',password:'',confirm:''},{name:'model'});
    const f=form(model,(p,{required,email,minLength,validate})=>{
      required(p.name,{message:tx('Gib deinen Namen ein.','Enter your name.')});
      required(p.email,{message:tx('Gib deine E-Mail-Adresse ein.','Enter your email address.')});
      email(p.email,{message:tx('Gib eine gültige E-Mail-Adresse ein.','Enter a valid email address.')});
      minLength(p.password,8,{message:tx('Mindestens 8 Zeichen.','At least 8 characters.')});
      validate(p.confirm,({value,valueOf})=>value()!==valueOf(p.password)?{kind:'mismatch',message:tx('Die Passwörter stimmen nicht überein.','Passwords do not match.')}:null);
    });
    const K=['name','email','password','confirm'];
    /* [formField]: Input ↔ Feld in beide Richtungen, blur → touched */
    const inputs=Object.fromEntries(K.map(k=>[k,$('#signal-forms-'+k,root)]));
    K.forEach(k=>{inputs[k].addEventListener('input',()=>f[k]().value.set(inputs[k].value));inputs[k].addEventListener('blur',()=>f[k]().markAsTouched())});
    /* Das „Template“ */
    const view=effect(()=>{
      const m=model();
      $('#signal-forms-model',root).textContent=JSON.stringify(m,null,1).replace(/\n\s*/g,' ');
      $('#signal-forms-state',root).innerHTML=K.map(k=>{const s=f[k]();return `<div class="signal-forms-row"><code>${k}</code> <span class="rf-st ${s.valid()?'rf-valid':'rf-invalid'}">${s.valid()?'valid':'invalid'}</span> <span class="rf-flags"><span class="${s.touched()?'on':''}">touched: ${s.touched()}</span></span><div class="signal-forms-errs">errors(): <code>${esc(JSON.stringify(s.errors().map(e=>({kind:e.kind}))))}</code></div></div>`}).join('');
      K.forEach(k=>{
        const s=f[k](),show=s.touched()&&s.invalid(),inp=inputs[k],box=$(`#signal-forms-${k}-err`,root);
        if(inp.value!==s.value())inp.value=s.value();
        inp.setAttribute('aria-invalid',String(show));
        if(show)inp.setAttribute('aria-describedby',`signal-forms-${k}-e`);else inp.removeAttribute('aria-describedby');
        box.innerHTML=show?`<p class="err" id="signal-forms-${k}-e">${esc(s.errors().map(e=>e.message).join(' '))}</p>`:'';
      });
      $('#signal-forms-count',root).textContent=recomputes;
    },{name:'template'});
    let pending=null;
    $('#signal-forms-form',root).addEventListener('submit',e=>{
      e.preventDefault();
      const st=$('#signal-forms-status',root);
      f().markAsTouched();
      if(!f().valid){st.textContent=tx('Bitte die markierten Felder korrigieren.','Please fix the marked fields.');const first=K.find(k=>f[k]().invalid());inputs[first].focus();return}
      st.textContent=tx('Wird gesendet …','Submitting …');clearTimeout(pending);
      pending=setTimeout(()=>st.textContent=tx('Registriert – danke!','Signed up – thank you!'),600);
    });
    root.addEventListener('click',e=>{if(e.target.closest('#signal-forms-set'))model.set({name:'Ada Lovelace',email:'ada@example.com',password:'analytical1',confirm:'analytical1'})});
    return ()=>{view.destroy();clearTimeout(pending)};
  },
  css:`.signal-forms-f{margin-bottom:12px}.signal-forms-f .err{margin-top:2px}.signal-forms-status{margin:12px 0 0;font-weight:700;min-height:1.5em}.signal-forms-state{display:grid;gap:6px;margin:10px 0}.signal-forms-row{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-sm)}.signal-forms-errs{font-size:.8125rem;margin-top:2px;overflow-wrap:anywhere}`,
  bad:{code:`// Reactive Forms: eigener Zustand neben dem Modell
readonly user = signal<User>(emptyUser);
readonly form = this.fb.group({ name: [''], email: [''] });

constructor() {
  // zwei Wahrheiten synchron halten – in beide Richtungen
  effect(() => this.form.patchValue(this.user(), { emitEvent: false }));
  this.form.valueChanges.pipe(takeUntilDestroyed())
    .subscribe(v => this.user.update(u => ({ ...u, ...v })));
}`.replace('Reactive Forms: eigener Zustand neben dem Modell',tx('Reactive Forms: eigener Zustand neben dem Modell','reactive forms: own state next to the model')).replace('zwei Wahrheiten synchron halten – in beide Richtungen',tx('zwei Wahrheiten synchron halten – in beide Richtungen','keeping two sources of truth in sync – both ways')),
    note:tx('Wer Signals und Reactive Forms per Hand koppelt, hat zwei Kopien der Daten, <code>emitEvent</code>-Tricks gegen Schleifen und Formularzustand, der nicht als Signal lesbar ist.','Coupling signals and reactive forms by hand means two copies of the data, <code>emitEvent</code> tricks against loops and form state that isn’t readable as signals.')},
  good:{code:`import { Component, inject, signal } from '@angular/core';
import { form, FormField, FormRoot, required, email, minLength, validate } from '@angular/forms/signals';

interface SignUpModel { name: string; email: string; password: string; confirm: string; }

@Component({
  selector: 'app-sign-up',
  imports: [FormField, FormRoot],
  template: \`
    <form [formRoot]="signUpForm">
      <label for="email">Email</label>
      <input id="email" type="email" [formField]="signUpForm.email" />
      @if (signUpForm.email().touched() && signUpForm.email().invalid()) {
        @for (error of signUpForm.email().errors(); track error.kind) {
          <p class="error">{{ error.message }}</p>
        }
      }
      <\!-- name, password, confirm analog -->
      <button type="submit">Sign up</button>
    </form>
  \`,
})
export class SignUp {
  private readonly api = inject(AuthApi);
  readonly model = signal<SignUpModel>({ name: '', email: '', password: '', confirm: '' });

  readonly signUpForm = form(this.model, p => {
    required(p.name, { message: 'Enter your name.' });
    required(p.email, { message: 'Enter your email address.' });
    email(p.email, { message: 'Enter a valid email address.' });
    minLength(p.password, 8, { message: 'At least 8 characters.' });
    validate(p.confirm, ({ value, valueOf }) =>
      value() !== valueOf(p.password)
        ? { kind: 'mismatch', message: 'Passwords do not match.' }
        : null);
  }, {
    submission: { action: async f => { await this.api.register(f().value()); } },
  });
}`,
    note:tx('Eine Wahrheit (<code>model</code>), Regeln an einer Stelle, Zustand als Signals – im Template ohne <code>async</code>-Pipe. <code>[formRoot]</code> setzt <code>novalidate</code>, verhindert das Neuladen und ruft beim Absenden die <code>submission.action</code> auf.','One source of truth (<code>model</code>), rules in one place, state as signals – no <code>async</code> pipe in the template. <code>[formRoot]</code> sets <code>novalidate</code>, prevents the page reload and calls the <code>submission.action</code> on submit.')},
  do:tx(['Das Modell vollständig initialisieren (<code>\'\'</code> statt <code>undefined</code>) – der Feldbaum folgt seiner Form.','Regeln ins Schema, Anzeige-Logik ins Template: <code>touched()</code> und <code>invalid()</code> lesen.','Fehlermeldungen per <code>message</code> direkt an der Regel angeben.','Bestehende Reactive Forms schrittweise mit <code>@angular/forms/signals/compat</code> (<code>compatForm</code>) anbinden statt alles neu zu schreiben.'],
        ['Fully initialise the model (<code>\'\'</code> instead of <code>undefined</code>) – the field tree follows its shape.','Rules into the schema, display logic into the template: read <code>touched()</code> and <code>invalid()</code>.','Give error messages via <code>message</code> right at the rule.','Connect existing reactive forms step by step with <code>@angular/forms/signals/compat</code> (<code>compatForm</code>) instead of rewriting everything.']),
  dont:tx(['Nicht <code>[formField]</code> und <code>formControlName</code> auf demselben Element mischen.','Keine Werte zusätzlich in einer Komponenten-Variable spiegeln – das Signal <em>ist</em> das Modell.','Kein <code>[control]</code> oder <code>[field]</code> aus älteren Blogposts – die Direktive heißt in Angular 22 <code>FormField</code> mit dem Selektor <code>[formField]</code>.'],
        ['Don’t mix <code>[formField]</code> and <code>formControlName</code> on the same element.','Don’t mirror values in an extra component variable – the signal <em>is</em> the model.','No <code>[control]</code> or <code>[field]</code> from older blog posts – in Angular 22 the directive is <code>FormField</code> with the selector <code>[formField]</code>.']),
  why:tx('<p>Bei Reactive Forms besitzt das Formular die Daten; bei Signal Forms besitzt <em>du</em> sie. <code>form()</code> legt nur einen Baum aus Feldern über dein Signal, jedes Feld ist eine Funktion, die seinen <code>FieldState</code> liefert. Weil <code>errors()</code>, <code>valid()</code> und Co. abgeleitete Signals sind, rechnet Angular genau die Regeln neu, deren gelesene Werte sich geändert haben – darum reagiert der Vergleich mit <code>valueOf(p.password)</code> sofort, wenn sich das Passwort ändert.</p><p>Die API kam in Angular 21 als experimentell und ist in 22 mit <code>@publicApi 22.0</code> markiert, also stabil. Reactive Forms bleiben voll unterstützt und sind nicht deprecated. Für neue Formulare in einer signalbasierten App sind Signal Forms aber der direkteste Weg.</p>',
           '<p>With reactive forms, the form owns the data; with signal forms, <em>you</em> own it. <code>form()</code> only lays a tree of fields over your signal; every field is a function returning its <code>FieldState</code>. Because <code>errors()</code>, <code>valid()</code> and friends are derived signals, Angular recomputes exactly the rules whose read values changed – that’s why the comparison with <code>valueOf(p.password)</code> reacts immediately when the password changes.</p><p>The API arrived in Angular 21 as experimental and is marked <code>@publicApi 22.0</code> in 22, i.e. stable. Reactive forms stay fully supported and are not deprecated. For new forms in a signal-based app, though, signal forms are the most direct way.</p>'),
  test:{code:`it('flags mismatching passwords reactively', () => {
  TestBed.runInInjectionContext(() => {
    const model = signal({ password: 'secret123', confirm: 'secret124' });
    const f = form(model, p => {
      validate(p.confirm, ({ value, valueOf }) =>
        value() !== valueOf(p.password) ? { kind: 'mismatch' } : null);
    });

    expect(f.confirm().errors().map(e => e.kind)).toEqual(['mismatch']);

    f.password().value.set('secret124');
    expect(f.confirm().valid()).toBe(true);
    expect(model().password).toBe('secret124');
  });
});`,note:tx('<code>form()</code> braucht einen Injection Context (oder die Option <code>injector</code>) – im Test liefert ihn <code>TestBed.runInInjectionContext()</code>.','<code>form()</code> needs an injection context (or the <code>injector</code> option) – in tests <code>TestBed.runInInjectionContext()</code> provides it.')}
});

LESSONS.push({
  id:'template-vs-reactive', cat:'forms', order:60,
  title:tx('Template-driven, Reactive oder Signal Forms?','Template-driven, reactive or signal forms?'),
  short:tx('Drei Wege zu einem Formular – wo das Modell lebt, wann Werte ankommen und wann welcher passt.','Three ways to a form – where the model lives, when values arrive and when which one fits.'),
  keys:'template-driven reactive forms signal forms ngModel FormsModule ReactiveFormsModule vergleich comparison entscheidung decision synchron asynchron',
  status:'stable',
  refs:[[tx('Angular-Doku: Einen Ansatz wählen','Angular docs: Choosing an approach'),'https://angular.dev/guide/forms#choosing-an-approach'],
        [tx('Angular-Doku: Datenfluss in Formularen','Angular docs: Data flow in forms'),'https://angular.dev/guide/forms#data-flow-in-forms'],
        [tx('Angular-Doku: Signal Forms','Angular docs: Signal forms'),'https://angular.dev/guide/forms/signals/overview']],
  rule:tx('<strong>Template-driven</strong> (<code>ngModel</code>): Das Formularmodell entsteht aus dem Template, Aktualisierungen sind asynchron – gut für kleine, einfache Formulare. <strong>Reactive</strong> (<code>FormGroup</code>): Das Modell steht im Code, synchron, testbar ohne DOM, mit Observables – der bewährte Standard für alles Größere. <strong>Signal Forms</strong> (<code>form()</code>): Modell ist ein Signal, Regeln stehen im Schema – in Angular 22 stabil und die naheliegende Wahl für neue, signalbasierte Formulare.','<strong>Template-driven</strong> (<code>ngModel</code>): the form model is created from the template, updates are asynchronous – good for small, simple forms. <strong>Reactive</strong> (<code>FormGroup</code>): the model lives in code, synchronous, testable without DOM, with observables – the proven standard for anything larger. <strong>Signal forms</strong> (<code>form()</code>): the model is a signal, rules live in a schema – stable in Angular 22 and the natural choice for new, signal-based forms.'),
  apis:[['FormsModule','[(ngModel)], #f="ngForm", name=…',tx('Template-driven: Direktiven erzeugen die Controls; Validierung per Attribut (<code>required</code>, <code>minlength</code>).','Template-driven: directives create the controls; validation via attributes (<code>required</code>, <code>minlength</code>).')],
        ['ReactiveFormsModule','[formGroup], formControlName',tx('Reactive: Du baust <code>FormGroup</code>/<code>FormControl</code> im Code, das Template bindet nur.','Reactive: you build <code>FormGroup</code>/<code>FormControl</code> in code, the template only binds.')],
        ['@angular/forms/signals','form(model, schema) · [formField]',tx('Signal Forms: Das Formular ist ein Baum aus Feldern über einem <code>signal()</code>.','Signal forms: the form is a tree of fields over a <code>signal()</code>.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Wann ist der Wert da?','When is the value there?')}</h3>
    <p class="hint">${tx('Code setzt den Namen auf „Grace“ und liest sofort den Formularwert.','Code sets the name to “Grace” and immediately reads the form value.')}</p>
    <div class="sim-row template-vs-reactive-btns"><button type="button" class="btn btn-secondary" id="template-vs-reactive-td">Template-driven</button><button type="button" class="btn btn-secondary" id="template-vs-reactive-rf">Reactive</button><button type="button" class="btn btn-secondary" id="template-vs-reactive-sf">Signal Forms</button></div>
    <ul class="sim-log" id="template-vs-reactive-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
  <div class="sim-card"><h3 id="template-vs-reactive-needs-h">${tx('Was brauchst du?','What do you need?')}</h3>
    <div id="template-vs-reactive-needs" role="group" aria-labelledby="template-vs-reactive-needs-h">${[
      ['simple',tx('Wenige Felder, einfache Pflichtfeld-Regeln','Few fields, simple required rules')],
      ['dynamic',tx('Dynamische Felder oder Zeilen','Dynamic fields or rows')],
      ['cross',tx('Feldübergreifende oder asynchrone Validierung','Cross-field or async validation')],
      ['test',tx('Formularlogik ohne DOM testen','Test form logic without DOM')],
      ['streams',tx('Werte als Stream (debounce, switchMap)','Values as a stream (debounce, switchMap)')],
      ['signals',tx('Neue Komponente, App arbeitet mit Signals','New component, app works with signals')],
      ['legacy',tx('Viele bestehende Reactive Forms im Projekt','Many existing reactive forms in the project')]
    ].map(([k,t])=>`<label class="check-row"><input type="checkbox" value="${k}"> ${t}</label>`).join('')}</div>
    <p class="template-vs-reactive-rec" id="template-vs-reactive-rec" aria-live="polite"></p>
  </div>
</div>
<p class="demo-note">${tx('Probier: Drück „Template-driven“ – direkt nach dem Setzen steht im Formular noch der alte Wert, erst nach Change Detection und einem Microtask der neue. Reactive und Signal Forms sind sofort aktuell. Unter „Was brauchst du?“: Kreuz an, was dein Formular braucht.','Try: press “Template-driven” – right after setting, the form still holds the old value; only after change detection and a microtask the new one. Reactive and signal forms are current right away. Under “What do you need?”: tick what your form needs.')}</p>`,
  init(root){
    const {signal,log}=NG;
    const ul=$('#template-vs-reactive-log',root);
    let seq=0;const timers=[];
    function td(){
      const run=++seq;ul.innerHTML='';
      /* Template-driven: NgModel übernimmt den Modellwert in ngOnChanges und schreibt ihn per Promise.then ins Control */
      let model='Ada',control='Ada';
      model='Grace';log(ul,`this.name = 'Grace'`);
      log(ul,`form.value.name → <span class="template-vs-reactive-old">'${control}'</span> <span class="t">(${tx('noch alt','still old')})</span>`);
      timers.push(setTimeout(()=>{if(run!==seq)return;log(ul,`<span class="t">Change Detection → NgModel.ngOnChanges</span>`);
        Promise.resolve().then(()=>{if(run!==seq)return;control=model;log(ul,`<span class="t">Promise.then</span> → control.setValue('Grace')`);log(ul,`form.value.name → <span class="hl">'${control}'</span>`)})},400));
    }
    function rf(){
      ++seq;ul.innerHTML='';
      const c=new RF.FormControl('Ada',{nonNullable:true});
      c.setValue('Grace');log(ul,`form.controls.name.setValue('Grace')`);
      log(ul,`form.value.name → <span class="hl">'${c.value}'</span> <span class="t">(${tx('synchron','synchronous')})</span>`);
    }
    function sf(){
      ++seq;ul.innerHTML='';
      const model=signal({name:'Ada'});
      model.update(m=>({...m,name:'Grace'}));log(ul,`profileForm.name().value.set('Grace')`);
      log(ul,`profile().name → <span class="hl">'${model().name}'</span> <span class="t">(${tx('synchron, das Signal ist das Modell','synchronous, the signal is the model')})</span>`);
    }
    function recommend(){
      const on=new Set($$('#template-vs-reactive-needs input:checked',root).map(i=>i.value));
      const rec=$('#template-vs-reactive-rec',root);
      if(!on.size){rec.textContent=tx('Kreuz etwas an.','Tick something.');return}
      const heavy=['dynamic','cross','test','streams'].some(k=>on.has(k));
      let out;
      if(on.has('legacy')&&!on.has('signals'))out=['Reactive Forms',tx('Konsistenz im Projekt zählt; typisierte Reactive Forms können alles hier.','Consistency in the project counts; typed reactive forms can do everything here.')];
      else if(on.has('streams')&&!on.has('signals'))out=['Reactive Forms',tx('<code>valueChanges</code> ist ein Observable – ideal für RxJS-Ketten.','<code>valueChanges</code> is an observable – ideal for RxJS chains.')];
      else if(on.has('signals'))out=['Signal Forms',tx('Modell als Signal, Regeln im Schema, in Angular 22 stabil. Für Streams: <code>toObservable()</code> auf das Modell.','Model as a signal, rules in a schema, stable in Angular 22. For streams: <code>toObservable()</code> on the model.')];
      else if(heavy)out=['Reactive Forms',tx('Explizites Modell im Code, synchron und ohne DOM testbar.','Explicit model in code, synchronous and testable without DOM.')];
      else out=['Template-driven',tx('Für ein kleines Formular reicht <code>[(ngModel)]</code> – wächst es, wechsle zu Reactive oder Signal Forms.','For a small form <code>[(ngModel)]</code> is enough – if it grows, switch to reactive or signal forms.')];
      rec.innerHTML=`${tx('Empfehlung','Recommendation')}: <strong>${out[0]}</strong> – ${out[1]}`;
    }
    root.addEventListener('click',e=>{
      if(e.target.closest('#template-vs-reactive-td'))td();
      if(e.target.closest('#template-vs-reactive-rf'))rf();
      if(e.target.closest('#template-vs-reactive-sf'))sf();
    });
    root.addEventListener('change',recommend);recommend();
    return ()=>{seq++;timers.forEach(clearTimeout)};
  },
  css:`.template-vs-reactive-btns{margin:10px 0 12px}.template-vs-reactive-old{color:var(--danger);font-weight:700}.template-vs-reactive-rec{margin:12px 0 0;min-height:3em}`,
  bad:{code:`// Template-driven für ein großes, dynamisches Formular
<form #f="ngForm">
  @for (item of items; track item.id; let i = $index) {
    <input [name]="'qty' + i" [(ngModel)]="item.qty" required min="1" />
  }
</form>

save() {
  // Wert direkt nach dem Setzen lesen – noch nicht übernommen
  this.items[0].qty = 5;
  console.log(this.f.value);  // alter Wert
}`.replace('Template-driven für ein großes, dynamisches Formular',tx('Template-driven für ein großes, dynamisches Formular','template-driven for a large, dynamic form')).replace('Wert direkt nach dem Setzen lesen – noch nicht übernommen',tx('Wert direkt nach dem Setzen lesen – noch nicht übernommen','reading the value right after setting it – not applied yet')).replace('// alter Wert',tx('// alter Wert','// old value')),
    note:tx('Das Modell entsteht erst beim Rendern, Namen müssen eindeutig sein, Werte kommen asynchron an – und Tests brauchen das Template.','The model only exists after rendering, names must be unique, values arrive asynchronously – and tests need the template.')},
  good:{code:`// klein und einfach: template-driven (auch mit Signals)
@Component({
  imports: [FormsModule],
  template: \`<input name="q" [(ngModel)]="query" aria-label="Search" />\`,
})
export class QuickSearch { readonly query = signal(''); }

// größer oder dynamisch: reactive
private readonly fb = inject(NonNullableFormBuilder);
readonly form = this.fb.group({
  items: this.fb.array([this.newItem()]),
});

// neu und signalbasiert: Signal Forms
readonly profile = signal({ name: '', email: '' });
readonly profileForm = form(this.profile, p => {
  required(p.name);
  email(p.email);
});`.replace('klein und einfach: template-driven (auch mit Signals)',tx('klein und einfach: template-driven (auch mit Signals)','small and simple: template-driven (also with signals)')).replace('größer oder dynamisch: reactive',tx('größer oder dynamisch: reactive','larger or dynamic: reactive')).replace('neu und signalbasiert: Signal Forms',tx('neu und signalbasiert: Signal Forms','new and signal-based: signal forms')),
    note:tx('Keine Variante ist „veraltet“ – alle drei sind in Angular 22 unterstützt. Entscheidend ist, wo das Modell leben soll und wie viel Logik das Formular hat.','None of them is “deprecated” – all three are supported in Angular 22. What matters is where the model should live and how much logic the form has.')},
  do:tx(['Pro Formular einen Ansatz wählen und im Projekt eine Linie halten.','Reactive oder Signal Forms, sobald Felder dynamisch sind, Regeln Felder verbinden oder Logik getestet werden soll.','Template-driven für kleine Eingaben (Suche, ein Newsletter-Feld) ruhig nutzen.'],
        ['Pick one approach per form and keep one line in the project.','Reactive or signal forms as soon as fields are dynamic, rules connect fields or logic should be tested.','Feel free to use template-driven for small inputs (search, a newsletter field).']),
  dont:tx(['<code>ngModel</code> und <code>formControlName</code> nicht auf demselben Element mischen – das ist seit v6 deprecated.','Nicht erwarten, dass ein template-driven Formular direkt nach dem Setzen des Modells aktuell ist.','Bestehende Reactive Forms nicht ohne Grund umschreiben – Signal Forms bieten Interop (<code>compatForm</code>) für schrittweise Migration.'],
        ['Don’t mix <code>ngModel</code> and <code>formControlName</code> on the same element – deprecated since v6.','Don’t expect a template-driven form to be current right after setting the model.','Don’t rewrite existing reactive forms without reason – signal forms offer interop (<code>compatForm</code>) for gradual migration.']),
  why:tx('<p>Template-driven Forms bauen das Modell aus Direktiven: Jedes <code>ngModel</code> registriert sein Control asynchron und übernimmt Modelländerungen erst nach der Change Detection in einem Microtask. Das ist bequem, aber indirekt – und bei vielen oder dynamischen Feldern schwer zu überblicken. Reactive Forms drehen es um: Das Modell steht explizit im Code, jede Änderung ist sofort sichtbar, und <code>valueChanges</code> liefert einen Stream.</p><p>Signal Forms (<code>@angular/forms/signals</code>) nehmen dein eigenes <code>signal()</code> als einzige Quelle der Wahrheit; Feldzustände wie <code>valid()</code> oder <code>errors()</code> sind abgeleitete Signals. Sie kamen in Angular 21 als experimentelle API und sind laut JSDoc (<code>@publicApi 22.0</code>) und Roadmap seit Angular 22 stabil.</p>',
           '<p>Template-driven forms build the model from directives: every <code>ngModel</code> registers its control asynchronously and only applies model changes after change detection in a microtask. That’s convenient but indirect – and hard to keep track of with many or dynamic fields. Reactive forms turn it around: the model lives explicitly in code, every change is visible immediately, and <code>valueChanges</code> provides a stream.</p><p>Signal forms (<code>@angular/forms/signals</code>) take your own <code>signal()</code> as the single source of truth; field states like <code>valid()</code> or <code>errors()</code> are derived signals. They arrived in Angular 21 as an experimental API and, according to the JSDoc (<code>@publicApi 22.0</code>) and the roadmap, are stable since Angular 22.</p>')
});

LESSONS.push({
  id:'typed-forms', cat:'forms', order:10,
  title:tx('Typisierte Reactive Forms','Typed reactive forms'),
  short:tx('FormControl<string> statt any: nonNullable, NonNullableFormBuilder und warum value bei deaktivierten Feldern lügt.','FormControl<string> instead of any: nonNullable, NonNullableFormBuilder and why value lies with disabled fields.'),
  keys:'typed forms FormControl FormGroup nonNullable NonNullableFormBuilder FormBuilder getRawValue value disabled reset partial typisiert',
  since:'Angular 14', status:'stable',
  refs:[[tx('Angular-Doku: Nullability','Angular docs: Nullability'),'https://angular.dev/guide/forms/typed-forms#nullability'],
        [tx('Angular-Doku: FormBuilder und NonNullableFormBuilder','Angular docs: FormBuilder and NonNullableFormBuilder'),'https://angular.dev/guide/forms/typed-forms#formbuilder-and-nonnullableformbuilder'],
        [tx('Angular-Doku: Partial Values','Angular docs: Partial values'),'https://angular.dev/guide/forms/typed-forms#partial-values']],
  rule:tx('Reactive Forms sind typisiert. Ein <code>FormControl</code> ist aber standardmäßig <strong>nullable</strong>, weil <code>reset()</code> es auf <code>null</code> setzt. Mit <code>nonNullable: true</code> bzw. <code>inject(NonNullableFormBuilder)</code> setzt <code>reset()</code> auf den Startwert zurück und der Typ bleibt <code>string</code>. Zum Absenden nimm <code>getRawValue()</code> – <code>value</code> lässt deaktivierte Controls weg.','Reactive forms are typed. But a <code>FormControl</code> is <strong>nullable</strong> by default, because <code>reset()</code> sets it to <code>null</code>. With <code>nonNullable: true</code> or <code>inject(NonNullableFormBuilder)</code>, <code>reset()</code> goes back to the initial value and the type stays <code>string</code>. To submit, use <code>getRawValue()</code> – <code>value</code> leaves out disabled controls.'),
  apis:[['FormControl','new FormControl(\'\', { nonNullable: true })',tx('Ohne Option: <code>FormControl&lt;string | null&gt;</code>. Mit <code>nonNullable</code>: <code>FormControl&lt;string&gt;</code>, <code>reset()</code> → Startwert.','Without option: <code>FormControl&lt;string | null&gt;</code>. With <code>nonNullable</code>: <code>FormControl&lt;string&gt;</code>, <code>reset()</code> → initial value.')],
        ['NonNullableFormBuilder','inject(NonNullableFormBuilder).group({...})',tx('Wie <code>FormBuilder</code>, aber jedes neu erzeugte Control ist non-nullable. Kurz: <code>inject(FormBuilder).nonNullable</code>.','Like <code>FormBuilder</code>, but every newly created control is non-nullable. Short form: <code>inject(FormBuilder).nonNullable</code>.')],
        ['value','form.value: Partial<{…}>',tx('Nur aktivierte Controls – darum ist jeder Schlüssel optional.','Only enabled controls – that’s why every key is optional.')],
        ['getRawValue()','form.getRawValue(): {…}',tx('Alle Controls inklusive deaktivierter – vollständig typisiert.','All controls including disabled ones – fully typed.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Formular','Form')}</h3>
    <div class="field typed-forms-f"><label for="typed-forms-name">name <span class="opt">FormControl&lt;string&gt; · nonNullable</span></label><input class="input" id="typed-forms-name" autocomplete="off"></div>
    <div class="field typed-forms-f"><label for="typed-forms-company">company <span class="opt">FormControl&lt;string | null&gt;</span></label><input class="input" id="typed-forms-company" autocomplete="off"></div>
    <label class="check-row"><input type="checkbox" id="typed-forms-news"> newsletter <span class="opt">FormControl&lt;boolean&gt;</span></label>
    <div class="sim-row typed-forms-btns">
      <button type="button" class="btn btn-secondary" id="typed-forms-dis">company.disable()</button>
      <button type="button" class="btn btn-secondary" id="typed-forms-patch">patchValue({ name: 'Grace' })</button>
      <button type="button" class="btn btn-secondary" id="typed-forms-reset">form.reset()</button>
    </div>
  </div>
  <div class="sim-card"><h3>${tx('Was dein Code bekommt','What your code gets')}</h3>
    <p class="typed-forms-lbl"><code>form.value</code> <span class="hint">Partial&lt;{ name: string; company: string | null; newsletter: boolean }&gt;</span></p>
    <pre class="rx-json" id="typed-forms-value"></pre>
    <p class="typed-forms-lbl"><code>form.getRawValue()</code> <span class="hint">{ name: string; company: string | null; newsletter: boolean }</span></p>
    <pre class="rx-json" id="typed-forms-raw"></pre>
    <ul class="sim-log typed-forms-log" id="typed-forms-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Ändere beide Felder und klick <code>form.reset()</code> – <code>name</code> springt auf „Ada“ zurück, <code>company</code> auf <code>null</code>. Dann <code>company.disable()</code>: In <code>value</code> fehlt der Schlüssel, <code>getRawValue()</code> hat ihn.','Try: change both fields and click <code>form.reset()</code> – <code>name</code> jumps back to “Ada”, <code>company</code> to <code>null</code>. Then <code>company.disable()</code>: the key is missing from <code>value</code>, <code>getRawValue()</code> has it.')}</p>`,
  init(root){
    const {FormControl,FormGroup,bind,json}=RF;
    const {log}=NG;
    const ul=$('#typed-forms-log',root);
    const form=new FormGroup({
      name:new FormControl('Ada',{nonNullable:true}),
      company:new FormControl('ACME'),
      newsletter:new FormControl(false,{nonNullable:true})
    });
    const offs=[bind($('#typed-forms-name',root),form.get('name')),bind($('#typed-forms-company',root),form.get('company')),bind($('#typed-forms-news',root),form.get('newsletter'),{checkbox:true})];
    const render=()=>{
      $('#typed-forms-value',root).textContent=json(form.value);
      $('#typed-forms-raw',root).textContent=json(form.getRawValue());
      $('#typed-forms-dis',root).textContent=form.get('company').disabled?'company.enable()':'company.disable()';
    };
    const off=form.watch(render);render();
    root.addEventListener('click',e=>{
      if(e.target.closest('#typed-forms-dis')){const c=form.get('company');if(c.disabled){c.enable();log(ul,'company.enable()')}else{c.disable();log(ul,`company.disable() – ${tx('fehlt jetzt in value','now missing from value')}`)}}
      if(e.target.closest('#typed-forms-patch')){form.get('name').setValue('Grace');log(ul,"patchValue({ name: 'Grace' })")}
      if(e.target.closest('#typed-forms-reset')){form.reset();log(ul,`reset() → name = <span class="hl">"Ada"</span> (nonNullable), company = <span class="hl">null</span>, newsletter = false`)}
      render();
    });
    return ()=>{off();offs.forEach(f=>f())};
  },
  css:`.typed-forms-f{margin-bottom:12px}.typed-forms-btns{margin-top:12px}.typed-forms-lbl{margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}.typed-forms-lbl .hint{font-family:var(--font-mono);font-size:.75rem}.sim-card .rx-json+.typed-forms-lbl{margin-top:12px}.typed-forms-log{margin-top:12px}.typed-forms-f .input:disabled{opacity:.55;cursor:not-allowed;border-style:dashed}`,
  bad:{code:`form = new FormGroup({
  name: new FormControl('Ada'),        // FormControl<string | null>
  company: new FormControl('ACME'),
});

save() {
  // company ist deaktiviert → fehlt hier einfach
  this.api.save(this.form.value as Profile);
}`.replace('company ist deaktiviert → fehlt hier einfach',tx('company ist deaktiviert → fehlt hier einfach','company is disabled → simply missing here')),
    note:tx('<code>name</code> kann nach <code>reset()</code> <code>null</code> sein, und <code>form.value</code> ist ein <code>Partial</code>. Der Cast mit <code>as</code> versteckt beides – der Server bekommt ein Objekt ohne <code>company</code>.','<code>name</code> can be <code>null</code> after <code>reset()</code>, and <code>form.value</code> is a <code>Partial</code>. The <code>as</code> cast hides both – the server receives an object without <code>company</code>.')},
  good:{code:`private readonly fb = inject(NonNullableFormBuilder);

readonly form = this.fb.group({
  name: ['Ada', Validators.required],                // FormControl<string>
  newsletter: false,                                 // FormControl<boolean>
  company: new FormControl<string | null>('ACME'),   // bewusst nullable
});

save() {
  const profile = this.form.getRawValue();
  // { name: string; newsletter: boolean; company: string | null }
  this.api.save(profile);
}`.replace('bewusst nullable',tx('bewusst nullable','nullable on purpose')),
    note:tx('Der Typ sagt die Wahrheit, ganz ohne Cast. Schon erzeugte Controls (hier <code>company</code>) behält der <code>NonNullableFormBuilder</code> so, wie sie sind.','The type tells the truth, no cast needed. Already constructed controls (here <code>company</code>) are kept as they are by <code>NonNullableFormBuilder</code>.')},
  do:tx(['<code>inject(NonNullableFormBuilder)</code> als Standard für neue Formulare.','<code>null</code> nur dort zulassen, wo „kein Wert“ fachlich etwas bedeutet – dann explizit <code>new FormControl&lt;T | null&gt;(…)</code>.','Zum Absenden <code>getRawValue()</code>; <code>value</code> nur, wenn deaktivierte Felder bewusst wegfallen sollen.','Für Formulare mit dynamischen Schlüsseln <code>FormRecord&lt;FormControl&lt;T&gt;&gt;</code>.'],
        ['<code>inject(NonNullableFormBuilder)</code> as the default for new forms.','Only allow <code>null</code> where “no value” means something – then explicitly <code>new FormControl&lt;T | null&gt;(…)</code>.','Submit with <code>getRawValue()</code>; use <code>value</code> only if disabled fields should deliberately drop out.','For forms with dynamic keys use <code>FormRecord&lt;FormControl&lt;T&gt;&gt;</code>.']),
  dont:tx(['Kein <code>UntypedFormGroup</code> oder <code>any</code> in neuem Code – das gibt es nur für die Migration.','Kein <code>as</code>-Cast auf <code>form.value</code>.','Nicht erwarten, dass <code>reset()</code> ohne <code>nonNullable</code> den Startwert herstellt.'],
        ['No <code>UntypedFormGroup</code> or <code>any</code> in new code – they only exist for migration.','No <code>as</code> cast on <code>form.value</code>.','Don’t expect <code>reset()</code> without <code>nonNullable</code> to restore the initial value.']),
  why:tx('<p>Seit Angular 14 leitet TypeScript die Typen aus den Startwerten ab. Weil <code>reset()</code> ohne Argument historisch <code>null</code> schreibt, muss der Typ <code>null</code> enthalten – außer du sagst mit <code>nonNullable</code>, dass <code>reset()</code> zum Startwert zurückgehen soll. Das ist nicht nur Typkosmetik, sondern ändert das Laufzeitverhalten.</p><p>Deaktivierte Controls gelten in Angular als „nicht Teil der Eingabe“: Sie werden nicht validiert und fehlen in <code>value</code>. Darum ist <code>value</code> als <code>Partial</code> getypt. <code>getRawValue()</code> sammelt alles ein – meist das, was ein Server erwartet.</p>',
           '<p>Since Angular 14, TypeScript infers the types from the initial values. Because an argument-less <code>reset()</code> historically writes <code>null</code>, the type has to include <code>null</code> – unless you say with <code>nonNullable</code> that <code>reset()</code> should go back to the initial value. That’s not just type cosmetics, it changes runtime behaviour.</p><p>Disabled controls count as “not part of the input” in Angular: they aren’t validated and are missing from <code>value</code>. That’s why <code>value</code> is typed as <code>Partial</code>. <code>getRawValue()</code> collects everything – usually what a server expects.</p>'),
  test:{code:`it('resets non-nullable controls to their initial value', () => {
  const fb = TestBed.inject(NonNullableFormBuilder);
  const form = fb.group({
    name: 'Ada',
    company: new FormControl<string | null>('ACME'),
  });

  form.patchValue({ name: 'Grace', company: 'Initech' });
  form.reset();

  expect(form.getRawValue()).toEqual({ name: 'Ada', company: null });
});`,note:tx('Formularlogik lässt sich ohne Template testen – <code>TestBed.inject()</code> liefert den Builder.','Form logic can be tested without a template – <code>TestBed.inject()</code> provides the builder.')}
});

LESSONS.push({
  id:'validators', cat:'forms', order:20,
  title:tx('Validatoren: eingebaut, eigene, feldübergreifend, asynchron','Validators: built-in, custom, cross-field, async'),
  short:tx('ValidatorFn für ein Feld, ein Validator auf der Gruppe für „Passwort wiederholen“ und ein asynchroner Check mit updateOn: \'blur\'.','ValidatorFn for one field, a validator on the group for “repeat password” and an async check with updateOn: \'blur\'.'),
  keys:'Validators ValidatorFn AsyncValidatorFn ValidationErrors required minLength pattern custom eigener validator cross-field password confirm passwort async pending updateOn blur',
  status:'stable',
  refs:[[tx('Angular-Doku: Eigene Validatoren','Angular docs: Defining custom validators'),'https://angular.dev/guide/forms/form-validation#defining-custom-validators'],
        [tx('Angular-Doku: Feldübergreifende Validierung','Angular docs: Cross-field validation'),'https://angular.dev/guide/forms/form-validation#adding-cross-validation-to-reactive-forms'],
        [tx('Angular-Doku: Asynchrone Validatoren optimieren','Angular docs: Optimizing async validators'),'https://angular.dev/guide/forms/form-validation#optimizing-performance-of-async-validators']],
  rule:tx('Ein Validator ist eine reine Funktion: Control rein, <code>null</code> (gültig) oder ein Fehlerobjekt raus. Regeln für <em>ein</em> Feld hängen am Control, Regeln über <em>mehrere</em> Felder am <code>FormGroup</code>. Asynchrone Validatoren laufen nur, wenn alle synchronen bestehen – mit <code>updateOn: \'blur\'</code> fragst du den Server erst, wenn das Feld verlassen wird.','A validator is a pure function: control in, <code>null</code> (valid) or an error object out. Rules for <em>one</em> field go on the control, rules across <em>several</em> fields on the <code>FormGroup</code>. Async validators only run when all sync ones pass – with <code>updateOn: \'blur\'</code> you only ask the server once the field is left.'),
  apis:[['ValidatorFn','(control: AbstractControl) => ValidationErrors | null',tx('Synchroner Validator. Leere Werte meist durchlassen – das ist Aufgabe von <code>required</code>.','Sync validator. Usually let empty values pass – that’s <code>required</code>’s job.')],
        ['AsyncValidatorFn','(control) => Observable<ValidationErrors | null> | Promise<…>',tx('Liefert das Ergebnis später; das Observable muss enden. Ein neuer Wert kündigt die laufende Prüfung.','Delivers the result later; the observable must complete. A new value cancels the running check.')],
        ['Validators','required, minLength(n), maxLength(n), min(n), max(n), email, pattern(re)',tx('Eingebaute Validatoren. Fehlerschlüssel sind klein geschrieben: <code>minlength</code>, <code>maxlength</code>.','Built-in validators. Error keys are lower case: <code>minlength</code>, <code>maxlength</code>.')],
        ['updateOn','{ updateOn: \'change\' | \'blur\' | \'submit\' }',tx('Wann Wert und Validierung aktualisiert werden.','When value and validation are updated.')],
        ['status','\'VALID\' | \'INVALID\' | \'PENDING\' | \'DISABLED\'',tx('<code>PENDING</code>, solange ein asynchroner Validator läuft.','<code>PENDING</code> while an async validator is running.')]],
  demo:`<div class="sim-grid">
  <form class="sim-card" id="validators-form" novalidate><h3>${tx('Registrierung','Sign-up')}</h3>
    <div class="field validators-f"><label for="validators-user">${tx('Benutzername','Username')} <span class="opt">updateOn: 'blur'</span></label><input class="input" id="validators-user" autocomplete="off" spellcheck="false"><p class="hint">${tx('Vergeben sind: ada, grace, admin','Taken: ada, grace, admin')}</p></div>
    <div class="field validators-f"><label for="validators-pw">${tx('Passwort','Password')}</label><input class="input" id="validators-pw" type="text" autocomplete="off"></div>
    <div class="field validators-f"><label for="validators-pw2">${tx('Passwort wiederholen','Repeat password')}</label><input class="input" id="validators-pw2" type="text" autocomplete="off"></div>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="validators-taken">${tx('Beispiel: vergebener Name','Example: taken name')}</button><button type="button" class="btn btn-secondary" id="validators-mismatch">${tx('Beispiel: ungleiche Passwörter','Example: mismatching passwords')}</button></div>
  </form>
  <div class="sim-card"><h3>${tx('Was Angular weiß','What Angular knows')}</h3>
    <div id="validators-tree" class="validators-tree"></div>
    <ul class="sim-log validators-log" id="validators-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Tipp „ada“ in den Benutzernamen – nichts passiert, bis du das Feld verlässt (<code>updateOn: \'blur\'</code>). Dann ist das Feld kurz <code>PENDING</code>, danach <code>taken</code>. Tipp „a b“: Der eigene Validator meldet <code>whitespace</code>, der Server wird gar nicht erst gefragt. Ungleiche Passwörter erzeugen einen Fehler auf der <em>Gruppe</em>, nicht am Feld.','Try: type “ada” into the username – nothing happens until you leave the field (<code>updateOn: \'blur\'</code>). Then the field is briefly <code>PENDING</code>, then <code>taken</code>. Type “a b”: the custom validator reports <code>whitespace</code>, the server isn’t even asked. Mismatching passwords create an error on the <em>group</em>, not on the field.')}</p>`,
  init(root){
    const {FormControl,FormGroup,Validators:V,bind,statusHTML,json}=RF;
    const {log}=NG;
    const ul=$('#validators-log',root);
    /* eigene Validatoren – genau wie im Code unten */
    const noWhitespace=c=>/\s/.test(c.value??'')?{whitespace:true}:null;
    const passwordsMatch=g=>{const a=g.get('password').value,b=g.get('confirm').value;return a&&b&&a!==b?{passwordMismatch:true}:null};
    const usernameFree=c=>{
      const name=c.value;log(ul,`<span class="hl">async</span> ${tx('prüfe','checking')} ${tx('„','“')}${esc(name)}${tx('“','”')} …`);
      return RX.request({ms:800,value:()=>['ada','grace','admin'].includes(name.toLowerCase())?{taken:true}:null,
        onEnd:st=>log(ul,st==='cancelled'?`<span class="t">${tx('Prüfung für','check for')} ${tx('„','“')}${esc(name)}${tx('“','”')} ${tx('gekündigt (neuer Wert)','cancelled (new value)')}</span>`:`<span class="hl">async</span> ${tx('„','“')}${esc(name)}${tx('“','”')} → ${['ada','grace','admin'].includes(name.toLowerCase())?'{ taken: true }':'null'}`)});
    };
    const form=new FormGroup({
      username:new FormControl('',{nonNullable:true,validators:[V.required,V.minLength(3),noWhitespace],asyncValidators:[usernameFree],updateOn:'blur'}),
      password:new FormControl('',{nonNullable:true,validators:[V.required,V.minLength(8)]}),
      confirm:new FormControl('',{nonNullable:true,validators:V.required})
    },{validators:passwordsMatch});
    const ids={username:'validators-user',password:'validators-pw',confirm:'validators-pw2'};
    const offs=Object.entries(ids).map(([k,id])=>bind($('#'+id,root),form.get(k)));
    const row=(name,c)=>`<div class="validators-row"><code>${name}</code> ${statusHTML(c)}${c.pending?` <span class="hint">${tx('Server wird gefragt …','asking the server …')}</span>`:''}<div class="validators-err">errors: <code>${c.errors?esc(json(c.errors)):'null'}</code></div></div>`;
    const render=()=>{$('#validators-tree',root).innerHTML=row('form',form)+Object.keys(ids).map(k=>row(k,form.get(k))).join('')};
    const off=form.watch(render);render();
    const type=(k,v)=>{const el=$('#'+ids[k],root);el.value=v;el.dispatchEvent(new Event('input'));el.dispatchEvent(new Event('blur'))};
    root.addEventListener('click',e=>{
      if(e.target.closest('#validators-taken'))type('username','ada');
      if(e.target.closest('#validators-mismatch')){type('password','geheim123');type('confirm','geheim124')}
    });
    return ()=>{off();offs.forEach(f=>f());form.get('username')._cancelAsync()};
  },
  css:`.validators-f{margin-bottom:12px}.validators-tree{display:grid;gap:8px;margin-bottom:12px}.validators-row{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm)}.validators-row:first-child{border-color:var(--line-strong)}.validators-err{margin-top:4px;font-size:.8125rem;overflow-wrap:anywhere}`,
  bad:{code:`// Passwortvergleich im Feld-Validator von "confirm"
confirm: ['', (c: AbstractControl) =>
  c.value !== this.form?.get('password')?.value ? { mismatch: true } : null],

// Server bei jedem Tastendruck fragen
username: ['', [], [c => this.api.exists(c.value).pipe(map(e => e ? { taken: true } : null))]],`.replace('Passwortvergleich im Feld-Validator von "confirm"',tx('Passwortvergleich im Feld-Validator von "confirm"','password comparison in the field validator of "confirm"')).replace('Server bei jedem Tastendruck fragen',tx('Server bei jedem Tastendruck fragen','ask the server on every keystroke')),
    note:tx('Der Feld-Validator von <code>confirm</code> läuft nicht, wenn sich <code>password</code> ändert – der Fehler bleibt stehen oder fehlt. Und ohne <code>updateOn: \'blur\'</code> (oder Debounce) geht jeder Tastendruck an den Server.','The field validator of <code>confirm</code> doesn’t run when <code>password</code> changes – the error stays or is missing. And without <code>updateOn: \'blur\'</code> (or a debounce) every keystroke goes to the server.')},
  good:{code:`export const noWhitespace: ValidatorFn = control =>
  /\\s/.test(control.value ?? '') ? { whitespace: true } : null;

export const passwordsMatch: ValidatorFn = group => {
  const password = group.get('password')?.value;
  const confirm = group.get('confirm')?.value;
  return password && confirm && password !== confirm ? { passwordMismatch: true } : null;
};

export const usernameFree = (api: UserApi): AsyncValidatorFn => control =>
  api.exists(control.value).pipe(
    map(exists => (exists ? { taken: true } : null)),
    catchError(() => of(null)),
  );

// in der Komponente
private readonly fb = inject(NonNullableFormBuilder);
readonly form = this.fb.group({
  username: this.fb.control('', {
    validators: [Validators.required, Validators.minLength(3), noWhitespace],
    asyncValidators: [usernameFree(inject(UserApi))],
    updateOn: 'blur',
  }),
  password: ['', [Validators.required, Validators.minLength(8)]],
  confirm: ['', Validators.required],
}, { validators: passwordsMatch });`.replace('in der Komponente',tx('in der Komponente','in the component')),
