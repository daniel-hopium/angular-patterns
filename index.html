  bad:{code:`export class Profile implements OnInit {
  constructor(
    private http: HttpClient,
    private route: ActivatedRoute,
    @Inject(API_URL) private url: string,
  ) {}

  ngOnInit() {
    // NG0203: no injection context here
    const logger = inject(Logger);
  }
}`,
    note:tx('Konstruktor-Parameter funktionieren weiterhin und sind nicht deprecated – aber Tokens brauchen <code>@Inject()</code>, Unterklassen müssen alles über <code>super()</code> durchreichen, und der neue <code>@Service()</code>-Decorator (Angular 22) unterstützt nur <code>inject()</code>. Und <code>inject()</code> in <code>ngOnInit</code> wirft NG0203.','Constructor parameters still work and aren’t deprecated – but tokens need <code>@Inject()</code>, subclasses have to pass everything through <code>super()</code>, and the new <code>@Service()</code> decorator (Angular 22) only supports <code>inject()</code>. And <code>inject()</code> in <code>ngOnInit</code> throws NG0203.')},
  good:{code:`export class Profile {
  private http = inject(HttpClient);
  private route = inject(ActivatedRoute);
  private apiUrl = inject(API_URL);
  private injector = inject(Injector);

  async openChart() {
    const m = await import('./chart');
    // after await: no context anymore
    runInInjectionContext(this.injector,
      () => m.createChart());
  }
}`,
    note:tx('Alles steht an einer Stelle, Typen kommen aus dem Token, und für Code nach einem <code>await</code> gibt es den gemerkten Injector. Umstellen kannst du automatisch mit <code>ng generate @angular/core:inject</code>.','Everything is in one place, types come from the token, and for code after an <code>await</code> there is the saved injector. You can migrate automatically with <code>ng generate @angular/core:inject</code>.')},
  do:tx(['Abhängigkeiten als Feld-Initialisierer mit <code>inject()</code> holen – typsicher, auch für <code>InjectionToken</code>, ohne <code>@Inject()</code>.','Eigene Helfer wie <code>injectUser()</code> schreiben, die intern <code>inject()</code> nutzen – mit <code>assertInInjectionContext(injectUser)</code> für eine klare Fehlermeldung.','Für Code, der später läuft, den Injector per <code>inject(Injector)</code> merken und <code>runInInjectionContext()</code> nutzen – oder die <code>{ injector }</code>-Option von z. B. <code>effect()</code> und <code>toSignal()</code>.','In funktionalen Guards, Resolvern und Interceptoren direkt <code>inject()</code> aufrufen – Angular führt sie im Injection Context aus.'],
        ['Get dependencies as field initialisers with <code>inject()</code> – type-safe, also for <code>InjectionToken</code>, without <code>@Inject()</code>.','Write your own helpers like <code>injectUser()</code> that use <code>inject()</code> internally – with <code>assertInInjectionContext(injectUser)</code> for a clear error message.','For code that runs later, keep the injector via <code>inject(Injector)</code> and use <code>runInInjectionContext()</code> – or the <code>{ injector }</code> option of e.g. <code>effect()</code> and <code>toSignal()</code>.','Call <code>inject()</code> directly in functional guards, resolvers and interceptors – Angular runs them in an injection context.']),
  dont:tx(['Kein <code>inject()</code> in <code>ngOnInit</code>, Event-Handlern oder in <code>setTimeout</code>- und <code>subscribe</code>-Callbacks.','Kein <code>inject()</code> nach einem <code>await</code> – nur der synchrone Teil vor dem ersten <code>await</code> läuft noch im Context.','Nicht Konstruktor-Parameter und <code>inject()</code> in derselben Klasse mischen – das macht Reihenfolge und Vererbung unübersichtlich.'],
        ['No <code>inject()</code> in <code>ngOnInit</code>, event handlers or <code>setTimeout</code> and <code>subscribe</code> callbacks.','No <code>inject()</code> after an <code>await</code> – only the synchronous part before the first <code>await</code> still runs in the context.','Don’t mix constructor parameters and <code>inject()</code> in the same class – it makes order and inheritance hard to follow.']),
  why:tx('<p><code>inject()</code> ist eine ganz normale Funktion. Sie funktioniert, weil Angular sich in einer globalen Variable merkt, <strong>welcher Injector gerade eine Klasse erzeugt</strong>. Während der Konstruktor und die Feld-Initialisierer laufen, ist diese Variable gesetzt; danach wird sie zurückgesetzt. Genau so ist die Simulation gebaut – darum schlägt alles fehl, was später läuft: <code>ngOnInit</code>, Callbacks und alles nach einem <code>await</code>.</p><p>Der Vorteil gegenüber Konstruktor-Parametern: Die Abhängigkeit steht dort, wo sie gebraucht wird, der Typ kommt aus dem Token, und Funktionen können selbst injizieren. Darum sind Guards, Resolver und Interceptoren heute einfache Funktionen – der Router ruft sie in <code>runInInjectionContext()</code> auf.</p>',
           '<p><code>inject()</code> is a plain function. It works because Angular keeps a global variable with <strong>the injector that is currently creating a class</strong>. While the constructor and field initialisers run, that variable is set; afterwards it’s reset. The simulation is built exactly like that – which is why everything that runs later fails: <code>ngOnInit</code>, callbacks and everything after an <code>await</code>.</p><p>The advantage over constructor parameters: the dependency sits where it’s used, the type comes from the token, and functions can inject by themselves. That’s why guards, resolvers and interceptors are plain functions today – the router calls them inside <code>runInInjectionContext()</code>.</p>'),
  test:{code:`const APP_CONFIG = new InjectionToken<{ apiUrl: string }>('APP_CONFIG');
const API_URL = new InjectionToken<string>('API_URL', {
  factory: () => inject(APP_CONFIG).apiUrl,
});

it('reads the api url from the config', () => {
  TestBed.configureTestingModule({
    providers: [{ provide: APP_CONFIG, useValue: { apiUrl: '/test' } }],
  });
  const url = TestBed.runInInjectionContext(() => inject(API_URL));
  expect(url).toBe('/test');
});`,note:tx('<code>TestBed.runInInjectionContext()</code> testet Funktionen, die <code>inject()</code> nutzen – etwa eigene <code>injectX()</code>-Helfer oder funktionale Guards.','<code>TestBed.runInInjectionContext()</code> tests functions that use <code>inject()</code> – such as your own <code>injectX()</code> helpers or functional guards.')}
});

LESSONS.push({
  id:'resolution-modifiers', cat:'di', order:50,
  title:tx('Suche im Injector-Baum: optional, self, skipSelf, host','Searching the injector tree: optional, self, skipSelf, host'),
  short:tx('Wie Angular einen Provider findet – und wie du den Suchweg einschränkst.','How Angular finds a provider – and how you restrict the search path.'),
  keys:'optional self skipSelf host resolution modifier auflösung injector baum tree element injector environment NullInjector NG0201 @Optional @SkipSelf @Self @Host',
  status:'stable',
  refs:[[tx('Angular-Doku: Auflösungsregeln','Angular docs: Resolution rules'),'https://angular.dev/guide/di/hierarchical-dependency-injection#resolution-rules'],
        [tx('Angular-Doku: Resolution Modifiers','Angular docs: Resolution modifiers'),'https://angular.dev/guide/di/hierarchical-dependency-injection#resolution-modifiers'],
        [tx('API: InjectOptions','API: InjectOptions'),'https://angular.dev/api/core/InjectOptions']],
  rule:tx('Angular sucht einen Provider zuerst <strong>aufwärts durch die Element Injectors</strong> (Element → Eltern-Komponente …), dann im <strong>Environment Injector</strong> (Root) und wirft am Ende NG0201. Mit den Optionen von <code>inject()</code> änderst du Start, Ende und Fehlerverhalten dieser Suche.',
          'Angular looks for a provider first <strong>upwards through the element injectors</strong> (element → parent component …), then in the <strong>environment injector</strong> (root), and finally throws NG0201. With the options of <code>inject()</code> you change the start, the end and the error behaviour of this search.'),
  apis:[['optional','inject(T, { optional: true })',tx('Liefert <code>null</code> statt eines Fehlers. Der Rückgabetyp wird <code>T | null</code>.','Returns <code>null</code> instead of an error. The return type becomes <code>T | null</code>.')],
        ['self','inject(T, { self: true })',tx('Nur der eigene Element Injector – kein Elternteil, kein Root.','Only the own element injector – no parent, no root.')],
        ['skipSelf','inject(T, { skipSelf: true })',tx('Beginnt beim Eltern-Injector, überspringt den eigenen.','Starts at the parent injector, skips the own one.')],
        ['host','inject(T, { host: true })',tx('Endet am Host-Element des Templates, in dem du stehst (dort zählen nur dessen <code>viewProviders</code>). Kein Root.','Stops at the host element of the template you’re in (there only its <code>viewProviders</code> count). No root.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Wer stellt <code>Logger</code> bereit?','Who provides <code>Logger</code>?')}</h3>
    <label class="check-row"><input type="checkbox" id="resolution-modifiers-root" checked> ${tx('Root (<code>@Service()</code>)','Root (<code>@Service()</code>)')}</label>
    <fieldset class="seg"><legend>&lt;app-parent&gt;</legend><div class="seg-opts">
      <label><input type="radio" name="resolution-modifiers-p" value="none"> ${tx('nichts','nothing')}</label>
      <label><input type="radio" name="resolution-modifiers-p" value="providers" checked> providers</label>
      <label><input type="radio" name="resolution-modifiers-p" value="viewProviders"> viewProviders</label></div></fieldset>
    <label class="check-row"><input type="checkbox" id="resolution-modifiers-child" checked> ${tx('&lt;app-child&gt; providers','&lt;app-child&gt; providers')}</label>
  </div>
  <div class="sim-card"><h3>${tx('Anfrage in &lt;app-child&gt;','Request in &lt;app-child&gt;')}</h3>
    <div class="resolution-modifiers-opts">${['optional','self','skipSelf','host'].map(o=>`<label class="check-row"><input type="checkbox" data-o="${o}"> <code>${o}</code></label>`).join('')}</div>
    <pre class="resolution-modifiers-call" id="resolution-modifiers-call"></pre>
    <button type="button" class="btn btn-primary" id="resolution-modifiers-go">${tx('Auflösen','Resolve')}</button>
  </div>
  <div class="sim-card"><h3>${tx('Suchweg','Search path')}</h3>
    <ol class="resolution-modifiers-tree" id="resolution-modifiers-tree"></ol>
    <output class="resolution-modifiers-out" id="resolution-modifiers-out"></output>
  </div>
</div>
<p class="demo-note">${tx('Probier: <code>skipSelf</code> überspringt den eigenen Logger. <code>self</code> ohne Provider im Kind wirft sofort – auch wenn Root einen hat. Stell <code>&lt;app-parent&gt;</code> auf providers und kreuze <code>skipSelf</code> + <code>host</code> an: nichts gefunden, denn am Host zählen nur viewProviders. Und <code>optional</code> macht aus jedem Fehler ein <code>null</code>.','Try: <code>skipSelf</code> skips the own logger. <code>self</code> without a provider in the child throws right away – even though root has one. Set <code>&lt;app-parent&gt;</code> to providers and tick <code>skipSelf</code> + <code>host</code>: nothing found, because at the host only viewProviders count. And <code>optional</code> turns every error into <code>null</code>.')}</p>`,
  init(root){
    const {sleep}=NG;
    let run=0;
    const opt=o=>$(`[data-o="${o}"]`,root).checked;
    const cfg=()=>({root:$('#resolution-modifiers-root',root).checked,parent:$('[name="resolution-modifiers-p"]:checked',root).value,child:$('#resolution-modifiers-child',root).checked});
    const NODES=[['null','NullInjector'],['root',tx('Root (Environment Injector)','Root (environment injector)')],['parent','&lt;app-parent&gt;'],['child','&lt;app-child&gt; ★']];
    const tree=$('#resolution-modifiers-tree',root),out=$('#resolution-modifiers-out',root);
    const drawTree=()=>{const c=cfg();
      const has={null:'',root:c.root?"providedIn: 'root'":'',parent:c.parent==='none'?'':c.parent,child:c.child?'providers':''};
      tree.innerHTML=NODES.map(([k,n])=>`<li class="resolution-modifiers-node" id="resolution-modifiers-n-${k}"><span class="resolution-modifiers-name">${n}</span><span class="resolution-modifiers-has">${has[k]?`Logger · ${has[k]}`:'—'}</span><span class="resolution-modifiers-st" id="resolution-modifiers-s-${k}"></span></li>`).join('');
    };
    const drawCall=()=>{const on=['optional','self','skipSelf','host'].filter(opt);
      $('#resolution-modifiers-call',root).textContent=`logger = inject(Logger${on.length?`, {\n  ${on.map(o=>o+': true').join(',\n  ')}\n}`:''});`};
    /* Suche wie im Angular-Quellcode (getOrCreateInjectable): Element Injectors, dann Environment Injector */
    const resolve=()=>{
      const c=cfg(),self=opt('self'),skip=opt('skipSelf'),host=opt('host'),steps=[];
      const els=[{k:'child',vis:c.child?'providers':null},{k:'parent',vis:c.parent==='none'?null:c.parent}];
      let i=skip?1:0;
      if(skip&&self){steps.push({k:'child',st:'skip'});i=-1}
      else if(skip)steps.push({k:'child',st:'skip'});
      while(i>=0&&i<els.length){
        const e=els[i],atHost=host&&e.k==='parent';
        const found=atHost?e.vis==='viewProviders':!!e.vis;
        steps.push({k:e.k,st:found?'found':'miss',note:atHost&&e.vis==='providers'?tx('nur viewProviders zählen','only viewProviders count'):''});
        if(found)return {steps,from:e.k};
        if(self||atHost)break;
        i++;
      }
      if(self||host){steps.push({k:'root',st:'skip',note:self?tx('self: kein Root','self: no root'):tx('host: kein Root','host: no root')})}
      else{if(c.root){steps.push({k:'root',st:'found'});return {steps,from:'root'}}steps.push({k:'root',st:'miss'});steps.push({k:'null',st:'miss'})}
      return {steps,from:null};
    };
    const LBL={found:tx('gefunden','found'),miss:tx('nicht hier','not here'),skip:tx('übersprungen','skipped')};
    const go=async()=>{
      const my=++run;drawTree();out.textContent='';
      const {steps,from}=resolve(),d=reducedMotion()?0:260;
      for(const s of steps){
        if(my!==run)return;
        const li=$(`#resolution-modifiers-n-${s.k}`,root);li.classList.add(`resolution-modifiers-${s.st}`);
        $(`#resolution-modifiers-s-${s.k}`,root).textContent=LBL[s.st]+(s.note?` – ${s.note}`:'');
        await sleep(d);
      }
      if(my!==run)return;
      const where={child:'<app-child>',parent:'<app-parent>',root:'Root'}[from];
      out.className='resolution-modifiers-out '+(from?'resolution-modifiers-ok':opt('optional')?'':'resolution-modifiers-err');
      out.textContent=from?`→ Logger ${tx('aus','from')} ${where}`:opt('optional')?'→ null':'NG0201: No provider found for `Logger`.';
    };
    const reset=()=>{run++;drawTree();drawCall();out.textContent=''};
    root.addEventListener('change',reset);
    root.addEventListener('click',e=>{if(e.target.closest('#resolution-modifiers-go'))go()});
    reset();
    return ()=>{run++};
  },
  css:`.resolution-modifiers-opts{display:flex;flex-wrap:wrap;gap:0 16px}
.resolution-modifiers-call{margin:8px 0 12px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.45 var(--font-mono);white-space:pre-wrap;min-height:3em}
.resolution-modifiers-tree{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.resolution-modifiers-node{display:grid;gap:2px;padding:8px 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);position:relative}
.resolution-modifiers-node+.resolution-modifiers-node::before{content:"↑";position:absolute;top:-17px;left:18px;color:var(--muted);font-size:.8rem}
.resolution-modifiers-name{font:700 .8125rem/1.3 var(--font-mono)}.resolution-modifiers-has{font-size:.8125rem;color:var(--muted)}
.resolution-modifiers-st{font-size:.8125rem;font-weight:700}
.resolution-modifiers-found{border-color:var(--success);background:var(--success-bg)}.resolution-modifiers-found .resolution-modifiers-st{color:var(--success)}
.resolution-modifiers-miss{border-color:var(--brand);border-style:dashed}.resolution-modifiers-miss .resolution-modifiers-st{color:var(--brand)}
.resolution-modifiers-skip{opacity:.6;border-style:dotted}
.resolution-modifiers-out{display:block;margin-top:12px;font:700 .875rem/1.45 var(--font-mono);min-height:1.5em;overflow-wrap:anywhere}
.resolution-modifiers-ok{color:var(--success)}.resolution-modifiers-err{color:var(--danger)}`,
  bad:{code:`export class TreeNode {
  constructor(
    @Optional() @SkipSelf()
    parent: TreeNode | null,
    @Self() state: TreeState,
  ) {}
}`,
    note:tx('Die Parameter-Decorators funktionieren noch, sind aber der ältere Weg: Den Typ <code>| null</code> musst du selbst richtig schreiben, und in Funktionen (Guards, <code>injectX()</code>-Helfer) gibt es sie gar nicht.','The parameter decorators still work, but they’re the older way: you have to get the <code>| null</code> type right yourself, and they don’t exist in functions (guards, <code>injectX()</code> helpers) at all.')},
  good:{code:`@Component({
  selector: 'app-tree-node',
  providers: [TreeState],
  template: \`… <app-tree-node /> …\`,
})
export class TreeNode {
  // node above me – null at the top
  readonly parent = inject(TreeNode,
    { skipSelf: true, optional: true });
  // must be my own, never a parent's
  readonly state = inject(TreeState,
    { self: true });
  readonly depth: number =
    (this.parent?.depth ?? -1) + 1;
}`,
    note:tx('<code>skipSelf</code> findet den nächsten <code>TreeNode</code> darüber (ohne <code>skipSelf</code> wäre es die Komponente selbst – ein Zirkelbezug). <code>optional</code> gibt der obersten Ebene <code>null</code>, und der Typ passt automatisch.','<code>skipSelf</code> finds the next <code>TreeNode</code> above (without <code>skipSelf</code> it would be the component itself – a circular dependency). <code>optional</code> gives the top level <code>null</code>, and the type fits automatically.')},
  do:tx(['<code>skipSelf</code> + <code>optional</code> für verschachtelte gleiche Komponenten (Baum, Menü, Accordion), die ihr Elternteil brauchen.','<code>self</code>, wenn ein Service zwingend von genau dieser Komponente oder Direktive kommen muss.','Bei <code>optional</code> einen sinnvollen Standard setzen: <code>inject(X, { optional: true }) ?? fallback</code>.','Im Zweifel die Angular DevTools öffnen: Der Injector-Baum zeigt, wer was bereitstellt.'],
        ['<code>skipSelf</code> + <code>optional</code> for nested components of the same kind (tree, menu, accordion) that need their parent.','<code>self</code> when a service must come from exactly this component or directive.','With <code>optional</code>, set a sensible default: <code>inject(X, { optional: true }) ?? fallback</code>.','When in doubt, open Angular DevTools: the injector tree shows who provides what.']),
  dont:tx(['<code>optional</code> nicht als Pflaster für vergessene Provider nutzen – der Fehler NG0201 ist dann ein Hinweis, kein Problem.','Nicht erwarten, dass <code>self</code> oder <code>host</code> auf den Root-Injector zurückfallen – das tun sie nie.','<code>host</code> nicht mit den normalen <code>providers</code> des Hosts kombinieren und auf einen Treffer hoffen – am Host zählen nur <code>viewProviders</code>.'],
        ['Don’t use <code>optional</code> to patch over a forgotten provider – NG0201 is a hint then, not the problem.','Don’t expect <code>self</code> or <code>host</code> to fall back to the root injector – they never do.','Don’t combine <code>host</code> with the host’s normal <code>providers</code> and hope for a hit – at the host only <code>viewProviders</code> count.']),
  why:tx('<p>Angular hat zwei Hierarchien: die <strong>Element Injectors</strong> entlang des DOM-Baums (für <code>providers</code> und <code>viewProviders</code> von Komponenten und Direktiven) und die <strong>Environment Injectors</strong> (Root, Routen). Eine Anfrage wandert erst die Element-Kette hinauf und springt dann in den Environment Injector. Findet auch der nichts, meldet der <code>NullInjector</code> NG0201.</p><p>Die Optionen greifen genau in diese Schleife ein: <code>skipSelf</code> verschiebt den Start um eins nach oben, <code>self</code> bricht nach dem ersten Schritt ab, <code>host</code> nach dem Host-Element des aktuellen Templates – und beide verhindern den Sprung in den Environment Injector. <code>optional</code> ändert nur das Ende: <code>null</code> statt Fehler. Die Simulation folgt dieser Logik aus dem Angular-Quellcode.</p>',
           '<p>Angular has two hierarchies: the <strong>element injectors</strong> along the DOM tree (for <code>providers</code> and <code>viewProviders</code> of components and directives) and the <strong>environment injectors</strong> (root, routes). A request first walks up the element chain and then jumps into the environment injector. If that finds nothing either, the <code>NullInjector</code> reports NG0201.</p><p>The options hook into exactly this loop: <code>skipSelf</code> moves the start one level up, <code>self</code> stops after the first step, <code>host</code> after the host element of the current template – and both prevent the jump into the environment injector. <code>optional</code> only changes the end: <code>null</code> instead of an error. The simulation follows this logic from the Angular source code.</p>')
});

LESSONS.push({
  id:'provided-in-root', cat:'di', order:20,
  title:tx('Singletons mit @Service() und providedIn: \'root\'','Singletons with @Service() and providedIn: \'root\''),
  short:tx('App-weite Services meldet der Service selbst an – das ergibt ein Singleton und Tree-Shaking.','App-wide services register themselves – that gives you a singleton and tree-shaking.'),
  keys:'providedIn root service singleton tree-shaking treeshaking injectable bundle @Service injectAsync',

        [tx('Angular-Doku: Wie Services verfügbar werden','Angular docs: How services become available'),'https://angular.dev/guide/di/creating-and-using-services#how-services-become-available'],
        [tx('API: Service','API: Service'),'https://angular.dev/api/core/Service']],
  rule:tx('Ein Service, den die ganze App teilt, meldet sich <strong>selbst</strong> an: mit <code>@Service()</code> (neu in Angular 22) oder <code>@Injectable({ providedIn: \'root\' })</code>. Dann gibt es genau eine Instanz im Root-Injector, sie entsteht erst beim ersten <code>inject()</code> – und fliegt beim Build ganz raus, wenn niemand sie injiziert.',
          'A service the whole app shares registers <strong>itself</strong>: with <code>@Service()</code> (new in Angular 22) or <code>@Injectable({ providedIn: \'root\' })</code>. Then there is exactly one instance in the root injector, it’s only created on the first <code>inject()</code> – and it’s dropped from the build entirely if nobody injects it.'),
  apis:[['@Service()','@Service({ autoProvided?, factory? })',tx('Neu in Angular 22: Kurzform für <code>@Injectable({ providedIn: \'root\' })</code>. Unterstützt nur <code>inject()</code>, keine Konstruktor-Parameter. Mit <code>autoProvided: false</code> musst du ihn selbst bereitstellen.','New in Angular 22: shorthand for <code>@Injectable({ providedIn: \'root\' })</code>. Only supports <code>inject()</code>, no constructor parameters. With <code>autoProvided: false</code> you have to provide it yourself.')],
        ['@Injectable','@Injectable({ providedIn: \'root\' })',tx('Der bisherige Weg, gleiche Wirkung. Weiterhin nötig für <code>useClass</code>/<code>useFactory</code> im Decorator.','The previous way, same effect. Still needed for <code>useClass</code>/<code>useFactory</code> in the decorator.')],
        ['injectAsync()','injectAsync(() => import(…), { prefetch? })',tx('Neu in Angular 22: einen großen, automatisch bereitgestellten Service erst bei Bedarf nachladen. Liefert eine Funktion, die ein Promise der Instanz zurückgibt.','New in Angular 22: lazy-load a large auto-provided service only when needed. Returns a function that returns a promise of the instance.')]],

<div class="sim-grid provided-in-root-two">
  <div class="sim-card"><h3>&lt;app-header&gt;</h3><p class="provided-in-root-line" id="provided-in-root-a"></p><button type="button" class="btn btn-secondary" data-add="a">${tx('Artikel +1','Item +1')}<span class="sr-only"> (app-header)</span></button></div>

    <ul class="sim-log provided-in-root-log" id="provided-in-root-log" aria-label="${tx('Protokoll','Log')}"></ul></div>
</div>
<p class="demo-note">${tx('Probier: Nimm bei <code>PdfExportService</code> den Haken weg – mit <code>@Service()</code> verschwindet er aus dem Bundle, im providers-Array bleibt er drin. Unten teilen sich beide Komponenten dieselbe Instanz <code>CartService#1</code>, auch wenn du sie neu erzeugst.','Try: untick <code>PdfExportService</code> – with <code>@Service()</code> it disappears from the bundle, in the providers array it stays. Below, both components share the same <code>CartService#1</code> instance, even when you recreate them.')}</p>`,
  init(root){
    const {log,flash}=NG,D=NGDI;D.reset();
    const SVC=[{n:'CartService',kb:4,used:true},{n:'AnalyticsService',kb:18,used:true},{n:'PdfExportService',kb:120,used:true},{n:'LegacyReportService',kb:36,used:false}];
    let mode='root';
    const box=$('#provided-in-root-svcs',root);
    box.innerHTML=SVC.map((s,i)=>`<label class="check-row"><input type="checkbox" data-i="${i}" ${s.used?'checked':''} ${i===0?'disabled':''}> <code>${s.n}</code> <span class="hint">${s.kb} kB</span></label>`).join('');
    const render=()=>{
      let kb=0;
      $('#provided-in-root-bundle',root).innerHTML=SVC.map(s=>{
        const inB=mode==='array'||s.used;if(inB)kb+=s.kb;
        const why=s.used?tx('injiziert','injected'):mode==='array'?tx('im providers-Array referenziert','referenced in the providers array'):tx('entfernt (Tree-Shaking)','removed (tree-shaking)');
        return `<li class="${inB?'':'provided-in-root-gone'}"><code>${s.n}</code> <span>${inB?s.kb+' kB':'—'}</span><small>${why}</small></li>`;
      }).join('');
      $('#provided-in-root-kb',root).textContent=`${kb} kB`;
    };
    root.addEventListener('change',e=>{
      if(e.target.name==='provided-in-root-mode'){mode=e.target.value;render()}
      if(e.target.dataset.i){SVC[+e.target.dataset.i].used=e.target.checked;render()}
    });
    render();
    /* Singleton: zwei Komponenten, ein Root-Injector */
    const ul=$('#provided-in-root-log',root);
    const on=ev=>{
      if(ev.type==='auto')log(ul,`<span class="t">Root</span> ${tx('kennt','knows')} ${ev.token} (providedIn: 'root')`);
      if(ev.type==='create')log(ul,`<span class="hl">${tx('erzeugt','creates')}</span> ${esc(D.label(ev.value))} – ${tx('beim ersten inject()','on the first inject()')}`);
      if(ev.type==='hit')log(ul,`<span class="t">${tx('gleiche Instanz','same instance')}</span> ${esc(D.label(ev.value))}`);
    };
    const inj=D.injector('Root',[],null,{root:true,on});
    const Cart=D.service('CartService',{providedIn:'root',init:v=>{v.items=0}});
    let cmps={};
    const make=()=>{
      ['a','b'].forEach(k=>{log(ul,`<span class="t">new</span> ${k==='a'?'Header':'CartPage'}()`);cmps[k]={cart:D.runIn(inj,()=>D.inject(Cart))}});
      paint();
    };
    const paint=()=>['a','b'].forEach(k=>{const c=cmps[k].cart;$(`#provided-in-root-${k}`,root).innerHTML=`<code>${esc(D.label(c))}</code> · ${tx(`${c.items} Artikel`,`${c.items} item${c.items===1?'':'s'}`)}`});
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-add]');
      if(b){cmps[b.dataset.add].cart.items++;paint();['a','b'].forEach(k=>flash($(`#provided-in-root-${k}`,root)))}
      if(e.target.closest('#provided-in-root-recreate'))make();
    });
    make();
  },
  css:`.provided-in-root-q{margin:14px 0 4px}.provided-in-root-bundle{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.provided-in-root-bundle li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:var(--radius-sm)}

.provided-in-root-total{margin:12px 0 0;font-size:1.0625rem}.provided-in-root-two{margin-top:16px}
.provided-in-root-line{margin:0 0 10px;padding:4px 8px;border-radius:var(--radius-sm)}.provided-in-root-line.flash{background:var(--brand-soft)}
.provided-in-root-log{margin-top:10px}`,
  bad:{code:`@Injectable()
export class CartService { … }

// app.config.ts
export const appConfig = {

  ],

    note:tx('Alles im providers-Array landet im Bundle, auch wenn es nie injiziert wird. Und wer <code>CartService</code> zusätzlich in die <code>providers</code> einer Komponente schreibt, bekommt still eine zweite Instanz.','Everything in the providers array ends up in the bundle, even if it’s never injected. And whoever also adds <code>CartService</code> to a component’s <code>providers</code> silently gets a second instance.')},
  good:{code:`@Service()
export class CartService {
  private http = inject(HttpClient);
  readonly items = signal<Item[]>([]);
}

// before Angular 22 – same effect:
@Injectable({ providedIn: 'root' })
export class CartService { … }`,
    note:tx('Kein Eintrag im providers-Array nötig. Die Instanz entsteht beim ersten <code>inject()</code> und wird geteilt; ungenutzte Services entfernt der Build. Umstellen: <code>ng generate @angular/core:service</code>.','No entry in the providers array needed. The instance is created on the first <code>inject()</code> and shared; unused services are removed by the build. To migrate: <code>ng generate @angular/core:service</code>.')},
  do:tx(['App-weite Services mit <code>@Service()</code> (ab Angular 22) oder <code>providedIn: \'root\'</code> anmelden – die CLI erzeugt das so.','Zustand, den mehrere Komponenten teilen, als Signals in so einen Service legen.','Große, selten gebrauchte Services mit <code>injectAsync()</code> erst bei Bedarf laden (Angular 22).','Nur dann ins providers-Array (oder <code>autoProvided: false</code>), wenn du die Instanz bewusst an einen Bereich binden willst – siehe nächste Lektionen.'],
        ['Register app-wide services with <code>@Service()</code> (from Angular 22) or <code>providedIn: \'root\'</code> – that’s what the CLI generates.','Put state that several components share into such a service as signals.','Load large, rarely used services on demand with <code>injectAsync()</code> (Angular 22).','Only use a providers array (or <code>autoProvided: false</code>) if you deliberately want to bind the instance to a scope – see the next lessons.']),
  dont:tx(['App-weite Services nicht zusätzlich in <code>providers</code> von Komponenten eintragen – das erzeugt eine zweite, getrennte Instanz.','Nicht <code>providedIn: \'any\'</code> oder ein NgModule als <code>providedIn</code> verwenden – beides ist deprecated.','Nicht erwarten, dass <code>@Service()</code> Konstruktor-Parameter auflöst – dort gibt es nur <code>inject()</code>.'],
        ['Don’t also list app-wide services in a component’s <code>providers</code> – that creates a second, separate instance.','Don’t use <code>providedIn: \'any\'</code> or an NgModule as <code>providedIn</code> – both are deprecated.','Don’t expect <code>@Service()</code> to resolve constructor parameters – it only supports <code>inject()</code>.']),
  why:tx('<p><code>providedIn: \'root\'</code> dreht die Richtung der Referenz um: Nicht die App-Konfiguration zeigt auf den Service, sondern der Service trägt selbst die Information „ich gehöre in den Root-Injector“. Importiert keine Datei die Klasse, gibt es keine Referenz – und der Bundler kann sie weglassen (<strong>Tree-Shaking</strong>). Ein Eintrag im providers-Array ist dagegen immer eine Referenz.</p><p>Der Root-Injector legt die Instanz <strong>lazy</strong> beim ersten <code>inject()</code> an und hebt sie für die Lebensdauer der App auf. Darum sehen alle Komponenten – auch in lazy geladenen Routen – dieselben Daten. <code>@Service()</code> ist dafür nur die kürzere Schreibweise; es verlangt aber <code>inject()</code> statt Konstruktor-Parametern.</p>',
           '<p><code>providedIn: \'root\'</code> reverses the direction of the reference: the app config doesn’t point to the service – the service itself carries the information “I belong in the root injector”. If no file imports the class, there’s no reference – and the bundler can drop it (<strong>tree-shaking</strong>). An entry in the providers array, however, is always a reference.</p><p>The root injector creates the instance <strong>lazily</strong> on the first <code>inject()</code> and keeps it for the lifetime of the app. That’s why all components – also in lazy-loaded routes – see the same data. <code>@Service()</code> is just the shorter spelling; it does require <code>inject()</code> instead of constructor parameters.</p>'),
  test:{code:`it('shares one instance', () => {
  const a = TestBed.inject(CartService);
  const b = TestBed.inject(CartService);
  expect(a).toBe(b);
});`,note:tx('Jeder Test bekommt einen frischen TestBed-Injector – das Singleton lebt also nur innerhalb eines Tests.','Each test gets a fresh TestBed injector – so the singleton only lives within one test.')}
});

LESSONS.push({
  id:'injection-tokens', cat:'di', order:30,
  title:tx('InjectionToken und Provider-Rezepte','InjectionToken and provider recipes'),
  short:tx('useClass, useExisting, useFactory, useValue – und typisierte Tokens für alles, was keine Klasse ist.','useClass, useExisting, useFactory, useValue – and typed tokens for everything that isn’t a class.'),
  keys:'InjectionToken token provider useClass useExisting useFactory useValue alias factory config konfiguration abstract class',
  since:'Angular 4', status:'stable',
  refs:[[tx('Angular-Doku: Was ist ein InjectionToken?','Angular docs: What is an InjectionToken?'),'https://angular.dev/guide/di/defining-dependency-providers#what-is-an-injectiontoken'],
        [tx('Angular-Doku: useExisting','Angular docs: useExisting'),'https://angular.dev/guide/di/defining-dependency-providers#useexisting'],
        [tx('API: InjectionToken','API: InjectionToken'),'https://angular.dev/api/core/InjectionToken']],
  rule:tx('Ein Provider sagt: „Wer <em>dieses Token</em> will, bekommt <em>das</em>.“ Für Werte ohne Klasse (URLs, Konfiguration, Funktionen) nimm ein typisiertes <code>InjectionToken</code>. Und merk dir den wichtigsten Unterschied: <code>useClass</code> erzeugt eine <strong>neue</strong> Instanz, <code>useExisting</code> ist nur ein <strong>Alias</strong> auf eine vorhandene.',
          'A provider says: “Whoever wants <em>this token</em> gets <em>that</em>.” For values without a class (URLs, configuration, functions) use a typed <code>InjectionToken</code>. And remember the key difference: <code>useClass</code> creates a <strong>new</strong> instance, <code>useExisting</code> is just an <strong>alias</strong> for an existing one.'),
  apis:[['InjectionToken','new InjectionToken<T>(desc, { factory? })',tx('Typisiertes Token für Nicht-Klassen. Mit <code>factory</code> ist es automatisch im Root-Injector bereitgestellt (mit Standardwert) und tree-shakable.','Typed token for non-classes. With <code>factory</code> it’s automatically provided in the root injector (with a default value) and tree-shakable.')],
        ['useClass','{ provide, useClass }',tx('Erzeugt in diesem Injector eine eigene Instanz der Klasse.','Creates its own instance of the class in this injector.')],
        ['useExisting','{ provide, useExisting }',tx('Alias: liefert, was das andere Token liefert – dieselbe Instanz.','Alias: returns whatever the other token returns – the same instance.')],
        ['useFactory','{ provide, useFactory }',tx('Ruft die Funktion einmal pro Injector auf – im Injection Context, darf also <code>inject()</code> nutzen.','Calls the function once per injector – in an injection context, so it may use <code>inject()</code>.')],
        ['useValue','{ provide, useValue }',tx('Nimmt den Wert, wie er ist – Konfiguration oder ein Mock im Test.','Takes the value as is – configuration or a mock in a test.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>app.config.ts</h3>
    <fieldset class="seg"><legend>${tx('Provider für <code>Logger</code>','Provider for <code>Logger</code>')}</legend><div class="seg-opts">
      <label><input type="radio" name="injection-tokens-r" value="useClass" checked> useClass</label>
      <label><input type="radio" name="injection-tokens-r" value="useExisting"> useExisting</label>
      <label><input type="radio" name="injection-tokens-r" value="useFactory"> useFactory</label>
      <label><input type="radio" name="injection-tokens-r" value="useValue"> useValue</label></div></fieldset>
    <pre class="injection-tokens-code" id="injection-tokens-code"></pre>
    <label class="check-row"><input type="checkbox" id="injection-tokens-url"> ${tx('<code>API_URL</code> überschreiben','Override <code>API_URL</code>')}</label>
    <p class="hint">${tx('<code>ConsoleLogger</code> ist <code>@Service()</code>, <code>API_URL</code> hat eine <code>factory</code> mit <code>\'/api\'</code>.','<code>ConsoleLogger</code> is a <code>@Service()</code>, <code>API_URL</code> has a <code>factory</code> returning <code>\'/api\'</code>.')}</p>
  </div>
  <div class="sim-card"><h3>${tx('Eine Komponente injiziert','A component injects')}</h3>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="injection-tokens-go">${tx('Alle drei injizieren','Inject all three')}</button><button type="button" class="btn btn-ghost" id="injection-tokens-restart">${tx('App neu starten','Restart app')}</button></div>
    <dl class="injection-tokens-res" id="injection-tokens-res" aria-live="polite"></dl>
    <ul class="sim-log" id="injection-tokens-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Bei <code>useClass</code> gibt es zwei verschiedene Logger (<code>#1</code> und <code>#2</code>), bei <code>useExisting</code> nur einen. Klick mehrmals auf „Alle drei injizieren“: Die Factory läuft trotzdem nur einmal. Und schau, was mit <code>API_URL</code> passiert, wenn du sie überschreibst.','Try: with <code>useClass</code> there are two different loggers (<code>#1</code> and <code>#2</code>), with <code>useExisting</code> only one. Click “Inject all three” several times: the factory still runs only once. And watch what happens to <code>API_URL</code> when you override it.')}</p>`,
  init(root){
    const {log,flash}=NG,D=NGDI;
    const ul=$('#injection-tokens-log',root);
    const Logger=D.token('Logger'),ConsoleLogger=D.service('ConsoleLogger',{providedIn:'root'});
    const API_URL=D.token('API_URL',{factory:()=>'/api'});
    const CODE={useClass:`{ provide: Logger,
  useClass: ConsoleLogger }`,useExisting:`{ provide: Logger,
  useExisting: ConsoleLogger }`,useFactory:`{ provide: Logger,
  useFactory: () => isDevMode()
    ? new ConsoleLogger()
    : new RemoteLogger() }`,useValue:`{ provide: Logger,
  useValue: { log: () => {} } }`};
    let recipe='useClass',inj,calls=0;
    const on=ev=>{
      if(ev.type==='auto')log(ul,`<span class="t">Root</span> ${tx('stellt bereit','provides')} ${ev.token} ${ev.token==='API_URL'?'(factory)':"(providedIn: 'root')"}`);
      if(ev.type==='create')log(ul,`<span class="hl">${tx('erzeugt','creates')}</span> ${esc(D.label(ev.value))} ${tx('für','for')} ${ev.token}`);
      if(ev.type==='alias')log(ul,`<span class="hl">${tx('Alias','alias')}</span> ${ev.token} → ${ev.to}`);
      if(ev.type==='factory')log(ul,`<span class="hl">${tx('Factory liefert','factory returns')}</span> ${ev.token} = ${esc(D.label(ev.value))}`);
      if(ev.type==='value')log(ul,`<span class="hl">useValue</span> ${ev.token} = ${esc(D.label(ev.value))}`);
      if(ev.type==='hit')log(ul,`<span class="t">${tx('aus dem Cache','from cache')}</span> ${ev.token} = ${esc(D.label(ev.value))}`);
    };
    const boot=()=>{
      D.reset();calls=0;
      const p={useClass:{provide:Logger,useClass:ConsoleLogger},useExisting:{provide:Logger,useExisting:ConsoleLogger},
        useFactory:{provide:Logger,useFactory:()=>{calls++;return D.instance('ConsoleLogger')}},
        useValue:{provide:Logger,useValue:{__label:'{ log: ƒ }'}}}[recipe];
      const ps=[p];
      if($('#injection-tokens-url',root).checked)ps.push({provide:API_URL,useValue:'https://api.example.com'});
      inj=D.injector('Root',ps,null,{root:true,on});
      $('#injection-tokens-code',root).textContent=CODE[recipe]+($('#injection-tokens-url',root).checked?`,
{ provide: API_URL,
  useValue: 'https://api.example.com' }`:'');
      $('#injection-tokens-res',root).innerHTML='';
      log(ul,`<span class="t">— ${tx('App gestartet','app started')} (${recipe}) —</span>`);
    };
    const go=()=>{
      const a=inj.get(Logger),b=inj.get(ConsoleLogger),u=inj.get(API_URL);
      const same=a===b,n=inj.created.length+calls;
      $('#injection-tokens-res',root).innerHTML=`<dt>inject(Logger)</dt><dd>${esc(D.label(a))}</dd><dt>inject(ConsoleLogger)</dt><dd>${esc(D.label(b))}</dd>
<dt>${tx('dieselbe Instanz?','same instance?')}</dt><dd class="${same?'injection-tokens-yes':'injection-tokens-no'}">${same?tx('ja','yes'):tx('nein','no')}</dd>
<dt>${tx('Logger-Instanzen','logger instances')}</dt><dd>${n}</dd><dt>inject(API_URL)</dt><dd>'${esc(u)}'</dd>${recipe==='useFactory'?`<dt>${tx('Factory-Aufrufe','factory calls')}</dt><dd>${calls}</dd>`:''}`;
      flash($('#injection-tokens-res',root));
    };
    root.addEventListener('change',e=>{
      if(e.target.name==='injection-tokens-r'){recipe=e.target.value;boot()}
      if(e.target.id==='injection-tokens-url')boot();
    });
    root.addEventListener('click',e=>{
      if(e.target.closest('#injection-tokens-go'))go();
      if(e.target.closest('#injection-tokens-restart'))boot();
    });
    boot();
  },
  css:`.injection-tokens-code{margin:12px 0 4px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.45 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:5.5em}

  bad:{code:`interface AppConfig { apiUrl: string }

providers: [

  { provide: Logger,

constructor(

    note:tx('String-Tokens sind untypisiert, können kollidieren und werden von <code>inject()</code> nicht akzeptiert; ein Interface kann gar kein Token sein (zur Laufzeit weg). Und <code>useClass</code> erzeugt einen zweiten <code>ConsoleLogger</code> neben dem aus dem Root – zwei Zustände, schwer zu findende Bugs.','String tokens are untyped, can collide and aren’t accepted by <code>inject()</code>; an interface can’t be a token at all (it’s gone at runtime). And <code>useClass</code> creates a second <code>ConsoleLogger</code> next to the root one – two states, hard-to-find bugs.')},
  good:{code:`export abstract class Logger {
  abstract log(msg: string): void;
}
export const API_URL =
  new InjectionToken<string>('API_URL', {
    factory: () => '/api',
  });

// app.config.ts
providers: [
  { provide: Logger,
    useExisting: ConsoleLogger },
  { provide: API_URL,
    useValue: environment.api },
]

// in a component
logger = inject(Logger);
apiUrl = inject(API_URL); // string`,
    note:tx('Eine abstrakte Klasse ist Token und Typ zugleich. <code>useExisting</code> leitet auf die vorhandene Instanz um. Das Token hat einen Standardwert und ist trotzdem überschreibbar.','An abstract class is token and type at once. <code>useExisting</code> redirects to the existing instance. The token has a default value and can still be overridden.')},
  do:tx(['Für Konfiguration, URLs und Funktionen ein <code>InjectionToken&lt;T&gt;</code> anlegen – mit <code>factory</code>, wenn es einen sinnvollen Standardwert gibt.','Als Token für austauschbare Implementierungen eine <code>abstract class</code> nehmen – sie existiert zur Laufzeit.','<code>useExisting</code>, wenn zwei Tokens auf <em>dieselbe</em> Instanz zeigen sollen.','<code>useValue</code> für Mocks im Test: <code>{ provide: Logger, useValue: { log: vi.fn() } }</code>.'],
        ['Create an <code>InjectionToken&lt;T&gt;</code> for configuration, URLs and functions – with <code>factory</code> if there’s a sensible default value.','Use an <code>abstract class</code> as the token for exchangeable implementations – it exists at runtime.','<code>useExisting</code> when two tokens should point to the <em>same</em> instance.','<code>useValue</code> for mocks in tests: <code>{ provide: Logger, useValue: { log: vi.fn() } }</code>.']),
  dont:tx(['Keine String-Tokens (<code>\'config\'</code>) – untypisiert, kollisionsanfällig, nicht mit <code>inject()</code> nutzbar.','Kein Interface als Token – TypeScript-Interfaces verschwinden beim Kompilieren.','Nicht <code>useClass</code> nehmen, wenn du eigentlich ein Alias willst – sonst gibt es zwei Instanzen mit getrenntem Zustand.'],
        ['No string tokens (<code>\'config\'</code>) – untyped, collision-prone, not usable with <code>inject()</code>.','No interface as a token – TypeScript interfaces vanish when compiling.','Don’t use <code>useClass</code> when you actually want an alias – otherwise there are two instances with separate state.']),
  why:tx('<p>Der Injector ist eine Map von <strong>Token</strong> zu <strong>Rezept</strong>. Das Token ist der Schlüssel – eine Klasse, eine abstrakte Klasse oder ein <code>InjectionToken</code>, also immer ein Objekt, das es zur Laufzeit gibt. Beim ersten Zugriff führt der Injector das Rezept aus und merkt sich das Ergebnis; weitere <code>inject()</code>-Aufrufe bekommen denselben Wert.</p><p><code>useClass</code> ist ein Rezept „baue diese Klasse“ – der Injector baut sie für dieses Token, unabhängig davon, ob dieselbe Klasse schon unter ihrem eigenen Token existiert. <code>useExisting</code> dagegen ist „frag nach dem anderen Token“ und landet so bei derselben Instanz. Das ist der Grund für die zwei Logger in der Simulation.</p>',
           '<p>The injector is a map from <strong>token</strong> to <strong>recipe</strong>. The token is the key – a class, an abstract class or an <code>InjectionToken</code>, so always an object that exists at runtime. On first access the injector runs the recipe and remembers the result; further <code>inject()</code> calls get the same value.</p><p><code>useClass</code> is a recipe “build this class” – the injector builds it for this token, regardless of whether the same class already exists under its own token. <code>useExisting</code>, on the other hand, means “ask for the other token” and so ends up with the same instance. That’s the reason for the two loggers in the simulation.</p>'),
  test:{code:`it('uses the overridden API url', () => {
  TestBed.configureTestingModule({
    providers: [{ provide: API_URL, useValue: '/mock' }],
  });
  expect(TestBed.inject(API_URL)).toBe('/mock');
});`,note:tx('Tokens mit <code>useValue</code> zu überschreiben ist der einfachste Weg, Konfiguration im Test auszutauschen.','Overriding tokens with <code>useValue</code> is the simplest way to swap configuration in a test.')}
});

LESSONS.push({
  id:'cva', cat:'forms', order:50,
  title:tx('Eigenes Formularfeld mit ControlValueAccessor','Custom form control with ControlValueAccessor'),
  short:tx('Eine Sternebewertung, die mit formControlName funktioniert: vier Methoden als Vertrag zwischen Komponente und Forms-API.','A star rating that works with formControlName: four methods as the contract between component and forms API.'),
  keys:'ControlValueAccessor NG_VALUE_ACCESSOR writeValue registerOnChange registerOnTouched setDisabledState custom control eigenes feld rating sterne FormValueControl',
  status:'stable',
  refs:[[tx('API: ControlValueAccessor','API: ControlValueAccessor'),'https://angular.dev/api/forms/ControlValueAccessor'],
        [tx('Angular-Doku: Custom Controls für Signal Forms','Angular docs: Custom controls for signal forms'),'https://angular.dev/guide/forms/signals/custom-controls#formvaluecontrol']],
  rule:tx('Damit eine eigene Komponente mit <code>formControlName</code>, <code>[formControl]</code> oder <code>ngModel</code> funktioniert, implementiert sie <code>ControlValueAccessor</code> und registriert sich als <code>NG_VALUE_ACCESSOR</code>. Angular schreibt über <code>writeValue()</code> hinein; die Komponente meldet Änderungen über die registrierte <code>onChange</code>-Funktion und „fertig“ über <code>onTouched</code>. Für Signal Forms gibt es mit <code>FormValueControl</code> einen einfacheren Vertrag.','For a custom component to work with <code>formControlName</code>, <code>[formControl]</code> or <code>ngModel</code>, it implements <code>ControlValueAccessor</code> and registers as <code>NG_VALUE_ACCESSOR</code>. Angular writes in via <code>writeValue()</code>; the component reports changes through the registered <code>onChange</code> function and “done” through <code>onTouched</code>. For signal forms there’s a simpler contract, <code>FormValueControl</code>.'),
  apis:[['writeValue(v)','writeValue(obj: any): void',tx('Form → Komponente: neuer Wert von außen (Start, <code>setValue</code>, <code>reset</code>). Hier <strong>nicht</strong> <code>onChange</code> aufrufen.','Form → component: new value from outside (start, <code>setValue</code>, <code>reset</code>). Do <strong>not</strong> call <code>onChange</code> here.')],
        ['registerOnChange(fn)','registerOnChange(fn: any): void',tx('Komponente → Form: <code>fn(wert)</code> aufrufen, wenn der Nutzer etwas ändert.','Component → form: call <code>fn(value)</code> when the user changes something.')],
        ['registerOnTouched(fn)','registerOnTouched(fn: any): void',tx('<code>fn()</code> beim Verlassen (blur) aufrufen – setzt <code>touched</code>.','Call <code>fn()</code> on leaving (blur) – sets <code>touched</code>.')],
        ['setDisabledState?(d)','setDisabledState?(isDisabled: boolean): void',tx('Optional; wird beim Anbinden und bei <code>disable()</code>/<code>enable()</code> aufgerufen.','Optional; called on attach and on <code>disable()</code>/<code>enable()</code>.')],
        ['NG_VALUE_ACCESSOR','{ provide: NG_VALUE_ACCESSOR, useExisting: forwardRef(() => Rating), multi: true }',tx('Macht die Komponente für die Forms-Direktiven auffindbar.','Makes the component discoverable for the forms directives.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Bewertungsformular','Review form')}</h3>
    <fieldset class="cva-rating" id="cva-rating"><legend>${tx('Wie war’s?','How was it?')} <span class="opt">&lt;app-rating formControlName="rating"&gt;</span></legend>
      <div class="cva-stars">${[1,2,3,4,5].map(n=>`<label class="cva-star"><input type="radio" name="cva-r" value="${n}"><span aria-hidden="true">★</span><span class="sr-only">${tx(`${n} von 5 Sternen`,`${n} of 5 stars`)}</span></label>`).join('')}</div>
    </fieldset>
    <p class="cva-state" id="cva-state"></p>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="cva-set">rating.setValue(4)</button><button type="button" class="btn btn-secondary" id="cva-dis">rating.disable()</button><button type="button" class="btn btn-secondary" id="cva-reset">form.reset()</button></div>
  </div>
  <div class="sim-card"><h3>${tx('Aufrufe zwischen Form und Komponente','Calls between form and component')}</h3>
    <ul class="sim-log cva-log" id="cva-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Wähl einen Stern (Klick oder Pfeiltasten) – die Komponente ruft <code>onChange(3)</code>, das Control wird dirty. Verlass die Gruppe mit Tab: <code>onTouched()</code>. Die Buttons gehen den anderen Weg: <code>writeValue()</code> bzw. <code>setDisabledState()</code>. Beim Anbinden hat Angular schon <code>writeValue</code>, <code>setDisabledState(false)</code> und beide <code>register…</code> aufgerufen.','Try: pick a star (click or arrow keys) – the component calls <code>onChange(3)</code>, the control becomes dirty. Leave the group with Tab: <code>onTouched()</code>. The buttons go the other way: <code>writeValue()</code> or <code>setDisabledState()</code>. On attach, Angular already called <code>writeValue</code>, <code>setDisabledState(false)</code> and both <code>register…</code>.')}</p>`,
  init(root){
    const {FormControl,FormGroup,statusHTML,flags}=RF;
    const {log}=NG;
    const ul=$('#cva-log',root),fs=$('#cva-rating',root),radios=$$('input[name="cva-r"]',root);
    const L=(dir,html)=>log(ul,`<span class="t">${dir==='in'?tx('Form → Komponente','form → component'):tx('Komponente → Form','component → form')}</span> ${html}`);
    /* Die Komponente – implementiert ControlValueAccessor */
    const rating={
      value:null,disabled:false,onChange:()=>{},onTouched:()=>{},
      writeValue(v){L('in',`writeValue(<span class="hl">${v}</span>)`);this.value=v;this.paint()},
      registerOnChange(fn){L('in','registerOnChange(fn)');this.onChange=fn},
      registerOnTouched(fn){L('in','registerOnTouched(fn)');this.onTouched=fn},
      setDisabledState(d){L('in',`setDisabledState(<span class="hl">${d}</span>)`);this.disabled=d;this.paint()},
      select(n){this.value=n;L('out',`onChange(<span class="hl">${n}</span>)`);this.onChange(n);this.paint()},
      paint(){radios.forEach(r=>{r.checked=+r.value===this.value});fs.disabled=this.disabled;fs.style.setProperty('--cva-n',this.value||0)}
    };
    /* Die Forms-Seite – so verbindet Angular Control und Accessor (setUpControl) */
    const control=new FormControl(null);
    const form=new FormGroup({rating:control});
    control._toView=v=>rating.writeValue(v);
    rating.writeValue(control.value);
    rating.setDisabledState(control.disabled);                      // callSetDisabledState: 'always'
    rating.registerOnChange(v=>{control.markAsDirty({emitEvent:false});control.setValue(v,{emitModelToViewChange:false})});
    rating.registerOnTouched(()=>control.markAsTouched());
    const render=()=>{$('#cva-state',root).innerHTML=`rating = <b>${control.value}</b> ${statusHTML(control)} ${flags(control)}`;$('#cva-dis',root).textContent=control.disabled?'rating.enable()':'rating.disable()'};
    const off=form.watch(render);render();
    radios.forEach(r=>r.addEventListener('change',()=>rating.select(+r.value)));
    fs.addEventListener('focusout',e=>{if(!fs.contains(e.relatedTarget)){L('out','onTouched()');rating.onTouched()}});
    root.addEventListener('click',e=>{
      if(e.target.closest('#cva-set'))control.setValue(4);
      if(e.target.closest('#cva-dis')){const was=control.disabled;if(was)control.enable();else control.disable();rating.setDisabledState(!was)}
      if(e.target.closest('#cva-reset'))form.reset();
      render();
    });
    return off;
  },
  css:`.cva-rating{border:0;padding:0;margin:0 0 8px;min-width:0}.cva-rating legend{font-weight:700;margin-bottom:6px;padding:0}.cva-stars{display:flex;gap:2px}.cva-star{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;font-size:1.75rem;color:var(--line-strong);cursor:pointer;border-radius:var(--radius-sm)}.cva-star input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}.cva-star:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:1px}.cva-star:nth-child(-n+5):has(~ .cva-star input:checked),.cva-star:has(input:checked){color:var(--warn)}.cva-rating:disabled .cva-star{opacity:.45;cursor:not-allowed}.cva-state{margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cva-log{max-height:260px}`,
  bad:{code:`@Component({
  selector: 'app-rating',
  template: \`…\`,
})
export class Rating {
  @Input() value = 0;
  @Output() valueChange = new EventEmitter<number>();
}

// Elternkomponente: Wert, Validierung und touched von Hand verdrahten
<app-rating [value]="form.controls.rating.value"
            (valueChange)="form.controls.rating.setValue($event); form.controls.rating.markAsDirty()" />`.replace('Elternkomponente: Wert, Validierung und touched von Hand verdrahten',tx('Elternkomponente: Wert, Validierung und touched von Hand verdrahten','parent: wire value, validation and touched by hand')),
    note:tx('Funktioniert nicht mit <code>formControlName</code>, <code>touched</code> wird nie gesetzt, <code>disable()</code> kommt nicht an – und jedes Formular muss das neu verdrahten.','Doesn’t work with <code>formControlName</code>, <code>touched</code> is never set, <code>disable()</code> doesn’t arrive – and every form has to wire it again.')},
  good:{code:`let nextId = 0;

@Component({
  selector: 'app-rating',
  changeDetection: ChangeDetectionStrategy.OnPush,
  providers: [{ provide: NG_VALUE_ACCESSOR, useExisting: forwardRef(() => Rating), multi: true }],
  template: \`
    <fieldset [disabled]="disabled()">
      <legend>{{ label() }}</legend>
      @for (star of stars; track star) {
        <label>
          <input type="radio" [name]="name" [value]="star" [checked]="value() === star"
                 (change)="select(star)" (blur)="onTouched()" />
          {{ star }} of 5 stars
        </label>
      }
    </fieldset>
  \`,
})
export class Rating implements ControlValueAccessor {
  readonly label = input.required<string>();
  protected readonly stars = [1, 2, 3, 4, 5];
  protected readonly name = \`rating-\${nextId++}\`;
  protected readonly value = signal<number | null>(null);
  protected readonly disabled = signal(false);
  private onChange: (v: number | null) => void = () => {};
  protected onTouched: () => void = () => {};

  writeValue(v: number | null) { this.value.set(v); }
  registerOnChange(fn: (v: number | null) => void) { this.onChange = fn; }
  registerOnTouched(fn: () => void) { this.onTouched = fn; }
  setDisabledState(d: boolean) { this.disabled.set(d); }

  protected select(star: number) {
    this.value.set(star);
    this.onChange(star);
  }
}

// Verwendung: <app-rating label="How was it?" formControlName="rating" />

// Mit Signal Forms reicht ein model():
export class SignalRating implements FormValueControl<number | null> {
  readonly value = model<number | null>(null);
}
// <app-signal-rating [formField]="reviewForm.rating" />`.replace('Verwendung:',tx('Verwendung:','usage:')).replace('Mit Signal Forms reicht ein model():',tx('Mit Signal Forms reicht ein model():','with signal forms a model() is enough:')),
    note:tx('Innen Signals: So aktualisiert sich die OnPush-Komponente auch, wenn Angular <code>writeValue()</code> außerhalb der Change Detection aufruft. Native Radio-Buttons bringen Tastatur und Screenreader-Semantik gratis mit.','Signals inside: that way the OnPush component also updates when Angular calls <code>writeValue()</code> outside change detection. Native radio buttons bring keyboard and screen reader semantics for free.')},
  do:tx(['Innen native Elemente nutzen (Radio, Checkbox, Input) – Tastatur und Rolle kommen mit.','<code>onTouched()</code> beim Verlassen der Komponente aufrufen, nicht beim Fokussieren.','Internen Zustand als Signal halten, damit OnPush-Views <code>writeValue</code> sofort zeigen.','Für Signal Forms stattdessen <code>FormValueControl</code> mit <code>value = model()</code> implementieren.'],
        ['Use native elements inside (radio, checkbox, input) – keyboard and role come along.','Call <code>onTouched()</code> when leaving the component, not on focus.','Keep internal state in a signal so OnPush views show <code>writeValue</code> right away.','For signal forms implement <code>FormValueControl</code> with <code>value = model()</code> instead.']),
  dont:tx(['In <code>writeValue()</code> nicht <code>onChange()</code> aufrufen – das markiert das Formular als dirty und kann Schleifen erzeugen.','Nicht <code>NG_VALUE_ACCESSOR</code> ohne <code>multi: true</code> registrieren.','Keine eigene Validierung im Accessor verstecken – Validatoren gehören ans Control (oder <code>NG_VALIDATORS</code>).'],
        ['Don’t call <code>onChange()</code> in <code>writeValue()</code> – it marks the form dirty and can cause loops.','Don’t register <code>NG_VALUE_ACCESSOR</code> without <code>multi: true</code>.','Don’t hide validation inside the accessor – validators belong on the control (or <code>NG_VALIDATORS</code>).']),
  why:tx('<p>Die Forms-Direktiven (<code>formControlName</code>, <code>ngModel</code>) kennen keine Komponenten, nur <em>Value Accessors</em>. Für <code>&lt;input&gt;</code> liefert Angular sie mit (<code>DefaultValueAccessor</code>, <code>CheckboxControlValueAccessor</code> …); für deine Komponente schreibst du einen. Beim Anbinden ruft Angular <code>writeValue</code>, <code>setDisabledState</code> (seit v15 immer, auch mit <code>false</code>) und die beiden <code>register…</code>-Methoden auf – ab dann ist die Leitung in beide Richtungen offen.</p><p>Signal Forms drehen das um: Eine Komponente, die <code>FormValueControl</code> implementiert, hat einfach ein <code>value = model()</code> und optional Inputs wie <code>disabled</code> oder <code>errors</code>; die <code>[formField]</code>-Direktive bindet sie selbst. Für bestehende Reactive Forms bleibt <code>ControlValueAccessor</code> der Weg – <code>[formField]</code> kann solche Komponenten übrigens auch ansteuern.</p>',
           '<p>The forms directives (<code>formControlName</code>, <code>ngModel</code>) don’t know components, only <em>value accessors</em>. For <code>&lt;input&gt;</code> Angular ships them (<code>DefaultValueAccessor</code>, <code>CheckboxControlValueAccessor</code> …); for your component you write one. On attach, Angular calls <code>writeValue</code>, <code>setDisabledState</code> (always since v15, also with <code>false</code>) and both <code>register…</code> methods – from then on the line is open in both directions.</p><p>Signal forms turn this around: a component implementing <code>FormValueControl</code> simply has a <code>value = model()</code> and optionally inputs like <code>disabled</code> or <code>errors</code>; the <code>[formField]</code> directive binds it by itself. For existing reactive forms, <code>ControlValueAccessor</code> remains the way – and <code>[formField]</code> can drive such components too.</p>'),
  test:{code:`@Component({
  imports: [ReactiveFormsModule, Rating],
  template: \`<app-rating label="Rating" [formControl]="rating" />\`,
})
class Host { readonly rating = new FormControl<number | null>(2); }

it('writes into the control when a star is picked', async () => {
  const fixture = TestBed.createComponent(Host);
  await fixture.whenStable();
  const radios = fixture.nativeElement.querySelectorAll('input[type=radio]');

  expect(radios[1].checked).toBe(true);        // writeValue(2)
  radios[3].click();                            // user picks 4
  expect(fixture.componentInstance.rating.value).toBe(4);
  expect(fixture.componentInstance.rating.dirty).toBe(true);
});`,note:tx('Eine kleine Host-Komponente testet beide Richtungen, genau wie die Forms-API sie nutzt.','A small host component tests both directions, exactly the way the forms API uses them.')}
});

        [tx('Angular-Doku: Formularstatus anzeigen','Angular docs: Display form status'),'https://angular.dev/guide/forms/reactive-forms#display-form-status']],

<div class="sim-grid">
