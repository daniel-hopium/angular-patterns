        [tx('Angular-Doku: Timing von toObservable','Angular docs: Timing of toObservable'),'https://angular.dev/ecosystem/rxjs-interop#timing-of-toobservable']],
  rule:tx('<code>toSignal()</code> abonniert sofort und braucht einen Wert für „noch nichts da“: ohne Option ist das <code>undefined</code>, mit <code>initialValue</code> dein Wert, mit <code>requireSync: true</code> muss das Observable synchron liefern. Ein Fehler im Observable wird beim <em>Lesen</em> des Signals geworfen – fang ihn also vorher mit <code>catchError</code> ab.','<code>toSignal()</code> subscribes immediately and needs a value for “nothing yet”: without options that’s <code>undefined</code>, with <code>initialValue</code> it’s your value, with <code>requireSync: true</code> the observable must emit synchronously. An error in the observable is thrown when the signal is <em>read</em> – so catch it beforehand with <code>catchError</code>.'),
  apis:[['toSignal(obs$)','toSignal<T>(source): Signal<T | undefined>',tx('Ohne Option: <code>undefined</code>, bis der erste Wert kommt.','Without options: <code>undefined</code> until the first value arrives.')],
        ['initialValue','toSignal(obs$, { initialValue: [] })',tx('Startwert statt <code>undefined</code>; der Typ wird <code>Signal&lt;T&gt;</code> (bei <code>initialValue: null</code> entsprechend <code>Signal&lt;T | null&gt;</code>).','Start value instead of <code>undefined</code>; the type becomes <code>Signal&lt;T&gt;</code> (with <code>initialValue: null</code> accordingly <code>Signal&lt;T | null&gt;</code>).')],
        ['requireSync','toSignal(obs$, { requireSync: true })',tx('Für Quellen, die beim Abonnieren sofort liefern (<code>BehaviorSubject</code>, <code>startWith</code>). Sonst Laufzeitfehler NG0601.','For sources that emit on subscribe (<code>BehaviorSubject</code>, <code>startWith</code>). Otherwise runtime error NG0601.')],
        ['toObservable(sig)','toObservable<T>(source: Signal<T>, { injector? })',tx('Ein <code>effect</code> schiebt den Wert in ein Observable – asynchron, mehrere Änderungen dazwischen ergeben einen Wert.','An <code>effect</code> pushes the value into an observable – asynchronously, several changes in between yield one value.')],
        ['manualCleanup','toSignal(obs$, { manualCleanup: true })',tx('Nicht an den <code>DestroyRef</code> binden; die Subscription endet erst, wenn das Observable endet.','Don’t tie to the <code>DestroyRef</code>; the subscription only ends when the observable completes.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3><code>toSignal()</code></h3>
    <fieldset class="seg interop-seg"><legend>${tx('Quelle','Source')}</legend><div class="seg-opts">
      <label><input type="radio" name="interop-src" value="sync" checked> BehaviorSubject</label>
      <label><input type="radio" name="interop-src" value="http"> HTTP 800 ms</label>
      <label><input type="radio" name="interop-src" value="fail"> ${tx('HTTP mit Fehler','HTTP with error')}</label></div></fieldset>
    <fieldset class="seg interop-seg"><legend>${tx('Option','Option')}</legend><div class="seg-opts">
      <label><input type="radio" name="interop-opt" value="none" checked> ${tx('keine','none')}</label>
      <label><input type="radio" name="interop-opt" value="init"> initialValue</label>
      <label><input type="radio" name="interop-opt" value="sync"> requireSync</label></div></fieldset>
    <label class="check-row"><input type="checkbox" id="interop-catch"> <span><code>catchError(() => of('?'))</code> ${tx('davor','before it')}</span></label>
    <p class="interop-code"><code id="interop-code"></code></p>
    <p class="hint">${tx('Typ','Type')}: <code id="interop-type"></code></p>
    <button type="button" class="btn btn-primary" id="interop-create">${tx('Komponente erzeugen','Create component')}</button>
    <ul class="sim-log interop-log" id="interop-log" aria-label="${tx('Protokoll toSignal','Log toSignal')}"></ul>
  </div>
  <div class="sim-card"><h3><code>toObservable()</code></h3>
    <p>count = <b id="interop-count">0</b></p>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="interop-one">count.update(+1)</button><button type="button" class="btn btn-secondary" id="interop-three">${tx('3× set() direkt hintereinander','3× set() in a row')}</button></div>
    <p class="hint interop-hint">${tx('Das Observable hat bisher gesendet:','The observable has emitted so far:')} <b id="interop-emits">0×</b></p>
    <ul class="sim-log interop-log" id="interop-log2" aria-label="${tx('Protokoll toObservable','Log toObservable')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: HTTP + „keine“ – das Template liest erst <code>undefined</code>. Dann HTTP + requireSync: NG0601 beim Erzeugen. HTTP mit Fehler: Das Lesen wirft, bis du <code>catchError</code> davorsetzt. Bei <code>toObservable()</code>: drei <code>set()</code> hintereinander ergeben nur <em>eine</em> Emission mit dem letzten Wert.','Try: HTTP + “none” – the template first reads <code>undefined</code>. Then HTTP + requireSync: NG0601 on creation. HTTP with error: reading throws until you put <code>catchError</code> in front. With <code>toObservable()</code>: three <code>set()</code> in a row yield only <em>one</em> emission with the last value.')}</p>`,
  init(root){
    const {signal,effect,log}=NG;
    const ul=$('#interop-log',root),ul2=$('#interop-log2',root);
    const val=name=>$(`input[name="${name}"]:checked`,root).value;
    let view=null,sig=null,t0=0;
    function describe(){
      const src=val('interop-src'),opt=val('interop-opt'),c=$('#interop-catch',root).checked;
      const obs=src==='sync'?'user$':'http.get<string>(url)';
      $('#interop-code',root).textContent=`name = toSignal(${obs}${c?".pipe(catchError(() => of('?')))":''}${opt==='init'?", { initialValue: 'Gast' }":opt==='sync'?', { requireSync: true }':''});`.replace("'Gast'",tx("'Gast'","'Guest'"));
      $('#interop-type',root).textContent=opt==='none'?'Signal<string | undefined>':'Signal<string>';
    }
    function destroy(){if(view){view.destroy();view=null}if(sig){sig.subscription.unsubscribe();sig=null}}
    function create(){
      destroy();ul.innerHTML='';t0=performance.now();
      const src=val('interop-src'),opt=val('interop-opt'),c=$('#interop-catch',root).checked;
      const ms=()=>`<span class="t">${Math.round(performance.now()-t0)} ms</span>`;
      let obs=src==='sync'?new RX.BehaviorSubject('Ada'):RX.request({ms:800,value:'Ada',fail:src==='fail',error:new Error('500 Server Error')});
      if(c)obs=obs.pipe(RX.catchError(()=>RX.of('?')));
      const opts=opt==='init'?{initialValue:tx('Gast','Guest')}:opt==='sync'?{requireSync:true}:{};
      try{sig=RX.toSignal(obs,opts)}catch(e){log(ul,`${ms()} <span class="interop-err">${tx('Konstruktor wirft','constructor throws')}: ${esc(e.message)}</span>`);return}
      log(ul,`${ms()} toSignal() ${tx('abonniert sofort','subscribes immediately')}`);
      /* Das „Template“: liest name() – so wie {{ name() }} */
      view=effect(()=>{
        try{const v=sig();log(ul,`${ms()} ${tx('Template','template')}: name() → <span class="hl">${v===undefined?'undefined':esc(JSON.stringify(v))}</span>`)}
        catch(e){log(ul,`${ms()} <span class="interop-err">${tx('Template wirft beim Lesen','template throws on read')}: ${esc(e.message)}</span>`)}
      },{name:'template'});
    }
    /* toObservable */
    const count=signal(0,{name:'count'});
    let emits=0;
    const count$=RX.toObservable(count);
    const sub=count$.subscribe(v=>{emits++;$('#interop-emits',root).textContent=emits+'×';log(ul2,`<span class="hl">${tx('Observable sendet','observable emits')}</span> ${v}`)});
    const show=()=>$('#interop-count',root).textContent=count.node.value;
    root.addEventListener('click',e=>{
      if(e.target.closest('#interop-create'))create();
      if(e.target.closest('#interop-one')){count.update(v=>v+1);show();log(ul2,`<span class="t">set</span> count = ${count.node.value}`)}
      if(e.target.closest('#interop-three')){for(let i=0;i<3;i++){count.update(v=>v+1);log(ul2,`<span class="t">set</span> count = ${count.node.value}`)}show()}
    });
    root.addEventListener('change',describe);
    describe();
    return ()=>{destroy();sub.unsubscribe();count$.destroy()};
  },
  css:`.interop-seg{margin-bottom:12px}.interop-code{margin:4px 0 6px}.interop-code code{display:block;padding:8px 10px}.interop-log{margin-top:12px}.interop-err{color:var(--danger);font-weight:700}.interop-hint{margin:12px 0 0}`,
  bad:{code:`// 1. undefined wird vergessen
user = toSignal(this.http.get<User>('/api/me'));
// Template: {{ user().name }}  → TypeError, solange nichts geladen ist

// 2. requireSync bei einer asynchronen Quelle
items = toSignal(this.http.get<Item[]>('/api/items'), { requireSync: true }); // NG0601

// 3. Fehler ungefangen: jedes Lesen von user() wirft`.replace('1. undefined wird vergessen',tx('1. undefined wird vergessen','1. undefined is forgotten')).replace('→ TypeError, solange nichts geladen ist',tx('→ TypeError, solange nichts geladen ist','→ TypeError while nothing is loaded')).replace('2. requireSync bei einer asynchronen Quelle',tx('2. requireSync bei einer asynchronen Quelle','2. requireSync with an asynchronous source')).replace('3. Fehler ungefangen: jedes Lesen von user() wirft',tx('3. Fehler ungefangen: jedes Lesen von user() wirft','3. uncaught error: every read of user() throws')),
    note:tx('Der Typ <code>Signal&lt;User | undefined&gt;</code> warnt dich eigentlich – mit <code>!</code> oder <code>as</code> weggecastet, knallt es zur Laufzeit.','The type <code>Signal&lt;User | undefined&gt;</code> actually warns you – cast away with <code>!</code> or <code>as</code>, it blows up at runtime.')},
  good:{code:`// asynchron: Startwert angeben, Fehler im Observable abfangen
readonly items = toSignal(
  this.http.get<Item[]>('/api/items').pipe(catchError(() => of([]))),
  { initialValue: [] },
);

// synchron (BehaviorSubject, startWith): requireSync spart den Startwert
readonly theme = toSignal(this.theme$, { requireSync: true });

// Signal → Observable, z. B. für switchMap
readonly query = signal('');
readonly results = toSignal(
  toObservable(this.query).pipe(
    debounceTime(300),
    switchMap(q => this.api.search(q)),
  ),
  { initialValue: [] },
);`.replace('asynchron: Startwert angeben, Fehler im Observable abfangen',tx('asynchron: Startwert angeben, Fehler im Observable abfangen','async: give a start value, catch errors in the observable')).replace('synchron (BehaviorSubject, startWith): requireSync spart den Startwert',tx('synchron (BehaviorSubject, startWith): requireSync spart den Startwert','sync (BehaviorSubject, startWith): requireSync saves the start value')).replace('Signal → Observable, z. B. für switchMap',tx('Signal → Observable, z. B. für switchMap','signal → observable, e.g. for switchMap')),
    note:tx('Beide Funktionen brauchen einen Injection Context (Feldinitialisierer, Konstruktor) oder die Option <code>injector</code>. Nie in einem <code>computed()</code> oder <code>effect()</code> aufrufen – das erzeugt bei jedem Lauf eine neue Subscription.','Both functions need an injection context (field initialiser, constructor) or the <code>injector</code> option. Never call them inside a <code>computed()</code> or <code>effect()</code> – that creates a new subscription on every run.')},
  do:tx(['Bei HTTP-Quellen immer <code>initialValue</code> angeben oder im Template bewusst mit <code>undefined</code> umgehen (<code>@if (user(); as u)</code>).','<code>requireSync: true</code> nur für Quellen, die garantiert synchron liefern.','Fehler im Observable mit <code>catchError</code> in einen Wert verwandeln, bevor <code>toSignal()</code> sie sieht.','Für Ladezustand und Fehler als Signal lieber <code>rxResource()</code> oder <code>httpResource()</code> erwägen.'],
        ['For HTTP sources always pass <code>initialValue</code> or deliberately handle <code>undefined</code> in the template (<code>@if (user(); as u)</code>).','<code>requireSync: true</code> only for sources that are guaranteed to emit synchronously.','Turn errors into a value with <code>catchError</code> before <code>toSignal()</code> sees them.','For loading and error state as signals, consider <code>rxResource()</code> or <code>httpResource()</code> instead.']),
  dont:tx(['Nicht erwarten, dass <code>toObservable()</code> jede Zwischenänderung liefert – es sendet den Stand, wenn der effect läuft.','Kein <code>toSignal()</code> in Methoden oder Klick-Handlern: jedes Mal eine neue Subscription.','Kein <code>!</code> auf ein <code>Signal&lt;T | undefined&gt;</code>, nur damit der Compiler still ist.'],
        ['Don’t expect <code>toObservable()</code> to deliver every intermediate change – it emits the state when the effect runs.','No <code>toSignal()</code> in methods or click handlers: a new subscription every time.','No <code>!</code> on a <code>Signal&lt;T | undefined&gt;</code> just to silence the compiler.']),
  why:tx('<p>Ein Signal hat <em>immer</em> einen Wert, ein Observable nicht unbedingt. <code>toSignal()</code> muss diese Lücke füllen – deshalb die drei Varianten. Intern speichert Angular den Zustand als „Wert“ oder „Fehler“; ein <code>computed</code> liefert den Wert oder wirft den gespeicherten Fehler. Nach einem Fehler ist das Observable beendet, das Signal bleibt im Fehlerzustand. Darum gehört <code>catchError</code> <em>vor</em> <code>toSignal()</code>.</p><p><code>toObservable()</code> läuft über einen <code>effect</code> und ein <code>ReplaySubject(1)</code>. Effects sind gebündelt und asynchron: Drei <code>set()</code> im selben Durchlauf ergeben eine Emission mit dem letzten Wert. Das ist Absicht – ein Signal ist Zustand, kein Ereignisstrom. Wer jedes Ereignis braucht, nimmt einen <code>Subject</code> oder ein <code>output()</code>.</p>',
           '<p>A signal <em>always</em> has a value, an observable not necessarily. <code>toSignal()</code> has to fill that gap – hence the three variants. Internally Angular stores the state as “value” or “error”; a <code>computed</code> returns the value or throws the stored error. After an error the observable is done and the signal stays in the error state. That’s why <code>catchError</code> belongs <em>before</em> <code>toSignal()</code>.</p><p><code>toObservable()</code> runs through an <code>effect</code> and a <code>ReplaySubject(1)</code>. Effects are batched and asynchronous: three <code>set()</code> in the same pass yield one emission with the last value. That’s intentional – a signal is state, not an event stream. If you need every event, use a <code>Subject</code> or an <code>output()</code>.</p>'),
  test:{code:`it('uses the initial value until the request answers', () => {
  TestBed.configureTestingModule({
    providers: [provideHttpClient(), provideHttpClientTesting()],
  });
  const fixture = TestBed.createComponent(ItemList);
  const http = TestBed.inject(HttpTestingController);

  expect(fixture.componentInstance.items()).toEqual([]);

  http.expectOne('/api/items').flush([{ id: 1 }]);
  expect(fixture.componentInstance.items()).toEqual([{ id: 1 }]);
});`,note:tx('<code>toSignal()</code> setzt das Signal synchron, sobald das Observable sendet – nach <code>flush()</code> ist der neue Wert sofort lesbar.','<code>toSignal()</code> sets the signal synchronously as soon as the observable emits – after <code>flush()</code> the new value is readable right away.')}
});

LESSONS.push({
  id:'sharereplay', cat:'rxjs', order:60,
  title:tx('Ein Request für alle: shareReplay','One request for everyone: shareReplay'),
  short:tx('Drei Abonnenten, drei HTTP-Requests – es sei denn, du teilst das Observable. Und refCount entscheidet, ob es danach weiterläuft.','Three subscribers, three HTTP requests – unless you share the observable. And refCount decides whether it keeps running afterwards.'),
  keys:'shareReplay share refCount bufferSize multicast cache caching mehrfach request http doppelt cold hot',
  status:'stable',
  refs:[[tx('API: shareReplay','API: shareReplay'),'https://rxjs.dev/api/operators/shareReplay'],
        [tx('API: share','API: share'),'https://rxjs.dev/api/operators/share'],
        [tx('RxJS-Doku: Multicasting','RxJS docs: Multicasting'),'https://rxjs.dev/guide/operators#multicasting-operators']],
  rule:tx('<code>HttpClient</code>-Observables sind <strong>kalt</strong>: Jedes <code>subscribe()</code> ist ein eigener Request. Sollen mehrere Stellen dieselbe Antwort nutzen, teile das Observable mit <code>shareReplay({ bufferSize: 1, refCount: true })</code> – dann gibt es einen Request, Nachzügler bekommen den letzten Wert, und die Quelle wird gekündigt, sobald niemand mehr zuhört.','<code>HttpClient</code> observables are <strong>cold</strong>: every <code>subscribe()</code> is its own request. If several places should use the same response, share the observable with <code>shareReplay({ bufferSize: 1, refCount: true })</code> – then there’s one request, latecomers get the last value, and the source is cancelled as soon as nobody listens.'),
  apis:[['share()','share({ resetOnComplete, resetOnRefCountZero, … })',tx('Teilt eine Subscription unter allen gleichzeitigen Abonnenten. Ohne Replay: Wer nach dem Abschluss kommt, löst einen neuen Request aus.','Shares one subscription among all simultaneous subscribers. No replay: whoever comes after completion triggers a new request.')],
        ['shareReplay(1)','shareReplay(bufferSize?, windowTime?)',tx('Teilt und merkt sich den letzten Wert für Nachzügler. <code>refCount</code> ist hier <code>false</code>: Die Quelle bleibt abonniert, auch wenn alle weg sind.','Shares and remembers the last value for latecomers. <code>refCount</code> is <code>false</code> here: the source stays subscribed even when everyone left.')],
        ['shareReplay({…})','shareReplay({ bufferSize: 1, refCount: true })',tx('Wie oben, aber die Quelle wird gekündigt, wenn der letzte Abonnent geht (solange sie noch nicht beendet ist).','As above, but the source is cancelled when the last subscriber leaves (as long as it hasn’t completed yet).')]],
  demo:`<div class="sim-grid sharereplay-opts">
  <fieldset class="seg"><legend>${tx('Operator','Operator')}</legend><div class="seg-opts">
    <label><input type="radio" name="sharereplay-m" value="none" checked> ${tx('keiner','none')}</label>
    <label><input type="radio" name="sharereplay-m" value="share"> share()</label>
    <label><input type="radio" name="sharereplay-m" value="sr1"> shareReplay(1)</label>
    <label><input type="radio" name="sharereplay-m" value="src"> refCount: true</label></div></fieldset>
  <fieldset class="seg"><legend>${tx('Quelle','Source')}</legend><div class="seg-opts">
    <label><input type="radio" name="sharereplay-s" value="http" checked> ${tx('HTTP (endet)','HTTP (completes)')}</label>
    <label><input type="radio" name="sharereplay-s" value="live"> ${tx('Live-Stream (endet nie)','live stream (never ends)')}</label></div></fieldset>
</div>
<pre class="rx-json" id="sharereplay-code"></pre>
<div class="sharereplay-widgets" role="group" aria-label="${tx('Abonnenten','Subscribers')}">
  ${['header','sidebar','content'].map((w,i)=>`<label class="check-row sim-card sharereplay-w"><input type="checkbox" data-w="${w}"> <span><b>${[tx('Kopfzeile','Header'),tx('Seitenleiste','Sidebar'),tx('Inhalt','Content')][i]}</b><br><span class="hint" id="sharereplay-v-${w}">${tx('nicht abonniert','not subscribed')}</span></span></label>`).join('')}
</div>
<div class="sim-row sharereplay-ctrl"><button type="button" class="btn btn-secondary" id="sharereplay-all">${tx('Nacheinander abonnieren','Subscribe one by one')}</button><button type="button" class="btn btn-secondary" id="sharereplay-none">${tx('Alle abmelden','Unsubscribe all')}</button></div>
<p class="sharereplay-count">${tx('Quell-Subscriptions (Requests) gestartet','Source subscriptions (requests) started')}: <span class="rx-count" id="sharereplay-calls">0</span> · ${tx('jetzt aktiv','active now')}: <span class="rx-count" id="sharereplay-live">0</span></p>
<div id="sharereplay-dia"></div>
${RX.legend(['run','done','cancelled','out'])}
<p class="demo-note">${tx('Probier: „Nacheinander abonnieren“ mit jedem Operator. Der dritte Abonnent kommt nach der Antwort: Bei <code>share()</code> startet er einen neuen Request, bei <code>shareReplay</code> bekommt er den gemerkten Wert. Dann „Live-Stream“ + <code>shareReplay(1)</code> + „Alle abmelden“: Die Quelle bleibt aktiv – ein Leck. Mit <code>refCount: true</code> fällt sie auf 0.','Try: “Subscribe one by one” with every operator. The third subscriber arrives after the response: with <code>share()</code> it starts a new request, with <code>shareReplay</code> it gets the remembered value. Then “live stream” + <code>shareReplay(1)</code> + “Unsubscribe all”: the source stays active – a leak. With <code>refCount: true</code> it drops to 0.')}</p>`,
  init(root){
    const val=n=>$(`input[name="${n}"]:checked`,root).value;
    const W=['header','sidebar','content'];
    const CODE={none:'user$ = this.http.get<User>(url);',share:'user$ = this.http.get<User>(url).pipe(share());',sr1:'user$ = this.http.get<User>(url).pipe(shareReplay(1));',src:'user$ = this.http.get<User>(url).pipe(\n  shareReplay({ bufferSize: 1, refCount: true }),\n);'};
    let d,user$,subs={},calls=0,live=0,timers=[];
    const upd=()=>{$('#sharereplay-calls',root).textContent=calls;const l=$('#sharereplay-live',root);l.textContent=live;l.className='rx-count'+(live&&!Object.keys(subs).length?' rx-bad':'')};
    function build(){
      Object.values(subs).forEach(s=>s.unsubscribe());subs={};timers.forEach(clearTimeout);timers=[];
      $$('input[data-w]',root).forEach(i=>i.checked=false);W.forEach(w=>$('#sharereplay-v-'+w,root).textContent=tx('nicht abonniert','not subscribed'));
      d&&d.destroy();calls=0;live=0;
      d=RX.diagram($('#sharereplay-dia',root),{lanes:[{id:'src',label:tx('Quelle','source'),rows:3},...W.map((w,i)=>({id:w,label:[tx('Kopfzeile','header'),tx('Seitenleiste','sidebar'),tx('Inhalt','content')][i]}))],span:7000});
      const m=val('sharereplay-m'),s=val('sharereplay-s');
      $('#sharereplay-code',root).textContent=s==='http'?CODE[m]:CODE[m].replace('this.http.get<User>(url)','this.socket.messages$');
      /* kalte Quelle: jedes subscribe startet einen eigenen Request bzw. eine eigene Verbindung */
      const source=s==='http'
        ?new RX.Observable(sub=>{const k=++calls;live++;upd();let bar=d.bar('src','GET #'+k);
            const inner=RX.request({ms:1000,value:'Ada · GET #'+k,onEnd:st=>bar.end(st)}).subscribe({next:v=>sub.next(v),complete:()=>sub.complete()});
            return ()=>{inner.unsubscribe();live--;upd()}})
        :new RX.Observable(sub=>{const k=++calls;live++;upd();let bar=d.bar('src','WS #'+k),i=0;
            const iv=setInterval(()=>sub.next(`msg ${++i} · WS #${k}`),700);
            return ()=>{clearInterval(iv);bar.end('cancelled');live--;upd()}});
      user$=m==='none'?source:m==='share'?source.pipe(RX.share()):m==='sr1'?source.pipe(RX.shareReplay(1)):source.pipe(RX.shareReplay({bufferSize:1,refCount:true}));
      upd();
    }
    function toggle(w,on){
      const box=$(`input[data-w="${w}"]`,root);box.checked=on;
      if(on&&!subs[w]){$('#sharereplay-v-'+w,root).textContent=tx('wartet …','waiting …');subs[w]=user$.subscribe(v=>{d.marble(w,v.startsWith('msg')?'m'+v.split(' ')[1]:'#'+v.split('#')[1],'rx-out');$('#sharereplay-v-'+w,root).textContent=v})}
      if(!on&&subs[w]){subs[w].unsubscribe();delete subs[w];$('#sharereplay-v-'+w,root).textContent=tx('nicht abonniert','not subscribed')}
      upd();
    }
    root.addEventListener('change',e=>{
      if(e.target.dataset.w)toggle(e.target.dataset.w,e.target.checked);
      if(e.target.name==='sharereplay-m'||e.target.name==='sharereplay-s')build();
    });
    root.addEventListener('click',e=>{
      if(e.target.closest('#sharereplay-all')){W.forEach(w=>toggle(w,false));timers.push(setTimeout(()=>toggle('header',true),0),setTimeout(()=>toggle('sidebar',true),300),setTimeout(()=>toggle('content',true),1600))}
      if(e.target.closest('#sharereplay-none')){timers.forEach(clearTimeout);timers=[];W.forEach(w=>toggle(w,false))}
    });
    build();
    return ()=>{Object.values(subs).forEach(s=>s.unsubscribe());timers.forEach(clearTimeout);d.destroy()};
  },
  css:`.sharereplay-opts{margin-bottom:12px}.sharereplay-widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin:12px 0}.sharereplay-w{align-items:flex-start;padding:10px 12px;cursor:pointer}.sharereplay-w input{margin-top:2px}.sharereplay-ctrl{margin-bottom:8px}.sharereplay-count{margin:8px 0 12px}`,
  bad:{code:`@Injectable({ providedIn: 'root' })
export class UserService {

// Kopfzeile, Seitenleiste und Inhalt nutzen user$ | async
// → drei identische GET /api/me`.replace('Kopfzeile, Seitenleiste und Inhalt nutzen user$ | async',tx('Kopfzeile, Seitenleiste und Inhalt nutzen user$ | async','header, sidebar and content use user$ | async')).replace('→ drei identische GET /api/me',tx('→ drei identische GET /api/me','→ three identical GET /api/me')),
    note:tx('Ein Observable ist eine Anleitung, keine Variable: Jede <code>async</code>-Pipe führt sie neu aus.','An observable is a recipe, not a variable: every <code>async</code> pipe runs it again.')},
  good:{code:`@Injectable({ providedIn: 'root' })
export class UserService {
  private readonly http = inject(HttpClient);
  readonly user$ = this.http.get<User>('/api/me').pipe(
    shareReplay({ bufferSize: 1, refCount: true }),
  );
}`,
    note:tx('Ein Request, alle Abonnenten bekommen dieselbe Antwort, Nachzügler den gemerkten Wert. Achtung: Nach einer <em>abgeschlossenen</em> Quelle (HTTP) bleibt der Wert auch mit <code>refCount: true</code> gecacht, bis zum Neuladen der App – für frische Daten brauchst du einen Trigger (z. B. <code>reload$.pipe(switchMap(…))</code>).','One request, all subscribers get the same response, latecomers the remembered value. Note: after a <em>completed</em> source (HTTP) the value stays cached even with <code>refCount: true</code> until the app reloads – for fresh data you need a trigger (e.g. <code>reload$.pipe(switchMap(…))</code>).')},
  do:tx(['Geteilte Streams in Services mit <code>shareReplay({ bufferSize: 1, refCount: true })</code> anlegen.','<code>bufferSize: 1</code> angeben – ohne Angabe merkt sich <code>shareReplay</code> <em>alle</em> Werte.','Für Zustand, der sich ändert und synchron gelesen wird, lieber ein <code>signal()</code> im Service oder <code>httpResource()</code> erwägen.'],
        ['Create shared streams in services with <code>shareReplay({ bufferSize: 1, refCount: true })</code>.','Pass <code>bufferSize: 1</code> – without it <code>shareReplay</code> remembers <em>all</em> values.','For state that changes and is read synchronously, consider a <code>signal()</code> in the service or <code>httpResource()</code> instead.']),
  dont:tx(['Kein <code>shareReplay(1)</code> ohne <code>refCount</code> auf Streams, die nie enden (WebSocket, <code>interval</code>, Store) – die Quelle läuft ewig weiter.','Nicht erwarten, dass <code>refCount: true</code> einen HTTP-Cache leert: Nach dem Abschluss bleibt der Wert.','Kein <code>shareReplay</code> in einer Methode, die bei jedem Aufruf ein neues Observable baut – dann gibt es nichts zu teilen.'],
        ['No <code>shareReplay(1)</code> without <code>refCount</code> on streams that never end (WebSocket, <code>interval</code>, store) – the source runs forever.','Don’t expect <code>refCount: true</code> to clear an HTTP cache: after completion the value stays.','No <code>shareReplay</code> inside a method that builds a new observable on every call – then there’s nothing to share.']),
  why:tx('<p>Kalte Observables starten ihre Arbeit pro Abonnent. <code>share()</code> schaltet ein <code>Subject</code> dazwischen: Die Quelle wird einmal abonniert, das Subject verteilt an alle. <code>shareReplay</code> nimmt stattdessen ein <code>ReplaySubject</code>, das die letzten Werte für Nachzügler aufhebt – und setzt nach dem Abschluss der Quelle <em>nicht</em> zurück. Darum wirkt es bei HTTP wie ein Cache.</p><p><code>refCount</code> zählt die Abonnenten. Mit <code>true</code> wird die Quelle gekündigt, wenn der Zähler auf 0 fällt – aber nur, solange sie noch läuft. Mit <code>false</code> (dem Standard von <code>shareReplay(1)</code>) bleibt sie abonniert. Bei einem einmaligen HTTP-Request fällt das kaum auf, bei einem WebSocket ist es ein Leck.</p>',
           '<p>Cold observables start their work per subscriber. <code>share()</code> puts a <code>Subject</code> in between: the source is subscribed once, the subject distributes to everyone. <code>shareReplay</code> uses a <code>ReplaySubject</code> instead, which keeps the last values for latecomers – and does <em>not</em> reset after the source completes. That’s why it acts like a cache for HTTP.</p><p><code>refCount</code> counts subscribers. With <code>true</code> the source is cancelled when the count drops to 0 – but only while it’s still running. With <code>false</code> (the default of <code>shareReplay(1)</code>) it stays subscribed. With a one-off HTTP request you hardly notice, with a WebSocket it’s a leak.</p>'),
  test:{code:`it('sends only one request for several subscribers', () => {
  TestBed.configureTestingModule({
    providers: [provideHttpClient(), provideHttpClientTesting()],
  });
  const service = TestBed.inject(UserService);
  const http = TestBed.inject(HttpTestingController);

  service.user$.subscribe();
  service.user$.subscribe();

  http.expectOne('/api/me').flush({ name: 'Ada' });  // fails if there were two
  http.verify();
});`,note:tx('<code>expectOne()</code> schlägt fehl, wenn mehr als ein passender Request offen ist – genau das willst du hier prüfen.','<code>expectOne()</code> fails if more than one matching request is open – exactly what you want to check here.')}
});

LESSONS.push({
  id:'subjects', cat:'rxjs', order:80,
  title:tx('Zustand im Service: Subject oder Signal?','State in a service: subject or signal?'),
  short:tx('BehaviorSubject war jahrelang der Standard für Zustand. Für Werte, die man liest, sind Signals heute einfacher – für Ereignisse bleibt RxJS stark.','BehaviorSubject was the standard for state for years. For values you read, signals are simpler today – for events RxJS stays strong.'),
  keys:'Subject BehaviorSubject ReplaySubject signal state zustand service store combineLatest glitch diamond asObservable asReadonly',
  status:'stable',
  refs:[[tx('RxJS-Doku: Subject','RxJS docs: Subject'),'https://rxjs.dev/guide/subject'],
        [tx('Angular-Doku: RxJS-Interop','Angular docs: RxJS interop'),'https://angular.dev/ecosystem/rxjs-interop']],
  rule:tx('<strong>Zustand</strong> (ein aktueller Wert, den Templates lesen) hältst du im Service als <code>signal()</code>, nach außen mit <code>asReadonly()</code>, Abgeleitetes mit <code>computed()</code>. <strong>Ereignisse</strong> (Klicks, Nachrichten, „jetzt neu laden“) und alles mit Zeit (Debounce, Abbrechen, Wiederholen) bleiben bei RxJS – ein <code>Subject</code> ist dafür genau richtig.','<strong>State</strong> (a current value templates read) lives in the service as a <code>signal()</code>, exposed with <code>asReadonly()</code>, derived values with <code>computed()</code>. <strong>Events</strong> (clicks, messages, “reload now”) and anything involving time (debounce, cancel, retry) stay with RxJS – a <code>Subject</code> is exactly right for that.'),
  apis:[['BehaviorSubject','new BehaviorSubject<T>(initial)',tx('Hat immer einen aktuellen Wert (<code>.value</code>), sendet ihn jedem neuen Abonnenten.','Always has a current value (<code>.value</code>) and sends it to every new subscriber.')],
        ['Subject','new Subject<T>()',tx('Reiner Ereignisverteiler ohne Gedächtnis – wer später kommt, verpasst es.','Pure event distributor without memory – latecomers miss out.')],
        ['asObservable()','subject.asObservable()',tx('Versteckt <code>next()</code> vor Konsumenten.','Hides <code>next()</code> from consumers.')],
        ['signal / asReadonly','signal<T>(initial).asReadonly()',tx('Das Signal-Gegenstück: synchron lesbar, glitch-frei abgeleitet mit <code>computed()</code>.','The signal counterpart: synchronously readable, glitch-free derivation with <code>computed()</code>.')]],
  demo:`<div class="sim-row subjects-ctrl"><button type="button" class="btn btn-primary" id="subjects-inc">count + 1</button><button type="button" class="btn btn-ghost" id="subjects-clear">${tx('Protokolle leeren','Clear logs')}</button></div>
<div class="sim-grid">
  <div class="sim-card"><h3>BehaviorSubject + combineLatest</h3>
    <pre class="rx-json subjects-code">count$ = new BehaviorSubject(0);
double$ = count$.pipe(map(c => c * 2));
view$ = combineLatest([count$, double$]);</pre>
    <p class="hint">${tx('Emissionen','Emissions')}: <b id="subjects-rx-n">0</b> · ${tx('davon inkonsistent','inconsistent')}: <b id="subjects-rx-bad">0</b></p>
    <ul class="sim-log" id="subjects-rx-log" aria-label="${tx('Protokoll RxJS','Log RxJS')}"></ul></div>
  <div class="sim-card"><h3>signal + computed</h3>
    <pre class="rx-json subjects-code">count = signal(0);
double = computed(() => this.count() * 2);
// ${tx('Template liest count() und double()','template reads count() and double()')}</pre>
    <p class="hint">${tx('Template-Läufe','Template runs')}: <b id="subjects-sig-n">0</b> · ${tx('davon inkonsistent','inconsistent')}: <b id="subjects-sig-bad">0</b></p>
    <ul class="sim-log" id="subjects-sig-log" aria-label="${tx('Protokoll Signals','Log signals')}"></ul></div>
</div>
<p class="demo-note">${tx('Probier: „count + 1“. Bei RxJS sendet <code>combineLatest</code> zweimal – zuerst mit neuem <code>count</code> und <em>altem</em> <code>double</code> (ein „Glitch“, rot), dann korrekt. Bei Signals liest das Template nur konsistente Werte, einmal pro Änderung.','Try: “count + 1”. With RxJS <code>combineLatest</code> emits twice – first with the new <code>count</code> and the <em>old</em> <code>double</code> (a “glitch”, red), then correctly. With signals the template only reads consistent values, once per change.')}</p>`,
  init(root){
    const {signal,computed,effect,log}=NG;
    const rxUl=$('#subjects-rx-log',root),sigUl=$('#subjects-sig-log',root);
    let rxN=0,rxBad=0,sigN=0,sigBad=0;
    const line=(c,d)=>{const ok=d===c*2;return `[${c}, ${d}] ${ok?'✓':`<span class="subjects-bad">${tx('inkonsistent','inconsistent')}</span>`}`};
    /* RxJS: der klassische „Diamant“ – count$ wird zweimal abonniert */
    const count$=new RX.BehaviorSubject(0);
    const double$=count$.pipe(RX.map(c=>c*2));
    const sub=RX.combineLatest([count$,double$]).subscribe(([c,d])=>{rxN++;if(d!==c*2)rxBad++;log(rxUl,line(c,d));$('#subjects-rx-n',root).textContent=rxN;$('#subjects-rx-bad',root).textContent=rxBad});
    /* Signals: computed wird beim Lesen nachgerechnet, der effect sieht nur fertige Werte */
    const count=signal(0,{name:'count'}),double=computed(()=>count()*2,{name:'double'});
    const view=effect(()=>{const c=count(),d=double();sigN++;if(d!==c*2)sigBad++;log(sigUl,line(c,d));$('#subjects-sig-n',root).textContent=sigN;$('#subjects-sig-bad',root).textContent=sigBad},{name:'template'});
    root.addEventListener('click',e=>{
      if(e.target.closest('#subjects-inc')){count$.next(count$.value+1);count.update(c=>c+1)}
      if(e.target.closest('#subjects-clear')){rxUl.innerHTML='';sigUl.innerHTML=''}
    });
    return ()=>{sub.unsubscribe();view.destroy()};
  },
  css:`.subjects-ctrl{margin-bottom:12px}.subjects-code{margin:0 0 10px;font-size:.75rem}.subjects-bad{color:var(--danger);font-weight:700}.sim-card .hint{margin-bottom:8px}`,
  bad:{code:`@Injectable({ providedIn: 'root' })
export class CartService {
  private readonly items$ = new BehaviorSubject<Item[]>([]);
  readonly count$ = this.items$.pipe(map(items => items.length));

  add(item: Item) {
    // aktuellen Wert holen, neu setzen – und alle müssen abonnieren
    this.items$.next([...this.items$.value, item]);
  }
}
// Template: {{ count$ | async }} – Typ number | null, eine Subscription je Stelle`.replace('aktuellen Wert holen, neu setzen – und alle müssen abonnieren',tx('aktuellen Wert holen, neu setzen – und alle müssen abonnieren','get current value, set a new one – and everyone must subscribe')).replace('Typ number | null, eine Subscription je Stelle',tx('Typ number | null, eine Subscription je Stelle','type number | null, one subscription per usage')),
    note:tx('Funktioniert, ist aber viel Zeremonie für einen Wert: <code>async</code>-Pipe überall, <code>null</code> im Typ, und kombinierte Streams können kurz inkonsistente Zwischenstände zeigen.','Works, but it’s a lot of ceremony for a value: <code>async</code> pipe everywhere, <code>null</code> in the type, and combined streams can briefly show inconsistent intermediate states.')},
  good:{code:`@Injectable({ providedIn: 'root' })
export class CartService {
  private readonly _items = signal<Item[]>([]);
  readonly items = this._items.asReadonly();
  readonly count = computed(() => this._items().length);

  add(item: Item) {
    this._items.update(items => [...items, item]);
  }

  // Ereignisse bleiben ein Stream
  readonly checkout$ = new Subject<void>();
}`.replace('Ereignisse bleiben ein Stream',tx('Ereignisse bleiben ein Stream','events stay a stream')),
    note:tx('Synchron lesbar, kein Abonnieren, glitch-frei. Wo Zeit ins Spiel kommt, verbindest du beides mit <code>toSignal()</code> und <code>toObservable()</code>.','Synchronously readable, no subscribing, glitch-free. Where time comes into play, connect both with <code>toSignal()</code> and <code>toObservable()</code>.')},
  do:tx(['Zustand, den Templates anzeigen: <code>signal()</code> + <code>computed()</code>.','Nach außen nur lesend freigeben: <code>asReadonly()</code> bzw. <code>asObservable()</code>.','Ereignisse und Zeitlogik mit <code>Subject</code> und Operatoren modellieren.'],
        ['State templates display: <code>signal()</code> + <code>computed()</code>.','Expose it read-only: <code>asReadonly()</code> or <code>asObservable()</code>.','Model events and time logic with <code>Subject</code> and operators.']),
  dont:tx(['Nicht bestehenden, funktionierenden RxJS-Code nur aus Prinzip umschreiben.','Kein <code>BehaviorSubject</code> öffentlich machen – dann kann jeder <code>next()</code> aufrufen.','Kein <code>Subject</code> für Zustand, den man sofort lesen will – es hat keinen aktuellen Wert.'],
        ['Don’t rewrite existing, working RxJS code just on principle.','Don’t expose a <code>BehaviorSubject</code> publicly – then anyone can call <code>next()</code>.','No <code>Subject</code> for state you want to read right away – it has no current value.']),
  why:tx('<p>RxJS ist <em>push</em>-basiert: Jede Quelle sendet sofort an alle Abonnenten, in Abonnement-Reihenfolge. Hängen zwei Pfade an derselben Quelle und werden wieder zusammengeführt (ein Diamant), bekommt <code>combineLatest</code> die Änderung zweimal – das erste Mal mit einem veralteten Ast. Signals sind <em>push-pull</em>: Die Änderung markiert nur „veraltet“, gerechnet wird beim Lesen, und dann sind alle Abhängigkeiten aktuell.</p><p>Dafür können Signals keine Zeit: kein Debounce, kein Abbrechen, keine Ereignisse, die man nicht verpassen darf. Darum ist die Faustregel nicht „RxJS raus“, sondern: Zustand in Signals, Ereignisströme in RxJS, und <code>toSignal</code>/<code>toObservable</code> als Brücke.</p>',
           '<p>RxJS is <em>push</em>-based: every source sends immediately to all subscribers, in subscription order. If two paths hang off the same source and are merged again (a diamond), <code>combineLatest</code> receives the change twice – the first time with a stale branch. Signals are <em>push-pull</em>: the change only marks “stale”, the calculation happens on read, and by then all dependencies are current.</p><p>In exchange, signals can’t do time: no debounce, no cancelling, no events you mustn’t miss. So the rule of thumb isn’t “RxJS out” but: state in signals, event streams in RxJS, and <code>toSignal</code>/<code>toObservable</code> as the bridge.</p>')
});

LESSONS.push({
  id:'typeahead', cat:'rxjs', order:20,
  title:tx('Suchfeld mit debounceTime und switchMap','Search box with debounceTime and switchMap'),
  short:tx('Warten, bis getippt ist, Doppeltes weglassen, alte Anfragen kündigen – die klassische Typeahead-Kette.','Wait until typing stops, skip duplicates, cancel old requests – the classic typeahead chain.'),
  keys:'debounceTime distinctUntilChanged switchMap filter typeahead autocomplete suche search valueChanges race condition',
  status:'stable',
  refs:[[tx('API: debounceTime','API: debounceTime'),'https://rxjs.dev/api/operators/debounceTime'],
        [tx('API: distinctUntilChanged','API: distinctUntilChanged'),'https://rxjs.dev/api/operators/distinctUntilChanged'],
        [tx('Angular-Doku: toSignal','Angular docs: toSignal'),'https://angular.dev/ecosystem/rxjs-interop#create-a-signal-from-an-rxjs-observable-with-tosignal']],
  rule:tx('Ein Suchfeld schickt nicht bei jedem Tastendruck eine Anfrage. Die Kette lautet: <code>debounceTime</code> (Pause abwarten) → <code>filter</code> (Mindestlänge) → <code>distinctUntilChanged</code> (gleicher Begriff? nichts tun) → <code>switchMap</code> (alte Anfrage kündigen). Nur so gehört die angezeigte Antwort sicher zur aktuellen Eingabe.','A search box doesn’t send a request on every keystroke. The chain is: <code>debounceTime</code> (wait for a pause) → <code>filter</code> (minimum length) → <code>distinctUntilChanged</code> (same term? do nothing) → <code>switchMap</code> (cancel the old request). Only then is the displayed response guaranteed to belong to the current input.'),
  apis:[['debounceTime(ms)','debounceTime(300)',tx('Gibt einen Wert erst weiter, wenn <code>ms</code> lang kein neuer kam – nur den letzten.','Only passes a value on once no new one arrived for <code>ms</code> – only the last one.')],
        ['filter(fn)','filter(q => q.length >= 2)',tx('Lässt nur Werte durch, für die <code>fn</code> <code>true</code> liefert.','Only lets values through for which <code>fn</code> returns <code>true</code>.')],
        ['distinctUntilChanged()','distinctUntilChanged(compare?)',tx('Verwirft einen Wert, der gleich dem zuletzt weitergegebenen ist.','Drops a value equal to the last one passed on.')],
        ['switchMap(fn)','switchMap(q => api.search(q))',tx('Startet die Anfrage und kündigt die vorige, falls sie noch läuft.','Starts the request and cancels the previous one if it’s still running.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Suchfeld','Search box')}</h3>
    <fieldset class="seg typeahead-mode"><legend>${tx('Variante','Variant')}</legend><div class="seg-opts">
      <label><input type="radio" name="typeahead-mode" value="naive"> ${tx('Naiv','Naive')}</label>
      <label><input type="radio" name="typeahead-mode" value="good" checked> ${tx('Mit Operatoren','With operators')}</label></div></fieldset>
    <div class="field typeahead-field"><label for="typeahead-q">${tx('Angular-API suchen','Search Angular APIs')}</label><input class="input" id="typeahead-q" type="search" autocomplete="off" spellcheck="false" aria-describedby="typeahead-status"></div>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="typeahead-type">${tx('„sig“ schnell tippen','Type “sig” fast')}</button><button type="button" class="btn btn-secondary" id="typeahead-back">${tx('„n“ tippen und gleich löschen','Type “n” and delete it')}</button></div>
  </div>
  <div class="sim-card"><h3>${tx('Angezeigt','Displayed')}</h3>
    <p class="typeahead-status" id="typeahead-status" aria-live="polite">${tx('Noch keine Suche.','No search yet.')}</p>
    <ul class="typeahead-results" id="typeahead-results" aria-label="${tx('Treffer','Results')}"></ul>
    <p class="hint typeahead-count">${tx('Anfragen','Requests')}: <b id="typeahead-req">0</b> · ${tx('gekündigt','cancelled')}: <b id="typeahead-can">0</b> · ${tx('veraltete Antworten angezeigt','stale responses shown')}: <b id="typeahead-stale">0</b></p>
  </div>
</div>
<h3 class="typeahead-h">${tx('Was durch die Kette geht','What goes through the chain')}</h3>
<div id="typeahead-dia"></div>
${RX.legend(['in','run','done','cancelled','ignored','out'])}
<p class="demo-note">${tx('Probier: Schalte auf „Naiv“ und tippe schnell „sig“ – drei Anfragen mit zufälliger Dauer, die langsamste gewinnt, oft steht dann das Ergebnis für „s“ da. Mit Operatoren: eine Anfrage nach der Pause. Der Button mit dem „n“ landet wieder bei „sig“ – <code>distinctUntilChanged</code> verwirft das.','Try: switch to “Naive” and quickly type “sig” – three requests of random duration, the slowest one wins, often leaving the result for “s” on screen. With operators: one request after the pause. The button with the “n” ends at “sig” again – <code>distinctUntilChanged</code> drops it.')}</p>`,
  init(root){
    const API=['signal','computed','effect','linkedSignal','resource','httpResource','input','output','model','viewChild','contentChildren','inject','DestroyRef','toSignal','toObservable','takeUntilDestroyed','outputFromObservable','provideHttpClient','withInterceptors','provideRouter','withComponentInputBinding','FormControl','FormGroup','NonNullableFormBuilder','Validators','afterNextRender','untracked','signalStore','ChangeDetectionStrategy'];
    const q=$('#typeahead-q',root),list=$('#typeahead-results',root),status=$('#typeahead-status',root);
    const d=RX.diagram($('#typeahead-dia',root),{lanes:[{id:'in',label:tx('Eingabe','input')},{id:'deb',label:'debounce'},{id:'dist',label:'filter+distinct'},{id:'req',label:tx('Anfragen','requests'),rows:3},{id:'out',label:tx('Ergebnis','result')}],span:6000});
    let mode='good',sub=null,req=0,can=0,stale=0,timers=[];
    const term$=new RX.Subject();
    const api=term=>{let bar;return RX.request({ms:()=>RX.rand(300,1300),value:()=>({term,hits:API.filter(a=>a.toLowerCase().includes(term.toLowerCase()))}),
      onStart:()=>{req++;bar=d.bar('req',term);cnt()},onEnd:st=>{bar.end(st);if(st==='cancelled'){can++;cnt()}}})};
    const cnt=()=>{$('#typeahead-req',root).textContent=req;$('#typeahead-can',root).textContent=can;$('#typeahead-stale',root).textContent=stale};
    function show({term,hits}){
      const current=q.value.trim(),old=term!==current;
      if(old){stale++;cnt()}
      d.marble('out',term,old?'rx-err':'rx-out',old?tx('veraltet','stale'):'');
      list.innerHTML=hits.slice(0,6).map(h=>`<li><code>${esc(h)}</code></li>`).join('');
      status.innerHTML=(old?`<b class="typeahead-old">${tx('Veraltet!','Stale!')}</b> `:'')+tx(`${hits.length} Treffer für „${esc(term)}“`,`${hits.length} results for “${esc(term)}”`);
    }
    function wire(){
      sub&&sub.unsubscribe();
      const tapDeb=RX.tap(v=>d.marble('deb',v||'∅'));
      sub=(mode==='naive'
        ?term$.pipe(RX.filter(v=>v.trim().length>0),RX.mergeMap(t=>api(t.trim())))
        :term$.pipe(RX.debounceTime(300),tapDeb,RX.map(t=>t.trim()),
            RX.filter(t=>{if(t.length<2)d.marble('dist',t||'∅','rx-ignored',tx('zu kurz','too short'));return t.length>=2}),
            RX.distinctUntilChanged((a,b)=>{const same=a===b;if(same)d.marble('dist',b,'rx-ignored',tx('gleich wie vorher','same as before'));return same}),
            RX.tap(t=>d.marble('dist',t)),
            RX.switchMap(t=>api(t).pipe(RX.catchError(()=>RX.of({term:t,hits:[]}))))
          )).subscribe(show);
    }
    function emit(v){d.marble('in',v.slice(-3)||'∅');term$.next(v)}
    q.addEventListener('input',()=>emit(q.value));
    function typeSeq(seq){timers.forEach(clearTimeout);timers=[];seq.forEach(([v,ms])=>timers.push(setTimeout(()=>{q.value=v;emit(v)},ms)))}
    root.addEventListener('click',e=>{
      if(e.target.closest('#typeahead-type')){q.value='';emit('');typeSeq([['s',120],['si',240],['sig',360]])}
      if(e.target.closest('#typeahead-back'))typeSeq([[q.value.trim()+'n',100],[q.value.trim(),200]]);
    });
    root.addEventListener('change',e=>{if(e.target.name==='typeahead-mode'){mode=e.target.value;wire()}});
    wire();
    return ()=>{sub&&sub.unsubscribe();timers.forEach(clearTimeout);d.destroy()};
  },
  css:`.typeahead-mode,.typeahead-field{margin-bottom:12px}.typeahead-auto{margin-bottom:8px}.typeahead-status{margin:8px 0;min-height:1.5em;font-weight:700}.typeahead-old{color:var(--danger)}.typeahead-results{margin:0;padding-left:1.2em;display:grid;gap:4px}.typeahead-count{margin-top:10px}.typeahead-h{margin:16px 0 8px}`,
  bad:{code:`this.query.valueChanges.subscribe(q => {
  this.api.search(q).subscribe(hits => this.hits.set(hits));
});`,
    note:tx('Jeder Tastendruck ist eine Anfrage, und die Antworten kommen in beliebiger Reihenfolge an: Tippt man „sig“, kann die langsame Antwort für „s“ zuletzt eintreffen und das richtige Ergebnis überschreiben.','Every keystroke is a request, and responses arrive in any order: typing “sig”, the slow response for “s” may arrive last and overwrite the right result.')},
  good:{code:`@Component({
  selector: 'app-api-search',
  imports: [ReactiveFormsModule],
  template: \`
    <label for="q">Search</label>
    <input id="q" type="search" [formControl]="query" />
    <ul>
      @for (hit of hits(); track hit) { <li>{{ hit }}</li> }
    </ul>
  \`,
})
export class ApiSearch {
  private readonly api = inject(ApiService);
  readonly query = new FormControl('', { nonNullable: true });

  readonly hits = toSignal(
    this.query.valueChanges.pipe(
      debounceTime(300),
      map(q => q.trim()),
      filter(q => q.length >= 2),
      distinctUntilChanged(),
      switchMap(q => this.api.search(q).pipe(catchError(() => of([])))),
    ),
    { initialValue: [] },
  );
}`,
    note:tx('<code>toSignal()</code> abonniert und räumt beim Zerstören der Komponente auf. Das <code>catchError</code> sitzt <em>innerhalb</em> von <code>switchMap</code>, damit ein Fehler nur diese eine Suche beendet, nicht den ganzen Stream.','<code>toSignal()</code> subscribes and cleans up when the component is destroyed. The <code>catchError</code> sits <em>inside</em> <code>switchMap</code>, so an error only ends this one search, not the whole stream.')},
  do:tx(['Reihenfolge einhalten: erst <code>debounceTime</code>, dann <code>map</code>/<code>filter</code>, dann <code>distinctUntilChanged</code>, zuletzt <code>switchMap</code>.','Den Begriff vor dem Vergleich normalisieren (<code>trim</code>, eventuell <code>toLowerCase</code>) – sonst gilt „sig “ als neu.','Fehler innerhalb von <code>switchMap</code> abfangen.','Überlegen, was bei zu kurzer Eingabe passiert: <code>filter</code> lässt das alte Ergebnis stehen; soll die Liste leer werden, stattdessen auf <code>of([])</code> umschalten.'],
        ['Keep the order: <code>debounceTime</code> first, then <code>map</code>/<code>filter</code>, then <code>distinctUntilChanged</code>, <code>switchMap</code> last.','Normalise the term before comparing (<code>trim</code>, maybe <code>toLowerCase</code>) – otherwise “sig ” counts as new.','Catch errors inside <code>switchMap</code>.','Decide what happens with too short input: <code>filter</code> leaves the old result; if the list should empty, switch to <code>of([])</code> instead.']),
  dont:tx(['Kein <code>distinctUntilChanged</code> vor <code>debounceTime</code> – dann vergleicht es jeden Tastendruck statt des fertigen Begriffs.','Kein <code>mergeMap</code> oder verschachteltes <code>subscribe</code> für Suchen.','Die Wartezeit nicht zu lang wählen: 200–400 ms fühlen sich flüssig an.'],
        ['No <code>distinctUntilChanged</code> before <code>debounceTime</code> – it would compare every keystroke instead of the finished term.','No <code>mergeMap</code> or nested <code>subscribe</code> for searches.','Don’t make the delay too long: 200–400 ms feels smooth.']),
  why:tx('<p>Jeder Operator löst ein eigenes Problem: <code>debounceTime</code> spart Anfragen während des Tippens, <code>filter</code> verhindert sinnlose Suchen nach einem Buchstaben, <code>distinctUntilChanged</code> fängt „tippen und wieder löschen“ ab, und <code>switchMap</code> garantiert, dass nur die Antwort zur letzten Anfrage ankommt – die vorige wird abgebrochen, der Browser beendet den HTTP-Request.</p><p>Ohne <code>switchMap</code> entsteht eine Race Condition: Netzwerklatenz ist nicht konstant, also kommen Antworten nicht in der Reihenfolge der Anfragen an. Das fällt im Entwickler-WLAN selten auf und im Zug ständig.</p>',
           '<p>Every operator solves its own problem: <code>debounceTime</code> saves requests while typing, <code>filter</code> prevents pointless one-letter searches, <code>distinctUntilChanged</code> catches “type and delete again”, and <code>switchMap</code> guarantees only the response to the latest request arrives – the previous one is aborted, the browser ends the HTTP request.</p><p>Without <code>switchMap</code> you get a race condition: network latency isn’t constant, so responses don’t arrive in request order. You rarely notice on office Wi-Fi and constantly on a train.</p>'),
  test:{code:`import { TestScheduler } from 'rxjs/testing';

// the chain extracted into a function so it can be tested
const searchPipeline = (term$: Observable<string>, api: (q: string) => Observable<string[]>) =>
  term$.pipe(debounceTime(300), map(q => q.trim()), filter(q => q.length >= 2),
             distinctUntilChanged(), switchMap(q => api(q)));

it('searches once after a 300 ms pause', () => {
  new TestScheduler((a, e) => expect(a).toEqual(e)).run(({ cold, expectObservable }) => {
    const typing = cold('a 99ms b 99ms c 499ms |', { a: 's', b: 'si', c: 'sig' });
    const api = (q: string) => cold('--r|', { r: [q] });
    expectObservable(searchPipeline(typing, api)).toBe('502ms r 197ms |', { r: ['sig'] });
  });
});`,note:tx('Im <code>TestScheduler.run()</code> laufen auch <code>debounceTime</code> und Co. in virtueller Zeit. Die Kette in eine Funktion auszulagern macht sie ohne Komponente testbar.','Inside <code>TestScheduler.run()</code>, <code>debounceTime</code> and friends run in virtual time too. Extracting the chain into a function makes it testable without a component.')}
});

LESSONS.push({
  id:'unsubscribe', cat:'rxjs', order:30,
  title:tx('Abmelden: takeUntilDestroyed, async-Pipe, toSignal','Unsubscribing: takeUntilDestroyed, async pipe, toSignal'),
  short:tx('Jede Subscription braucht ein Ende – sonst lebt sie weiter, obwohl die Komponente längst weg ist.','Every subscription needs an end – otherwise it lives on long after the component is gone.'),
  keys:'unsubscribe takeUntilDestroyed DestroyRef async pipe memory leak speicherleck subscription ngOnDestroy takeUntil',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: takeUntilDestroyed','Angular docs: takeUntilDestroyed'),'https://angular.dev/ecosystem/rxjs-interop/take-until-destroyed'],
        [tx('API: DestroyRef','API: DestroyRef'),'https://angular.dev/api/core/DestroyRef'],
        [tx('API: AsyncPipe','API: AsyncPipe'),'https://angular.dev/api/common/AsyncPipe']],
  rule:tx('Ein <code>subscribe()</code> auf einen langlebigen Stream (Store, WebSocket, <code>interval</code>, <code>valueChanges</code>) muss an die Lebensdauer der Komponente gebunden sein. Am besten gar nicht selbst abonnieren (<code>toSignal()</code> oder <code>async</code>-Pipe) – und wenn doch, mit <code>takeUntilDestroyed()</code> als letztem Operator.','A <code>subscribe()</code> to a long-lived stream (store, WebSocket, <code>interval</code>, <code>valueChanges</code>) must be tied to the component’s lifetime. Best not to subscribe yourself at all (<code>toSignal()</code> or the <code>async</code> pipe) – and if you do, with <code>takeUntilDestroyed()</code> as the last operator.'),
  apis:[['takeUntilDestroyed()','takeUntilDestroyed(destroyRef?: DestroyRef)',tx('Beendet den Stream, wenn der Kontext (Komponente, Direktive, Service) zerstört wird. Ohne Argument nur im Injection Context.','Completes the stream when the context (component, directive, service) is destroyed. Without an argument only in an injection context.')],
        ['DestroyRef','inject(DestroyRef).onDestroy(fn)',tx('Callback beim Zerstören registrieren; liefert eine Funktion zum Abmelden. <code>destroyed</code> sagt, ob es schon passiert ist.','Register a callback for destruction; returns a function to unregister. <code>destroyed</code> tells whether it already happened.')],
        ['async','{{ obs$ | async }}',tx('Abonniert im Template, meldet sich beim Zerstören der View selbst ab.','Subscribes in the template and unsubscribes itself when the view is destroyed.')],
        ['toSignal()','toSignal(obs$, { initialValue })',tx('Abonniert sofort und meldet sich über den <code>DestroyRef</code> des Kontexts ab.','Subscribes immediately and unsubscribes via the context’s <code>DestroyRef</code>.')]],
  demo:`<div class="sim-row unsubscribe-ctrl">
  <button type="button" class="btn btn-primary" id="unsubscribe-toggle">${tx('Komponente öffnen','Open component')}</button>
  <button type="button" class="btn btn-secondary" id="unsubscribe-cycle">${tx('3× öffnen und schließen','Open and close 3×')}</button>
  <button type="button" class="btn btn-ghost" id="unsubscribe-reset">${tx('Zurücksetzen','Reset')}</button>
</div>
<p class="unsubscribe-state" id="unsubscribe-state" aria-live="polite"></p>
<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Manuell','Manual')} <code>subscribe()</code></h3><p class="hint">${tx('ohne Abmelden','without unsubscribing')}</p><p>${tx('Aktive Subscriptions','Live subscriptions')}: <span class="rx-count" id="unsubscribe-n-manual">0</span></p></div>
  <div class="sim-card"><h3><code>takeUntilDestroyed()</code></h3><p class="hint">${tx('beendet beim Zerstören','completes on destroy')}</p><p>${tx('Aktive Subscriptions','Live subscriptions')}: <span class="rx-count" id="unsubscribe-n-tud">0</span></p></div>
  <div class="sim-card"><h3><code>async</code> / <code>toSignal()</code></h3><p class="hint">${tx('Angular meldet ab','Angular unsubscribes')}</p><p>${tx('Aktive Subscriptions','Live subscriptions')}: <span class="rx-count" id="unsubscribe-n-async">0</span></p></div>
</div>
<h3 class="unsubscribe-h">${tx('Wer bekommt den Tick vom Store?','Who receives the store tick?')}</h3>
<ul class="sim-log" id="unsubscribe-log" aria-label="${tx('Protokoll','Log')}"></ul>
<p class="demo-note">${tx('Probier: „3× öffnen und schließen“. Der Store sendet jede Sekunde einen Wert. Beim manuellen <code>subscribe()</code> zählen die Subscriptions weiter hoch – drei zerstörte Komponenten reagieren noch immer auf jeden Tick (und halten ihren Speicher fest). Die beiden anderen Zähler fallen beim Schließen auf 0.','Try: “Open and close 3×”. The store emits a value every second. With the manual <code>subscribe()</code> the subscriptions keep counting up – three destroyed components still react to every tick (and keep their memory alive). The other two counters drop to 0 on close.')}</p>`,
  init(root){
    const {log}=NG;
    const ul=$('#unsubscribe-log',root);
    let store,tick=0,iv,live,inst,open,n,timers=[];
    /* Mini-DestroyRef wie in Angular: onDestroy liefert eine Abmeldefunktion */
    const makeDestroyRef=()=>{const cbs=new Set();return {destroyed:false,onDestroy(fn){cbs.add(fn);return ()=>cbs.delete(fn)},destroy(){this.destroyed=true;[...cbs].forEach(f=>f());cbs.clear()}}};
    /* takeUntilDestroyed – derselbe Aufbau wie in @angular/core/rxjs-interop */
    const takeUntilDestroyed=ref=>{
      const destroyed$=new RX.Observable(sub=>{if(ref.destroyed){sub.next();return}return ref.onDestroy(()=>sub.next())});
      return src=>src.pipe(RX.takeUntil(destroyed$));
    };
    /* Zählt aktive Subscriptions je Variante */
    const counted=v=>new RX.Observable(sub=>{live[v]++;upd();const s=store.subscribe({next:x=>sub.next(x)});return ()=>{live[v]--;s.unsubscribe();upd()}});
    function upd(){
      [['manual','manual'],['tud','tud'],['async','async']].forEach(([k,id])=>{const el=$('#unsubscribe-n-'+id,root);el.textContent=live[k];el.className='rx-count'+(k==='manual'&&live.manual>(open?1:0)?' rx-bad':live[k]===0&&!open?' rx-good':'')});
      $('#unsubscribe-toggle',root).textContent=open?tx('Komponente schließen','Close component'):tx('Komponente öffnen','Open component');
      $('#unsubscribe-state',root).textContent=open?tx(`Komponente #${n} ist offen.`,`Component #${n} is open.`):tx(`Keine Komponente offen – bisher ${n}× geöffnet.`,`No component open – opened ${n}× so far.`);
    }
    function openComp(){
      n++;const id=n,ref=makeDestroyRef(),comp={id,ref,alive:true,got:[]};
      counted('manual').subscribe(v=>comp.got.push(['manual',v]));                           // Leck
      counted('tud').pipe(takeUntilDestroyed(ref)).subscribe(v=>comp.got.push(['tud',v]));  // endet mit ref.destroy()
      const asyncSub=counted('async').subscribe(v=>comp.got.push(['async',v]));             // wie AsyncPipe/toSignal:
      ref.onDestroy(()=>asyncSub.unsubscribe());                                              // Abmelden beim Zerstören
      inst.push(comp);open=comp;
      log(ul,`<span class="hl">${tx('erzeugt','created')}</span> ${tx('Komponente','component')} #${id}`);upd();
    }
    function closeComp(){
      if(!open)return;open.alive=false;open.ref.destroy();
      log(ul,`<span class="t">${tx('zerstört','destroyed')}</span> ${tx('Komponente','component')} #${open.id}`);open=null;upd();
    }
    function reset(){
      clearInterval(iv);timers.forEach(clearTimeout);timers=[];
      store&&store.complete();
      store=new RX.Subject();live={manual:0,tud:0,async:0};inst=[];open=null;n=0;tick=0;ul.innerHTML='';
      iv=setInterval(()=>{
        tick++;inst.forEach(c=>c.got=[]);store.next(tick);
        const got=inst.filter(c=>c.got.length);
        if(!got.length)return;
        log(ul,`<span class="t">tick ${tick}</span> → `+got.map(c=>c.alive?`#${c.id} ✓ (${c.got.length}×)`:`<span class="unsubscribe-zombie">#${c.id} ${tx('zerstört','destroyed')}, ${tx('reagiert trotzdem','still reacts')}</span>`).join(', '));
      },1000);
      upd();
    }
    reset();
    root.addEventListener('click',e=>{
      if(e.target.closest('#unsubscribe-toggle'))open?closeComp():openComp();
      if(e.target.closest('#unsubscribe-cycle')){closeComp();[0,1,2].forEach(i=>{timers.push(setTimeout(openComp,i*500),setTimeout(closeComp,i*500+250))})}
      if(e.target.closest('#unsubscribe-reset'))reset();
    });
    return ()=>{clearInterval(iv);timers.forEach(clearTimeout);store.complete()};
  },
  css:`.unsubscribe-ctrl{margin-bottom:8px}.unsubscribe-state{margin:0 0 12px;font-weight:700}.unsubscribe-h{margin:16px 0 8px}.unsubscribe-zombie{color:var(--danger);font-weight:700}`,
  bad:{code:`export class Ticker implements OnInit {
  private readonly store = inject(Store);
  count = 0;

  ngOnInit() {
    // läuft weiter, nachdem die Komponente zerstört wurde
    this.store.select(selectTicks).subscribe(t => this.count = t);
  }
}`.replace('läuft weiter, nachdem die Komponente zerstört wurde',tx('läuft weiter, nachdem die Komponente zerstört wurde','keeps running after the component is destroyed')),
    note:tx('Der Store lebt so lange wie die App. Seine Subscription hält die Komponente samt Callback im Speicher, und bei jedem Öffnen kommt eine dazu. Der alte Weg mit <code>Subject</code> + <code>takeUntil</code> + <code>ngOnDestroy</code> funktioniert, ist aber Boilerplate, die man leicht vergisst.','The store lives as long as the app. Its subscription keeps the component and callback in memory, and every open adds one more. The old way with <code>Subject</code> + <code>takeUntil</code> + <code>ngOnDestroy</code> works, but it’s boilerplate that’s easy to forget.')},
  good:{code:`export class Ticker {
  private readonly store = inject(Store);

  // 1. am besten: gar nicht selbst abonnieren
  readonly count = toSignal(this.store.select(selectTicks), { initialValue: 0 });

  constructor() {
    // 2. wenn es ein Seiteneffekt sein muss: takeUntilDestroyed als letzter Operator
    this.store.select(selectTicks).pipe(
      filter(t => t % 10 === 0),
      takeUntilDestroyed(),
    ).subscribe(t => console.log('milestone', t));
  }
}`.replace('1. am besten: gar nicht selbst abonnieren',tx('1. am besten: gar nicht selbst abonnieren','1. best: don’t subscribe yourself at all')).replace('2. wenn es ein Seiteneffekt sein muss: takeUntilDestroyed als letzter Operator',tx('2. wenn es ein Seiteneffekt sein muss: takeUntilDestroyed als letzter Operator','2. if it must be a side effect: takeUntilDestroyed as the last operator')),
    note:tx('<code>takeUntilDestroyed()</code> ohne Argument holt sich den <code>DestroyRef</code> per <code>inject()</code> – also nur im Konstruktor oder in Feldinitialisierern. In <code>ngOnInit</code> oder einem Klick-Handler gib <code>takeUntilDestroyed(this.destroyRef)</code> mit.','<code>takeUntilDestroyed()</code> without an argument gets the <code>DestroyRef</code> via <code>inject()</code> – so only in the constructor or field initialisers. In <code>ngOnInit</code> or a click handler pass <code>takeUntilDestroyed(this.destroyRef)</code>.')},
  do:tx(['Werte fürs Template mit <code>toSignal()</code> oder der <code>async</code>-Pipe holen – dann meldet Angular ab.','<code>takeUntilDestroyed()</code> als <strong>letzten</strong> Operator setzen, damit auch vorherige <code>switchMap</code>-Requests mit beendet werden.','Außerhalb des Injection Context den <code>DestroyRef</code> vorher per <code>inject(DestroyRef)</code> holen und übergeben.','Für Nicht-RxJS-Aufräumarbeiten (Timer, Listener) <code>inject(DestroyRef).onDestroy(fn)</code> nutzen.'],
        ['Get template values with <code>toSignal()</code> or the <code>async</code> pipe – then Angular unsubscribes.','Put <code>takeUntilDestroyed()</code> <strong>last</strong>, so earlier <code>switchMap</code> requests are ended too.','Outside an injection context, get the <code>DestroyRef</code> beforehand via <code>inject(DestroyRef)</code> and pass it.','For non-RxJS cleanup (timers, listeners) use <code>inject(DestroyRef).onDestroy(fn)</code>.']),
  dont:tx(['Nicht auf das Aufräumen verzichten, weil „die Komponente eh selten zerstört wird“ – Routenwechsel zerstören ständig.','Kein <code>takeUntilDestroyed()</code> ohne Argument in <code>ngOnInit</code>: Das wirft NG0203 (kein Injection Context).','Kein <code>.subscribe()</code> nur, um einen Wert in ein Feld zu kopieren, das dann im Template steht.'],
        ['Don’t skip cleanup because “the component is rarely destroyed” – route changes destroy all the time.','No argument-less <code>takeUntilDestroyed()</code> in <code>ngOnInit</code>: it throws NG0203 (no injection context).','No <code>.subscribe()</code> just to copy a value into a field that’s shown in the template.']),
  why:tx('<p>Ein Observable weiß nichts von Komponenten. Solange jemand abonniert ist, hält die Quelle eine Referenz auf den Callback – und der Callback auf die Komponente. Endliche Streams wie ein einzelner <code>HttpClient</code>-Request enden von selbst; langlebige Streams (Store, <code>valueChanges</code>, <code>interval</code>, Router-Events) nicht. Ergebnis: Speicherlecks und Handler, die in zerstörten Komponenten weiterlaufen.</p><p><code>takeUntilDestroyed()</code> hängt ein <code>takeUntil</code> an ein Observable, das feuert, sobald der <code>DestroyRef</code> des aktuellen Kontexts zerstört wird. Die <code>async</code>-Pipe und <code>toSignal()</code> machen dasselbe automatisch – deshalb sind sie der bequemste Weg.</p>',
           '<p>An observable knows nothing about components. As long as someone is subscribed, the source holds a reference to the callback – and the callback to the component. Finite streams like a single <code>HttpClient</code> request end on their own; long-lived streams (store, <code>valueChanges</code>, <code>interval</code>, router events) don’t. The result: memory leaks and handlers that keep running in destroyed components.</p><p><code>takeUntilDestroyed()</code> adds a <code>takeUntil</code> with an observable that fires as soon as the current context’s <code>DestroyRef</code> is destroyed. The <code>async</code> pipe and <code>toSignal()</code> do the same automatically – that’s why they are the most convenient way.</p>'),
  test:{code:`it('unsubscribes when the component is destroyed', () => {
  const ticks = new Subject<number>();
  TestBed.configureTestingModule({ providers: [{ provide: TICKS, useValue: ticks }] });

  const fixture = TestBed.createComponent(Ticker);
  expect(ticks.observed).toBe(true);

  fixture.destroy();
  expect(ticks.observed).toBe(false);
});`,note:tx('<code>Subject.observed</code> verrät, ob noch jemand abonniert ist. <code>fixture.destroy()</code> löst alle <code>DestroyRef</code>-Callbacks aus. (<code>TICKS</code> ist hier ein eigenes InjectionToken für den Stream.)','<code>Subject.observed</code> tells whether anyone is still subscribed. <code>fixture.destroy()</code> triggers all <code>DestroyRef</code> callbacks. (<code>TICKS</code> is a custom injection token for the stream here.)')}
});

LESSONS.push({
  id:'computed', cat:'signals', order:20,
  title:tx('Abgeleitete Werte mit computed()','Derived values with computed()'),
  short:tx('Was sich aus anderen Signals ergibt, wird berechnet – nicht per effect() nachgeschrieben.','Whatever follows from other signals is computed – not copied over with effect().'),
  keys:'computed signal abgeleitet derived memo lazy',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Computed signals','Angular docs: Computed signals'),'https://angular.dev/guide/signals#computed-signals'],
        [tx('API: computed()','API: computed()'),'https://angular.dev/api/core/computed']],
  rule:tx('Alles, was sich aus anderen Signals <em>ergibt</em>, ist ein <code>computed()</code>. Es rechnet erst, wenn jemand den Wert liest, merkt sich das Ergebnis und rechnet nur neu, wenn sich eine Abhängigkeit wirklich geändert hat.','Anything that <em>follows</em> from other signals is a <code>computed()</code>. It only calculates when someone reads the value, remembers the result and only recalculates when a dependency really changed.'),
  apis:[['computed(fn)','computed(() => T, { equal? })',tx('Schreibgeschütztes Signal, abgeleitet aus allen Signals, die <code>fn</code> liest.','Read-only signal derived from every signal <code>fn</code> reads.')],
        ['equal','(a: T, b: T) => boolean',tx('Eigener Vergleich: Gilt das neue Ergebnis als gleich, merken Abhängige nichts.','Custom comparison: if the new result counts as equal, dependents don’t notice anything.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Warenkorb','Cart')}</h3>
    <p class="computed-line">${tx('Preis','Price')}: <b id="computed-price"></b> · ${tx('Menge','Quantity')}: <b id="computed-qty"></b></p>
    <div class="sim-row"><button type="button" class="btn btn-secondary" id="computed-more">${tx('Menge +1','Quantity +1')}</button><button type="button" class="btn btn-secondary" id="computed-same">${tx('Preis gleich setzen','Set same price')}</button><button type="button" class="btn btn-secondary" id="computed-cheap">${tx('Preis −10 %','Price −10 %')}</button></div>
    <label class="check-row computed-show"><input type="checkbox" id="computed-show" checked> ${tx('Summe im Template anzeigen','Show total in the template')}</label>
    <p class="computed-total" aria-live="polite">${tx('Summe','Total')}: <b id="computed-total"></b></p>
  </div>
  <div class="sim-card"><h3>${tx('Was Angular tut','What Angular does')}</h3>
    <p class="sim-row"><span class="sim-node" id="computed-n-price">price</span><span class="sim-node" id="computed-n-qty">qty</span><span aria-hidden="true">→</span><span class="sim-node" id="computed-n-total">total</span></p>
    <p class="hint">${tx('Berechnungen von <code>total</code> bisher:','Calculations of <code>total</code> so far:')} <b id="computed-count">0</b></p>
    <ul class="sim-log" id="computed-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: „Preis gleich setzen“ – kein Neuberechnen, weil der Wert gleich bleibt. Nimm den Haken weg und ändere die Menge: Solange niemand <code>total()</code> liest, rechnet es auch nicht. Setz den Haken wieder – jetzt rechnet es genau einmal.','Try: “Set same price” – no recalculation, because the value stays the same. Untick the box and change the quantity: as long as nobody reads <code>total()</code>, it doesn’t calculate. Tick it again – now it calculates exactly once.')}</p>`,
  init(root){
    const {signal,computed,effect,watch,log,flash}=NG;
    const fmt=v=>new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}).format(v);
    const price=signal(12.5,{name:'price'}),qty=signal(2,{name:'qty'}),show=signal(true,{name:'show'});
    let n=0;
    const total=computed(()=>{n++;return price()*qty()},{name:'total'});
    const ul=$('#computed-log',root);
    const off=watch(ev=>{
      if(ev.type==='set'){flash($(`#computed-n-${ev.name}`,root));log(ul,`<span class="t">set</span> ${ev.name} = ${esc(String(ev.value))}`)}
      if(ev.type==='same')log(ul,`<span class="t">set</span> ${ev.name} = ${esc(String(ev.value))} – ${tx('gleicher Wert, nichts passiert','same value, nothing happens')}`);
      if(ev.type==='compute'&&ev.name==='total'){flash($('#computed-n-total',root));$('#computed-count',root).textContent=n;log(ul,`<span class="hl">${tx('berechnet','computed')}</span> total = ${esc(String(ev.value))}`)}
    });
    /* Das „Template“: ein effect, der nur liest, was gerade angezeigt wird */
    const view=effect(()=>{
      $('#computed-price',root).textContent=fmt(price());
      $('#computed-qty',root).textContent=qty();
      $('#computed-total',root).textContent=show()?fmt(total()):'—';
    },{name:'template'});
    root.addEventListener('click',e=>{
      if(e.target.closest('#computed-more'))qty.update(q=>q+1);
      if(e.target.closest('#computed-same'))price.set(price.node.value);
      if(e.target.closest('#computed-cheap'))price.update(p=>Math.round(p*90)/100);
    });
    $('#computed-show',root).addEventListener('change',e=>show.set(e.target.checked));
    return ()=>{off();view.destroy()};
  },
  css:`.computed-line,.computed-total{margin:0 0 12px}.computed-total{margin:12px 0 0;font-size:1.125rem}.computed-show{margin-top:12px}`,
  bad:{code:`total = signal(0);

constructor() {
  // Abgeleiteten Wert per effect nachschreiben
  effect(() => {
    this.total.set(this.price() * this.qty());
  });
}`.replace('Abgeleiteten Wert per effect nachschreiben',tx('Abgeleiteten Wert per effect nachschreiben','Copy the derived value over with an effect')),
    note:tx('Der Wert ist kurz veraltet (effects laufen später), kann von außen überschrieben werden, und es gibt eine unnötige Runde durch die Change Detection.','The value is briefly stale (effects run later), can be overwritten from outside, and it costs an extra round through change detection.')},
  good:{code:`price = signal(12.5);
qty = signal(2);
total = computed(() => this.price() * this.qty());`,
    note:tx('Immer aktuell, schreibgeschützt, lazy und gemerkt – Angular weiß von selbst, dass <code>total</code> von <code>price</code> und <code>qty</code> abhängt.','Always up to date, read-only, lazy and memoised – Angular knows by itself that <code>total</code> depends on <code>price</code> and <code>qty</code>.')},
  do:tx(['Abgeleitete Werte (Summen, Filter, Formatierungen) immer als <code>computed()</code>.','Die Berechnung rein halten: nur lesen und zurückgeben, keine Seiteneffekte.','Teure Berechnungen ruhig in <code>computed()</code> legen – sie laufen nur bei echten Änderungen.','Für Objekte oder Arrays ein eigenes <code>equal</code> angeben, wenn neue Instanzen mit gleichem Inhalt nichts auslösen sollen.'],
        ['Always use <code>computed()</code> for derived values (totals, filters, formatting).','Keep the calculation pure: only read and return, no side effects.','Feel free to put expensive calculations into <code>computed()</code> – they only run on real changes.','Pass a custom <code>equal</code> for objects or arrays if new instances with equal content shouldn’t trigger anything.']),
  dont:tx(['Kein <code>effect()</code>, das ein anderes Signal setzt, nur um einen Wert abzuleiten.','Keine Signals in <code>computed()</code> schreiben – Angular wirft dann einen Fehler.','Nicht erwarten, dass ein Signal hinter einer Bedingung immer Abhängigkeit ist: Gelesen wird nur, was beim letzten Lauf tatsächlich ausgeführt wurde.'],
        ['No <code>effect()</code> that sets another signal just to derive a value.','Don’t write signals inside <code>computed()</code> – Angular throws an error.','Don’t expect a signal behind a condition to always be a dependency: only what actually ran in the last run is tracked.']),
  why:tx('<p><code>computed()</code> ist ein <strong>memoisierter, lazy</strong> Wert: Angular merkt sich beim Rechnen, welche Signals gelesen wurden (dynamische Abhängigkeiten). Ändert sich eines, wird <code>total</code> nur als „veraltet“ markiert – gerechnet wird erst beim nächsten Lesen. Kommt dasselbe Ergebnis heraus, erfährt niemand davon.</p><p>Der effect-Umweg bricht das: Der Wert liegt eine Weile falsch im Signal, jeder kann <code>total.set()</code> aufrufen, und bei Ketten aus solchen effects entstehen Zwischenzustände, die das Template kurz falsch anzeigt.</p>',
           '<p><code>computed()</code> is a <strong>memoised, lazy</strong> value: while calculating, Angular records which signals were read (dynamic dependencies). When one changes, <code>total</code> is only marked “stale” – the calculation happens on the next read. If the result is the same, nobody hears about it.</p><p>The effect detour breaks this: the value sits wrong in the signal for a while, anyone can call <code>total.set()</code>, and chains of such effects create intermediate states that the template briefly shows.</p>'),
  test:{code:`it('computes the total', () => {
  const price = signal(10);
  const qty = signal(3);
  const total = computed(() => price() * qty());
  expect(total()).toBe(30);
  qty.set(4);
  expect(total()).toBe(40);
});`,note:tx('Signals sind synchron lesbar – für <code>computed()</code> brauchst du weder TestBed noch <code>fakeAsync</code>.','Signals can be read synchronously – <code>computed()</code> needs neither TestBed nor <code>fakeAsync</code>.')}
});

LESSONS.push({
  id:'effect', cat:'signals', order:30,
  title:tx('Seiteneffekte mit effect()','Side effects with effect()'),
  short:tx('effect() gleicht Signals mit der Außenwelt ab – localStorage, Logging, DOM-Bibliotheken. Für abgeleiteten Zustand ist es das falsche Werkzeug.','effect() syncs signals to the outside world – localStorage, logging, DOM libraries. For derived state it’s the wrong tool.'),
  keys:'effect oncleanup cleanup seiteneffekt side effect localstorage injection context injector destroy effectref ng0203',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Anwendungsfälle für effects','Angular docs: Use cases for effects'),'https://angular.dev/guide/signals/effect#use-cases-for-effects'],
        [tx('Angular-Doku: Cleanup-Funktionen','Angular docs: Effect cleanup functions'),'https://angular.dev/guide/signals/effect#effect-cleanup-functions'],
        [tx('Angular-Doku: Injection Context','Angular docs: Injection context'),'https://angular.dev/guide/signals/effect#injection-context']],
