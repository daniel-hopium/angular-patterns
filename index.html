</div>
<p class="demo-note">${tx('Probier: Leg über die Methoden etwas in den Warenkorb – Header und Warenkorb bleiben synchron. Klick dann rechts auf <code>push</code> und <code>set</code>: Im guten Store verhindert TypeScript beides. Schaltest du auf „öffentliches WritableSignal“, landet <code>push</code> unbemerkt im Array (die Anzeige ist veraltet) und <code>set([])</code> leert den Warenkorb von irgendwo aus.','Try: put something into the cart using the methods – header and cart stay in sync. Then click <code>push</code> and <code>set</code> on the right: in the good store TypeScript prevents both. Switch to “public WritableSignal” and <code>push</code> lands in the array unnoticed (the display is stale), and <code>set([])</code> empties the cart from anywhere.')}</p>`,
  init(root){
    const {signal,computed,effect,log,flash}=NG;
    const fmt=v=>new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}).format(v);
    const ul=$('#state-service-log',root);
    const goods={book:{name:tx('Buch','Book'),price:12},mug:{name:tx('Tasse','Mug'),price:8}};
    let mode='good';
    /* CartStore */
    const _items=signal([],{name:'_items'});
    const items=_items.asReadonly();
    const count=computed(()=>_items().length,{name:'count'});
    const total=computed(()=>_items().reduce((s,i)=>s+i.price,0),{name:'total'});
    const store={add:p=>_items.update(l=>[...l,{...p}]),clear:()=>_items.set([])};
    /* Die beiden Verbraucher – wie Templates, die Signals lesen */
    const header=effect(()=>{const el=$('#state-service-badge',root);el.textContent=tx(`Warenkorb (${count()})`,`Cart (${count()})`);flash(el);sync()},{name:'header'});
    const cart=effect(()=>{
      const list=items();
      $('#state-service-items',root).innerHTML=list.length?list.map(i=>`<li>${esc(i.name)} · ${fmt(i.price)}</li>`).join(''):`<li class="hint">${tx('leer','empty')}</li>`;
      $('#state-service-total',root).textContent=`${tx('Summe','Total')}: ${fmt(total())}`;sync();
    },{name:'cart'});
    let shownCount=0;
    function sync(){
      queueMicrotask(()=>{
        const real=_items.node.value.length;shownCount=count();
        $('#state-service-real',root).textContent=`${real} ${tx('Artikel','items')}${real!==shownCount?` – ${tx('Anzeige zeigt','display shows')} ${shownCount}`:''}`;
        $('#state-service-real',root).classList.toggle('state-service-stale',real!==shownCount);
      });
    }
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-ss]')?.dataset.ss;if(!k)return;
      if(k==='add-book'||k==='add-mug'){const p=goods[k.slice(4)];store.add(p);log(ul,`store.add(${esc(p.name)}) → _items.update(l =&gt; [...l, p])`)}
      if(k==='clear'){store.clear();log(ul,'store.clear()')}
      if(k==='push'){
        if(mode==='good')log(ul,`<span class="hl">TS2339</span> ${esc("Property 'push' does not exist on type 'readonly CartItem[]'.")}`);
        else{_items.node.value.push({...goods.book});log(ul,`<span class="hl">items().push()</span> ${tx('– Array mutiert, kein Signal-Update, niemand wird benachrichtigt','– array mutated, no signal update, nobody is notified')}`);sync()}
      }
      if(k==='set'){
        if(mode==='good')log(ul,`<span class="hl">TS2339</span> ${esc("Property 'set' does not exist on type 'Signal<readonly CartItem[]>'.")}`);
        else{_items.set([]);log(ul,`<span class="hl">items.set([])</span> ${tx('– Warenkorb von außen geleert; wer war das?','– cart emptied from outside; who did that?')}`)}
      }
    });
    root.addEventListener('change',e=>{if(e.target.name!=='state-service-mode')return;mode=e.target.value;log(ul,`<span class="t">${mode==='good'?'private _items + items = _items.asReadonly()':'items = signal<CartItem[]>([]) (public)'}</span>`)});
    log(ul,`<span class="t">private _items + items = _items.asReadonly()</span>`);
    return ()=>{header.destroy();cart.destroy()};
  },
  css:`.state-service-top{margin-bottom:14px}.state-service-h{margin-top:16px!important}
.state-service-badge{display:inline-block;margin:0;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line-strong);font-weight:700}
.state-service-badge.flash{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.state-service-items{margin:0 0 8px;padding-left:18px;min-height:48px}
.state-service-total{font-weight:700;margin:0 0 12px}
.state-service-btns{display:grid;gap:8px;margin-bottom:12px}.state-service-btns .btn{justify-content:flex-start}.state-service-btns code{background:none}
.state-service-real{margin:0 0 10px}.state-service-stale{color:var(--danger)}
@media (prefers-reduced-motion:no-preference){.state-service-badge{transition:background .3s,border-color .3s,color .3s}}`,
  bad:{code:`@Injectable({ providedIn: 'root' })
export class CartStore {
  items = signal<CartItem[]>([]);   // public and writable
}

// anywhere in the app
this.store.items().push(item);     // mutates – nobody is notified
this.store.items.set([]);          // anybody can wipe the cart`,
    note:tx('Jede Komponente kann den Zustand beliebig ändern – auch so, dass Signals es nicht bemerken. Bugs entstehen dann „irgendwo“, und Regeln (Höchstmenge, Duplikate) lassen sich nicht an einer Stelle durchsetzen.','Every component can change the state at will – even in ways signals don’t notice. Bugs then originate “somewhere”, and rules (max quantity, duplicates) can’t be enforced in one place.')},
  good:{code:`@Injectable({ providedIn: 'root' })
export class CartStore {
  private readonly _items = signal<readonly CartItem[]>([]);

  readonly items = this._items.asReadonly();
  readonly count = computed(() => this._items().length);
  readonly total = computed(() =>
    this._items().reduce((sum, i) => sum + i.price, 0));

  add(item: CartItem) {
    this._items.update(list => [...list, item]);
  }
  remove(id: string) {
    this._items.update(list => list.filter(i => i.id !== id));
  }
  clear() {
    this._items.set([]);
  }
}

// component
protected readonly cart = inject(CartStore);
// template: {{ cart.count() }} · {{ cart.total() | currency: 'EUR' }}`,
    note:tx('Lesen darf jeder, schreiben nur der Service. <code>readonly CartItem[]</code> verbietet zusätzlich <code>push</code> und Co. schon beim Kompilieren. Für größere Apps gibt es Bibliotheken wie NgRx SignalStore, die genau dieses Muster ausbauen.','Everyone may read, only the service writes. <code>readonly CartItem[]</code> additionally forbids <code>push</code> and friends at compile time. For larger apps, libraries like NgRx SignalStore build out exactly this pattern.')},
  do:tx(['Das schreibbare Signal <code>private</code> machen und nur <code>asReadonly()</code> oder <code>computed()</code> herausgeben.','Arrays als <code>readonly T[]</code> typisieren, damit Mutationen nicht kompilieren.','Änderungen als Methoden mit sprechenden Namen anbieten (<code>add</code>, <code>remove</code>, <code>clear</code>) – dort gelten auch die Regeln.','Asynchrones (HTTP) im Service kapseln und das Ergebnis per <code>set()</code> ins Signal schreiben.'],
        ['Make the writable signal <code>private</code> and only hand out <code>asReadonly()</code> or <code>computed()</code>.','Type arrays as <code>readonly T[]</code> so mutations don’t compile.','Offer changes as methods with meaningful names (<code>add</code>, <code>remove</code>, <code>clear</code>) – that’s where the rules live too.','Encapsulate async work (HTTP) in the service and write the result into the signal with <code>set()</code>.']),
  dont:tx(['Kein öffentliches <code>WritableSignal</code> in einem geteilten Service.','Nicht mit <code>effect()</code> Zustand zwischen Signals hin- und herkopieren – dafür gibt es <code>computed()</code>.','Keine Signals mit veränderlichen Objekten, die du dann direkt mutierst.'],
        ['No public <code>WritableSignal</code> in a shared service.','Don’t copy state back and forth between signals with <code>effect()</code> – that’s what <code>computed()</code> is for.','No signals holding mutable objects that you then mutate directly.']),
  why:tx('<p>Ein Service mit <code>providedIn: \'root\'</code> ist ein Singleton: Alle Komponenten sehen denselben Zustand. Weil Templates die Signals lesen, werden genau die Komponenten aktualisiert, die den geänderten Wert anzeigen – ganz ohne Subscriptions oder <code>markForCheck()</code>.</p><p>Die Kapselung sorgt dafür, dass es für jede Änderung genau einen Weg gibt. Das macht den Datenfluss nachvollziehbar, hält Regeln an einer Stelle und garantiert neue Referenzen – die Voraussetzung dafür, dass Signals und OnPush eine Änderung überhaupt bemerken.</p>',
           '<p>A service with <code>providedIn: \'root\'</code> is a singleton: all components see the same state. Because templates read the signals, exactly those components that display the changed value are updated – without subscriptions or <code>markForCheck()</code>.</p><p>Encapsulation ensures there is exactly one way to make each change. That makes the data flow traceable, keeps rules in one place and guarantees new references – the precondition for signals and OnPush to notice a change at all.</p>'),
  test:{code:`it('adds items and computes the total', () => {
  const store = TestBed.inject(CartStore);
  store.add({ id: 'a', name: 'Book', price: 12 });
  store.add({ id: 'b', name: 'Mug', price: 8 });
  expect(store.count()).toBe(2);
  expect(store.total()).toBe(20);
});`,note:tx('Ein Signal-Store ist synchron testbar: Methode aufrufen, Signal lesen – kein Warten, kein Mock nötig.','A signal store is synchronously testable: call a method, read a signal – no waiting, no mocks needed.')}
});

LESSONS.push({
  id:'zoneless', cat:'perf', order:20,
  title:tx('Zoneless: Change Detection ohne zone.js','Zoneless: change detection without zone.js'),
  short:tx('Ohne zone.js prüft Angular nur, wenn es benachrichtigt wird – ein normales Feld in setTimeout reicht dafür nicht.','Without zone.js Angular only checks when it is notified – a plain field in setTimeout is not enough.'),
  keys:'zoneless zone zone.js ngzone providezonelesschangedetection providezonechangedetection settimeout markforcheck scheduling polyfill',
  since:'Angular 20.2', status:'stable',
  refs:[[tx('Angular-Doku: Zoneless aktivieren','Angular docs: Enabling zoneless'),'https://angular.dev/guide/zoneless#enabling-zoneless-in-an-application'],
        [tx('Angular-Doku: Voraussetzungen für Zoneless','Angular docs: Requirements for zoneless compatibility'),'https://angular.dev/guide/zoneless#requirements-for-zoneless-compatibility'],
        [tx('API: provideZonelessChangeDetection','API: provideZonelessChangeDetection'),'https://angular.dev/api/core/provideZonelessChangeDetection']],
  rule:tx('Seit Angular 21 ist zoneless der Standard: Ohne zone.js startet Angular Change Detection nur, wenn es davon erfährt – durch ein Signal im Template, ein Template-Event, <code>markForCheck()</code>, <code>setInput()</code> oder die <code>async</code>-Pipe. Setzt Code in <code>setTimeout</code>, <code>Promise.then</code> oder <code>subscribe</code> nur ein normales Feld, bleibt die Anzeige stehen.','Since Angular 21 zoneless is the default: without zone.js Angular only starts change detection when it learns about a change – through a signal in the template, a template event, <code>markForCheck()</code>, <code>setInput()</code> or the <code>async</code> pipe. If code in <code>setTimeout</code>, <code>Promise.then</code> or <code>subscribe</code> only sets a plain field, the display stays put.'),
  apis:[['provideZonelessChangeDetection','provideZonelessChangeDetection(): EnvironmentProviders',tx('Schaltet zoneless ein. In v21+ nicht mehr nötig (Standard); nützlich in v20 und in <code>TestBed</code>.','Turns on zoneless. No longer needed in v21+ (default); useful in v20 and in <code>TestBed</code>.')],
        ['provideZoneChangeDetection','provideZoneChangeDetection({ eventCoalescing? })',tx('Holt die zone.js-basierte Change Detection zurück (plus zone.js in den Polyfills).','Brings back zone.js-based change detection (plus zone.js in the polyfills).')],
        ['PendingTasks','inject(PendingTasks).run(fn)',tx('Hält die App bei SSR „instabil“, bis die Arbeit fertig ist – ersetzt, was zone.js früher automatisch mitgezählt hat.','Keeps the app “unstable” during SSR until the work is done – replaces what zone.js used to track automatically.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Einstellungen','Settings')}</h3>
    ${TPL.seg('zoneless-mode','Scheduling',[['zoneless',tx('zoneless (Standard)','zoneless (default)')],['zone','zone.js']],'zoneless')}
    <div class="zoneless-gap"></div>
    ${TPL.seg('zoneless-strat','AppComponent',[['onpush','OnPush'],['eager','Eager']],'onpush')}
    <h3 class="zoneless-h">${tx('Code ausführen','Run code')}</h3>
    <div class="zoneless-btns">
      <button type="button" class="btn btn-secondary" data-zl="field"><code>setTimeout(() =&gt; this.count++)</code></button>
      <button type="button" class="btn btn-secondary" data-zl="signal"><code>setTimeout(() =&gt; this.total.update(n =&gt; n + 1))</code></button>
      <button type="button" class="btn btn-secondary" data-zl="click"><code>(click)="count++"</code></button>
      <button type="button" class="btn btn-secondary" data-zl="mfc"><code>setTimeout(() =&gt; { this.count++; this.cdr.markForCheck(); })</code></button>
    </div>
  </div>
  <div class="sim-card"><h3>AppComponent</h3>
    <div class="zoneless-cmp">
      <table class="zoneless-tab"><thead><tr><th scope="col"><span class="sr-only">${tx('Ort','Where')}</span></th><th scope="col">count</th><th scope="col">total()</th></tr></thead>
      <tbody><tr><th scope="row">${tx('Im DOM','In the DOM')}</th><td id="zoneless-dom-count"></td><td id="zoneless-dom-total"></td></tr>
      <tr><th scope="row">${tx('In der Klasse','In the class')}</th><td id="zoneless-cls-count"></td><td id="zoneless-cls-total"></td></tr></tbody></table>
      <p class="zoneless-status" id="zoneless-status" aria-live="polite"></p>
    </div>
    <p class="sim-row"><span class="sim-node" id="zoneless-ticks">${tx('Change Detection','change detection')} <b>0</b>×</span><span class="sim-node" id="zoneless-checks">${tx('Komponente geprüft','component checked')} <b>0</b>×</span></p>
    <ul class="sim-log" id="zoneless-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: zoneless + <code>this.count++</code> im Timeout – in der Klasse steht der neue Wert, im DOM nicht, weil niemand Angular benachrichtigt hat. Mit zone.js läuft danach zwar ein Durchlauf, aber eine OnPush-Komponente ist nicht dirty. Nur zone.js + Eager „funktioniert“ – mit einer Prüfung nach jedem noch so unwichtigen Task. Das Signal klappt überall.','Try: zoneless + <code>this.count++</code> in a timeout – the class has the new value, the DOM doesn’t, because nobody notified Angular. With zone.js a pass does run afterwards, but an OnPush component is not dirty. Only zone.js + Eager “works” – with a check after every task, however unimportant. The signal works everywhere.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const ul=$('#zoneless-log',root),timers=new Set();
    const s={mode:'zoneless',count:0,total:0};
    const cmp={strategy:'onpush',dirty:false,refresh:false};
    const dom={count:0,total:0};
    let ticks=0,checks=1,scheduled=false;
    const paint=()=>{
      $('#zoneless-dom-count',root).textContent=dom.count;$('#zoneless-dom-total',root).textContent=dom.total;
      $('#zoneless-cls-count',root).textContent=s.count;$('#zoneless-cls-total',root).textContent=s.total;
      const stale=dom.count!==s.count||dom.total!==s.total;
      const st=$('#zoneless-status',root);st.className='zoneless-status '+(stale?'zoneless-stale':'zoneless-ok');
      st.textContent=stale?tx('Anzeige veraltet','display is stale'):tx('Anzeige aktuell','display up to date');
      $('#zoneless-ticks b',root).textContent=ticks;$('#zoneless-checks b',root).textContent=checks;
    };
    function tick(){
      scheduled=false;ticks++;flash($('#zoneless-ticks',root));
      const should=cmp.strategy==='eager'||cmp.dirty||cmp.refresh;
      if(should){checks++;dom.count=s.count;dom.total=s.total;flash($('#zoneless-checks',root));log(ul,`<span class="hl">tick</span> AppComponent ${tx('geprüft','checked')} (${cmp.strategy==='eager'?'Eager':cmp.refresh?tx('Signal geändert','signal changed'):'dirty'})`)}
      else log(ul,`<span class="hl">tick</span> AppComponent ${tx('übersprungen – OnPush und nicht dirty','skipped – OnPush and not dirty')}`);
      cmp.dirty=cmp.refresh=false;paint();
    }
    /* Zoneless: nur Benachrichtigungen planen einen Durchlauf */
    const notify=why=>{log(ul,`<span class="t">${tx('Angular benachrichtigt','Angular notified')}: ${why}</span>`);if(!scheduled){scheduled=true;const t=setTimeout(()=>{timers.delete(t);tick()},30);timers.add(t)}};
    /* zone.js: nach jedem Task (Timeout, Event) läuft ein Durchlauf – egal, ob sich etwas geändert hat */
    const zoneDone=()=>{if(s.mode!=='zone')return;log(ul,`<span class="t">zone.js: ${tx('Task beendet','task finished')} → ApplicationRef.tick()</span>`);if(!scheduled){scheduled=true;const t=setTimeout(()=>{timers.delete(t);tick()},30);timers.add(t)}};
    const later=(f)=>{const t=setTimeout(()=>{timers.delete(t);f();zoneDone();if(s.mode==='zoneless'&&!scheduled)log(ul,`<span class="t">${tx('zoneless: niemand hat Angular benachrichtigt → keine Change Detection','zoneless: nobody notified Angular → no change detection')}</span>`)},500);timers.add(t);log(ul,`<span class="t">${tx('Timeout geplant (500 ms)','timeout scheduled (500 ms)')}</span>`)};
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-zl]')?.dataset.zl;if(!k)return;
      if(k==='field')later(()=>{s.count++;log(ul,`this.count = ${s.count} ${tx('(normales Feld)','(plain field)')}`);paint()});
      if(k==='signal')later(()=>{s.total++;cmp.refresh=true;log(ul,`total.set(${s.total})`);notify(tx('Signal im Template','signal in template'));paint()});
      if(k==='click'){s.count++;cmp.dirty=true;log(ul,`(click) count = ${s.count}`);notify(tx('Template-Listener → markViewDirty','template listener → markViewDirty'));zoneDone();paint()}
      if(k==='mfc')later(()=>{s.count++;cmp.dirty=true;log(ul,`this.count = ${s.count} + markForCheck()`);notify('markForCheck()');paint()});
    });
    root.addEventListener('change',e=>{
      if(e.target.name==='zoneless-mode'){s.mode=e.target.value;log(ul,`<span class="t">Scheduling: ${s.mode==='zone'?'zone.js':'zoneless'}</span>`)}
      if(e.target.name==='zoneless-strat'){cmp.strategy=e.target.value;log(ul,`<span class="t">AppComponent: ${cmp.strategy==='eager'?'Eager':'OnPush'}</span>`)}
    });
    paint();
    log(ul,`<span class="t">${tx('Bereit – führ Code aus und beobachte, ob Angular prüft.','Ready – run code and watch whether Angular checks.')}</span>`);
    return ()=>timers.forEach(clearTimeout);
  },
  css:`.zoneless-gap{height:12px}.zoneless-h{margin-top:16px!important}
.zoneless-btns{display:grid;gap:8px}.zoneless-btns .btn{justify-content:flex-start;text-align:left;height:auto;padding-top:8px;padding-bottom:8px}.zoneless-btns code{white-space:normal;overflow-wrap:anywhere;background:none;font-size:.8125rem}
.zoneless-cmp{border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px}
.zoneless-tab{border-collapse:collapse;margin:0 0 8px;width:100%}.zoneless-tab th,.zoneless-tab td{text-align:left;padding:3px 8px 3px 0}.zoneless-tab thead th{font:600 .75rem/1.2 var(--font-mono);color:var(--muted)}.zoneless-tab tbody th{font-weight:400;color:var(--muted)}.zoneless-tab td{font:700 1rem/1.3 var(--font-mono)}
.zoneless-status{margin:0;font-weight:700}.zoneless-status.zoneless-stale{color:var(--danger)}.zoneless-status.zoneless-ok{color:var(--success)}`,
  bad:{code:`// v21+ app – zoneless by default
export class Clock {

      this.time = new Date();   // nobody tells Angular

// Workaround that keeps the old magic:
// providers: [provideZoneChangeDetection()] + zone.js polyfill`,
    note:tx('Früher hat zone.js <code>setInterval</code> gepatcht und danach die ganze App geprüft. Zoneless passiert nach so einem Callback nichts – die Uhr bleibt stehen. zone.js wieder einzuschalten versteckt das Problem nur und kostet Bundle-Größe und Laufzeit.','zone.js used to patch <code>setInterval</code> and check the whole app afterwards. Zoneless, nothing happens after such a callback – the clock stands still. Turning zone.js back on only hides the problem and costs bundle size and runtime.')},
  good:{code:`// app.config.ts (v21+): zoneless is the default – nothing to add.
// v20: providers: [provideZonelessChangeDetection()]

// template: {{ time() | date: 'mediumTime' }}`,
    note:tx('Das Signal benachrichtigt Angular selbst, und nur diese Komponente wird gerendert. Entferne danach <code>zone.js</code> aus den <code>polyfills</code> in <code>angular.json</code> und aus <code>package.json</code>.','The signal notifies Angular by itself, and only this component is rendered. Afterwards remove <code>zone.js</code> from the <code>polyfills</code> in <code>angular.json</code> and from <code>package.json</code>.')},
  do:tx(['Zustand, der sich asynchron ändert, als Signal halten – oder die <code>async</code>-Pipe bzw. <code>toSignal()</code> nutzen.','Wo du bewusst ein normales Feld setzt, danach <code>markForCheck()</code> aufrufen.','<code>NgZone.onStable</code> und <code>onMicrotaskEmpty</code> durch <code>afterNextRender()</code> oder <code>afterEveryRender()</code> ersetzen.','Bei SSR asynchrone Arbeit mit <code>PendingTasks</code> anmelden, damit der Server auf sie wartet.'],
        ['Keep state that changes asynchronously as a signal – or use the <code>async</code> pipe or <code>toSignal()</code>.','Where you deliberately set a plain field, call <code>markForCheck()</code> afterwards.','Replace <code>NgZone.onStable</code> and <code>onMicrotaskEmpty</code> with <code>afterNextRender()</code> or <code>afterEveryRender()</code>.','In SSR, register async work with <code>PendingTasks</code> so the server waits for it.']),
  dont:tx(['Nicht erwarten, dass <code>setTimeout</code>, <code>fetch().then()</code> oder <code>subscribe()</code> mit normalen Feldern die Anzeige aktualisieren.','<code>provideZoneChangeDetection()</code> nicht als Dauerlösung nutzen, um alten Code „zum Laufen“ zu bringen.','Tests nicht mit <code>fakeAsync</code>/<code>tick</code> schreiben, wenn die App zoneless ist – die brauchen zone.js; nimm <code>await fixture.whenStable()</code>.'],
        ['Don’t expect <code>setTimeout</code>, <code>fetch().then()</code> or <code>subscribe()</code> with plain fields to update the display.','Don’t use <code>provideZoneChangeDetection()</code> as a permanent fix to get old code “working”.','Don’t write tests with <code>fakeAsync</code>/<code>tick</code> when the app is zoneless – they need zone.js; use <code>await fixture.whenStable()</code>.']),
  why:tx('<p>zone.js patcht alle asynchronen Browser-APIs und meldet Angular: „Ein Task ist fertig, vielleicht hat sich etwas geändert.“ Angular prüft daraufhin den Baum – auch nach Mausbewegungen oder Timern, die gar nichts verändert haben. Das kostet Zeit, vergrößert das Bundle und macht Stacktraces unlesbar.</p><p>Zoneless dreht das um: Angular prüft nur, wenn eine Angular-API sagt, dass es etwas zu tun gibt – ein Signal, ein Template-Event, <code>markForCheck()</code>, <code>setInput()</code>, das Einhängen oder Entfernen einer View. Mit Signals und OnPush ist dein Code dafür schon bereit; Probleme machen nur Stellen, die sich stillschweigend auf zone.js verlassen haben.</p>',
           '<p>zone.js patches all async browser APIs and tells Angular: “a task finished, maybe something changed.” Angular then checks the tree – even after mouse moves or timers that changed nothing. That costs time, grows the bundle and makes stack traces unreadable.</p><p>Zoneless turns this around: Angular only checks when an Angular API says there is something to do – a signal, a template event, <code>markForCheck()</code>, <code>setInput()</code>, attaching or removing a view. With signals and OnPush your code is already ready for this; only places that silently relied on zone.js cause trouble.</p>'),
  test:{code:`beforeEach(() => {
  TestBed.configureTestingModule({
    providers: [provideZonelessChangeDetection()],
  });
});

it('shows the new time', async () => {
  const fixture = TestBed.createComponent(Clock);
  fixture.componentInstance.time.set(new Date(2026, 0, 1, 12, 0, 0));
  await fixture.whenStable();
  expect(fixture.nativeElement.textContent).toContain('12:00:00');
});`,note:tx('Mit dem Provider verhält sich der Test wie die App in Produktion. <code>whenStable()</code> wartet, bis Angular die geplante Change Detection erledigt hat – ohne zone.js.','With the provider the test behaves like the app in production. <code>whenStable()</code> waits until Angular has finished the scheduled change detection – without zone.js.')}
});

LESSONS.push({
  id:'route-guards', cat:'router', order:40,
  title:tx('Funktionale Guards und ihre Reihenfolge','Functional guards and their order'),
  short:tx('canMatch, canDeactivate, canActivate – kleine Funktionen, die true, false, einen UrlTree oder einen RedirectCommand liefern.','canMatch, canDeactivate, canActivate – small functions returning true, false, a UrlTree or a RedirectCommand.'),
  keys:'guard canActivate canMatch canDeactivate canActivateChild CanActivateFn CanMatchFn CanDeactivateFn RedirectCommand UrlTree GuardResult auth login redirect pipeline reihenfolge order canLoad',
  status:'stable',
  refs:[[tx('Angular-Doku: Rückgabewerte von Guards','Angular docs: Route guard return types'),'https://angular.dev/guide/routing/route-guards#route-guard-return-types'],
        [tx('Angular-Doku: CanMatch','Angular docs: CanMatch'),'https://angular.dev/guide/routing/route-guards#canmatch'],
        [tx('API: RedirectCommand','API: RedirectCommand'),'https://angular.dev/api/router/RedirectCommand']],
  rule:tx('Ein Guard ist eine Funktion mit <code>inject()</code>, die <code>true</code> (weiter), <code>false</code> (abbrechen) oder ein <strong>Umleitungsziel</strong> zurückgibt – <code>UrlTree</code> oder <code>RedirectCommand</code>, gern auch als Promise oder Observable. <code>canMatch</code> läuft schon beim URL-Abgleich und lässt bei <code>false</code> die nächste Route probieren; danach kommen alle <code>canDeactivate</code>, dann <code>canActivateChild</code>/<code>canActivate</code> von oben nach unten.',
          'A guard is a function using <code>inject()</code> that returns <code>true</code> (continue), <code>false</code> (cancel) or a <strong>redirect target</strong> – <code>UrlTree</code> or <code>RedirectCommand</code>, also as a promise or observable. <code>canMatch</code> already runs during URL matching and on <code>false</code> lets the next route try; after that come all <code>canDeactivate</code>, then <code>canActivateChild</code>/<code>canActivate</code> from top to bottom.'),
  apis:[['CanActivateFn','(route, state) => MaybeAsync<GuardResult>',tx('Darf die Route betreten werden? <code>GuardResult</code> = <code>boolean | UrlTree | RedirectCommand</code>.','May the route be entered? <code>GuardResult</code> = <code>boolean | UrlTree | RedirectCommand</code>.')],
        ['CanMatchFn','(route, segments, currentSnapshot) => MaybeAsync<GuardResult>',tx('Darf diese Route für die URL überhaupt passen? <code>false</code> → nächste Route. Ersetzt das deprecated <code>canLoad</code>.','May this route match the URL at all? <code>false</code> → next route. Replaces the deprecated <code>canLoad</code>.')],
        ['CanDeactivateFn<T>','(component, currentRoute, currentState, nextState) => MaybeAsync<GuardResult>',tx('Darf die aktuelle Seite verlassen werden? Bekommt die Komponenten-Instanz.','May the current page be left? Receives the component instance.')],
        ['RedirectCommand','new RedirectCommand(urlTree, navigationBehaviorOptions?)',tx('Seit Angular 18: Umleitung mit Optionen wie <code>skipLocationChange</code>, <code>replaceUrl</code> oder <code>state</code>.','Since Angular 18: redirect with options like <code>skipLocationChange</code>, <code>replaceUrl</code> or <code>state</code>.')]],
  demo:`<div class="sim-grid route-guards-top">
  <div class="sim-card"><h3>${tx('Zustand der App','App state')}</h3>
    <label class="check-row"><input type="checkbox" id="route-guards-auth"> ${tx('eingeloggt','logged in')}</label>
    <label class="check-row"><input type="checkbox" id="route-guards-admin"> ${tx('Rolle Admin','admin role')}</label>
    <label class="check-row"><input type="checkbox" id="route-guards-dirty" checked> ${tx('ungespeicherte Änderungen im Editor','unsaved changes in the editor')}</label>
    <fieldset class="seg"><legend>${tx('<code>authGuard</code> ohne Login liefert','<code>authGuard</code> without login returns')}</legend><div class="seg-opts">
      <label><input type="radio" name="route-guards-ret" value="false"> false</label>
      <label><input type="radio" name="route-guards-ret" value="tree" checked> UrlTree</label>
      <label><input type="radio" name="route-guards-ret" value="cmd"> RedirectCommand <span class="hint">(skipLocationChange)</span></label></div></fieldset>
  </div>
  <div class="sim-card"><h3>${tx('Browser','Browser')}</h3>
    ${NGRT.chrome('route-guards')}
    <div class="sim-row route-guards-links">${['/','/editor','/admin','/login'].map(u=>`<button type="button" class="btn btn-ghost" data-url="${u}"><code>${u}</code></button>`).join('')}</div>
  </div>
</div>
<div class="sim-grid route-guards-lower">
  <div class="sim-card"><h3>${tx('Pipeline','Pipeline')}</h3><ol class="route-guards-pipe" id="route-guards-pipe"></ol><p class="hint route-guards-note" id="route-guards-note" aria-live="polite"></p></div>
  <div class="sim-card"><h3>${tx('Router-Events','Router events')}</h3><ul class="sim-log route-guards-log" id="route-guards-log" aria-label="${tx('Protokoll','Log')}"></ul></div>
</div>
<p class="demo-note">${tx('Probier: <code>/editor</code> ohne Login – je nach Rückgabe bleibst du stehen oder landest auf <code>/login</code> (mit <code>RedirectCommand</code> und <code>skipLocationChange</code> bleibt sogar die Adresse). <code>/admin</code> ohne Admin-Rolle: <code>canMatch</code> sagt <code>false</code>, und die nächste Route mit demselben Pfad zeigt „Kein Zugriff“. Verlass den Editor mit ungespeicherten Änderungen: Der <code>canDeactivate</code>-Guard wartet auf deine Antwort.','Try: <code>/editor</code> without login – depending on the return value you stay put or land on <code>/login</code> (with <code>RedirectCommand</code> and <code>skipLocationChange</code> even the address stays). <code>/admin</code> without the admin role: <code>canMatch</code> says <code>false</code>, and the next route with the same path shows “No access”. Leave the editor with unsaved changes: the <code>canDeactivate</code> guard waits for your answer.')}</p>`,
  init(root){
    const {log}=NG,R=NGRT;
    const ul=$('#route-guards-log',root),view=$('#route-guards-view',root),url=$('#route-guards-url',root),tab=$('#route-guards-tab',root),pipe=$('#route-guards-pipe',root);
    const chk=id=>$(`#route-guards-${id}`,root).checked;
    let alive=true,pendingAsk=null,skipLoc=false;
    const authGuard=()=>{if(chk('auth'))return true;const r=$('[name="route-guards-ret"]:checked',root).value;skipLoc=r==='cmd';return r==='false'?false:r==='tree'?R.urlTree('/login'):R.redirectCommand('/login')};authGuard.guardName='authGuard';
    const adminMatch=()=>chk('admin');adminMatch.guardName='adminMatch';
    const unsavedGuard=()=>{if(!chk('dirty'))return true;return new Promise(res=>{pendingAsk=res;
      view.insertAdjacentHTML('beforeend',`<div class="route-guards-ask" role="alertdialog" aria-labelledby="route-guards-askq"><p id="route-guards-askq">${tx('Ungespeicherte Änderungen verwerfen?','Discard unsaved changes?')}</p><div class="sim-row"><button type="button" class="btn btn-secondary" data-ask="1">${tx('Verwerfen','Discard')}</button><button type="button" class="btn btn-primary" data-ask="0">${tx('Bleiben','Stay')}</button></div></div>`);
      $('.route-guards-ask [data-ask="0"]',view).focus();})};unsavedGuard.guardName='unsavedGuard';
    const routes=[{path:'',pathMatch:'full',component:'Home'},{path:'login',component:'Login'},
      {path:'editor',component:'Editor',canActivate:[authGuard],canDeactivate:[unsavedGuard]},
      {path:'admin',canMatch:[adminMatch],canActivateChild:[authGuard],children:[{path:'',component:'AdminHome'}]},
      {path:'admin',component:'NoAccess'},{path:'**',component:'NotFound'}];
    const PH=[['match',tx('URL-Abgleich (canMatch)','URL matching (canMatch)')],['deact','canDeactivate'],['act','canActivateChild / canActivate'],['resolve',tx('Resolver','Resolvers')],['activate',tx('Komponente anzeigen','Show component')]];
    const ph={};const paintPipe=()=>{pipe.innerHTML=PH.map(([k,t])=>`<li class="route-guards-ph route-guards-${ph[k]||'wait'}"><span>${t}</span><b>${{wait:'',run:'…',ok:'✓',fail:tx('abgebrochen','cancelled'),redir:tx('umgeleitet','redirected')}[ph[k]||'wait']}</b></li>`).join('')};
    let phase='match';
    const set=(k,v)=>{ph[k]=v;paintPipe()};
    const router=R.create({routes,on:ev=>{
      if(!alive)return;
      log(ul,R.fmt(ev));
      switch(ev.type){
        case 'NavigationStart':Object.keys(ph).forEach(k=>delete ph[k]);phase='match';set('match','run');break;
        case 'RoutesRecognized':set('match','ok');phase='deact';set('deact','run');break;
        case 'guard':if(ev.kind==='canActivate'||ev.kind==='canActivateChild'){if(phase==='deact'){set('deact','ok');phase='act';set('act','run')}}break;
        case 'GuardsCheckEnd':if(ev.result){set('deact','ok');set('act','ok');phase='resolve';set('resolve','run')}else set(phase,'fail');break;
        case 'ResolveEnd':set('resolve','ok');phase='activate';break;
        case 'NavigationCancel':note.textContent=ev.reason==='Redirect'?tx(`Umgeleitet: ${url.dataset.req} → ${ev.to}`,`Redirected: ${url.dataset.req} → ${ev.to}`):tx(`Abgebrochen (${ev.reason}) – du bleibst auf ${url.value||'/'}.`,`Cancelled (${ev.reason}) – you stay on ${url.value||'/'}.`);break;
        case 'NavigationEnd':set('activate','ok');url.value=skipLoc&&ev.url==='/login'?url.dataset.req:ev.url;skipLoc=false;tab.textContent=ev.state.name;
          view.innerHTML=`<div class="ngrt-page"><h4>${ev.state.name==='NoAccess'?tx('Kein Zugriff','No access'):ev.state.name}</h4>${ev.state.name==='Editor'?`<p class="hint">${tx('Änderungen:','Changes:')} ${chk('dirty')?tx('ungespeichert','unsaved'):tx('gespeichert','saved')}</p>`:''}</div>`;break;
      }
    }});
    const note=$('#route-guards-note',root);
    const go=u=>{if(pendingAsk)return;url.dataset.req=u;note.textContent='';router.navigate(u,{component:{}})};
    $('#route-guards-bar',root).addEventListener('submit',e=>{e.preventDefault();go(url.value)});
    root.addEventListener('click',e=>{
      const b=e.target.closest('[data-url]');if(b)go(b.dataset.url);
      const a=e.target.closest('[data-ask]');
      if(a&&pendingAsk){const r=pendingAsk;pendingAsk=null;$('.route-guards-ask',view)?.remove();if(a.dataset.ask==='1')$('#route-guards-dirty',root).checked=false;r(a.dataset.ask==='1')}
    });
    paintPipe();go('/');
    return ()=>{alive=false;router.cancelAll();if(pendingAsk)pendingAsk(false)};
  },
  css:`.route-guards-top{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.route-guards-links{margin-top:12px}.route-guards-lower{margin-top:16px}
.route-guards-pipe{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:ph}
.route-guards-ph{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);font-size:.875rem;counter-increment:ph}
.route-guards-ph span::before{content:counter(ph) ". ";color:var(--muted)}
.route-guards-run{border-color:var(--brand);background:var(--brand-soft)}.route-guards-ok{border-color:var(--success);background:var(--success-bg)}.route-guards-ok b{color:var(--success)}
.route-guards-fail{border-color:var(--danger)}.route-guards-fail b{color:var(--danger)}.route-guards-redir{border-color:var(--warn);background:var(--warn-bg)}.route-guards-redir b{color:var(--warn)}
.route-guards-wait{opacity:.6;border-style:dashed}.route-guards-log{max-height:260px}
.route-guards-ask{margin-top:12px;padding:10px 12px;border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:var(--radius-sm)}.route-guards-ask p{margin:0 0 8px;font-weight:700}`,
  bad:{code:`@Injectable({ providedIn: 'root' })
export class AuthGuard
    implements CanActivate {
  constructor(private auth: Auth,
              private router: Router) {}
  canActivate() {
    if (!this.auth.isLoggedIn()) {
      this.router.navigate(['/login']);
      return false;
    }
    return true;
  }
}
// canActivate: [AuthGuard]`,
    note:tx('Klassen als Guard-Token im Routen-Array sind deprecated. Und <code>navigate()</code> + <code>false</code> startet eine zweite Navigation, während die erste noch abgebrochen wird – gib stattdessen das Ziel zurück.','Classes as guard tokens in the route array are deprecated. And <code>navigate()</code> + <code>false</code> starts a second navigation while the first is still being cancelled – return the target instead.')},
  good:{code:`export const authGuard: CanActivateFn =
  (route, state) => {
    const auth = inject(Auth);
    if (auth.isLoggedIn()) return true;
    return inject(Router).createUrlTree(
      ['/login'],
      { queryParams: { next: state.url } });
  };

export const adminMatch: CanMatchFn =
  () => inject(Auth).role() === 'admin';

export const unsavedGuard:
  CanDeactivateFn<Editor> = cmp =>
    !cmp.dirty() || cmp.confirmLeave();

// routes
{ path: 'editor', component: Editor,
  canActivate: [authGuard],
  canDeactivate: [unsavedGuard] },
{ path: 'admin', canMatch: [adminMatch],
  loadChildren: () => import('./admin') },
{ path: 'admin', component: NoAccess },`,
    note:tx('Die Funktionen laufen im Injection Context und liefern ihr Ergebnis zurück, statt selbst zu navigieren. Brauchst du Optionen wie <code>skipLocationChange</code>, gib <code>new RedirectCommand(tree, { skipLocationChange: true })</code> zurück.','The functions run in an injection context and return their result instead of navigating themselves. If you need options like <code>skipLocationChange</code>, return <code>new RedirectCommand(tree, { skipLocationChange: true })</code>.')},
  do:tx(['Guards als <code>const</code>-Funktionen mit Typ (<code>CanActivateFn</code> …) schreiben und darin <code>inject()</code> nutzen.','Zum Umleiten einen <code>UrlTree</code> oder <code>RedirectCommand</code> zurückgeben, nicht selbst <code>navigate()</code> aufrufen.','<code>canMatch</code> für Rollen, Feature-Flags oder A/B-Varianten mit demselben Pfad – bei <code>false</code> passt die nächste Route.','Guards nur für Navigation und UX verwenden – die echte Berechtigungsprüfung macht der Server.'],
        ['Write guards as typed <code>const</code> functions (<code>CanActivateFn</code> …) and use <code>inject()</code> inside.','To redirect, return a <code>UrlTree</code> or <code>RedirectCommand</code> – don’t call <code>navigate()</code> yourself.','<code>canMatch</code> for roles, feature flags or A/B variants on the same path – on <code>false</code> the next route matches.','Use guards only for navigation and UX – the real permission check happens on the server.']),
  dont:tx(['Keine Klassen als Guard-Token im Routen-Array – das ist deprecated; brauchst du eine Klasse, dann <code>() =&gt; inject(MyGuard).canActivate()</code>.','Kein <code>canLoad</code> mehr – deprecated, <code>canMatch</code> ersetzt es.','Nicht erwarten, dass Guards in einem Array nacheinander laufen: Angular startet sie gleichzeitig und wertet das Ergebnis in Array-Reihenfolge aus.'],
        ['No classes as guard tokens in the route array – that’s deprecated; if you need a class, use <code>() =&gt; inject(MyGuard).canActivate()</code>.','No more <code>canLoad</code> – deprecated, <code>canMatch</code> replaces it.','Don’t expect guards in one array to run one after another: Angular starts them together and evaluates the results in array order.']),
  why:tx('<p>Die Navigation ist eine Pipeline mit fester Reihenfolge. <code>canMatch</code> gehört zum URL-Abgleich: Sagt er <code>false</code>, ist die Route für diese URL „unsichtbar“ und der Router probiert die nächste – darum ist er der richtige Platz für Rollen und Feature-Flags, und bei <code>loadChildren</code> wird dann auch nichts nachgeladen. Erst wenn feststeht, <em>welche</em> Routen es werden, fragt der Router die alte Seite (<code>canDeactivate</code>) und danach die neuen Routen von oben nach unten (<code>canActivateChild</code>, <code>canActivate</code>).</p><p>Ein zurückgegebener <code>UrlTree</code> oder <code>RedirectCommand</code> bricht die laufende Navigation mit „Redirect“ ab und startet sauber eine neue. Wer stattdessen selbst <code>navigate()</code> aufruft und <code>false</code> liefert, erzeugt zwei konkurrierende Navigationen. <code>RedirectCommand</code> (seit Angular 18) kann zusätzlich Optionen mitgeben – etwa <code>skipLocationChange</code>, damit die Adresszeile die ursprüngliche URL behält.</p>',
           '<p>Navigation is a pipeline with a fixed order. <code>canMatch</code> is part of URL matching: if it says <code>false</code>, the route is “invisible” for this URL and the router tries the next one – which makes it the right place for roles and feature flags, and with <code>loadChildren</code> nothing gets loaded either. Only once it’s clear <em>which</em> routes it will be does the router ask the old page (<code>canDeactivate</code>) and then the new routes from top to bottom (<code>canActivateChild</code>, <code>canActivate</code>).</p><p>A returned <code>UrlTree</code> or <code>RedirectCommand</code> cancels the running navigation with “redirect” and cleanly starts a new one. Calling <code>navigate()</code> yourself and returning <code>false</code> creates two competing navigations. <code>RedirectCommand</code> (since Angular 18) can also carry options – e.g. <code>skipLocationChange</code>, so the address bar keeps the original URL.</p>'),
  test:{code:`it('redirects to /login when logged out', () => {
  TestBed.configureTestingModule({
    providers: [provideRouter([]),
      { provide: Auth, useValue: { isLoggedIn: () => false } }],
  });
  const result = TestBed.runInInjectionContext(
    () => authGuard({} as ActivatedRouteSnapshot, { url: '/editor' } as RouterStateSnapshot));
  expect(String(result)).toBe('/login?next=%2Feditor');
});`,note:tx('Ein funktionaler Guard ist nur eine Funktion – mit <code>TestBed.runInInjectionContext()</code> rufst du ihn direkt auf und prüfst den zurückgegebenen <code>UrlTree</code>.','A functional guard is just a function – with <code>TestBed.runInInjectionContext()</code> you call it directly and check the returned <code>UrlTree</code>.')}
});

LESSONS.push({
  id:'route-inputs', cat:'router', order:20,
  title:tx('Routen-Parameter als input() mit withComponentInputBinding()','Route params as input() with withComponentInputBinding()'),
  short:tx('Pfad- und Query-Parameter, data und Resolver-Ergebnisse landen direkt in den Inputs der Komponente.','Path and query params, data and resolver results go straight into the component’s inputs.'),
  keys:'withComponentInputBinding input route params paramMap query parameter queryParams ActivatedRoute snapshot data resolve binding unmatchedInputBehavior',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: withComponentInputBinding','Angular docs: withComponentInputBinding'),'https://angular.dev/guide/routing/common-router-tasks#add-withcomponentinputbinding'],
        [tx('Angular-Doku: Priorität der Bindings','Angular docs: Input binding priority'),'https://angular.dev/guide/routing/common-router-tasks#input-binding-priority'],
        [tx('API: withComponentInputBinding','API: withComponentInputBinding'),'https://angular.dev/api/router/withComponentInputBinding']],
  rule:tx('Mit <code>withComponentInputBinding()</code> setzt der Router Pfad-Parameter, Query-Parameter, statische <code>data</code> und Resolver-Ergebnisse als <code>input()</code> der Routen-Komponente – gleicher Name, fertig. Er setzt sie bei <strong>jeder</strong> Navigation neu, auch wenn Angular die Komponente wiederverwendet. Fehlt ein Wert, wird der Input <code>undefined</code>.',
          'With <code>withComponentInputBinding()</code> the router sets path params, query params, static <code>data</code> and resolver results as <code>input()</code>s of the routed component – same name, done. It sets them again on <strong>every</strong> navigation, even when Angular reuses the component. If a value is missing, the input becomes <code>undefined</code>.'),
  apis:[['withComponentInputBinding()','withComponentInputBinding({ queryParams?, unmatchedInputBehavior? })',tx('Feature für <code>provideRouter()</code>. <code>queryParams: false</code> schaltet Query-Parameter ab.','Feature for <code>provideRouter()</code>. <code>queryParams: false</code> turns off query params.')],
        ['input()','id = input.required<string>()',tx('Der Name des Inputs ist der Schlüssel: <code>:id</code>, <code>?tab=</code>, ein <code>data</code>- oder <code>resolve</code>-Key.','The input’s name is the key: <code>:id</code>, <code>?tab=</code>, a <code>data</code> or <code>resolve</code> key.')],
        [tx('Priorität','Priority'),'query < path/matrix < data/resolve',tx('Gleicher Name aus mehreren Quellen: Resolver und <code>data</code> gewinnen, Query-Parameter verlieren.','Same name from several sources: resolvers and <code>data</code> win, query params lose.')],
        ['unmatchedInputBehavior','\'alwaysUndefined\' | \'undefinedIfStale\'',tx('Standard: Inputs ohne passenden Schlüssel werden <code>undefined</code> – auch wenn sie einen Default haben.','Default: inputs without a matching key become <code>undefined</code> – even if they have a default.')]],
  demo:`<div class="sim-grid route-inputs-top">
  <div class="sim-card"><h3>app.config.ts</h3>
    <label class="check-row"><input type="checkbox" id="route-inputs-on" checked> <code>withComponentInputBinding()</code></label>
    <label class="check-row"><input type="checkbox" id="route-inputs-q"> <code>{ queryParams: false }</code></label>
    <pre class="route-inputs-code">{ path: 'products/:id',
  component: ProductDetail,
  data: { layout: 'wide' },
  resolve: { product: productResolver } }</pre>
    <p class="hint route-inputs-try">${tx('Adresse eintippen:','Type an address:')}</p>
    <div class="sim-row">${['/products/42?tab=reviews','/products/7','/products/7?id=99','/products/7?layout=narrow'].map(u=>`<button type="button" class="btn btn-ghost" data-url="${u}"><code>${u}</code></button>`).join('')}</div>
  </div>
  <div class="sim-card"><h3>&lt;product-detail&gt;</h3>
    ${NGRT.chrome('route-inputs')}

</div>
<p class="demo-note">${tx('Probier: Von <code>/products/42</code> nach <code>/products/7</code> – dieselbe Instanz, aber <code>id</code> ist sofort aktuell, während der Snapshot-Wert beim ersten Stand bleibt. <code>?id=99</code> verliert gegen <code>:id</code>, <code>?layout=</code> gegen <code>data</code>. Ohne <code>?tab</code> wird <code>tab</code> wieder <code>undefined</code>. Schalte das Feature aus: Dann bleiben alle Inputs leer.','Try: from <code>/products/42</code> to <code>/products/7</code> – the same instance, but <code>id</code> is up to date right away, while the snapshot value stays at the first state. <code>?id=99</code> loses against <code>:id</code>, <code>?layout=</code> against <code>data</code>. Without <code>?tab</code>, <code>tab</code> becomes <code>undefined</code> again. Turn the feature off: then all inputs stay empty.')}</p>`,
  init(root){
    const {flash}=NG,R=NGRT;
    const view=$('#route-inputs-view',root),url=$('#route-inputs-url',root),tab=$('#route-inputs-tab',root),inst=$('#route-inputs-inst',root);
    let instances=0,cmp=null,alive=true;
    const routes=[{path:'products/:id',component:'ProductDetail',data:{layout:'wide'},resolve:{product:async c=>{await R.wait(250);return {name:`Product ${c.params.id}`}}}},{path:'**',component:'NotFound'}];
    const INPUTS=['id','tab','layout','product'];
    const show=v=>v===undefined?'<span class="route-inputs-undef">undefined</span>':esc(typeof v==='object'?JSON.stringify(v):`'${v}'`);
    const router=R.create({routes,on:ev=>{
      if(ev.type!=='NavigationEnd'||!alive)return;
      const s=ev.state,on=$('#route-inputs-on',root).checked,q=!$('#route-inputs-q',root).checked;
      url.value=s.url;tab.textContent=s.name;
      if(s.name!=='ProductDetail'){cmp=null;view.innerHTML='<div class="ngrt-page"><h4>NotFound</h4></div>';return}
      let fresh=false;if(!cmp){cmp={n:++instances,snap:s.params.id};fresh=true}
      /* Wie Angular: erst query, dann path/matrix, dann data + resolve – später überschreibt früher */
      const src={};const set=(obj,label)=>Object.entries(obj).forEach(([k,v])=>{src[k]={v,label}});
      if(q)set(s.query,'query');set(s.params,'path');set(s.chain[s.chain.length-1].route.data||{},'data');set(s.resolved[s.resolved.length-1]||{},'resolve');
      view.innerHTML=`<table class="route-inputs-table"><caption class="sr-only">${tx('Inputs der Komponente','Component inputs')}</caption><thead><tr><th scope="col">input()</th><th scope="col">${tx('Wert','Value')}</th><th scope="col">${tx('Quelle','Source')}</th></tr></thead><tbody>
${INPUTS.map(k=>{const b=on?src[k]:undefined;return `<tr><td><code>${k}</code></td><td>${show(b?.v)}</td><td>${b?b.label:'—'}</td></tr>`}).join('')}
<tr class="route-inputs-snap"><td><code>snapshot…get('id')</code></td><td>${show(cmp.snap)}</td><td>${tx('beim Erzeugen gelesen','read on creation')}</td></tr></tbody></table>`;
      inst.textContent=fresh?tx(`ProductDetail-Instanz #${cmp.n} – neu erzeugt.`,`ProductDetail instance #${cmp.n} – newly created.`):tx(`ProductDetail-Instanz #${cmp.n} – wiederverwendet, weil die Route gleich bleibt.`,`ProductDetail instance #${cmp.n} – reused, because the route stays the same.`);
      flash(view);
    }});
    const go=u=>router.navigate(u);
    root.addEventListener('change',()=>go(url.value));
    $('#route-inputs-bar',root).addEventListener('submit',e=>{e.preventDefault();go(url.value)});
    root.addEventListener('click',e=>{const b=e.target.closest('[data-url]');if(b)go(b.dataset.url)});
    go('/products/42?tab=reviews');
    return ()=>{alive=false;router.cancelAll()};
  },
  css:`.route-inputs-top{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

  bad:{code:`export class ProductDetail {
  private route = inject(ActivatedRoute);
  // read once – stale on /products/1 → /2
  id = this.route.snapshot
    .paramMap.get('id');
  tab = this.route.snapshot
    .queryParamMap.get('tab');
}`,
    note:tx('Wechselt nur der Parameter, verwendet Angular die Komponente wieder – der Konstruktor läuft nicht noch einmal, der Snapshot bleibt alt. Die Lösung mit <code>paramMap.subscribe()</code> funktioniert, braucht aber Aufräumen und viel Code.','When only the parameter changes, Angular reuses the component – the constructor doesn’t run again, the snapshot stays old. The fix with <code>paramMap.subscribe()</code> works, but needs cleanup and lots of code.')},
  good:{code:`// app.config.ts
provideRouter(routes,
  withComponentInputBinding())

export class ProductDetail {
  id = input.required<string>();  // :id
  tab = input<string>();          // ?tab=
  product = input<Product>(); // resolve
  activeTab = computed(
    () => this.tab() ?? 'details');
}`,
    note:tx('Inputs sind Signals, also rechnen <code>computed()</code> und Templates automatisch neu. Einen Standard setzt du per <code>??</code> in einem <code>computed()</code> oder per <code>transform</code> – nicht als Input-Default, den überschreibt der Router mit <code>undefined</code>.','Inputs are signals, so <code>computed()</code> and templates update automatically. Set a default with <code>??</code> in a <code>computed()</code> or with a <code>transform</code> – not as the input default, the router overwrites that with <code>undefined</code>.')},
  do:tx(['<code>withComponentInputBinding()</code> in <code>provideRouter()</code> einschalten und Parameter als <code>input()</code> lesen.','Den Input-Typ ehrlich schreiben: <code>input&lt;string | undefined&gt;()</code> für alles, was fehlen kann.','Abhängige Daten mit <code>computed()</code> oder einer <code>resource</code> aus dem Input ableiten – dann lädt der Parameterwechsel automatisch neu.','Mit <code>queryParams: false</code> arbeiten, wenn Query-Parameter nicht zufällig Inputs gleichen Namens überschreiben sollen.'],
        ['Turn on <code>withComponentInputBinding()</code> in <code>provideRouter()</code> and read parameters as <code>input()</code>.','Write the input type honestly: <code>input&lt;string | undefined&gt;()</code> for everything that can be missing.','Derive dependent data from the input with <code>computed()</code> or a <code>resource</code> – then a parameter change reloads automatically.','Use <code>queryParams: false</code> if query params shouldn’t accidentally overwrite inputs of the same name.']),
  dont:tx(['Nicht <code>route.snapshot</code> im Konstruktor lesen, wenn sich der Parameter bei gleicher Komponente ändern kann.','Keinen Input-Default wie <code>input(\'details\')</code> erwarten – ohne passenden Schlüssel setzt der Router <code>undefined</code>.','Nicht erwarten, dass das in Kind-Komponenten wirkt – gebunden wird nur die Komponente der Route.'],
        ['Don’t read <code>route.snapshot</code> in the constructor if the parameter can change while the component stays.','Don’t rely on an input default like <code>input(\'details\')</code> – without a matching key the router sets <code>undefined</code>.','Don’t expect this to work in child components – only the route’s component gets bound.']),
  why:tx('<p>Navigierst du innerhalb derselben Route (<code>/products/42</code> → <code>/products/7</code>), zerstört Angular die Komponente nicht, sondern verwendet sie wieder. Alles, was du einmalig im Konstruktor aus dem Snapshot liest, bleibt dann stehen. Mit dem Input-Binding setzt der Router nach jeder Navigation die Inputs neu – und weil <code>input()</code> ein Signal ist, reagiert alles, was davon abhängt.</p><p>Die Reihenfolge ist fest: Query-Parameter, dann Pfad- und Matrix-Parameter, dann <code>data</code> und Resolver; spätere Quellen überschreiben frühere. Ein Input ohne Treffer wird <code>undefined</code>, damit kein Wert von der vorigen URL übrig bleibt – darum gehört ein Standardwert in ein <code>computed()</code> oder ein <code>transform</code>.</p>',
           '<p>When you navigate within the same route (<code>/products/42</code> → <code>/products/7</code>), Angular doesn’t destroy the component but reuses it. Anything you read once from the snapshot in the constructor then stays as it was. With input binding, the router sets the inputs again after every navigation – and because <code>input()</code> is a signal, everything that depends on it reacts.</p><p>The order is fixed: query params, then path and matrix params, then <code>data</code> and resolvers; later sources overwrite earlier ones. An input without a match becomes <code>undefined</code> so that no value from the previous URL is left over – which is why a default belongs in a <code>computed()</code> or a <code>transform</code>.</p>'),
  test:{code:`it('binds :id to the input', async () => {
  TestBed.configureTestingModule({
    providers: [provideRouter(
      [{ path: 'products/:id', component: ProductDetail }],
      withComponentInputBinding())],
  });
  const harness = await RouterTestingHarness.create();
  const cmp = await harness.navigateByUrl('/products/7', ProductDetail);
  expect(cmp.id()).toBe('7');
});`,note:tx('Im Test gehört das Feature genauso in <code>provideRouter()</code> – sonst bleibt der Input leer. Ohne Router testest du die Komponente einfach mit <code>fixture.componentRef.setInput(\'id\', \'7\')</code>.','In the test the feature belongs into <code>provideRouter()</code> too – otherwise the input stays empty. Without the router, test the component simply with <code>fixture.componentRef.setInput(\'id\', \'7\')</code>.')}
});

LESSONS.push({
  id:'lazy-routes', cat:'router', order:30,
  title:tx('Lazy Loading mit loadComponent und loadChildren','Lazy loading with loadComponent and loadChildren'),
  short:tx('Jede Seite als eigener Chunk, der erst beim ersten Besuch geladen wird – optional im Hintergrund vorab.','Every page as its own chunk that’s only loaded on the first visit – optionally ahead of time in the background.'),
  keys:'lazy loading loadComponent loadChildren chunk bundle import() default export preloading withPreloading PreloadAllModules RouteConfigLoadStart',
  since:'Angular 14', status:'stable',
  refs:[[tx('Angular-Doku: Lazy geladene Komponenten und Routen','Angular docs: Lazily loaded components and routes'),'https://angular.dev/guide/routing/loading-strategies#lazily-loaded-components-and-routes'],
        [tx('Angular-Doku: Preloading','Angular docs: Preloading strategy'),'https://angular.dev/guide/routing/customizing-route-behavior#preloading-strategy'],
        [tx('Angular-Doku: Eager oder lazy?','Angular docs: Eager or lazy?'),'https://angular.dev/guide/routing/loading-strategies#should-i-use-an-eager-or-a-lazy-route']],
  rule:tx('Lade Seiten mit <code>loadComponent: () =&gt; import(…)</code> und ganze Bereiche mit <code>loadChildren</code>. Der Build macht daraus eigene Chunks; der Router lädt sie beim ersten Besuch und merkt sie sich. Mit <code>withPreloading(PreloadAllModules)</code> holt er sie nach dem Start im Hintergrund.',
          'Load pages with <code>loadComponent: () =&gt; import(…)</code> and whole areas with <code>loadChildren</code>. The build turns them into separate chunks; the router loads them on the first visit and keeps them. With <code>withPreloading(PreloadAllModules)</code> it fetches them in the background after startup.'),
  apis:[['loadComponent','loadComponent: () => import(\'./page\')',tx('Eine Komponente lazy laden. Mit <code>export default</code> reicht das nackte <code>import()</code>.','Lazy-load one component. With <code>export default</code> the bare <code>import()</code> is enough.')],
        ['loadChildren','loadChildren: () => import(\'./admin.routes\')',tx('Ein ganzes <code>Routes</code>-Array lazy laden – schon beim URL-Abgleich.','Lazy-load a whole <code>Routes</code> array – already during URL matching.')],
        ['withPreloading()','withPreloading(PreloadAllModules)',tx('Nach jeder Navigation alle lazy Routen im Hintergrund laden. Standard ist <code>NoPreloading</code>.','After each navigation, load all lazy routes in the background. Default is <code>NoPreloading</code>.')],
        ['RouteConfigLoadStart','RouteConfigLoadStart / RouteConfigLoadEnd',tx('Router-Events rund um das Nachladen – z. B. für einen Ladebalken.','Router events around lazy loading – e.g. for a progress bar.')]],
  demo:`<div class="sim-grid lazy-routes-top">
  <div class="sim-card"><h3>${tx('Browser','Browser')}</h3>
    ${NGRT.chrome('lazy-routes')}
    <div class="lazy-routes-busy" id="lazy-routes-busy" hidden><div class="ngrt-busy"></div></div>
    <p class="hint lazy-routes-try">${tx('Link anklicken:','Click a link:')}</p>
    <div class="sim-row">${['/','/products','/admin','/admin/users','/about'].map(u=>`<button type="button" class="btn btn-ghost" data-url="${u}"><code>${u}</code></button>`).join('')}</div>
  </div>
  <div class="sim-card"><h3>${tx('Netzwerk','Network')}</h3>
    <label class="check-row"><input type="checkbox" id="lazy-routes-pre"> <code>withPreloading(PreloadAllModules)</code></label>
    <ul class="lazy-routes-net" id="lazy-routes-net" aria-label="${tx('Chunks','Chunks')}"></ul>
    <button type="button" class="btn btn-secondary" id="lazy-routes-reload">${tx('Seite neu laden','Reload page')}</button>
  </div>
</div>
<div class="sim-card lazy-routes-logcard"><h3>${tx('Router-Events','Router events')}</h3><ul class="sim-log" id="lazy-routes-log" aria-label="${tx('Protokoll','Log')}"></ul></div>
<p class="demo-note">${tx('Probier: Öffne <code>/products</code> – der Chunk lädt erst jetzt, nach Guards und Resolvern. Ein zweites Mal kommt er aus dem Speicher. <code>/admin</code> lädt zuerst <code>admin.routes</code> (beim Abgleich) und dann die Seite. Lade neu mit Preloading: Nach der ersten Navigation kommen alle Chunks von allein.','Try: open <code>/products</code> – the chunk only loads now, after guards and resolvers. The second time it comes from memory. <code>/admin</code> first loads <code>admin.routes</code> (during matching) and then the page. Reload with preloading: after the first navigation all chunks arrive by themselves.')}</p>`,
  init(root){
    const {log}=NG,R=NGRT;
    const ul=$('#lazy-routes-log',root),view=$('#lazy-routes-view',root),url=$('#lazy-routes-url',root),tab=$('#lazy-routes-tab',root),busy=$('#lazy-routes-busy',root),net=$('#lazy-routes-net',root);
    const CHUNKS={'main':'main.js','product-list':'product-list.js','admin.routes':'admin.routes.js','admin-dashboard':'admin-dashboard.js','admin-users':'admin-users.js','about':'about.js'};
    const KB={'main':180,'product-list':24,'admin.routes':2,'admin-dashboard':38,'admin-users':31,'about':6};
    const routes=[{path:'',pathMatch:'full',component:'Home'},
      {path:'products',loadComponent:{chunk:'product-list',component:'ProductList'}},
      {path:'admin',loadChildren:{chunk:'admin.routes',routes:[{path:'',loadComponent:{chunk:'admin-dashboard',component:'AdminDashboard'}},{path:'users',loadComponent:{chunk:'admin-users',component:'AdminUsers'}}]}},
      {path:'about',loadComponent:{chunk:'about',component:'About'}},{path:'**',component:'NotFound'}];
    let router,st={},alive=true;
    const paintNet=()=>{net.innerHTML=Object.keys(CHUNKS).map(k=>{const s=st[k]||'idle';
      const lbl={idle:tx('nicht geladen','not loaded'),loading:tx('lädt …','loading …'),nav:tx('geladen bei Navigation','loaded on navigation'),pre:tx('vorgeladen','preloaded'),boot:tx('beim Start','at startup')}[s];
      return `<li class="lazy-routes-${s}"><code>${CHUNKS[k]}</code><span>${KB[k]} kB · ${lbl}</span></li>`}).join('')};
    let preloading=false;
    const boot=()=>{
      router&&router.cancelAll();st={main:'boot'};preloading=false;ul.innerHTML='';
      router=R.create({routes,chunkMs:800,on:ev=>{
        if(!alive)return;
        log(ul,R.fmt(ev));
        if(ev.type==='preload')preloading=true;
        if(ev.type==='RouteConfigLoadStart'){st[ev.chunk]='loading';paintNet();if(!preloading)busy.hidden=false}
        if(ev.type==='RouteConfigLoadEnd'){st[ev.chunk]=preloading?'pre':'nav';paintNet()}
        if(ev.type==='NavigationStart')preloading=false;
        if(ev.type==='NavigationEnd'){busy.hidden=true;url.value=ev.url;tab.textContent=ev.state.name;view.innerHTML=`<div class="ngrt-page"><h4>${ev.state.name}</h4></div>`;
          if($('#lazy-routes-pre',root).checked)setTimeout(()=>alive&&router.preloadAll(),0)}
        if(ev.type==='NavigationCancel'||ev.type==='NavigationError')busy.hidden=true;
      }});
      paintNet();router.navigate('/');
    };
    const go=u=>router.navigate(u);
    $('#lazy-routes-bar',root).addEventListener('submit',e=>{e.preventDefault();go(url.value)});
    root.addEventListener('click',e=>{const b=e.target.closest('[data-url]');if(b)go(b.dataset.url);if(e.target.closest('#lazy-routes-reload'))boot()});
    $('#lazy-routes-pre',root).addEventListener('change',boot);
    boot();
    return ()=>{alive=false;router.cancelAll()};
  },
  css:`.lazy-routes-top{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

  bad:{code:`import { AdminDashboard }
  from './admin/dashboard';
import { Reports } from './admin/reports';

export const routes: Routes = [
  { path: 'admin',
    component: AdminDashboard },
  { path: 'reports', component: Reports },
];`,
    note:tx('Statische Imports ziehen jede Seite in <code>main.js</code> – auch die, die viele nie öffnen. Der Start wird langsamer, je größer die App wird. (Der NgModule-Weg <code>loadChildren: () =&gt; import(…).then(m =&gt; m.AdminModule)</code> ist lazy, aber veraltet.)','Static imports pull every page into <code>main.js</code> – even those many users never open. Startup gets slower the bigger the app becomes. (The NgModule way <code>loadChildren: () =&gt; import(…).then(m =&gt; m.AdminModule)</code> is lazy, but outdated.)')},
  good:{code:`export const routes: Routes = [
  { path: '', component: Home }, // eager
  { path: 'products',
    loadComponent: () =>
      import('./products/product-list') },
  { path: 'admin',
    loadChildren: () =>
      import('./admin/admin.routes') },
];

// product-list.ts
export default class ProductList {}
// admin.routes.ts
export default [ … ] satisfies Routes;

provideRouter(routes,
  withPreloading(PreloadAllModules))`,
    note:tx('Die Startseite bleibt eager, alles andere wird eigener Chunk. <code>export default</code> spart das <code>.then(m =&gt; m.X)</code>. Umstellen hilft <code>ng generate @angular/core:route-lazy-loading</code>.','The start page stays eager, everything else becomes its own chunk. <code>export default</code> saves the <code>.then(m =&gt; m.X)</code>. <code>ng generate @angular/core:route-lazy-loading</code> helps you migrate.')},
  do:tx(['Die Einstiegsseite eager, alle anderen Seiten mit <code>loadComponent</code> laden.','Zusammengehörige Bereiche (Admin, Einstellungen) als eigenes <code>Routes</code>-Array mit <code>loadChildren</code> auslagern.','<code>PreloadAllModules</code> für kleine bis mittlere Apps; für große eine eigene <code>PreloadingStrategy</code>, die nur Wahrscheinliches lädt.','Die Events <code>RouteConfigLoadStart</code>/<code>End</code> oder <code>router.currentNavigation()</code> für einen Ladebalken nutzen.'],
        ['Load the entry page eagerly, all other pages with <code>loadComponent</code>.','Move related areas (admin, settings) into their own <code>Routes</code> array with <code>loadChildren</code>.','<code>PreloadAllModules</code> for small to medium apps; for big ones a custom <code>PreloadingStrategy</code> that only loads what’s likely.','Use the events <code>RouteConfigLoadStart</code>/<code>End</code> or <code>router.currentNavigation()</code> for a progress bar.']),
  dont:tx(['Lazy geladene Komponenten nicht zusätzlich irgendwo statisch importieren – dann landen sie wieder im Haupt-Bundle.','Nicht glauben, ein <code>canMatch</code>-Guard verhindert Preloading – <code>PreloadAllModules</code> lädt die Chunks trotzdem (nur das deprecated <code>canLoad</code> hält es auf). Den Zugriff schützt der Guard weiterhin.','Nicht jede Mini-Komponente lazy machen – jeder Chunk ist ein eigener Request.'],
        ['Don’t also import lazy-loaded components statically somewhere – then they end up in the main bundle again.','Don’t assume a <code>canMatch</code> guard prevents preloading – <code>PreloadAllModules</code> still loads the chunks (only the deprecated <code>canLoad</code> stops it). The guard still protects access.','Don’t make every tiny component lazy – each chunk is a request of its own.']),
  why:tx('<p><code>import()</code> ist für den Bundler ein Schnitt: Alles dahinter kommt in eine eigene Datei, die erst geladen wird, wenn die Funktion läuft. Der Router ruft <code>loadChildren</code> schon beim URL-Abgleich auf (er braucht die Kind-Routen, um weiterzusuchen), <code>loadComponent</code> dagegen erst nach Guards und Resolvern – lehnt ein <code>canActivate</code> ab, wird der Chunk gar nicht geladen.</p><p>Einmal geladen, merkt sich der Router das Ergebnis; jeder weitere Besuch ist sofort da. Preloading verschiebt das Laden nur zeitlich nach vorne: Nach der ersten Navigation – wenn die App schon benutzbar ist – holt der Router die restlichen Chunks im Hintergrund.</p>',
           '<p>For the bundler, <code>import()</code> is a cut: everything behind it goes into its own file that’s only loaded when the function runs. The router calls <code>loadChildren</code> already during URL matching (it needs the child routes to keep searching), <code>loadComponent</code> only after guards and resolvers – if a <code>canActivate</code> rejects, the chunk isn’t loaded at all.</p><p>Once loaded, the router remembers the result; every further visit is instant. Preloading only moves the loading earlier: after the first navigation – when the app is already usable – the router fetches the remaining chunks in the background.</p>')
});
