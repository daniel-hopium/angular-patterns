<p class="demo-note">${tx('Probier: Hak <code>isActive()</code> an – Angular schreibt genau eine Klasse. Klick dann „extra.highlight = !…“: Das Objekt ändert sich, das DOM nicht, weil die Referenz gleich bleibt. „extra = { … }“ erzeugt ein neues Objekt – jetzt wird die Klasse gesetzt.','Try: tick <code>isActive()</code> – Angular writes exactly one class. Then click “extra.highlight = !…”: the object changes, the DOM doesn’t, because the reference stays the same. “extra = { … }” creates a new object – now the class is set.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const box=$('#class-style-box',root),ul=$('#class-style-log',root);
    const s={active:false,error:false,w:40,extra:{highlight:false}};
    /* Was Angular sich pro Binding merkt – geschrieben wird nur bei Unterschied (===) */
    const last={active:undefined,error:undefined,w:undefined,extra:undefined,extraKeys:{}};
    function cd(){
      let writes=0;
      const cls=(name,on)=>{box.classList.toggle('class-style-'+name,on);log(ul,`<span class="hl">classList.${on?'add':'remove'}</span>('${name}')`);writes++};
      if(s.active!==last.active){if(last.active!==undefined||s.active)cls('active',s.active);last.active=s.active}
      if(s.error!==last.error){if(last.error!==undefined||s.error)cls('error',s.error);last.error=s.error}
      if(s.extra!==last.extra){
        for(const [k,v] of Object.entries(s.extra)){if(!!last.extraKeys[k]!==!!v)cls(k,!!v)}
        last.extraKeys={...s.extra};last.extra=s.extra;
      }
      if(s.w!==last.w){box.style.width=s.w+'%';log(ul,`<span class="hl">style.width</span> = '${s.w}%'`);writes++;last.w=s.w}
      if(!writes)log(ul,`<span class="t">${tx('geprüft – nichts geändert, kein DOM-Zugriff','checked – nothing changed, no DOM access')}</span>`);
      else flash(box);
      $('#class-style-attr',root).innerHTML=`class="<b>${esc([...box.classList].filter(c=>c!=='flash').map(c=>c.replace('class-style-','')).join(' '))}</b>"<br>style="<b>width: ${esc(box.style.width)}</b>"`;
      $('#class-style-obj',root).textContent=JSON.stringify(s.extra);
      $('#class-style-wv',root).textContent=s.w;
    }
    root.addEventListener('change',e=>{
      if(e.target.id==='class-style-active')s.active=e.target.checked;
      if(e.target.id==='class-style-error')s.error=e.target.checked;
      cd();
    });
    $('#class-style-w',root).addEventListener('input',e=>{s.w=+e.target.value;cd()});
    root.addEventListener('click',e=>{
      if(e.target.closest('#class-style-mutate')){s.extra.highlight=!s.extra.highlight;log(ul,`<span class="t">extra.highlight = ${s.extra.highlight} (${tx('Mutation','mutation')})</span>`);cd()}
      if(e.target.closest('#class-style-new')){s.extra={...s.extra,highlight:!last.extraKeys.highlight};log(ul,`<span class="t">extra = ${esc(JSON.stringify(s.extra))} (${tx('neues Objekt','new object')})</span>`);cd()}
    });
    cd();
  },
  css:`.class-style-h{margin-top:16px!important}.class-style-objline{margin-top:10px}
.class-style-code{margin:0 0 12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.class-style-track{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:6px;background:var(--surface-2)}
#class-style-box{height:36px;border-radius:6px;background:var(--line-strong);border:2px solid transparent;min-width:4px}
#class-style-box.class-style-active{background:var(--brand)}#class-style-box.class-style-error{border-color:var(--danger);background:var(--warn-bg)}#class-style-box.class-style-highlight{box-shadow:0 0 0 4px var(--brand-soft)}
.class-style-attr{font:500 .8125rem/1.5 var(--font-mono);overflow-wrap:anywhere;margin:10px 0}
@media (prefers-reduced-motion:no-preference){#class-style-box{transition:width .2s,background .2s}}`,
  bad:{code:`<div [ngClass]="{ active: isActive(), error: hasError() }"
     [ngStyle]="{ 'width.%': progress() }">
</div>

// imports: [NgClass, NgStyle]
// and somewhere in the class:
this.classes.highlight = true;   // mutated – [class]="classes" won't update`,
    note:tx('<code>NgClass</code> und <code>NgStyle</code> sind nicht deprecated, aber überflüssig: Sie brauchen einen Import und laufen als Direktive mit <code>ngDoCheck</code> bei jeder Prüfung. Und ein mutiertes Objekt erkennt ein <code>[class]</code>-Binding nicht.','<code>NgClass</code> and <code>NgStyle</code> are not deprecated, but unnecessary: they need an import and run as a directive with <code>ngDoCheck</code> on every check. And a <code>[class]</code> binding doesn’t detect a mutated object.')},
  good:{code:`<div class="card"
     [class.active]="isActive()"
     [class.error]="hasError()"
     [style.width.%]="progress()">
</div>

<\!-- several at once: object literal in the template is fine -->
<li [class]="{ done: task.done, late: task.late }">…</li>

// in the class: replace instead of mutate
this.classes = { ...this.classes, highlight: true };`,
    note:tx('Kein Import, gezielte Updates, und die statische Klasse <code>card</code> bleibt erhalten. Ein Objekt-Literal direkt im Template ist unproblematisch – der Compiler erzeugt nur dann ein neues Objekt, wenn sich ein Wert darin ändert.','No import, targeted updates, and the static class <code>card</code> stays. An object literal right in the template is fine – the compiler only creates a new object when one of its values changes.')},
  do:tx(['<code>[class.name]</code> für einzelne, an Bedingungen geknüpfte Klassen verwenden.','Einheiten direkt im Binding angeben: <code>[style.width.px]</code>, <code>[style.height.%]</code>.','Objekte und Arrays für <code>[class]</code>/<code>[style]</code> ersetzen statt verändern.','Bestehende Templates mit <code>ng generate @angular/core:ngclass-to-class</code> und <code>…:ngstyle-to-style</code> umstellen.'],
        ['Use <code>[class.name]</code> for single classes tied to conditions.','Put units right into the binding: <code>[style.width.px]</code>, <code>[style.height.%]</code>.','Replace objects and arrays for <code>[class]</code>/<code>[style]</code> instead of changing them.','Convert existing templates with <code>ng generate @angular/core:ngclass-to-class</code> and <code>…:ngstyle-to-style</code>.']),
  dont:tx(['Kein <code>[ngClass]</code> oder <code>[ngStyle]</code> in neuem Code, wenn ein Binding reicht.','Keine Objekt- oder Array-Felder mutieren, die an <code>[class]</code> oder <code>[style]</code> hängen.','Keine Klassen per <code>ElementRef.nativeElement.classList</code> setzen – Angular weiß davon nichts und kann sie überschreiben.'],
        ['No <code>[ngClass]</code> or <code>[ngStyle]</code> in new code when a binding does the job.','Don’t mutate object or array fields bound to <code>[class]</code> or <code>[style]</code>.','Don’t set classes via <code>ElementRef.nativeElement.classList</code> – Angular knows nothing about them and may overwrite them.']),
  why:tx('<p>Class- und Style-Bindings sind in den Renderer eingebaut. Angular merkt sich den letzten Wert jedes Bindings, vergleicht bei jeder Prüfung per <code>===</code> und schreibt nur bei einem Unterschied – dann genau die eine Klasse oder den einen Style. Statische Klassen, <code>[class]</code> und <code>[class.x]</code> werden dabei sauber zusammengeführt.</p><p>Der <code>===</code>-Vergleich erklärt auch die Falle: Ein mutiertes Objekt ist für Angular „dasselbe Objekt“. <code>ngClass</code> gleicht das zwar per Differ aus, zahlt dafür aber bei jeder Prüfung. Unveränderliche Updates sind die bessere Lösung – sie passen ohnehin zu Signals und OnPush.</p>',
           '<p>Class and style bindings are built into the renderer. Angular remembers the last value of every binding, compares with <code>===</code> on every check and only writes when there is a difference – then exactly that one class or style. Static classes, <code>[class]</code> and <code>[class.x]</code> are merged cleanly.</p><p>The <code>===</code> comparison also explains the trap: a mutated object is “the same object” to Angular. <code>ngClass</code> compensates with a differ, but pays for it on every check. Immutable updates are the better fix – they fit signals and OnPush anyway.</p>')
});

LESSONS.push({
  id:'defer-block', cat:'templates', order:50,
  title:tx('Später laden mit @defer','Load later with @defer'),
  short:tx('Teile des Templates samt Code erst laden, wenn sie gebraucht werden – mit Triggern, Prefetch und Platzhaltern.','Load parts of the template including their code only when needed – with triggers, prefetch and placeholders.'),
  keys:'defer lazy loading chunk viewport interaction idle timer when prefetch placeholder loading error minimum after hover immediate',
  since:'Angular 17', status:'stable',
  refs:[[tx('Angular-Doku: Trigger','Angular docs: Triggers'),'https://angular.dev/guide/templates/defer#controlling-deferred-content-loading-with-triggers'],
        [tx('Angular-Doku: @placeholder, @loading, @error','Angular docs: @placeholder, @loading, @error'),'https://angular.dev/guide/templates/defer#how-to-manage-different-stages-of-deferred-loading'],
        [tx('Angular-Doku: Prefetch','Angular docs: Prefetch'),'https://angular.dev/guide/templates/defer#prefetching-data-with-prefetch']],
  rule:tx('Alles in einem <code>@defer</code>-Block – Komponenten, Direktiven, Pipes – landet in einem eigenen Chunk und wird erst geladen, wenn ein Trigger feuert (Standard: <code>on idle</code>). Bis dahin zeigt Angular den <code>@placeholder</code>, während des Ladens <code>@loading</code>, bei einem Fehler <code>@error</code>. Mit <code>prefetch</code> holst du den Code früher, ohne ihn schon anzuzeigen.','Everything inside a <code>@defer</code> block – components, directives, pipes – goes into its own chunk and is only loaded when a trigger fires (default: <code>on idle</code>). Until then Angular shows the <code>@placeholder</code>, while loading <code>@loading</code>, on failure <code>@error</code>. With <code>prefetch</code> you fetch the code earlier without showing it yet.'),
  apis:[['on …','on viewport | interaction | hover | idle | immediate | timer(1s)',tx('Eingebaute Trigger. Mehrere mit <code>;</code> getrennt gelten als „oder“. <code>viewport</code>, <code>interaction</code> und <code>hover</code> beobachten ohne Referenz den Platzhalter.','Built-in triggers. Several separated by <code>;</code> count as “or”. Without a reference, <code>viewport</code>, <code>interaction</code> and <code>hover</code> watch the placeholder.')],
        ['when','when condition()',tx('Lädt, sobald die Bedingung truthy wird – einmalig, zurück geht es nicht.','Loads as soon as the condition becomes truthy – once, there is no way back.')],
        ['prefetch','prefetch on idle | prefetch when …',tx('Lädt nur den Code vorab; angezeigt wird erst beim Haupt-Trigger.','Only fetches the code ahead of time; it is shown on the main trigger.')],
        ['@placeholder','@placeholder (minimum 500ms) { … }',tx('Sichtbar vor dem Trigger. <code>minimum</code> verhindert Flackern.','Visible before the trigger. <code>minimum</code> prevents flicker.')],
        ['@loading','@loading (after 150ms; minimum 600ms) { … }',tx('Erst nach <code>after</code> zeigen, dann mindestens <code>minimum</code> lang. Ist der Code schneller da, erscheint es gar nicht.','Show only after <code>after</code>, then for at least <code>minimum</code>. If the code arrives sooner, it never appears.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Einstellungen','Settings')}</h3>
    ${TPL.seg('defer-block-trig',tx('Trigger','Trigger'),[['viewport','on viewport'],['interaction','on interaction'],['idle','on idle'],['timer','on timer(1s)'],['when','when show()']],'viewport')}
    <label class="check-row"><input type="checkbox" id="defer-block-prefetch"> <code>prefetch on idle</code></label>
    <label class="check-row"><input type="checkbox" id="defer-block-fail"> ${tx('Chunk-Download schlägt fehl','Chunk download fails')}</label>
    <label class="check-row" id="defer-block-when-row" hidden><input type="checkbox" id="defer-block-when"> <code>show()</code> = true</label>
    <p class="sim-row"><button type="button" class="btn btn-primary" id="defer-block-reload">${tx('Seite neu laden','Reload page')}</button></p>
    <pre class="defer-block-code" id="defer-block-code"></pre>
  </div>
  <div class="sim-card"><h3>${tx('Die Seite','The page')}</h3>
    <div class="defer-block-page" id="defer-block-page" tabindex="0" role="region" aria-label="${tx('Simulierte Seite, scrollbar','Simulated page, scrollable')}">
      <p class="defer-block-fill">${tx('Artikeltext … Scroll nach unten, dort sitzt der @defer-Block mit den Kommentaren.','Article text … Scroll down, the @defer block with the comments sits there.')}</p>
      <p class="defer-block-fill">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
      <p class="defer-block-fill">Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
      <p class="defer-block-fill">Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.</p>
      <div class="defer-block-slot" id="defer-block-slot" aria-live="polite"></div>
    </div>
    <p class="sim-row defer-block-states"><span class="sim-node" id="defer-block-s-placeholder">@placeholder</span><span class="sim-node" id="defer-block-s-loading">@loading</span><span class="sim-node" id="defer-block-s-complete">@defer</span><span class="sim-node" id="defer-block-s-error">@error</span></p>
    <p class="hint">comments.chunk.js: <b id="defer-block-chunk"></b></p>
    <ul class="sim-log" id="defer-block-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Mit <code>on viewport</code> scrollst du in der Seite nach unten – erst dann lädt der Chunk. Schalte <code>prefetch on idle</code> ein und lade neu: Der Code ist schon im Cache, wenn du ankommst, und <code>@loading</code> wird übersprungen. Mit „schlägt fehl“ siehst du <code>@error</code>.','Try: with <code>on viewport</code> scroll down inside the page – only then does the chunk load. Turn on <code>prefetch on idle</code> and reload: the code is already cached when you get there, and <code>@loading</code> is skipped. With “fails” you see <code>@error</code>.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const PH_MIN=500,LD_AFTER=150,LD_MIN=600,CHUNK_MS=900,IDLE_MS=300;
    const slot=$('#defer-block-slot',root),page=$('#defer-block-page',root),ul=$('#defer-block-log',root),chunkEl=$('#defer-block-chunk',root),code=$('#defer-block-code',root);
    let trig='viewport',t0=0,timers=new Set(),io=null,fired=false,chunk=null,chunkState='',phAt=0,run=0,state='';
    const later=(f,ms)=>{const my=run;const t=setTimeout(()=>{timers.delete(t);if(my===run)f()},ms);timers.add(t)};
    const ms=()=>`+${Math.round(performance.now()-t0)} ms`;
    const L=html=>log(ul,`<span class="t">${ms()}</span> ${html}`);
    const setChunk=s=>{chunkState=s;chunkEl.textContent={none:tx('nicht geladen','not loaded'),loading:tx('lädt …','loading …'),cached:tx('im Cache','cached'),failed:tx('fehlgeschlagen','failed')}[s]};
    function drawCode(){
      const t={viewport:'on viewport',interaction:'on interaction',idle:'on idle',timer:'on timer(1s)',when:'when show()'}[trig];
      const pf=$('#defer-block-prefetch',root).checked?'; prefetch on idle':'';
      code.textContent=`@defer (${t}${pf}) {
  <app-comments />
} @placeholder (minimum ${PH_MIN}ms) {
  ${trig==='interaction'?'<button>Show comments</button>':'<p>Comments …</p>'}
} @loading (after ${LD_AFTER}ms; minimum ${LD_MIN}ms) {
  <app-spinner />
} @error {
  <p>Could not load comments.</p>
}`;
    }
    function show(s){
      state=s;
      $$('.defer-block-states .sim-node',root).forEach(n=>n.classList.toggle('defer-block-on',n.id===`defer-block-s-${s}`));
      flash($(`#defer-block-s-${s}`,root));
      if(s==='placeholder')slot.innerHTML=trig==='interaction'?`<button type="button" class="btn btn-secondary" id="defer-block-ph">${tx('Kommentare anzeigen','Show comments')}</button>`:`<p class="defer-block-ph" id="defer-block-ph">${tx('Kommentare …','Comments …')}</p>`;
      if(s==='loading')slot.innerHTML=`<p class="defer-block-loading"><span class="defer-block-spin" aria-hidden="true"></span>${tx('Lädt Kommentare …','Loading comments …')}</p>`;
      if(s==='complete')slot.innerHTML=`<ul class="defer-block-comments"><li><b>Anna:</b> ${tx('Toller Artikel!','Great article!')}</li><li><b>Ben:</b> ${tx('Danke, hat geholfen.','Thanks, that helped.')}</li></ul>`;
      if(s==='error')slot.innerHTML=`<p class="defer-block-err">${tx('Kommentare konnten nicht geladen werden.','Could not load comments.')}</p>`;
      L(`${tx('rendert','renders')} <span class="hl">${s==='complete'?'@defer':'@'+s}</span>`);
    }
    function loadChunk(why){
      if(chunk)return chunk;
      setChunk('loading');L(`GET comments.chunk.js <span class="t">(${why})</span>`);
      const fail=$('#defer-block-fail',root).checked,my=run;
      chunk=new Promise((res,rej)=>later(()=>{if(fail){setChunk('failed');L(tx('Chunk-Download fehlgeschlagen','chunk download failed'));rej()}else{setChunk('cached');L(tx('Chunk geladen','chunk loaded'));res()}},CHUNK_MS));
      chunk.catch(()=>{});
      return chunk;
    }
    function fire(reason){
      if(fired)return;fired=true;io?.disconnect();
      L(`<span class="hl">${tx('Trigger','trigger')}</span> ${esc(reason)}`);
      const wait=Math.max(0,PH_MIN-(performance.now()-phAt));
      if(wait>0)L(tx(`@placeholder minimum: noch ${Math.round(wait)} ms warten`,`@placeholder minimum: wait another ${Math.round(wait)} ms`));
      later(begin,wait);
    }
    function begin(){
      if(chunkState==='cached'){show('complete');return}
      let loadingAt=0;
      later(()=>{if(chunkState==='loading'){show('loading');loadingAt=performance.now()}},LD_AFTER);
      const finish=s=>{const rest=loadingAt?Math.max(0,LD_MIN-(performance.now()-loadingAt)):0;if(rest>0)L(tx(`@loading minimum: noch ${Math.round(rest)} ms`,`@loading minimum: another ${Math.round(rest)} ms`));later(()=>show(s),rest)};
      loadChunk(tx('Trigger','trigger')).then(()=>finish('complete'),()=>finish('error'));
    }
    function start(){
      run++;timers.forEach(clearTimeout);timers.clear();io?.disconnect();io=null;
      fired=false;chunk=null;setChunk('none');t0=performance.now();ul.replaceChildren();
      page.scrollTop=0;drawCode();
      L(tx('Seite geladen','page loaded'));
      show('placeholder');phAt=performance.now();
      if($('#defer-block-prefetch',root).checked)later(()=>{L(tx('Browser ist idle → prefetch','browser is idle → prefetch'));loadChunk('prefetch')},IDLE_MS);
      if(trig==='idle')later(()=>fire('on idle (requestIdleCallback)'),IDLE_MS);
      if(trig==='timer')later(()=>fire('on timer(1s)'),1000);
      if(trig==='viewport'){io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))fire(tx('on viewport – Platzhalter ist sichtbar','on viewport – placeholder is visible'))},{root:page});io.observe(slot)}
      if(trig==='when'){const w=$('#defer-block-when',root);w.checked=false}
    }
    root.addEventListener('click',e=>{
      if(e.target.closest('#defer-block-reload'))start();
      if(e.target.closest('#defer-block-ph')&&trig==='interaction'&&state==='placeholder')fire(tx('on interaction – Klick auf den Platzhalter','on interaction – click on the placeholder'));
    });
    root.addEventListener('change',e=>{
      if(e.target.name==='defer-block-trig'){trig=e.target.value;$('#defer-block-when-row',root).hidden=trig!=='when';start()}
      if(e.target.id==='defer-block-prefetch'||e.target.id==='defer-block-fail')start();
      if(e.target.id==='defer-block-when'){
        if(e.target.checked)fire('when show() → true');
        else if(fired)L(tx('show() = false – <code>when</code> ist einmalig, der Block bleibt','show() = false – <code>when</code> is one-time, the block stays'));
      }
    });
    start();
    return ()=>{run++;timers.forEach(clearTimeout);io?.disconnect()};
  },
  css:`.defer-block-code{margin:12px 0 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.defer-block-page{height:200px;overflow:auto;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface-2);margin-bottom:10px}

.defer-block-states{margin:0 0 6px}.defer-block-states .sim-node.defer-block-on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}`,
  bad:{code:`// Everything in the main bundle, rendered immediately
@Component({
  imports: [CommentsComponent, ChartComponent],
  template: \`
    <app-article />
    <app-chart [data]="data()" />   <\!-- far below the fold -->
    <app-comments />
  \`
})
export class ArticlePage {}`,
    note:tx('Diagramm-Bibliothek und Kommentare landen im Start-Bundle und werden sofort gerendert – obwohl sie weit unten stehen und viele Besucher nie dort ankommen.','Chart library and comments land in the initial bundle and are rendered right away – although they sit far below and many visitors never get there.')},
  good:{code:`<app-article />

@defer (on viewport; prefetch on idle) {
  <app-chart [data]="data()" />
} @placeholder (minimum 500ms) {
  <div class="chart-skeleton"></div>
} @loading (after 150ms; minimum 600ms) {
  <app-spinner />
} @error {
  <p>Chart could not be loaded.</p>
}

@defer (on interaction) {
  <app-comments />
} @placeholder {
  <button>Show comments</button>
}`,
    note:tx('Der Compiler lagert <code>ChartComponent</code> und <code>CommentsComponent</code> in eigene Chunks aus. Sie dürfen dafür nur im <code>@defer</code>-Block und nirgends sonst in der Datei verwendet werden und müssen standalone sein.','The compiler moves <code>ChartComponent</code> and <code>CommentsComponent</code> into their own chunks. For that they may only be used inside the <code>@defer</code> block and nowhere else in the file, and they must be standalone.')},
  do:tx(['Schwere Teile unterhalb des sichtbaren Bereichs mit <code>on viewport</code> laden.','Einen Platzhalter mit der späteren Höhe bauen, damit nichts springt (Layout Shift).','<code>prefetch on idle</code> kombinieren, wenn der Nutzer den Block sehr wahrscheinlich braucht.','Für <code>viewport</code>, <code>interaction</code> und <code>hover</code> ohne Referenz genau ein Root-Element in den <code>@placeholder</code> setzen.','In Tests mit <code>fixture.getDeferBlocks()</code> und <code>render(DeferBlockState.Complete)</code> gezielt Zustände prüfen.'],
        ['Load heavy parts below the fold with <code>on viewport</code>.','Build a placeholder with the later height so nothing jumps (layout shift).','Combine with <code>prefetch on idle</code> when the user very likely needs the block.','For <code>viewport</code>, <code>interaction</code> and <code>hover</code> without a reference, put exactly one root element in the <code>@placeholder</code>.','In tests, check states on purpose with <code>fixture.getDeferBlocks()</code> and <code>render(DeferBlockState.Complete)</code>.']),
  dont:tx(['Nichts deferren, was beim ersten Rendern sichtbar ist – das verschlechtert den Layout Shift und die Ladezeit.','Die verzögerte Komponente nicht zusätzlich außerhalb des Blocks verwenden oder per <code>@ViewChild</code> referenzieren – dann wird sie eager geladen.','Nicht erwarten, dass <code>when</code> den Block wieder entfernt, wenn die Bedingung false wird.','Keine verschachtelten <code>@defer</code>-Blöcke mit denselben Triggern – das erzeugt Wasserfälle von Requests.'],
        ['Don’t defer anything that is visible on first render – that worsens layout shift and load time.','Don’t also use the deferred component outside the block or reference it via <code>@ViewChild</code> – then it is loaded eagerly.','Don’t expect <code>when</code> to remove the block again when the condition becomes false.','No nested <code>@defer</code> blocks with the same triggers – that creates request waterfalls.']),
  why:tx('<p>Der Compiler sammelt alle Abhängigkeiten im <code>@defer</code>-Block und ersetzt ihre statischen Importe durch dynamische <code>import()</code>-Aufrufe. Das Start-Bundle wird kleiner, der Browser parst weniger JavaScript und die Seite ist früher bedienbar. Die Abhängigkeiten von <code>@placeholder</code>, <code>@loading</code> und <code>@error</code> werden dagegen eager geladen – halte sie klein.</p><p>Die Zeitparameter gibt es gegen Flackern: Ist der Code nach 50 ms da, wäre ein Spinner, der kurz aufblitzt, schlimmer als keiner. <code>after</code> zeigt ihn erst, wenn es wirklich dauert, und <code>minimum</code> lässt ihn dann lange genug stehen, um nicht zu zucken.</p>',
           '<p>The compiler collects all dependencies inside the <code>@defer</code> block and replaces their static imports with dynamic <code>import()</code> calls. The initial bundle gets smaller, the browser parses less JavaScript and the page becomes interactive sooner. The dependencies of <code>@placeholder</code>, <code>@loading</code> and <code>@error</code> are loaded eagerly though – keep them small.</p><p>The timing parameters prevent flicker: if the code arrives after 50 ms, a spinner that flashes briefly would be worse than none. <code>after</code> only shows it when it really takes a while, and <code>minimum</code> then keeps it long enough not to twitch.</p>'),
  test:{code:`beforeEach(() => {
  TestBed.configureTestingModule({
    deferBlockBehavior: DeferBlockBehavior.Manual,
  });
});

it('renders the chart once loaded', async () => {
  const fixture = TestBed.createComponent(ArticlePage);
  const [chartBlock] = await fixture.getDeferBlocks();
  await chartBlock.render(DeferBlockState.Complete);
  expect(fixture.nativeElement.querySelector('app-chart')).not.toBeNull();
});`,note:tx('<code>DeferBlockBehavior</code> und <code>DeferBlockState</code> kommen aus <code>@angular/core/testing</code>. Standard ist <code>Playthrough</code> (wie im Browser); mit <code>Manual</code> steuerst du jeden Zustand selbst.','<code>DeferBlockBehavior</code> and <code>DeferBlockState</code> come from <code>@angular/core/testing</code>. The default is <code>Playthrough</code> (like in the browser); with <code>Manual</code> you drive every state yourself.')}
});

LESSONS.push({
  id:'for-track', cat:'templates', order:20,
  title:tx('Listen mit @for und track','Lists with @for and track'),
  short:tx('track sagt Angular, welcher DOM-Knoten zu welchem Eintrag gehört – das entscheidet über Wiederverwenden oder Neubauen.','track tells Angular which DOM node belongs to which item – that decides between reusing and rebuilding.'),
  keys:'for ngfor track trackby liste list index first last even odd count empty schleife loop dom',
  since:'Angular 17', status:'stable',
  refs:[[tx('Angular-Doku: Warum track wichtig ist','Angular docs: Why track is important'),'https://angular.dev/guide/templates/control-flow#why-is-track-in-for-blocks-important'],
        [tx('Angular-Doku: Kontextvariablen in @for','Angular docs: Contextual variables in @for'),'https://angular.dev/guide/templates/control-flow#contextual-variables-in-for-blocks'],
        [tx('Angular-Doku: @empty','Angular docs: @empty'),'https://angular.dev/guide/templates/control-flow#providing-a-fallback-for-for-blocks-with-the-empty-block']],
  rule:tx('Jedes <code>@for</code> braucht ein <code>track</code>. Nimm dafür eine stabile, eindeutige ID (<code>track item.id</code>): Dann verschiebt Angular beim Umsortieren nur vorhandene DOM-Knoten, statt sie neu zu bauen. <code>track $index</code> passt nur für Listen, die sich nie umsortieren.','Every <code>@for</code> needs a <code>track</code>. Use a stable, unique ID for it (<code>track item.id</code>): then Angular only moves existing DOM nodes when the list is re-sorted instead of rebuilding them. <code>track $index</code> only fits lists that never get re-sorted.'),
  apis:[['@for','@for (item of items; track item.id) { … }',tx('Wiederholt den Block für jeden Eintrag. <code>track</code> ist Pflicht.','Repeats the block for every item. <code>track</code> is required.')],
        ['$index $count','let i = $index, n = $count',tx('Position des Eintrags und Anzahl aller Einträge. Mit <code>let</code> kannst du Aliase vergeben.','Position of the item and number of all items. <code>let</code> gives them aliases.')],
        ['$first $last','boolean',tx('Erster bzw. letzter Eintrag.','First or last item.')],
        ['$even $odd','boolean',tx('Gerader bzw. ungerader Index – z. B. für Zebrastreifen.','Even or odd index – e.g. for zebra stripes.')],
        ['@empty','} @empty { … }',tx('Wird gerendert, wenn die Liste leer ist.','Rendered when the list is empty.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card for-track-wide"><h3>${tx('Die Liste','The list')}</h3>
    ${TPL.seg('for-track-mode','track …',[['id','item.id'],['index','$index'],['identity',tx('item (Identität)','item (identity)')]],'id')}
    <div class="sim-row for-track-actions">
      <button type="button" class="btn btn-secondary" data-ft="reverse">${tx('Umdrehen','Reverse')}</button>
      <button type="button" class="btn btn-secondary" data-ft="reload">${tx('Neu laden (neue Objekte)','Reload (new objects)')}</button>
      <button type="button" class="btn btn-secondary" data-ft="prepend">${tx('Vorne einfügen','Insert at start')}</button>
      <button type="button" class="btn btn-secondary" data-ft="shift">${tx('Ersten entfernen','Remove first')}</button>

    <ol class="for-track-list" id="for-track-list" aria-label="${tx('Personen','People')}"></ol>
