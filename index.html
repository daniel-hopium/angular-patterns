  rule:tx('Ein <code>effect()</code> läuft mindestens einmal und danach jedes Mal, wenn sich ein gelesenes Signal ändert – <strong>asynchron und gebündelt</strong>, nicht sofort beim <code>set()</code>. Nimm es nur, um Signals mit etwas <em>außerhalb</em> der Signal-Welt abzugleichen. Was sich aus Signals ergibt, ist ein <code>computed()</code>.','An <code>effect()</code> runs at least once and then every time a signal it read changes – <strong>asynchronously and batched</strong>, not right at <code>set()</code>. Only use it to sync signals with something <em>outside</em> the signal world. Anything that follows from signals is a <code>computed()</code>.'),
  apis:[['effect(fn)','effect((onCleanup) => void, { injector?, manualCleanup?, debugName? }): EffectRef',tx('Registriert einen Seiteneffekt. Braucht einen Injection Context – oder die Option <code>injector</code>.','Registers a side effect. Needs an injection context – or the <code>injector</code> option.')],
        ['onCleanup(fn)','(cleanupFn: () => void) => void',tx('Läuft vor dem nächsten Durchlauf und beim Zerstören – zum Abbrechen von Timern, Requests, Listenern.','Runs before the next run and on destroy – to cancel timers, requests, listeners.')],
        ['EffectRef.destroy()','destroy(): void',tx('Effect vorzeitig beenden. Sonst endet er automatisch mit seiner Komponente oder seinem Service.','End the effect early. Otherwise it ends automatically with its component or service.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Notiz (Signal im Service)','Note (signal in a service)')}</h3>
    <div class="field"><label for="effect-input">draft</label><input class="input" id="effect-input" type="text" autocomplete="off" spellcheck="false"></div>
    <div class="sim-row effect-btns">
      <button type="button" class="btn btn-secondary" id="effect-burst">${tx('3× in einem Zug setzen','Set 3× in one go')}</button>
      <button type="button" class="btn btn-secondary" id="effect-life">${tx('Komponente zerstören','Destroy component')}</button>
    </div>
    <p class="effect-status"><span class="sim-node" id="effect-n-cmp">EditorComponent: <b id="effect-alive">${tx('lebt','alive')}</b></span></p>
  </div>
  <div class="sim-card"><h3>${tx('Außenwelt: localStorage','Outside world: localStorage')}</h3>
    <p class="effect-store"><code>note-draft</code> = <b id="effect-store">""</b></p>
    <p class="hint">${tx('Effect-Läufe:','Effect runs:')} <b id="effect-runs">0</b> · ${tx('gespeichert:','saved:')} <b id="effect-saves">0</b>×</p>
    <ul class="sim-log" id="effect-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Tipp schnell ein Wort – jeder Buchstabe startet den Effect neu, <code>onCleanup</code> bricht den alten Timer ab, gespeichert wird erst nach 500 ms Ruhe. „3× in einem Zug setzen“ ergibt nur <em>einen</em> Lauf mit dem letzten Wert. Nach „Komponente zerstören“ reagiert nichts mehr.','Try: type a word quickly – every letter restarts the effect, <code>onCleanup</code> cancels the old timer, it only saves after 500 ms of quiet. “Set 3× in one go” results in just <em>one</em> run with the last value. After “Destroy component” nothing reacts anymore.')}</p>`,
  init(root){
    const {signal,effect,log,flash}=NG;
    const ul=$('#effect-log',root),inp=$('#effect-input',root),life=$('#effect-life',root);
    const draft=signal('',{name:'draft'});
    let eff=null,runs=0,saves=0;
    const create=()=>{
      eff=effect(onCleanup=>{
        const text=draft();
        runs++;$('#effect-runs',root).textContent=runs;flash($('#effect-n-cmp',root));
        log(ul,`<span class="hl">effect #${runs}</span> draft = "${esc(text)}" – ${tx('Timer 500 ms','timer 500 ms')}`);
        const t=setTimeout(()=>{
          saves++;$('#effect-saves',root).textContent=saves;
          $('#effect-store',root).textContent=JSON.stringify(text);
          log(ul,`localStorage.setItem('note-draft', "${esc(text)}")`);
        },500);
        onCleanup(()=>{clearTimeout(t);log(ul,`<span class="t">onCleanup</span> ${tx('alter Timer abgebrochen','old timer cancelled')}`)});
      },{name:'save'});
    };
    create();
    inp.addEventListener('input',()=>draft.set(inp.value));
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='effect-burst'){
        const base=inp.value;
        ['1','2','3'].forEach(s=>draft.set(base+s));
        inp.value=base+'3';
        log(ul,`<span class="t">set</span> draft ×3 ${tx('synchron','synchronously')}`);
      }
      if(b.id==='effect-life'){
        if(eff){eff.destroy();eff=null;log(ul,`<span class="t">DestroyRef</span> ${tx('Komponente zerstört → Effect beendet','component destroyed → effect ended')}`)}
        else{log(ul,`<span class="t">${tx('neu','new')}</span> ${tx('Komponente erzeugt → Effect läuft einmal','component created → effect runs once')}`);create()}
        const alive=!!eff;
        b.textContent=alive?tx('Komponente zerstören','Destroy component'):tx('Komponente erzeugen','Create component');
        $('#effect-alive',root).textContent=alive?tx('lebt','alive'):tx('zerstört','destroyed');
      }
    });
    return ()=>{eff?.destroy()};
  },
  css:`.effect-btns{margin-top:12px}.effect-status{margin:12px 0 0}.effect-store{margin:0 0 8px;overflow-wrap:anywhere}`,
  bad:{code:`export class Editor implements OnInit {
  draft = input('');
  upper = signal('');

  ngOnInit() {
    // NG0203: effect() can only be used within an injection context …
    effect(() => localStorage.setItem('draft', this.draft()));
  }

  constructor() {
    // derived state copied over with an effect
    effect(() => this.upper.set(this.draft().toUpperCase()));
  }
}`,
    note:tx('<code>ngOnInit</code> ist kein Injection Context – dort wirft <code>effect()</code> den Fehler NG0203. Und <code>upper</code> ist abgeleiteter Zustand: kurz veraltet, von außen überschreibbar, eine zusätzliche Runde durch die Change Detection.','<code>ngOnInit</code> is not an injection context – <code>effect()</code> throws NG0203 there. And <code>upper</code> is derived state: briefly stale, overwritable from outside, an extra round through change detection.')},
  good:{code:`export class Editor {
  draft = input('');
  upper = computed(() => this.draft().toUpperCase());

  constructor() {
    effect(onCleanup => {
      const text = this.draft();
      const t = setTimeout(() => localStorage.setItem('draft', text), 500);
      onCleanup(() => clearTimeout(t));
    });
  }
}`,
    note:tx('Der Effect sitzt im Konstruktor (Injection Context), schreibt nur in die Außenwelt und räumt seinen Timer selbst weg. Außerhalb davon: <code>effect(fn, { injector: this.injector })</code>.','The effect sits in the constructor (injection context), only writes to the outside world and cleans up its own timer. Elsewhere: <code>effect(fn, { injector: this.injector })</code>.')},
  do:tx(['Effects für Brücken nach außen: <code>localStorage</code>, Analytics/Logging, Canvas, Karten- oder Chart-Bibliotheken.','Effects im Konstruktor oder als Feld-Initialisierer anlegen – dort gibt es den Injection Context.','Alles, was ein Durchlauf startet (Timer, Listener, Requests), mit <code>onCleanup</code> wieder abbauen.','Für DOM-Arbeit nach dem Rendern <code>afterRenderEffect()</code> nehmen statt <code>effect()</code>.'],
        ['Use effects as bridges to the outside: <code>localStorage</code>, analytics/logging, canvas, map or chart libraries.','Create effects in the constructor or as a field initializer – that’s where the injection context is.','Tear down whatever a run starts (timers, listeners, requests) with <code>onCleanup</code>.','For DOM work after rendering, use <code>afterRenderEffect()</code> instead of <code>effect()</code>.']),
  dont:tx(['Keine Effects, die nur ein anderes Signal aus Signals berechnen – das ist <code>computed()</code> oder <code>linkedSignal()</code>.','Nicht erwarten, dass ein Effect synchron nach <code>set()</code> läuft; mehrere Änderungen ergeben einen Lauf.','<code>allowSignalWrites</code> nicht mehr setzen – die Option ist veraltet, Schreiben ist erlaubt (aber selten eine gute Idee).','Keine Signals nach einem <code>await</code> lesen und erwarten, dass sie Abhängigkeit werden – getrackt wird nur der synchrone Teil.'],
        ['No effects that just compute another signal from signals – that’s <code>computed()</code> or <code>linkedSignal()</code>.','Don’t expect an effect to run synchronously after <code>set()</code>; several changes result in one run.','Don’t set <code>allowSignalWrites</code> anymore – the option is deprecated, writing is allowed (but rarely a good idea).','Don’t read signals after an <code>await</code> and expect them to become dependencies – only the synchronous part is tracked.']),
  why:tx('<p>Ein Effect merkt sich wie <code>computed</code>, welche Signals er gelesen hat. Ändert sich eines, wird er nur als „dirty“ markiert und später ausgeführt: Effects einer Komponente laufen während der Change Detection, Effects außerhalb des Komponentenbaums (z. B. in einem Root-Service) davon unabhängig. Darum führen drei <code>set()</code> hintereinander zu einem einzigen Lauf mit dem letzten Wert.</p><p>Weil der Effect später läuft, ist ein damit „nachgeschriebenes“ Signal für einen Moment falsch – und schreibt ein Effect in Signals, die er selbst oder ein anderer Effect liest, entstehen Kaskaden oder Endlosschleifen. Der Injection Context wird gebraucht, weil sich der Effect beim <code>DestroyRef</code> seiner Komponente anmeldet und mit ihr endet – deshalb musst du ihn fast nie selbst zerstören.</p>',
           '<p>Like <code>computed</code>, an effect records which signals it read. When one changes, it’s only marked “dirty” and executed later: effects of a component run during change detection, effects outside the component tree (e.g. in a root service) independently of it. That’s why three <code>set()</code> calls in a row result in a single run with the last value.</p><p>Because the effect runs later, a signal “copied over” with it is wrong for a moment – and if an effect writes signals that it or another effect reads, you get cascades or infinite loops. The injection context is needed because the effect registers with its component’s <code>DestroyRef</code> and ends with it – which is why you almost never have to destroy it yourself.</p>'),
  test:{code:`it('saves the draft to localStorage', () => {
  const draft = signal('hi');
  TestBed.runInInjectionContext(() =>
    effect(() => localStorage.setItem('draft', draft()))
  );

  TestBed.tick();                 // runs pending effects
  expect(localStorage.getItem('draft')).toBe('hi');

  draft.set('hello');
  expect(localStorage.getItem('draft')).toBe('hi');   // not yet!
  TestBed.tick();
  expect(localStorage.getItem('draft')).toBe('hello');
});`,note:tx('<code>TestBed.tick()</code> führt anstehende Effects aus (es ersetzt das veraltete <code>TestBed.flushEffects()</code>). Die Zeile „not yet!“ zeigt, dass Effects nicht synchron laufen.','<code>TestBed.tick()</code> runs pending effects (it replaces the deprecated <code>TestBed.flushEffects()</code>). The “not yet!” line shows that effects don’t run synchronously.')}
});

LESSONS.push({
  id:'linked-signal', cat:'signals', order:50,
  title:tx('Abhängiger Zustand mit linkedSignal()','Dependent state with linkedSignal()'),
  short:tx('Ein schreibbares Signal, das sich zurücksetzt, wenn seine Quelle sich ändert – etwa die Auswahl, wenn sich die Liste ändert.','A writable signal that resets when its source changes – like the selection when the list changes.'),
  keys:'linkedsignal linked signal auswahl selection reset zurücksetzen source computation previous abhängig dependent state',
  since:'Angular 19', status:'stable',
  refs:[[tx('Angular-Doku: Dependent state with linkedSignal','Angular docs: Dependent state with linkedSignal'),'https://angular.dev/guide/signals/linked-signal'],
        [tx('Angular-Doku: Vorherigen Zustand berücksichtigen','Angular docs: Accounting for previous state'),'https://angular.dev/guide/signals/linked-signal#accounting-for-previous-state'],
        [tx('API: linkedSignal()','API: linkedSignal()'),'https://angular.dev/api/core/linkedSignal']],
  rule:tx('Wenn ein Wert <em>vom Benutzer änderbar</em> ist, aber sich bei einer Änderung seiner Quelle <em>neu ergeben</em> muss, ist er ein <code>linkedSignal()</code>. Es verhält sich wie ein <code>signal()</code> (mit <code>set</code>/<code>update</code>) und wie ein <code>computed()</code>, sobald sich die Quelle ändert.','When a value is <em>changeable by the user</em>, but has to be <em>derived anew</em> when its source changes, it’s a <code>linkedSignal()</code>. It behaves like a <code>signal()</code> (with <code>set</code>/<code>update</code>) and like a <code>computed()</code> as soon as the source changes.'),
  apis:[['linkedSignal(fn)','linkedSignal(() => D, { equal? }): WritableSignal<D>',tx('Kurzform: Startwert und Reset kommen aus <code>fn</code>; jede Änderung eines darin gelesenen Signals setzt zurück.','Short form: initial value and reset come from <code>fn</code>; any change of a signal read inside resets it.')],
        ['linkedSignal({ source, computation })','{ source: () => S, computation: (s: S, previous?: { source: S; value: D }) => D }',tx('Langform mit Zugriff auf den vorherigen Wert – etwa um eine Auswahl zu behalten, wenn es sie noch gibt.','Long form with access to the previous value – e.g. to keep a selection if it still exists.')],
        ['.set() / .update()','set(value: D): void',tx('Lokal überschreiben – gilt, bis sich die Quelle das nächste Mal ändert.','Override locally – holds until the source changes the next time.')]],
  demo:`<div class="sim-card linked-signal-src"><h3>${tx('Quelle: Lieferland','Source: country')}</h3>
  <div class="sim-row" role="group" aria-label="${tx('Lieferland','Country')}">
    <button type="button" class="btn btn-secondary linked-signal-c" data-c="AT" aria-pressed="true">AT</button>
    <button type="button" class="btn btn-secondary linked-signal-c" data-c="DE" aria-pressed="false">DE</button>
    <button type="button" class="btn btn-secondary linked-signal-c" data-c="CH" aria-pressed="false">CH</button>
  </div>
  <p class="hint">options = computed(() => SHIPPING[country()])</p>
</div>
<div class="sim-grid">
  <div class="sim-card"><h3>selected = signal(…)</h3>
    <fieldset class="linked-signal-fs"><legend>${tx('Versandart','Shipping')}</legend><div id="linked-signal-a"></div></fieldset>
    <p class="linked-signal-out" id="linked-signal-out-a" aria-live="polite"></p>
  </div>
  <div class="sim-card"><h3>selected = linkedSignal(…)</h3>
    <fieldset class="linked-signal-fs"><legend>${tx('Versandart','Shipping')}</legend><div id="linked-signal-b"></div></fieldset>
    <p class="linked-signal-out" id="linked-signal-out-b" aria-live="polite"></p>
    <ul class="sim-log" id="linked-signal-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Wähle in beiden Karten „Express“ und wechsle auf DE – Express gibt es dort auch, rechts bleibt es gewählt. Dann CH: Links steht noch „Express“ im Zustand, obwohl es die Option nicht gibt. Rechts fällt die Auswahl auf die erste Option zurück.','Try: pick “Express” in both cards and switch to DE – Express exists there too, on the right it stays selected. Then CH: on the left the state still says “Express” although the option doesn’t exist. On the right the selection falls back to the first option.')}</p>`,
  init(root){
    const {signal,computed,effect,untracked,log}=NG;
    /* Kleines Modell von linkedSignal: ein computed aus Quelle + lokalem Override.
       Ein lokaler Wert gilt nur für die Quellversion, zu der er gesetzt wurde. */
    function linkedSignal({source,computation,name='linked'}){
      let prev;
      const base=computed(()=>({src:source()}),{name:name+'.source'});
      const local=signal(null,{name:name+'.local'});
      const c=computed(()=>{
        const b=base(),o=local();
        const v=o&&o.base===b?o.value:computation(b.src,prev);
        prev={source:b.src,value:v};
        return v;
      },{name});
      c.set=v=>local.set({base:untracked(base),value:v});
      return c;
    }
    const SHIP={AT:[['standard','Standard',4.9],['express','Express',9.9],['pickup',tx('Abholung','Pick-up'),0]],
                DE:[['standard','Standard',5.9],['express','Express',12.9]],
                CH:[['standard','Standard',9],['post',tx('Post Priority','Post Priority'),14]]};
    const fmt=v=>new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}).format(v);
    const ul=$('#linked-signal-log',root);
    const country=signal('AT',{name:'country'});
    const options=computed(()=>SHIP[country()].map(([id,label,price])=>({id,label,price})),{name:'options'});
    const selA=signal(untracked(options)[0],{name:'selA'});
    const selB=linkedSignal({source:options,name:'selB',computation:(opts,prev)=>{
      const keep=prev&&opts.find(o=>o.id===prev.value.id);
      log(ul,`<span class="hl">computation</span>(${tx('Optionen','options')}, prev = ${prev?prev.value.id:'undefined'}) → ${keep?keep.id+' '+tx('(behalten)','(kept)'):opts[0].id+' '+tx('(zurückgesetzt)','(reset)')}`);
      return keep||opts[0];
    }});
    const radios=(box,name,sel,set)=>{
      const opts=options(),cur=sel();
      /* Nur bei neuer Liste neu aufbauen, sonst bliebe der Tastaturfokus nicht auf dem Radio */
      if(box._opts!==opts){
        box._opts=opts;
        box.innerHTML=opts.map(o=>`<label class="check-row"><input type="radio" name="${name}" value="${o.id}"> ${esc(o.label)} · ${fmt(o.price)}</label>`).join('');
        box.onchange=e=>set(opts.find(o=>o.id===e.target.value));
      }
      $$('input',box).forEach(r=>{r.checked=!!cur&&cur.id===r.value});
    };
    const out=(el,sel)=>{
      const s=sel(),ok=options().some(o=>o.id===s.id);
      el.innerHTML=ok?`${tx('Bestellung','Order')}: ${esc(s.label)} · <b>${fmt(s.price)}</b>`:`<span class="linked-signal-bad">${tx(`Zustand: „${esc(s.label)}“ – gibt es in ${country()} nicht!`,`State: “${esc(s.label)}” – doesn’t exist in ${country()}!`)}</span>`;
    };
    const view=effect(()=>{
      radios($('#linked-signal-a',root),'linked-signal-a',selA,v=>selA.set(v));
      radios($('#linked-signal-b',root),'linked-signal-b',selB,v=>{selB.set(v);log(ul,`<span class="t">set</span> selected = ${v.id} (${tx('lokal','local')})`)});
      out($('#linked-signal-out-a',root),selA);out($('#linked-signal-out-b',root),selB);
    },{name:'view'});
    root.addEventListener('click',e=>{
      const b=e.target.closest('.linked-signal-c');if(!b)return;
      $$('.linked-signal-c',root).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      log(ul,`<span class="t">set</span> country = ${b.dataset.c}`);
      country.set(b.dataset.c);
    });
    return ()=>view.destroy();
  },
  css:`.linked-signal-src{margin-bottom:16px}.linked-signal-src .hint{margin:10px 0 0;font-family:var(--font-mono);font-size:.8125rem}.linked-signal-c[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}.linked-signal-fs{border:0;margin:0;padding:0;display:grid;gap:4px}.linked-signal-fs legend{padding:0;margin-bottom:4px;font-weight:700}.linked-signal-out{margin:10px 0 12px;min-height:1.5em}.linked-signal-bad{color:var(--danger);font-weight:700}`,
  bad:{code:`options = computed(() => SHIPPING[this.country()]);
selected = signal<Option | undefined>(undefined);

constructor() {
  // reset the selection by hand whenever the options change
  effect(() => {
    const opts = this.options();
    const current = untracked(this.selected);
    this.selected.set(opts.find(o => o.id === current?.id) ?? opts[0]);
  });
}`,
    note:tx('Funktioniert – aber zeitversetzt: Bis der Effect läuft, zeigt das Template eine Auswahl, die es nicht gibt. Dazu kommen <code>untracked</code>, <code>undefined</code> als Startwert und ein zusätzlicher Change-Detection-Durchlauf.','Works – but delayed: until the effect runs, the template shows a selection that doesn’t exist. Plus <code>untracked</code>, <code>undefined</code> as the initial value and an extra change detection pass.')},
  good:{code:`options = computed(() => SHIPPING[this.country()]);

selected = linkedSignal<Option[], Option>({
  source: this.options,
  computation: (opts, previous) =>
    opts.find(o => o.id === previous?.value.id) ?? opts[0],
});

choose(option: Option) {
  this.selected.set(option);   // local choice until options change
}`,
    note:tx('Beim Lesen ist die Auswahl immer passend zur Liste – synchron, ohne Effect. <code>previous.value</code> ist der letzte Wert, auch wenn er per <code>set()</code> vom Benutzer kam.','When read, the selection always matches the list – synchronously, without an effect. <code>previous.value</code> is the last value, even if it came from the user via <code>set()</code>.')},
  do:tx(['<code>linkedSignal</code> für „Auswahl in einer Liste“, „aktuelle Seite bei neuem Filter“, „Formular-Entwurf aus geladenen Daten“.','Die Langform mit <code>previous</code> nehmen, wenn eine Benutzerauswahl nach Möglichkeit erhalten bleiben soll.','Mit einem <code>input()</code> als Quelle: lokal änderbarer Wert, der sich bei neuem Input zurücksetzt.'],
        ['Use <code>linkedSignal</code> for “selection in a list”, “current page on a new filter”, “form draft from loaded data”.','Use the long form with <code>previous</code> when a user selection should be kept where possible.','With an <code>input()</code> as the source: a locally changeable value that resets on a new input.']),
  dont:tx(['Kein <code>effect()</code>, das ein Signal zurücksetzt, wenn sich ein anderes ändert.','Nicht für reine Ableitungen ohne Schreibzugriff nehmen – das bleibt <code>computed()</code>.','In der Kurzform nicht vergessen: <em>jedes</em> darin gelesene Signal setzt zurück – mit <code>source</code> steuerst du genau, was auslöst.'],
        ['No <code>effect()</code> that resets one signal when another changes.','Don’t use it for pure derivations without writes – that stays <code>computed()</code>.','Don’t forget in the short form: <em>every</em> signal read inside resets it – with <code>source</code> you control exactly what triggers.']),
  why:tx('<p>Intern ist <code>linkedSignal</code> ein <code>computed</code> mit Schreibzugang: Solange die Quelle gleich bleibt, gilt der zuletzt gesetzte Wert. Ändert sich die Quelle, wird er beim nächsten Lesen neu berechnet – lazy und memoisiert wie jedes <code>computed</code>. Die Funktion bekommt dabei den vorherigen Quell- und Signalwert, damit du entscheiden kannst, was bleiben darf.</p><p>Der Effect-Umweg schreibt erst hinterher und damit zu spät: Zwischen Änderung und Effect-Lauf ist der Zustand ungültig, und genau dann kann ein Template oder ein anderes <code>computed</code> ihn lesen. Seit Angular 20 ist <code>linkedSignal</code> stabil.</p>',
           '<p>Internally, <code>linkedSignal</code> is a <code>computed</code> with write access: as long as the source stays the same, the last set value applies. When the source changes, it’s recalculated on the next read – lazy and memoised like any <code>computed</code>. The function gets the previous source and signal value, so you can decide what may stay.</p><p>The effect detour only writes afterwards and thus too late: between the change and the effect run the state is invalid, and that’s exactly when a template or another <code>computed</code> can read it. <code>linkedSignal</code> has been stable since Angular 20.</p>'),
  test:{code:`it('keeps the selection if it still exists', () => {
  const country = signal<'AT' | 'CH'>('AT');
  const options = computed(() => SHIPPING[country()]);
  const selected = linkedSignal<Option[], Option>({
    source: options,
    computation: (opts, prev) => opts.find(o => o.id === prev?.value.id) ?? opts[0],
  });

  selected.set(options()[1]);            // express
  country.set('CH');                     // no express in CH
  expect(selected().id).toBe('standard');
});`,note:tx('<code>linkedSignal</code> braucht keinen Injection Context – der Test läuft ohne TestBed.','<code>linkedSignal</code> doesn’t need an injection context – the test runs without TestBed.')}
});

LESSONS.push({
  id:'resource', cat:'signals', order:60,
  title:tx('Asynchrone Daten mit resource() und httpResource()','Async data with resource() and httpResource()'),
  short:tx('Laden als Signal: params ändern sich → alter Request wird abgebrochen, neuer startet, Status, Wert und Fehler sind Signals.','Loading as a signal: params change → the old request is aborted, a new one starts, status, value and error are signals.'),
  keys:'resource httpresource laden loading fetch http status isloading haswert hasvalue error reload abort abortsignal params loader idle reloading local',
  since:'Angular 19', status:'stable',
  refs:[[tx('Angular-Doku: Async reactivity with resources','Angular docs: Async reactivity with resources'),'https://angular.dev/guide/signals/resource'],
        [tx('Angular-Doku: Resource-Status','Angular docs: Resource status'),'https://angular.dev/guide/signals/resource#resource-status'],
        [tx('Angular-Doku: httpResource','Angular docs: httpResource'),'https://angular.dev/guide/http/http-resource#using-httpresource']],
  rule:tx('Für Daten, die von Signals abhängen, nimm <code>resource()</code> bzw. <code>httpResource()</code> statt eines Effects mit <code>subscribe</code>. <code>params</code> ist reaktiv wie ein <code>computed</code>; ändert es sich, wird der laufende Request per <code>AbortSignal</code> abgebrochen und ein neuer gestartet. Lies <code>value()</code> nur hinter <code>hasValue()</code> – im Fehlerzustand wirft es.','For data that depends on signals, use <code>resource()</code> or <code>httpResource()</code> instead of an effect with <code>subscribe</code>. <code>params</code> is reactive like a <code>computed</code>; when it changes, the running request is aborted via <code>AbortSignal</code> and a new one starts. Only read <code>value()</code> behind <code>hasValue()</code> – in the error state it throws.'),
  apis:[['resource({ params, loader })','resource<T, R>({ params?: () => R, loader: ({ params, abortSignal, previous }) => Promise<T>, defaultValue?, equal? }): ResourceRef<T | undefined>',tx('Allgemeine Resource mit Promise-Loader. Gibt <code>params</code> <code>undefined</code> zurück, lädt nichts: Status <code>idle</code>.','Generic resource with a promise loader. If <code>params</code> returns <code>undefined</code>, nothing loads: status <code>idle</code>.')],
        ['httpResource(() => url)','httpResource<T>(() => string | HttpResourceRequest | undefined, { parse?, defaultValue?, equal? })',tx('Dasselbe über <code>HttpClient</code> (mit Interceptors). Varianten: <code>.text()</code>, <code>.blob()</code>, <code>.arrayBuffer()</code>.','The same via <code>HttpClient</code> (with interceptors). Variants: <code>.text()</code>, <code>.blob()</code>, <code>.arrayBuffer()</code>.')],
        ['status()','idle | loading | reloading | resolved | error | local',tx('Was die Resource gerade tut. <code>isLoading()</code> ist bei <code>loading</code> und <code>reloading</code> wahr.','What the resource is doing. <code>isLoading()</code> is true for <code>loading</code> and <code>reloading</code>.')],
        ['value() / hasValue() / error()','Signal<T> · boolean · Signal<Error | undefined>',tx('<code>value()</code> wirft im Zustand <code>error</code>; <code>hasValue()</code> ist die sichere Abfrage und engt den Typ ein.','<code>value()</code> throws in the <code>error</code> state; <code>hasValue()</code> is the safe check and narrows the type.')],
        ['reload() / set() / update()','reload(): boolean',tx('<code>reload()</code> lädt mit gleichen params neu (<code>reloading</code>, alter Wert bleibt). <code>set()</code> überschreibt lokal (<code>local</code>).','<code>reload()</code> reloads with the same params (<code>reloading</code>, old value stays). <code>set()</code> overrides locally (<code>local</code>).')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>params</h3>
    <p class="resource-param">userId = <b id="resource-id"></b></p>
    <div class="sim-row">
      <button type="button" class="btn btn-primary" id="resource-next">${tx('Nächster User','Next user')}</button>
      <button type="button" class="btn btn-secondary" id="resource-fast">${tx('3× schnell weiter','3× quickly on')}</button>
      <button type="button" class="btn btn-secondary" id="resource-none">userId = undefined</button>
    </div>
    <label class="check-row resource-fail"><input type="checkbox" id="resource-fail"> ${tx('Server antwortet mit HTTP 500','Server answers with HTTP 500')}</label>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="resource-reload">reload()</button>
      <button type="button" class="btn btn-secondary" id="resource-local">value.update(…)</button>
    </div>
  </div>
  <div class="sim-card"><h3>${tx('Signals der Resource','Resource signals')}</h3>
    <dl class="resource-dl">
      <dt>status()</dt><dd><span class="sim-node" id="resource-status"></span></dd>
      <dt>isLoading()</dt><dd id="resource-loading"></dd>
      <dt>hasValue()</dt><dd id="resource-has"></dd>
      <dt>error()</dt><dd id="resource-error"></dd>
    </dl>
    <p class="resource-tpl" id="resource-tpl" aria-live="polite"></p>
  </div>
  <div class="sim-card"><h3>${tx('Netzwerk','Network')}</h3>
    <ul class="sim-log" id="resource-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: „3× schnell weiter“ – die ersten beiden Requests werden abgebrochen, nur der letzte kommt an. Mit Fehler-Häkchen landet die Resource in <code>error</code>; das Template fragt <code>hasValue()</code> und stürzt nicht ab. <code>reload()</code> behält den alten Wert sichtbar, ein neuer User nicht.','Try: “3× quickly on” – the first two requests are aborted, only the last one arrives. With the error box ticked the resource ends up in <code>error</code>; the template asks <code>hasValue()</code> and doesn’t crash. <code>reload()</code> keeps the old value visible, a new user doesn’t.')}</p>`,
  init(root){
    const {signal,computed,effect,untracked,log,flash}=NG;
    const ul=$('#resource-log',root);
    /* Kleines Modell von resource(): Zustandsmaschine wie in Angular (idle/loading/reloading/resolved/error/local).
       Ein effect beobachtet params; bei neuem Wert wird der alte Loader über seinen AbortController abgebrochen. */
    function resource({params,loader}){
      const state=signal({status:'idle',value:undefined,error:undefined,req:undefined},{name:'state'});
      let ctrl=null;
      const abort=()=>{if(ctrl){ctrl.abort();ctrl=null}};
      const run=req=>{
        abort();const c=ctrl=new AbortController();
        loader({params:req,abortSignal:c.signal}).then(
          v=>{if(c.signal.aborted)return;ctrl=null;state.set({status:'resolved',value:v,error:undefined,req})},
          err=>{if(c.signal.aborted)return;ctrl=null;state.set({status:'error',value:undefined,error:err,req})});
      };
      const watcher=effect(()=>{
        const req=params();
        untracked(()=>{
          if(req===undefined){abort();state.set({status:'idle',value:undefined,error:undefined,req});return}
          state.set({status:'loading',value:undefined,error:undefined,req});run(req);
        });
      },{name:'loadEffect'});
      const r={
        status:computed(()=>state().status),
        isLoading:computed(()=>['loading','reloading'].includes(state().status)),
        error:computed(()=>state().error),
        value(){const s=state();if(s.status==='error')throw new Error('Resource is currently in an error state');return s.value},
        hasValue:()=>{const s=state();return s.status!=='error'&&s.value!==undefined},
        reload(){const s=untracked(state);if(s.status==='idle'||s.status==='loading')return false;state.set({...s,status:'reloading',value:s.status==='error'?undefined:s.value});run(s.req);return true},
        set(v){abort();state.set({...untracked(state),status:'local',value:v,error:undefined})},
        destroy(){watcher.destroy();abort()}
      };
      return r;
    }
    const NAMES=['Ada Lovelace','Linus Torvalds','Grace Hopper','Alan Turing','Margaret Hamilton','Tim Berners-Lee'];
    const fail=$('#resource-fail',root);
    let reqNo=0;const timers=new Set();
    const userId=signal(1,{name:'userId'});
    const user=resource({
      params:()=>{const id=userId();return id===undefined?undefined:{id}},
      loader:({params,abortSignal})=>new Promise((res,rej)=>{
        const n=++reqNo;
        log(ul,`→ #${n} GET /api/users/${params.id}`);
        const t=setTimeout(()=>{timers.delete(t);
          if(fail.checked){log(ul,`<span class="t">←</span> #${n} HTTP 500`);rej(new Error('HTTP 500'))}
          else{log(ul,`<span class="hl">←</span> #${n} 200 OK`);res({id:params.id,name:NAMES[(params.id-1)%NAMES.length]})}
        },900);
        timers.add(t);
        abortSignal.addEventListener('abort',()=>{clearTimeout(t);timers.delete(t);log(ul,`<span class="t">✕</span> #${n} ${tx('abgebrochen (AbortSignal)','aborted (AbortSignal)')}`);rej(new DOMException('Aborted','AbortError'))});
      })
    });
    const view=effect(()=>{
      const st=user.status();
      $('#resource-id',root).textContent=String(userId());
      const sn=$('#resource-status',root);sn.textContent=`'${st}'`;flash(sn);
      $('#resource-loading',root).textContent=String(user.isLoading());
      $('#resource-has',root).textContent=String(user.hasValue());
      const err=user.error();$('#resource-error',root).textContent=err?err.message:'undefined';
      const tpl=$('#resource-tpl',root);
      if(user.hasValue())tpl.innerHTML=`${tx('Template','Template')}: <b>${esc(user.value().name)}</b>${user.isLoading()?' '+tx('(aktualisiert …)','(refreshing …)'):''}`;
      else if(err)tpl.innerHTML=`<span class="resource-bad">${tx('Template: Laden fehlgeschlagen','Template: loading failed')}</span>`;
      else tpl.textContent=user.isLoading()?tx('Template: lädt …','Template: loading …'):tx('Template: kein User gewählt','Template: no user selected');
    },{name:'view'});
    const next=()=>userId.update(id=>id===undefined?1:id+1);
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='resource-next')next();
      if(b.id==='resource-fast'){next();[200,400].forEach(ms=>{const t=setTimeout(()=>{timers.delete(t);next()},ms);timers.add(t)})}
      if(b.id==='resource-none')userId.set(undefined);
      if(b.id==='resource-reload'){const ok=user.reload();log(ul,`reload() → ${ok}${ok?'':' – '+tx('idle oder lädt schon','idle or already loading')}`)}
      if(b.id==='resource-local'){
        if(user.hasValue()){const v=user.value();user.set({...v,name:v.name+' ✎'});log(ul,`value.update(…) → ${tx('Status local, kein Request','status local, no request')}`)}
        else log(ul,tx('value.update(…) – kein Wert zum Ändern','value.update(…) – no value to change'));
      }
    });
    return ()=>{user.destroy();view.destroy();timers.forEach(clearTimeout)};
  },
  css:`.resource-param{margin:0 0 10px;font-family:var(--font-mono)}.resource-fail{margin:12px 0}.resource-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:0 0 12px;font:500 .8125rem/1.4 var(--font-mono)}.resource-dl dt{color:var(--muted)}.resource-dl dd{margin:0;overflow-wrap:anywhere}.resource-tpl{margin:0;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);min-height:1.5em}.resource-bad{color:var(--danger);font-weight:700}`,
  bad:{code:`userId = input.required<number>();
user = signal<User | undefined>(undefined);
loading = signal(false);

constructor() {
  effect(() => {
    this.loading.set(true);
    this.http.get<User>(\`/api/users/\${this.userId()}\`).subscribe(u => {
      this.user.set(u);          // late answer overwrites the newer one
      this.loading.set(false);   // errors? never reset
    });
  });
}`,
    note:tx('Drei Signals von Hand, kein Abbruch: Kommt die Antwort für User 1 nach der für User 2, zeigt die Seite den falschen User. Fehler bleiben ewig „loading“.','Three signals by hand, no cancellation: if the answer for user 1 arrives after the one for user 2, the page shows the wrong user. Errors stay “loading” forever.')},
  good:{code:`userId = input.required<number>();

user = httpResource<User>(() => \`/api/users/\${this.userId()}\`);

// or with any promise-based API:
user2 = resource({
  params: () => ({ id: this.userId() }),
  loader: async ({ params, abortSignal }) => {
    const res = await fetch(\`/api/users/\${params.id}\`, { signal: abortSignal });
    if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
    return (await res.json()) as User;
  },
});

// template:
// @if (user.hasValue()) { {{ user.value().name }} }
// @else if (user.error()) { <p>Could not load.</p> }
// @else if (user.isLoading()) { <app-spinner /> }`,
    note:tx('Status, Fehler und Abbruch kommen mit. Alte Antworten werden verworfen, <code>abortSignal</code> bricht auch das echte <code>fetch</code> ab. <code>httpResource</code> nutzt <code>HttpClient</code> samt Interceptors.','Status, errors and cancellation come included. Old answers are discarded, <code>abortSignal</code> also aborts the real <code>fetch</code>. <code>httpResource</code> uses <code>HttpClient</code> including interceptors.')},
  do:tx(['Für <em>lesende</em> Requests, die von Signals (Inputs, Route-Parameter, Filter) abhängen.','<code>abortSignal</code> an <code>fetch</code> weitergeben, damit der Browser den Request wirklich abbricht.','<code>undefined</code> aus <code>params</code> zurückgeben, solange etwas fehlt – dann bleibt die Resource <code>idle</code>.','Mit <code>hasValue()</code> absichern; <code>defaultValue</code> setzen, wenn ein Platzhalter (z. B. <code>[]</code>) passt.'],
        ['Use it for <em>reading</em> requests that depend on signals (inputs, route params, filters).','Pass <code>abortSignal</code> on to <code>fetch</code>, so the browser really aborts the request.','Return <code>undefined</code> from <code>params</code> while something is missing – the resource then stays <code>idle</code>.','Guard with <code>hasValue()</code>; set <code>defaultValue</code> when a placeholder (e.g. <code>[]</code>) fits.']),
  dont:tx(['Keine Resource für Schreib-Operationen (POST/PUT/DELETE) – ein Abbruch mitten im Speichern ist gefährlich. Dafür <code>HttpClient</code> direkt.','<code>value()</code> nicht ungeprüft im Template lesen – im Zustand <code>error</code> wirft es.','Keine alten Optionsnamen aus Angular 19 mehr: <code>request</code> heißt jetzt <code>params</code>, und bei <code>rxResource</code> heißt <code>loader</code> jetzt <code>stream</code>.'],
        ['No resource for write operations (POST/PUT/DELETE) – aborting in the middle of saving is dangerous. Use <code>HttpClient</code> directly for that.','Don’t read <code>value()</code> unchecked in the template – in the <code>error</code> state it throws.','No old option names from Angular 19: <code>request</code> is now <code>params</code>, and for <code>rxResource</code> <code>loader</code> is now <code>stream</code>.']),
  why:tx('<p>Eine Resource ist eine kleine Zustandsmaschine aus Signals: <code>params</code> wird wie ein <code>computed</code> getrackt; ändert es sich, springt der Status sofort auf <code>loading</code>, der Wert wird zu <code>undefined</code> (bzw. <code>defaultValue</code>), und der Loader läuft mit einem frischen <code>AbortSignal</code>. Kommt vorher schon ein neuer Parameter, wird der alte Loader abgebrochen und sein Ergebnis verworfen – Race Conditions sind damit ausgeschlossen.</p><p><code>reload()</code> ist anders: gleiche Parameter, Status <code>reloading</code>, der alte Wert bleibt sichtbar, bis der neue da ist. Nach langer Experimentierphase (seit Angular 19) sind <code>resource</code>, <code>httpResource</code> und <code>rxResource</code> mit Angular 22 stabil.</p>',
           '<p>A resource is a small state machine made of signals: <code>params</code> is tracked like a <code>computed</code>; when it changes, the status jumps to <code>loading</code> right away, the value becomes <code>undefined</code> (or <code>defaultValue</code>), and the loader runs with a fresh <code>AbortSignal</code>. If a new parameter arrives first, the old loader is aborted and its result discarded – race conditions are ruled out.</p><p><code>reload()</code> is different: same params, status <code>reloading</code>, the old value stays visible until the new one arrives. After a long experimental phase (since Angular 19), <code>resource</code>, <code>httpResource</code> and <code>rxResource</code> are stable as of Angular 22.</p>'),
  test:{code:`it('loads the user via httpResource', async () => {
  TestBed.configureTestingModule({
    providers: [provideHttpClient(), provideHttpClientTesting()],
  });
  const id = signal(1);
  const backend = TestBed.inject(HttpTestingController);
  const user = httpResource<User>(() => \`/api/users/\${id()}\`, {
    injector: TestBed.inject(Injector),
  });

  TestBed.tick();                                   // starts the request
  backend.expectOne('/api/users/1').flush({ id: 1, name: 'Ada' });
  await TestBed.inject(ApplicationRef).whenStable();

  expect(user.status()).toBe('resolved');
  expect(user.value()?.name).toBe('Ada');
});`,note:tx('So zeigt es auch die Angular-Doku: <code>TestBed.tick()</code> löst den Request aus, <code>HttpTestingController</code> beantwortet ihn, <code>whenStable()</code> wartet, bis der Wert angekommen ist.','That’s also how the Angular docs show it: <code>TestBed.tick()</code> triggers the request, <code>HttpTestingController</code> answers it, <code>whenStable()</code> waits until the value has arrived.')}
});

LESSONS.push({
  id:'signal-equal', cat:'signals', order:70,
  title:tx('Eigene Gleichheit mit equal','Custom equality with equal'),
  short:tx('Mit equal entscheidest du, wann ein neuer Wert „gleich“ ist – neue Objekte mit gleichem Inhalt lösen dann nichts aus.','With equal you decide when a new value counts as “the same” – new objects with the same content then trigger nothing.'),
  keys:'equal gleichheit equality object.is vergleich compare deep isequal objekt filter signal computed option',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Signal equality functions','Angular docs: Signal equality functions'),'https://angular.dev/guide/signals#signal-equality-functions'],
        [tx('Angular-Doku: linkedSignal mit equal','Angular docs: linkedSignal with equal'),'https://angular.dev/guide/signals/linked-signal#custom-equality-comparison']],
  rule:tx('Standardmäßig vergleicht ein Signal mit <code>Object.is</code>: Jedes neue Objekt gilt als Änderung, auch mit gleichem Inhalt. Kommen Werte regelmäßig als neue Instanz mit oft gleichem Inhalt (Formularwerte, Server-Antworten), gib ein <code>equal</code> mit – es muss aber <strong>alle</strong> Felder vergleichen, die jemand liest.','By default a signal compares with <code>Object.is</code>: every new object counts as a change, even with the same content. If values regularly arrive as new instances with often the same content (form values, server responses), pass an <code>equal</code> – but it must compare <strong>all</strong> fields anyone reads.'),
  apis:[['equal','(a: T, b: T) => boolean',tx('Gibt <code>true</code> zurück, wenn der neue Wert als gleich gilt – dann wird nicht gespeichert und nichts gemeldet.','Returns <code>true</code> if the new value counts as equal – then nothing is stored and nobody is notified.')],
        ['signal(v, { equal })','signal<T>(value, { equal?: ValueEqualityFn<T> })',tx('Auch bei <code>computed</code>, <code>linkedSignal</code>, <code>resource</code> und <code>toSignal</code> verfügbar.','Also available on <code>computed</code>, <code>linkedSignal</code>, <code>resource</code> and <code>toSignal</code>.')]],
  demo:`<div class="sim-card signal-equal-form"><h3>${tx('Suchformular','Search form')}</h3>
  <p class="signal-equal-val">{ q: <b id="signal-equal-q"></b>, sort: <b id="signal-equal-sort"></b> }</p>
  <div class="sim-row">
    <button type="button" class="btn btn-primary" id="signal-equal-resubmit">${tx('Absenden (gleiche Werte)','Submit (same values)')}</button>
    <button type="button" class="btn btn-secondary" id="signal-equal-qbtn">${tx('Suchbegriff ändern','Change query')}</button>
    <button type="button" class="btn btn-secondary" id="signal-equal-sortbtn">${tx('Sortierung ändern','Change sort')}</button>
  </div>
  <p class="hint">${tx('Jedes Absenden erzeugt ein <em>neues</em> Objekt: <code>filters.set({ ...form.value })</code>','Every submit creates a <em>new</em> object: <code>filters.set({ ...form.value })</code>')}</p>
</div>
<div class="sim-grid">
  <div class="sim-card"><h3>Object.is <span class="sim-node signal-equal-badge" id="signal-equal-n-a"><b id="signal-equal-ca">0</b> ${tx('Suchen','searches')}</span></h3>
    <p class="hint">signal(f)</p>
    <ul class="sim-log" id="signal-equal-log-a" aria-label="${tx('Protokoll Object.is','Log Object.is')}"></ul>
  </div>
  <div class="sim-card"><h3>equal <span class="sim-node signal-equal-badge" id="signal-equal-n-b"><b id="signal-equal-cb">0</b> ${tx('Suchen','searches')}</span></h3>
    <label class="check-row signal-equal-buggy"><input type="checkbox" id="signal-equal-buggy"> ${tx('Fehler: equal vergleicht nur q','Bug: equal compares only q')}</label>
    <p class="hint" id="signal-equal-fn"></p>
    <ul class="sim-log" id="signal-equal-log-b" aria-label="${tx('Protokoll equal','Log equal')}"></ul>
    <p class="signal-equal-warn" id="signal-equal-warn" aria-live="polite"></p>
  </div>
</div>
<p class="demo-note">${tx('Probier: „Absenden (gleiche Werte)“ – links startet jedes Mal eine neue Suche, rechts nicht. Dann den Fehler-Haken setzen und die Sortierung ändern: Rechts geht die Änderung verloren, weil <code>equal</code> <code>sort</code> nicht vergleicht.','Try: “Submit (same values)” – on the left every submit starts a new search, on the right it doesn’t. Then tick the bug box and change the sort: on the right the change gets lost, because <code>equal</code> doesn’t compare <code>sort</code>.')}</p>`,
  init(root){
    const {signal,effect,untracked,watch,log,flash}=NG;
    const qs=['angular','signals','rxjs'],sorts=['name','date','price'];
    let qi=0,si=0,ca=0,cb=0;
    const form={q:qs[0],sort:sorts[0]};
    const buggy=$('#signal-equal-buggy',root);
    const full=(a,b)=>a.q===b.q&&a.sort===b.sort,onlyQ=(a,b)=>a.q===b.q;
    const fA=signal({...form},{name:'A'});
    const fB=signal({...form},{name:'B',equal:(a,b)=>buggy.checked?onlyQ(a,b):full(a,b)});
    const la=$('#signal-equal-log-a',root),lb=$('#signal-equal-log-b',root);
    const showFn=()=>{$('#signal-equal-fn',root).textContent=buggy.checked?'equal: (a, b) => a.q === b.q':'equal: (a, b) => a.q === b.q && a.sort === b.sort'};
    showFn();
    const off=watch(ev=>{
      if(ev.type==='same'&&ev.name==='B')log(lb,`<span class="t">set</span> – equal → true, ${tx('nichts passiert','nothing happens')}`);
    });
    const ea=effect(()=>{const f=fA();ca++;$('#signal-equal-ca',root).textContent=ca;flash($('#signal-equal-n-a',root));log(la,`<span class="hl">search</span>(${f.q}, ${f.sort})`)},{name:'searchA'});
    const eb=effect(()=>{const f=fB();cb++;$('#signal-equal-cb',root).textContent=cb;flash($('#signal-equal-n-b',root));log(lb,`<span class="hl">search</span>(${f.q}, ${f.sort})`)},{name:'searchB'});
    const render=()=>{
      $('#signal-equal-q',root).textContent=`'${form.q}'`;$('#signal-equal-sort',root).textContent=`'${form.sort}'`;
      const b=untracked(fB);
      $('#signal-equal-warn',root).textContent=b.sort!==form.sort||b.q!==form.q?tx(`Signal hat noch sort = '${b.sort}' – die Liste ist falsch sortiert.`,`Signal still has sort = '${b.sort}' – the list is sorted wrongly.`):'';
    };
    render();
    const submit=()=>{fA.set({...form});fB.set({...form});render()};
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='signal-equal-qbtn'){qi=(qi+1)%qs.length;form.q=qs[qi]}
      if(b.id==='signal-equal-sortbtn'){si=(si+1)%sorts.length;form.sort=sorts[si]}
      submit();
    });
    buggy.addEventListener('change',()=>{showFn();render()});
    return ()=>{off();ea.destroy();eb.destroy()};
  },
  css:`.signal-equal-form{margin-bottom:16px}.signal-equal-val{margin:0 0 10px;font-family:var(--font-mono)}.signal-equal-form .hint{margin:10px 0 0}.signal-equal-badge{font-size:.75rem;margin-left:4px}.signal-equal-buggy{margin-bottom:6px}#signal-equal-fn{font-family:var(--font-mono);font-size:.75rem;margin:0 0 8px;overflow-wrap:anywhere}.signal-equal-warn{margin:8px 0 0;color:var(--danger);font-weight:700;min-height:1.5em}`,
  bad:{code:`filters = signal<Filters>({ q: '', sort: 'name' });

products = httpResource(() => ({
  url: '/api/products',
  params: { ...this.filters() },
}));

submit() {
  // new object on every click → new request on every click
  this.filters.set({ ...this.form.getRawValue() });
}`,
    note:tx('Jedes Absenden ist für das Signal eine Änderung – auch wenn der Benutzer nichts geändert hat. Ergebnis: doppelte Requests, flackernde Ladeanzeigen.','Every submit is a change for the signal – even if the user changed nothing. Result: duplicate requests, flickering loading indicators.')},
  good:{code:`const sameFilters = (a: Filters, b: Filters) =>
  a.q === b.q && a.sort === b.sort;

filters = signal<Filters>({ q: '', sort: 'name' }, { equal: sameFilters });

// also works for derived values:
visibleIds = computed(() => this.items().map(i => i.id), {
  equal: (a, b) => a.length === b.length && a.every((id, i) => id === b[i]),
});`,
    note:tx('Gleicher Inhalt → keine Meldung, kein Request. Das <code>equal</code> vergleicht jedes Feld, das die Abhängigen lesen.','Same content → no notification, no request. The <code>equal</code> compares every field the dependents read.')},
  do:tx(['<code>equal</code> für Objekte oder Arrays nutzen, die oft als neue Instanz mit gleichem Inhalt ankommen.','Vergleiche flach und schnell halten – <code>equal</code> läuft bei jedem <code>set()</code> bzw. jeder Neuberechnung.','Bei <code>computed</code> nutzen, das Arrays erzeugt (<code>map</code>/<code>filter</code>): Dann laufen nachgelagerte Abhängige nur bei echten Änderungen.'],
        ['Use <code>equal</code> for objects or arrays that often arrive as a new instance with the same content.','Keep comparisons shallow and fast – <code>equal</code> runs on every <code>set()</code> or recalculation.','Use it on a <code>computed</code> that creates arrays (<code>map</code>/<code>filter</code>): downstream dependents then only run on real changes.']),
  dont:tx(['Kein <code>equal</code>, das Felder auslässt, die jemand liest – deren Änderungen gehen sonst verloren.','<code>equal</code> nicht als Reparatur fürs Mutieren sehen: Bei gleicher Referenz sind <code>a</code> und <code>b</code> dasselbe Objekt, jeder Vergleich sagt „gleich“.','Kein teures Deep-Equal auf großen Bäumen bei jedem Tastendruck.'],
        ['No <code>equal</code> that skips fields someone reads – their changes get lost otherwise.','Don’t see <code>equal</code> as a fix for mutation: with the same reference, <code>a</code> and <code>b</code> are the same object, every comparison says “equal”.','No expensive deep-equal on large trees on every keystroke.']),
  why:tx('<p>Die Gleichheitsprüfung ist die Bremse des Signal-Graphen: Gilt der neue Wert als gleich, bleibt die Version des Signals unverändert, und kein <code>computed</code>, kein Effect und kein Template erfährt davon. Bei <code>computed</code> greift <code>equal</code> nach dem Neuberechnen – das <code>computed</code> selbst rechnet, aber alles dahinter bleibt ruhig.</p><p>Genau darum ist ein zu großzügiges <code>equal</code> gefährlich: Was es für gleich erklärt, wird verworfen, auch wenn der neue Wert eine wichtige Änderung enthält. Faustregel: Vergleiche genau das, was Abhängige lesen – nicht mehr, nicht weniger.</p>',
           '<p>The equality check is the brake of the signal graph: if the new value counts as equal, the signal’s version stays the same, and no <code>computed</code>, no effect and no template hears about it. For <code>computed</code>, <code>equal</code> applies after recalculating – the <code>computed</code> itself calculates, but everything behind it stays quiet.</p><p>That’s exactly why an overly generous <code>equal</code> is dangerous: whatever it declares equal is discarded, even if the new value contains an important change. Rule of thumb: compare exactly what dependents read – no more, no less.</p>'),
  test:{code:`it('ignores new objects with the same content', () => {
  const filters = signal({ q: 'a', sort: 'name' }, {
    equal: (a, b) => a.q === b.q && a.sort === b.sort,
  });
  let runs = 0;
  const query = computed(() => { runs++; return \`\${filters().q}|\${filters().sort}\`; });

  query();
  filters.set({ q: 'a', sort: 'name' });   // new object, same content
  query();
  expect(runs).toBe(1);
});`,note:tx('Zählt, wie oft das abhängige <code>computed</code> rechnet – ohne <code>equal</code> wären es zwei Läufe.','Counts how often the dependent <code>computed</code> calculates – without <code>equal</code> there would be two runs.')}
});

LESSONS.push({
  id:'signal', cat:'signals', order:10,
  title:tx('Zustand mit signal(): set, update, unveränderlich','State with signal(): set, update, immutable'),
  short:tx('Ein Signal meldet nur, wenn du ihm einen neuen Wert gibst – Objekte und Arrays also ersetzen, nicht verändern.','A signal only notifies when you give it a new value – so replace objects and arrays, don’t mutate them.'),
  keys:'signal set update asReadonly writable immutable unveränderlich mutieren push array objekt state zustand',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Writable signals','Angular docs: Writable signals'),'https://angular.dev/guide/signals#writable-signals'],
        [tx('Angular-Doku: Readonly-Signals','Angular docs: Readonly signals'),'https://angular.dev/guide/signals#converting-writable-signals-to-readonly'],
        [tx('API: signal()','API: signal()'),'https://angular.dev/api/core/signal']],
  rule:tx('Ein <code>signal()</code> hält einen Wert und meldet Änderungen an alle, die ihn lesen. Es merkt aber nur, was über <code>set()</code> oder <code>update()</code> hereinkommt – und auch das nur, wenn der neue Wert laut <code>Object.is</code> ein anderer ist. Arrays und Objekte darum immer <strong>ersetzen</strong> statt verändern.','A <code>signal()</code> holds a value and notifies everyone who reads it. But it only notices what comes in through <code>set()</code> or <code>update()</code> – and only if the new value is different according to <code>Object.is</code>. So always <strong>replace</strong> arrays and objects instead of mutating them.'),
  apis:[['signal(initial)','signal<T>(value: T, { equal?, debugName? })',tx('Schreibbares Signal. Lesen durch Aufruf: <code>todos()</code>.','Writable signal. Read it by calling it: <code>todos()</code>.')],
        ['.set(value)','set(value: T): void',tx('Neuen Wert setzen. Gleicher Wert (<code>Object.is</code>) → keine Meldung.','Set a new value. Same value (<code>Object.is</code>) → no notification.')],
        ['.update(fn)','update(fn: (v: T) => T): void',tx('Neuen Wert aus dem alten berechnen – <code>fn</code> muss einen <em>neuen</em> Wert zurückgeben.','Compute the new value from the old one – <code>fn</code> must return a <em>new</em> value.')],
        ['.asReadonly()','asReadonly(): Signal<T>',tx('Nur-Lese-Sicht für außen, z. B. aus einem Service. Schützt nicht vor tiefem Mutieren.','Read-only view for the outside, e.g. from a service. Doesn’t protect against deep mutation.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Aktionen','Actions')}</h3>
    <div class="sim-row signal-actions">
      <button type="button" class="btn btn-secondary" id="signal-push">todos().push(…)</button>
      <button type="button" class="btn btn-secondary" id="signal-same">${tx('push + set(gleiches Array)','push + set(same array)')}</button>
      <button type="button" class="btn btn-primary" id="signal-update">update(l => [...l, …])</button>
      <button type="button" class="btn btn-secondary" id="signal-toggle">${tx('1. Eintrag erledigt (neu)','Toggle 1st item (new)')}</button>
      <button type="button" class="btn btn-secondary" id="signal-other">${tx('Anderes Signal ändern','Change another signal')}</button>
      <button type="button" class="btn btn-ghost" id="signal-reset">${tx('Zurücksetzen','Reset')}</button>
    </div>
    <p class="hint signal-mem">${tx('Im Speicher (das echte Array):','In memory (the real array):')} <b id="signal-mem-n"></b> ${tx('Einträge','items')}</p>
  </div>
  <div class="sim-card"><h3 class="signal-h">${tx('Template','Template')} <span class="sim-node" id="signal-n-view">${tx('gerendert','rendered')} <b id="signal-renders">0</b>×</span></h3>
    <ul class="signal-list" id="signal-list"></ul>
    <p class="signal-open" aria-live="polite">${tx('Offen','Open')} (computed): <b id="signal-open"></b></p>
    <p class="hint" id="signal-warn" hidden></p>
  </div>
  <div class="sim-card"><h3>${tx('Was Angular tut','What Angular does')}</h3>
    <ul class="sim-log" id="signal-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: <code>push(…)</code> – das Array wächst, aber niemand erfährt davon. Dann „Anderes Signal ändern“: Das Template rendert neu und zeigt plötzlich den neuen Eintrag, das <code>computed</code> „Offen“ bleibt aber alt – ein inkonsistenter Zustand. Mit <code>update()</code> und neuem Array passt alles.','Try: <code>push(…)</code> – the array grows, but nobody hears about it. Then “Change another signal”: the template re-renders and suddenly shows the new item, but the <code>computed</code> “Open” stays stale – an inconsistent state. With <code>update()</code> and a new array everything fits.')}</p>`,
  init(root){
    const {signal,computed,effect,untracked,watch,log,flash}=NG;
    const start=()=>[{id:1,title:tx('Milch kaufen','Buy milk'),done:false},{id:2,title:tx('Angular lernen','Learn Angular'),done:true}];
    const todos=signal(start(),{name:'todos'}),theme=signal(0,{name:'theme'});
    let nextId=3,renders=0;
    const open=computed(()=>todos().filter(t=>!t.done).length,{name:'open'});
    const ul=$('#signal-log',root);
    const item=()=>({id:nextId,title:tx(`Aufgabe ${nextId}`,`Task ${nextId}`),done:false});
    const mem=()=>{$('#signal-mem-n',root).textContent=untracked(todos).length};
    const off=watch(ev=>{
      if(ev.type==='set')log(ul,`<span class="t">set</span> ${ev.name} → <span class="hl">${tx('Abhängige benachrichtigt','dependents notified')}</span>`);
      if(ev.type==='same')log(ul,`<span class="t">set</span> ${ev.name} – ${tx('gleiche Referenz (Object.is), keine Meldung','same reference (Object.is), no notification')}`);
      if(ev.type==='compute'&&ev.name==='open')log(ul,`<span class="t">${tx('berechnet','computed')}</span> open = ${ev.value}`);
    });
    const view=effect(()=>{
      const list=todos(),o=open();theme();
      renders++;
      $('#signal-renders',root).textContent=renders;flash($('#signal-n-view',root));
      $('#signal-list',root).innerHTML=list.map(t=>`<li class="${t.done?'signal-done':''}">${t.done?'✓':'○'} ${esc(t.title)}</li>`).join('');
      $('#signal-open',root).textContent=o;
      const real=list.filter(t=>!t.done).length,w=$('#signal-warn',root);
      w.hidden=real===o;
      w.textContent=tx(`Achtung: In der Liste sind ${real} offen, das computed sagt ${o}.`,`Careful: the list has ${real} open, the computed says ${o}.`);
      mem();
    },{name:'template'});
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='signal-push'){untracked(todos).push(item());nextId++;log(ul,`todos().push(…) – ${tx('Array verändert, <b>kein</b> Signal-Ereignis','array mutated, <b>no</b> signal event')}`)}
      if(b.id==='signal-same'){const l=untracked(todos);l.push(item());nextId++;todos.set(l)}
      if(b.id==='signal-update'){const it=item();nextId++;todos.update(l=>[...l,it])}
      if(b.id==='signal-toggle')todos.update(l=>l.map((t,i)=>i===0?{...t,done:!t.done}:t));
      if(b.id==='signal-other'){log(ul,tx('theme ändert sich → Template rendert neu','theme changes → template re-renders'));theme.update(n=>n+1)}
      if(b.id==='signal-reset'){nextId=3;todos.set(start())}
      mem();
    });
    return ()=>{off();view.destroy()};
  },
  css:`.signal-actions{margin-bottom:12px}.signal-mem{margin:0}.signal-list{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:4px}.signal-done{color:var(--muted);text-decoration:line-through}.signal-open{margin:0}#signal-warn{color:var(--danger);margin:8px 0 0;font-weight:700}.signal-h .sim-node{margin-left:6px;font-size:.75rem}`,
  bad:{code:`todos = signal<Todo[]>([]);

add(todo: Todo) {
  this.todos().push(todo);        // mutated in place – nobody is notified
}

toggle(todo: Todo) {
  todo.done = !todo.done;         // same: object changed, signal unchanged
  this.todos.set(this.todos());   // same reference → Object.is says "equal"
}`,
    note:tx('Das Array ändert sich, aber das Signal merkt es nicht. <code>computed</code>s bleiben alt, OnPush-Komponenten rendern nicht – und wenn doch (wegen etwas anderem), zeigt die Seite Mischzustände.','The array changes, but the signal doesn’t notice. <code>computed</code>s stay stale, OnPush components don’t re-render – and if they do (because of something else), the page shows mixed states.')},
  good:{code:`private readonly _todos = signal<Todo[]>([]);
readonly todos = this._todos.asReadonly();

add(todo: Todo) {
  this._todos.update(list => [...list, todo]);
}

toggle(id: number) {
  this._todos.update(list =>
    list.map(t => (t.id === id ? { ...t, done: !t.done } : t))
  );
}`,
    note:tx('Jede Änderung erzeugt ein neues Array (und für den geänderten Eintrag ein neues Objekt). Nach außen gibt es nur die Nur-Lese-Sicht, geschrieben wird an einer Stelle.','Every change creates a new array (and a new object for the changed item). The outside only gets the read-only view; writes happen in one place.')},
  do:tx(['Arrays mit Spread, <code>map</code>, <code>filter</code> oder <code>toSpliced</code> ersetzen, Objekte mit <code>{ ...alt, feld }</code>.','<code>update()</code> nehmen, wenn der neue Wert vom alten abhängt, sonst <code>set()</code>.','Im Service das schreibbare Signal privat halten und <code>asReadonly()</code> nach außen geben.','Signals im Template aufrufen: <code>{{ count() }}</code> – das Lesen macht es zur Abhängigkeit.'],
        ['Replace arrays with spread, <code>map</code>, <code>filter</code> or <code>toSpliced</code>, objects with <code>{ ...old, field }</code>.','Use <code>update()</code> when the new value depends on the old one, otherwise <code>set()</code>.','In a service, keep the writable signal private and expose <code>asReadonly()</code>.','Call signals in the template: <code>{{ count() }}</code> – reading makes it a dependency.']),
  dont:tx(['Kein <code>push</code>, <code>splice</code>, <code>sort</code> oder <code>obj.x = …</code> auf dem Wert eines Signals.','Nicht nach dem Mutieren <code>set(sameRef)</code> aufrufen und hoffen – gleiche Referenz heißt „nichts passiert“.','<code>asReadonly()</code> nicht für einen Tiefenschutz halten: Wer den Wert bekommt, kann ihn trotzdem mutieren.'],
        ['No <code>push</code>, <code>splice</code>, <code>sort</code> or <code>obj.x = …</code> on a signal’s value.','Don’t call <code>set(sameRef)</code> after mutating and hope – same reference means “nothing happens”.','Don’t mistake <code>asReadonly()</code> for deep protection: whoever gets the value can still mutate it.']),
  why:tx('<p>Ein Signal vergleicht beim Schreiben den alten mit dem neuen Wert – standardmäßig mit <code>Object.is</code>, also nach Referenz. Ein verändertes Array ist dieselbe Referenz: Für das Signal hat sich nichts geändert, es erhöht seine Version nicht und benachrichtigt niemanden. Genau darauf bauen <code>computed</code> (rechnet nur bei neuer Version) und die Change Detection von OnPush- und zonelosen Komponenten.</p><p>Unveränderliche Updates kosten ein neues Array, machen aber jede Änderung sichtbar und billig prüfbar: Ein Referenzvergleich genügt. Für große Listen ist das in der Praxis kein Problem – teuer wird erst, was unnötig neu rendert, und das verhindert <code>@for</code> mit <code>track</code>.</p>',
           '<p>When written, a signal compares the old and new value – by default with <code>Object.is</code>, i.e. by reference. A mutated array is the same reference: for the signal nothing changed, it doesn’t bump its version and notifies nobody. That is exactly what <code>computed</code> (recalculates only on a new version) and the change detection of OnPush and zoneless components rely on.</p><p>Immutable updates cost a new array, but make every change visible and cheap to check: a reference comparison is enough. For large lists that’s rarely a problem in practice – what’s expensive is needless re-rendering, and <code>@for</code> with <code>track</code> prevents that.</p>'),
  test:{code:`it('notifies only on a new array', () => {
  const todos = signal<string[]>(['a']);
  const count = computed(() => todos().length);
  expect(count()).toBe(1);

  todos().push('b');               // mutation: not noticed
  expect(count()).toBe(1);

  todos.update(l => [...l, 'c']);  // new array: noticed
  expect(count()).toBe(3);
});`,note:tx('Der Test zeigt das Problem direkt: Nach dem <code>push</code> liefert das <code>computed</code> noch den alten Wert.','The test shows the problem directly: after the <code>push</code> the <code>computed</code> still returns the old value.')}
});

LESSONS.push({
  id:'untracked', cat:'signals', order:40,
  title:tx('Lesen ohne Abhängigkeit: untracked()','Reading without a dependency: untracked()'),
  short:tx('Was ein effect oder computed nur nebenbei braucht, liest du mit untracked() – dann löst es keine neuen Läufe aus.','What an effect or computed only needs on the side, read with untracked() – then it doesn’t trigger new runs.'),
  keys:'untracked tracking abhängigkeit dependency reactive context effect computed logging nebenbei',
  since:'Angular 16', status:'stable',
  refs:[[tx('Angular-Doku: Reading without tracking dependencies','Angular docs: Reading without tracking dependencies'),'https://angular.dev/guide/signals#reading-without-tracking-dependencies'],
        [tx('Angular-Doku: Reactive context und async','Angular docs: Reactive context and async operations'),'https://angular.dev/guide/signals#reactive-context-and-async-operations'],
        [tx('API: untracked()','API: untracked()'),'https://angular.dev/api/core/untracked']],
  rule:tx('In einem <code>effect()</code> oder <code>computed()</code> wird <strong>jedes</strong> gelesene Signal zur Abhängigkeit – auch solche, die in aufgerufenen Methoden oder Services gelesen werden. Was nur mitgelesen, aber nicht auslösen soll, gehört in <code>untracked(() => …)</code>.','In an <code>effect()</code> or <code>computed()</code>, <strong>every</strong> signal read becomes a dependency – including those read inside called methods or services. Whatever should be read along but not trigger belongs in <code>untracked(() => …)</code>.'),
  apis:[['untracked(fn)','untracked<T>(fn: () => T): T',tx('Führt <code>fn</code> aus, ohne dass gelesene Signals zu Abhängigkeiten werden. Gibt das Ergebnis zurück.','Runs <code>fn</code> without the signals it reads becoming dependencies. Returns the result.')],
        ['untracked(signal)','untracked(this.user)',tx('Kurzform: ein Signal ist selbst eine Funktion und kann direkt übergeben werden.','Short form: a signal is a function itself and can be passed directly.')]],
  demo:`<div class="sim-card untracked-top"><h3>${tx('Zustand','State')}</h3>
    <p class="untracked-state">page = <b id="untracked-page"></b><br>user = <b id="untracked-user"></b></p>
    <div class="sim-row">
      <button type="button" class="btn btn-primary" id="untracked-nav">${tx('Seite wechseln','Change page')}</button>
      <button type="button" class="btn btn-secondary" id="untracked-login">${tx('User ändern','Change user')}</button>
    </div>
</div>
<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Ohne untracked','Without untracked')} <span class="sim-node untracked-badge" id="untracked-n-a"><b id="untracked-ca">0</b> page views</span></h3>
    <pre class="untracked-code">effect(() => {
  track(this.page(), this.user());
});</pre>
    <ul class="sim-log" id="untracked-log-a" aria-label="${tx('Protokoll ohne untracked','Log without untracked')}"></ul>
  </div>
  <div class="sim-card"><h3>${tx('Mit untracked','With untracked')} <span class="sim-node untracked-badge" id="untracked-n-b"><b id="untracked-cb">0</b> page views</span></h3>
    <pre class="untracked-code">effect(() => {
  const page = this.page();
  untracked(() => track(page, this.user()));
});</pre>
    <ul class="sim-log" id="untracked-log-b" aria-label="${tx('Protokoll mit untracked','Log with untracked')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: „User ändern“ – links wird fälschlich ein weiterer Seitenaufruf gezählt, weil <code>user</code> Abhängigkeit des Effects ist. Rechts passiert nichts; beim nächsten Seitenwechsel wird trotzdem der aktuelle User mitgeschickt.','Try: “Change user” – on the left another page view is wrongly counted, because <code>user</code> is a dependency of the effect. On the right nothing happens; on the next page change the current user is still sent along.')}</p>`,
  init(root){
    const {signal,effect,untracked,log,flash}=NG;
    const pages=['/home','/products','/cart','/checkout'],users=['ada','linus','grace'];
    let pi=0,ui=0,ca=0,cb=0;
    const page=signal(pages[0],{name:'page'}),user=signal(users[0],{name:'user'});
    const la=$('#untracked-log-a',root),lb=$('#untracked-log-b',root);
    const a=effect(()=>{const p=page(),u=user();ca++;$('#untracked-ca',root).textContent=ca;flash($('#untracked-n-a',root));log(la,`<span class="hl">track</span>(${esc(p)}, ${esc(u)})`)},{name:'a'});
    const b=effect(()=>{const p=page();untracked(()=>{const u=user();cb++;$('#untracked-cb',root).textContent=cb;flash($('#untracked-n-b',root));log(lb,`<span class="hl">track</span>(${esc(p)}, ${esc(u)})`)})},{name:'b'});
    const view=effect(()=>{$('#untracked-page',root).textContent=page();$('#untracked-user',root).textContent=user()},{name:'view'});
    root.addEventListener('click',e=>{
      if(e.target.closest('#untracked-nav')){pi=(pi+1)%pages.length;page.set(pages[pi])}
      if(e.target.closest('#untracked-login')){ui=(ui+1)%users.length;user.set(users[ui]);log(la,`<span class="t">set</span> user = ${users[ui]}`);log(lb,`<span class="t">set</span> user = ${users[ui]} – ${tx('kein Lauf','no run')}`)}
    });
    return ()=>{a.destroy();b.destroy();view.destroy()};
  },
  css:`.untracked-top{margin-bottom:16px}.untracked-state{margin:0 0 12px;font-family:var(--font-mono);font-size:.875rem;line-height:1.7}.untracked-code{margin:0 0 10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);font:500 .75rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}.untracked-badge{font-size:.75rem;margin-left:4px}`,
  bad:{code:`constructor() {
  effect(() => {
    // this.analytics.track() reads this.auth.user() internally
    this.analytics.track('page_view', this.page());
  });
}`,
    note:tx('Der Service liest intern ein weiteres Signal – unsichtbar für dich, aber nicht für den Effect. Jeder Login oder Logout zählt als Seitenaufruf.','The service reads another signal internally – invisible to you, but not to the effect. Every login or logout counts as a page view.')},
  good:{code:`constructor() {
  effect(() => {
    const page = this.page();             // the only trigger
    untracked(() => this.analytics.track('page_view', page));
  });
}`,
    note:tx('Getrackt wird nur, was vor <code>untracked</code> gelesen wird. Aufrufe in fremden Code gehören grundsätzlich in <code>untracked</code> – du weißt nie, welche Signals dort gelesen werden.','Only what is read before <code>untracked</code> is tracked. Calls into foreign code generally belong in <code>untracked</code> – you never know which signals are read there.')},
  do:tx(['Die auslösenden Signals zuerst lesen und in Variablen legen, den Rest in <code>untracked</code>.','Service-Methoden, Logger und Bibliotheken in Effects über <code>untracked</code> aufrufen.','Auch in <code>computed()</code> nutzen, wenn ein Wert nur als „Momentaufnahme“ gebraucht wird.'],
        ['Read the triggering signals first into variables, put the rest in <code>untracked</code>.','Call service methods, loggers and libraries in effects via <code>untracked</code>.','Also use it in <code>computed()</code> when a value is only needed as a “snapshot”.']),
  dont:tx(['Nicht <code>untracked</code> nehmen, um eine Abhängigkeit zu verstecken, die eigentlich auslösen sollte – dann zeigt die UI alte Werte.','Nicht glauben, dass ein Signal hinter einem <code>await</code> getrackt wird – es ist dort ohnehin schon „untracked“.','Kein <code>untracked</code> im Template – dort ist jedes Lesen gewollt.'],
        ['Don’t use <code>untracked</code> to hide a dependency that actually should trigger – then the UI shows stale values.','Don’t believe a signal behind an <code>await</code> is tracked – it’s effectively “untracked” there anyway.','No <code>untracked</code> in templates – every read there is intended.']),
  why:tx('<p>Angular trackt Abhängigkeiten zur Laufzeit: Solange ein Effect oder computed läuft, ist er der „aktive Consumer“, und jeder Signal-Aufruf meldet sich bei ihm an – egal, wie tief im Aufrufstapel. <code>untracked()</code> setzt den aktiven Consumer für die Dauer der Funktion auf <code>null</code>; die Signals werden ganz normal gelesen, nur niemand merkt es sich.</p><p>Das Gleiche passiert unbeabsichtigt nach einem <code>await</code>: Der Rest der Funktion läuft später, wenn kein Consumer mehr aktiv ist. Deshalb sollten Effects synchron bleiben – asynchrone Arbeit gehört in <code>resource()</code> oder RxJS.</p>',
           '<p>Angular tracks dependencies at runtime: while an effect or computed runs, it is the “active consumer”, and every signal call registers with it – no matter how deep in the call stack. <code>untracked()</code> sets the active consumer to <code>null</code> for the duration of the function; the signals are read normally, nobody just records it.</p><p>The same happens unintentionally after an <code>await</code>: the rest of the function runs later, when no consumer is active anymore. That’s why effects should stay synchronous – async work belongs in <code>resource()</code> or RxJS.</p>'),
  test:{code:`it('does not recompute for untracked reads', () => {
  const a = signal(1);
  const b = signal(10);
  let runs = 0;
  const sum = computed(() => { runs++; return a() + untracked(b); });

  expect(sum()).toBe(11);
  b.set(20);
  expect(sum()).toBe(11);   // b is not a dependency
  expect(runs).toBe(1);
  a.set(2);
  expect(sum()).toBe(22);   // recomputed, now with the current b
});`,note:tx('Mit einem <code>computed</code> lässt sich das synchron prüfen, ganz ohne TestBed.','With a <code>computed</code> this can be checked synchronously, without TestBed.')}
});

LESSONS.push({
  id:'class-style', cat:'templates', order:70,
  title:tx('Klassen und Styles binden','Binding classes and styles'),
  short:tx('[class.x], [class] und [style.width.px] statt ngClass und ngStyle – ohne Import, mit gezielten DOM-Updates.','[class.x], [class] and [style.width.px] instead of ngClass and ngStyle – no import, targeted DOM updates.'),
  keys:'class style ngclass ngstyle binding klasse css px einheit unit',
  status:'stable',
  refs:[[tx('Angular-Doku: Class- und Style-Bindings','Angular docs: Class and style bindings'),'https://angular.dev/guide/templates/binding#css-class-and-style-property-bindings'],
        [tx('Styleguide: class und style statt ngClass und ngStyle','Style guide: Prefer class and style over ngClass and ngStyle'),'https://angular.dev/style-guide#prefer-class-and-style-over-ngclass-and-ngstyle']],
  rule:tx('Für einzelne Klassen <code>[class.aktiv]="bedingung"</code>, für mehrere <code>[class]</code> mit String, Array oder Objekt, für Styles <code>[style.width.px]="zahl"</code>. Das kann Angular ohne Direktive und ohne Import. Bei Objekten und Arrays zählt die Referenz: Eine Mutation sieht Angular nicht, ein neues Objekt schon.','For single classes use <code>[class.active]="condition"</code>, for several <code>[class]</code> with a string, array or object, for styles <code>[style.width.px]="number"</code>. Angular does this without a directive and without an import. With objects and arrays the reference counts: Angular doesn’t see a mutation, but it does see a new object.'),
  apis:[['[class.name]','[class.active]="isActive()"',tx('Setzt oder entfernt genau eine Klasse.','Adds or removes exactly one class.')],
        ['[class]','[class]="\'a b\' | [\'a\',\'b\'] | { a: true }"',tx('Mehrere Klassen. Wird mit statischem <code>class</code> und <code>[class.x]</code> zusammengeführt.','Several classes. Merged with the static <code>class</code> and <code>[class.x]</code>.')],
        ['[style.prop.unit]','[style.width.px]="w()"',tx('Ein Style mit optionaler Einheit (<code>px</code>, <code>%</code>, <code>em</code>, <code>rem</code> …).','One style with an optional unit (<code>px</code>, <code>%</code>, <code>em</code>, <code>rem</code> …).')],
        ['[style]','[style]="{ \'max-width.px\': 200 }"',tx('Mehrere Styles als String oder Objekt.','Several styles as a string or object.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Zustand','State')}</h3>
    <label class="check-row"><input type="checkbox" id="class-style-active"> <code>isActive()</code></label>
    <label class="check-row"><input type="checkbox" id="class-style-error"> <code>hasError()</code></label>
    <div class="field"><label for="class-style-w"><code>progress()</code> = <span id="class-style-wv"></span></label><input type="range" id="class-style-w" min="0" max="100" step="10" value="40"></div>
    <h3 class="class-style-h"><code>[class]="extra"</code> – ${tx('ein Objekt-Feld','an object field')}</h3>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="class-style-mutate">extra.highlight = !…</button>
      <button type="button" class="btn btn-secondary" id="class-style-new">extra = { … }</button>
    </div>
    <p class="hint class-style-objline">${tx('Im Objekt','In the object')}: <code id="class-style-obj"></code></p>
  </div>
  <div class="sim-card"><h3>${tx('Ergebnis im DOM','Result in the DOM')}</h3>
    <pre class="class-style-code">&lt;div class="card"
     [class.active]="isActive()"
     [class.error]="hasError()"
     [class]="extra"
     [style.width.%]="progress()"&gt;</pre>
    <div class="class-style-track"><div class="class-style-card" id="class-style-box"></div></div>
    <p class="class-style-attr" id="class-style-attr"></p>
    <ul class="sim-log" id="class-style-log" aria-label="${tx('DOM-Schreibzugriffe','DOM writes')}"></ul>
  </div>
</div>
