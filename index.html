  </div>
  <div class="sim-card"><h3>${tx('Was Angular mit dem DOM tut','What Angular does to the DOM')}</h3>
    <p class="sim-row for-track-stats"><span class="sim-node" id="for-track-n-created">${tx('erzeugt','created')} <b>0</b></span><span class="sim-node" id="for-track-n-moved">${tx('verschoben','moved')} <b>0</b></span><span class="sim-node" id="for-track-n-reused">${tx('wiederverwendet','reused')} <b>0</b></span><span class="sim-node" id="for-track-n-destroyed">${tx('zerstört','destroyed')} <b>0</b></span></p>
    <p class="hint">${tx('Zahlen der letzten Änderung. Die Nummer „DOM #…“ an jeder Zeile zeigt, welcher Knoten es ist.','Numbers of the last change. The “DOM #…” number on each row shows which node it is.')}</p>
    <ul class="sim-log" id="for-track-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Tippe bei Anna eine Notiz und klick „Umdrehen“. Mit <code>item.id</code> wandert die Notiz mit Anna. Stell auf <code>$index</code> und dreh nochmal um: Die Knoten bleiben stehen, nur die Namen wechseln – die Notiz steht jetzt bei jemand anderem. Mit „Identität“ und „Neu laden“ baut Angular alles neu, die Notizen sind weg.','Try: type a note for Anna and click “Reverse”. With <code>item.id</code> the note travels with Anna. Switch to <code>$index</code> and reverse again: the nodes stay put, only the names change – the note now sits next to someone else. With “identity” and “Reload”, Angular rebuilds everything and the notes are gone.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const list=$('#for-track-list',root),ul=$('#for-track-log',root),empty=$('#for-track-empty',root);
    const base=[{id:1,name:'Anna'},{id:2,name:'Ben'},{id:3,name:'Cem'},{id:4,name:'Dana'}];
    const extra=['Emil','Fatma','Gregor','Hana','Ines','Jonas'];
    let items=base.map(p=>({...p})),mode='id',nodeNo=0,nextId=5,extraI=0;
    const keyFn={id:it=>it.id,index:(it,i)=>i,identity:it=>it};
    const create=()=>{
      const li=document.createElement('li');li.className='for-track-row';li.dataset.node=++nodeNo;
      li.innerHTML=`<span class="for-track-dom">DOM #${nodeNo}</span><span class="for-track-name"></span><span class="for-track-ctx"></span><input class="input for-track-note" type="text" autocomplete="off" placeholder="${tx('Notiz','Note')}">`;
      return li;
    };
    const update=(li,it,i,n,fresh)=>{
      $('.for-track-name',li).textContent=it.name;
      $('.for-track-note',li).setAttribute('aria-label',tx(`Notiz zu ${it.name}`,`Note for ${it.name}`));
      const flags=[i===0&&'$first',i===n-1&&'$last',i%2===0?'$even':'$odd'].filter(Boolean).join(' ');
      $('.for-track-ctx',li).textContent=`$index ${i} · $count ${n} · ${flags}`;
      li.classList.toggle('for-track-even',i%2===0);
      if(fresh)flash(li);
    };
    function render(what){
      const st=TPL.reconcile(list,items,keyFn[mode],create,update);
      empty.hidden=items.length>0;
      [['created',st.created],['moved',st.moved],['reused',st.reused],['destroyed',st.destroyed]].forEach(([k,v])=>{const el=$(`#for-track-n-${k}`,root);$('b',el).textContent=v;if(v)flash(el)});
      if(what)log(ul,`<span class="t">${esc(what)}</span> · track ${mode==='id'?'item.id':mode==='index'?'$index':'item'} → ${tx('erzeugt','created')} ${st.created}, ${tx('verschoben','moved')} ${st.moved}, ${tx('wiederverwendet','reused')} ${st.reused}, ${tx('zerstört','destroyed')} ${st.destroyed}`);
      if(mode==='identity'&&items.length&&st.created===items.length&&st.destroyed>0)log(ul,`<span class="hl">NG0956</span> ${tx('Dev-Mode-Warnung: track by identity hat die ganze Liste neu erzeugt','dev mode warning: track by identity re-created the entire collection')}`);
      if(mode==='index'&&what&&st.moved===0&&st.reused)log(ul,`<span class="t">$index</span> ${tx('Knoten bleiben an ihrer Position, nur die Bindings bekommen neue Daten','nodes stay at their position, only the bindings get new data')}`);
    }
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-ft]')?.dataset.ft;if(!k)return;
      const label=e.target.closest('[data-ft]').textContent;
      if(k==='reverse')items=items.slice().reverse();
      if(k==='reload')items=(items.length?items:base).map(p=>({...p}));
      if(k==='prepend')items=[{id:nextId++,name:extra[extraI++%extra.length]},...items];
      if(k==='shift')items=items.slice(1);
      if(k==='clear')items=[];
      render(label);
    });
    root.addEventListener('change',e=>{
      if(e.target.name!=='for-track-mode')return;
      mode=e.target.value;
      /* Moduswechsel = neues Template: alles neu aufbauen */
      list.replaceChildren();list._tpl=[];
      render(tx('track geändert – Liste neu aufgebaut','track changed – list rebuilt'));
    });
    render();
  },
  css:`.for-track-wide{grid-column:1/-1}.for-track-actions{margin:12px 0}
.for-track-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.for-track-row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.for-track-row.for-track-even{background:var(--surface-2)}
.for-track-row.flash{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.for-track-dom{font:700 .75rem/1.2 var(--font-mono);color:var(--brand);background:var(--brand-soft);padding:4px 7px;border-radius:4px}
.for-track-name{font-weight:700}
.for-track-ctx{grid-column:1/-1;font:500 .75rem/1.3 var(--font-mono);color:var(--muted)}
.for-track-note{grid-column:1/-1}
.for-track-empty{margin:8px 0 0;padding:10px 12px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);color:var(--muted)}
.for-track-stats{margin:0 0 8px}
@media (min-width:700px){.for-track-row{grid-template-columns:auto 8rem 1fr minmax(8rem,14rem)}.for-track-ctx{grid-column:auto}.for-track-note{grid-column:auto}}
@media (prefers-reduced-motion:no-preference){.for-track-row{transition:border-color .3s,box-shadow .3s}}`,
  bad:{code:`<li *ngFor="let user of users; let i = index">
  {{ i }}: {{ user.name }}
</li>

<\!-- or, in control flow: -->
@for (user of users(); track $index) {
  <app-user-row [user]="user" />
}`,
    note:tx('<code>*ngFor</code> ohne <code>trackBy</code> vergleicht nach Objekt-Identität: Kommen nach einem Reload neue Objekte, wird alles neu gebaut. <code>track $index</code> auf einer sortierbaren Liste ist das andere Extrem – die Knoten bleiben stehen und bekommen fremde Daten, Zustand im DOM (Eingaben, Fokus, Kind-Komponenten) landet beim falschen Eintrag.','<code>*ngFor</code> without <code>trackBy</code> compares by object identity: when a reload brings new objects, everything is rebuilt. <code>track $index</code> on a sortable list is the other extreme – nodes stay put and receive someone else’s data, state in the DOM (input, focus, child components) ends up with the wrong item.')},
  good:{code:`@for (user of users(); track user.id; let i = $index, last = $last) {
  <app-user-row [user]="user" [class.striped]="$even" />
  @if (!last) { <hr> }
} @empty {
  <p>No users yet.</p>
}`,
    note:tx('Eine stabile ID überlebt Reloads und Sortierungen. Die Kontextvariablen gibt es immer; mit <code>let</code> vergibst du nur Aliase (wichtig bei verschachtelten Schleifen).','A stable ID survives reloads and sorting. The contextual variables are always there; <code>let</code> only gives them aliases (important in nested loops).')},
  do:tx(['<code>track</code> auf eine eindeutige, stabile Eigenschaft setzen – meist die ID aus dem Backend.','<code>track $index</code> nur für statische Listen ohne Umsortieren, Einfügen oder Entfernen verwenden.','<code>@empty</code> für den Leerzustand nutzen statt eines eigenen <code>@if</code>.','In verschachtelten Schleifen Aliase vergeben (<code>let outerIndex = $index</code>).'],
        ['Point <code>track</code> at a unique, stable property – usually the ID from the backend.','Only use <code>track $index</code> for static lists without re-sorting, inserting or removing.','Use <code>@empty</code> for the empty state instead of a separate <code>@if</code>.','Give aliases in nested loops (<code>let outerIndex = $index</code>).']),
  dont:tx(['Nicht nach dem ganzen Objekt tracken, wenn die Daten regelmäßig neu geladen werden – Angular warnt dann im Dev-Mode mit NG0956.','Keine Funktion aufrufen, die bei jedem Aufruf einen neuen Wert liefert (z. B. <code>track random()</code>).','Keine doppelten Schlüssel – dann kann Angular Einträge nicht sauber zuordnen.'],
        ['Don’t track by the whole object when the data is reloaded regularly – Angular then warns in dev mode with NG0956.','Don’t call a function that returns a new value on every call (e.g. <code>track random()</code>).','No duplicate keys – Angular can’t match items cleanly then.']),
  why:tx('<p>Bei jeder Änderung vergleicht Angular die alte mit der neuen Liste über den <code>track</code>-Schlüssel. Gleicher Schlüssel heißt „derselbe Eintrag“: Der vorhandene DOM-Knoten wird behalten, bei Bedarf verschoben, und nur seine Bindings werden aktualisiert. Unbekannte Schlüssel erzeugen neue Knoten, verschwundene werden zerstört.</p><p>Neu bauen ist teuer: DOM-Knoten, Direktiven und Kind-Komponenten entstehen neu, Zustand im DOM geht verloren. Mit <code>$index</code> als Schlüssel passiert das Gegenteil – nichts wird verschoben, aber jeder Knoten zeigt plötzlich einen anderen Eintrag. Nur eine echte ID bildet ab, was wirklich passiert ist.</p>',
           '<p>On every change Angular compares the old and the new list using the <code>track</code> key. Same key means “the same item”: the existing DOM node is kept, moved if needed, and only its bindings are updated. Unknown keys create new nodes, missing ones are destroyed.</p><p>Rebuilding is expensive: DOM nodes, directives and child components are created from scratch and state in the DOM is lost. With <code>$index</code> as the key the opposite happens – nothing moves, but every node suddenly shows a different item. Only a real ID reflects what actually happened.</p>'),
  test:{code:`it('renders the empty state', async () => {
  const fixture = TestBed.createComponent(UserList);
  fixture.componentRef.setInput('users', []);
  await fixture.whenStable();
  expect(fixture.nativeElement.textContent).toContain('No users yet.');
});`,note:tx('<code>setInput()</code> setzt ein Signal-Input wie ein Eltern-Template und markiert die Komponente zur Prüfung.','<code>setInput()</code> sets a signal input like a parent template would and marks the component for checking.')}
});

LESSONS.push({
  id:'if-block', cat:'templates', order:10,
  title:tx('Bedingungen mit @if, @else if und @else','Conditions with @if, @else if and @else'),
  short:tx('Eingebauter Control Flow statt *ngIf – mit as-Alias und else-if-Ketten.','Built-in control flow instead of *ngIf – with an as alias and else-if chains.'),
  keys:'if else ngif control flow bedingung condition alias as',
  since:'Angular 17', status:'stable',
  refs:[[tx('Angular-Doku: @if, @else if und @else','Angular docs: @if, @else if and @else'),'https://angular.dev/guide/templates/control-flow#conditionally-display-content-with-if-else-if-and-else'],
        [tx('Angular-Doku: Ergebnis mit as referenzieren','Angular docs: Referencing the result with as'),'https://angular.dev/guide/templates/control-flow#referencing-the-conditional-expressions-result']],
  rule:tx('Bedingte Inhalte schreibst du mit <code>@if</code>, <code>@else if</code> und <code>@else</code> direkt im Template – ohne Import. Mit <code>; as name</code> merkst du dir das Ergebnis der Bedingung für den Block. Wechselt der Zweig, zerstört Angular die alte View und baut die neue; bleibt der Zweig gleich, werden nur die Bindings aktualisiert.','Write conditional content with <code>@if</code>, <code>@else if</code> and <code>@else</code> right in the template – no import. With <code>; as name</code> you keep the condition’s result for the block. When the branch changes, Angular destroys the old view and builds the new one; when the branch stays the same, only the bindings are updated.'),
  apis:[['@if','@if (cond; as alias) { … }',tx('Rendert den Block, wenn <code>cond</code> truthy ist. <code>as</code> speichert den Wert (z. B. ein Objekt statt <code>null</code>).','Renders the block when <code>cond</code> is truthy. <code>as</code> stores the value (e.g. an object instead of <code>null</code>).')],
        ['@else if','} @else if (cond; as alias) { … }',tx('Weitere Bedingung, wird nur geprüft, wenn die vorherigen falsy waren. <code>as</code> ist auch hier erlaubt.','Further condition, only checked if the previous ones were falsy. <code>as</code> is allowed here too.')],
        ['@else','} @else { … }',tx('Fallback, wenn keine Bedingung zutrifft.','Fallback when no condition matches.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Zustand setzen','Set state')}</h3>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" data-if="loading">${tx('Lädt …','Loading …')}</button>
      <button type="button" class="btn btn-secondary" data-if="error">${tx('Fehler','Error')}</button>
      <button type="button" class="btn btn-secondary" data-if="anna">${tx('Anna laden','Load Anna')}</button>
      <button type="button" class="btn btn-secondary" data-if="ben">${tx('Ben laden','Load Ben')}</button>
      <button type="button" class="btn btn-secondary" data-if="none">${tx('Abmelden','Log out')}</button>
    </div>
    <h3 class="if-block-h">${tx('Gerendert','Rendered')}</h3>
    <div class="if-block-out" id="if-block-out"></div>
    <p class="hint">${tx('Views erzeugt:','Views created:')} <b id="if-block-created">0</b> · ${tx('zerstört:','destroyed:')} <b id="if-block-destroyed">0</b></p>
  </div>
  <div class="sim-card"><h3>${tx('Template – aktiver Zweig','Template – active branch')}</h3>
    <pre class="if-block-code" id="if-block-code"></pre>
    <ul class="sim-log" id="if-block-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: „Anna laden“, tippe etwas ins Notizfeld, dann „Ben laden“ – gleicher Zweig, die View bleibt, deine Eingabe auch. Jetzt „Lädt …“ und wieder „Anna laden“: Zweigwechsel, die View wird neu gebaut und die Notiz ist weg.','Try: “Load Anna”, type something into the note field, then “Load Ben” – same branch, the view stays and so does your input. Now “Loading …” and “Load Anna” again: branch change, the view is rebuilt and the note is gone.')}</p>`,
  init(root){
    const {log}=NG;
    const out=$('#if-block-out',root),ul=$('#if-block-log',root),code=$('#if-block-code',root);
    const branches=[
      {lines:['@if (user(); as u) {','  <p>'+tx('Hallo','Hello')+' {{ u.name }}</p>','  <input aria-label="'+tx('Notiz','Note')+'">'],name:'@if (user(); as u)'},
      {lines:['} @else if (loading()) {','  <p>'+tx('Lädt …','Loading …')+'</p>'],name:'@else if (loading())'},
      {lines:['} @else if (error(); as e) {','  <p role="alert">{{ e }}</p>'],name:'@else if (error(); as e)'},
      {lines:['} @else {','  <p>'+tx('Niemand angemeldet.','Nobody logged in.')+'</p>'],name:'@else'}
    ];
    code.innerHTML=branches.map((b,i)=>`<span class="if-block-br" data-br="${i}">${esc(b.lines.join('\n'))}</span>`).join('\n')+'\n}';
    const s={user:null,loading:false,error:null};
    let active=-1,view=null,created=0,destroyed=0;
    const pick=()=>s.user?0:s.loading?1:s.error?2:3;
    function render(){
      const b=pick();
      if(b===active&&view){
        if(b===0){$('.if-block-name',view).textContent=s.user.name;log(ul,`<span class="t">${tx('gleicher Zweig','same branch')}</span> ${tx('nur Binding aktualisiert','binding updated only')}: u.name = ${esc(s.user.name)}`)}
        else log(ul,`<span class="t">${tx('gleicher Zweig','same branch')}</span> ${tx('nichts zu tun','nothing to do')}`);
        return;
      }
      if(view){view.remove();destroyed++;log(ul,`<span class="t">${tx('zerstört','destroyed')}</span> ${esc(branches[active].name)}`)}
      view=document.createElement('div');view.className='if-block-view';
      if(b===0)view.innerHTML=`<p>${tx('Hallo','Hello')} <b class="if-block-name">${esc(s.user.name)}</b></p><label class="field"><span>${tx('Notiz (nicht gebunden)','Note (not bound)')}</span><input class="input" type="text" autocomplete="off"></label>`;
      if(b===1)view.innerHTML=`<p>${tx('Lädt …','Loading …')}</p>`;
      if(b===2)view.innerHTML=`<p class="if-block-err">${esc(s.error)}</p>`;
      if(b===3)view.innerHTML=`<p>${tx('Niemand angemeldet.','Nobody logged in.')}</p>`;
      out.append(view);created++;active=b;
      log(ul,`<span class="hl">${tx('erzeugt','created')}</span> ${esc(branches[b].name)}`);
      $('#if-block-created',root).textContent=created;$('#if-block-destroyed',root).textContent=destroyed;
      $$('.if-block-br',code).forEach(el=>el.classList.toggle('if-block-on',+el.dataset.br===b));
    }
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-if]')?.dataset.if;if(!k)return;
      if(k==='loading')Object.assign(s,{user:null,loading:true,error:null});
      if(k==='error')Object.assign(s,{user:null,loading:false,error:tx('Netzwerkfehler','Network error')});
      if(k==='anna')Object.assign(s,{user:{name:'Anna'},loading:false,error:null});
      if(k==='ben')Object.assign(s,{user:{name:'Ben'},loading:false,error:null});
      if(k==='none')Object.assign(s,{user:null,loading:false,error:null});
      render();
    });
    render();
  },
  css:`.if-block-h{margin-top:16px!important}.if-block-out{min-height:96px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}.if-block-out p{margin:0 0 8px}.if-block-err{color:var(--danger);font-weight:700}
.if-block-code{margin:0 0 12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.if-block-br{display:inline;color:var(--muted)}.if-block-br.if-block-on{color:var(--ink);background:var(--brand-soft);outline:2px solid var(--brand);border-radius:3px;font-weight:700}`,
  bad:{code:`<div *ngIf="user$ | async as user; else loading">
  Hello {{ user.name }}
</div>
<ng-template #loading>
  <p>Loading …</p>
</ng-template>

// imports: [NgIf, AsyncPipe]`,
    note:tx('<code>*ngIf</code> ist seit Angular 20 <em>deprecated</em>: Die Direktive muss importiert werden, der else-Zweig braucht ein separates <code>&lt;ng-template&gt;</code> mit Referenz, und <code>else if</code> gibt es gar nicht.','<code>*ngIf</code> has been <em>deprecated</em> since Angular 20: the directive has to be imported, the else branch needs a separate <code>&lt;ng-template&gt;</code> with a reference, and there is no <code>else if</code> at all.')},
  good:{code:`@if (user(); as u) {
  <p>Hello {{ u.name }}</p>
} @else if (loading()) {
  <p>Loading …</p>
} @else if (error(); as e) {
  <p role="alert">{{ e }}</p>
} @else {
  <p>Nobody logged in.</p>
}`,
    note:tx('Liest sich wie TypeScript, braucht keinen Import und verengt Typen: Im ersten Block ist <code>u</code> garantiert nicht <code>null</code>. Mit <code>ng generate @angular/core:control-flow</code> migrierst du bestehende Templates automatisch.','Reads like TypeScript, needs no import and narrows types: inside the first block <code>u</code> is guaranteed not to be <code>null</code>. <code>ng generate @angular/core:control-flow</code> migrates existing templates automatically.')},
  do:tx(['Zustände wie Laden, Fehler, Daten, leer als eine <code>@if</code>-Kette schreiben – die Reihenfolge ist die Priorität.','<code>as</code> nutzen, wenn du den Wert der Bedingung im Block brauchst – er wird nur einmal ausgewertet.','Den Zweig mit dem häufigsten Zustand ruhig zuerst prüfen; bleibt der Zweig gleich, kostet ein Update nur die Bindings.','Bestehende <code>*ngIf</code> mit der Control-Flow-Migration umstellen.'],
        ['Write states like loading, error, data, empty as one <code>@if</code> chain – the order is the priority.','Use <code>as</code> when you need the condition’s value inside the block – it is evaluated only once.','Feel free to check the most common state first; if the branch stays the same, an update only costs the bindings.','Convert existing <code>*ngIf</code> with the control flow migration.']),
  dont:tx(['Keinen Zustand in einem Zweig ablegen, der einen Zweigwechsel überleben soll – die View wird dabei zerstört (Formulareingaben, Fokus, Kind-Komponenten).','Nicht <code>@if (a) {…} @if (!a) {…}</code> schreiben – dafür gibt es <code>@else</code>.','In neuem Code kein <code>*ngIf</code> mehr verwenden.'],
        ['Don’t keep state in a branch that should survive a branch change – the view gets destroyed (form input, focus, child components).','Don’t write <code>@if (a) {…} @if (!a) {…}</code> – that’s what <code>@else</code> is for.','Don’t use <code>*ngIf</code> in new code any more.']),
  why:tx('<p>Der eingebaute Control Flow ist Teil des Template-Compilers, keine Direktive. Darum braucht er keinen Import, erzeugt weniger Code und kann Typen verengen – wie ein <code>if</code> in TypeScript.</p><p>Zur Laufzeit merkt sich Angular den Index des aktiven Zweigs. Solange der gleich bleibt, bleibt auch die eingebettete View bestehen; nur die Bindings darin werden aktualisiert. Erst bei einem Wechsel wird die alte View zerstört und die neue erzeugt – samt allen Kind-Komponenten und DOM-Knoten.</p>',
           '<p>Built-in control flow is part of the template compiler, not a directive. That’s why it needs no import, produces less code and can narrow types – like an <code>if</code> in TypeScript.</p><p>At runtime Angular remembers the index of the active branch. As long as it stays the same, the embedded view stays too; only the bindings inside are updated. Only on a change is the old view destroyed and the new one created – including all child components and DOM nodes.</p>'),
  test:{code:`it('shows the error branch', async () => {
  const fixture = TestBed.createComponent(UserCard);
  fixture.componentInstance.error.set('Network error');
  await fixture.whenStable();
  const alert = fixture.nativeElement.querySelector('[role=alert]');
  expect(alert.textContent).toContain('Network error');
});`,note:tx('Signal setzen, auf <code>whenStable()</code> warten, dann das DOM prüfen – funktioniert mit und ohne zone.js.','Set the signal, wait for <code>whenStable()</code>, then check the DOM – works with and without zone.js.')}
});

LESSONS.push({
  id:'let-block', cat:'templates', order:40,
  title:tx('Lokale Template-Variablen mit @let','Local template variables with @let'),
  short:tx('Einen Ausdruck einmal benennen und mehrfach nutzen – z. B. ein einziges async-Abo statt drei.','Name an expression once and use it several times – e.g. one async subscription instead of three.'),
  keys:'let variable template lokal local async pipe subscription abo',
  since:'Angular 18.1', status:'stable',
  refs:[[tx('Angular-Doku: Lokale Variablen mit @let','Angular docs: Local variables with @let'),'https://angular.dev/guide/templates/variables#local-template-variables-with-let'],
        [tx('Angular-Doku: Gültigkeitsbereich','Angular docs: Variable scope'),'https://angular.dev/guide/templates/variables#variable-scope']],
  rule:tx('Mit <code>@let name = ausdruck;</code> gibst du einem Ausdruck im Template einen Namen. Angular hält den Wert automatisch aktuell, du kannst ihn aber nicht neu zuweisen. Er gilt in der aktuellen View und ihren Kindern – nicht davor und nicht in Geschwistern.','With <code>@let name = expression;</code> you give an expression in the template a name. Angular keeps the value up to date automatically, but you can’t reassign it. It is valid in the current view and its children – not before it and not in siblings.'),
  apis:[['@let','@let name = expression;',tx('Deklariert eine schreibgeschützte Template-Variable. Der Ausdruck darf mehrzeilig sein und endet mit <code>;</code>.','Declares a read-only template variable. The expression may span several lines and ends with <code>;</code>.')],
        ['| async','@let user = user$ | async;',tx('Typischer Fall: <em>ein</em> Abo, das Ergebnis überall im Template nutzen.','Typical case: <em>one</em> subscription, use the result everywhere in the template.')]],
  demo:`<div class="sim-row let-block-actions">
  <button type="button" class="btn btn-primary" id="let-block-mount">${tx('Komponente anzeigen','Show component')}</button>
  <button type="button" class="btn btn-secondary" id="let-block-next">${tx('Anderen Nutzer laden','Load another user')}</button>
  <button type="button" class="btn btn-secondary" id="let-block-destroy">${tx('Komponente zerstören','Destroy component')}</button>
</div>
<div class="sim-grid">
  <div class="sim-card"><h3>${tx('So nicht: 3× <code>| async</code>','Don’t: 3× <code>| async</code>')}</h3>
    <pre class="let-block-code">{{ (user$ | async)?.name }}
{{ (user$ | async)?.email }}
{{ (user$ | async)?.city }}</pre>
    <dl class="let-block-view" id="let-block-bad"></dl>
    <p class="sim-row"><span class="sim-node" id="let-block-bad-subs">${tx('Abos','subscriptions')} <b>0</b></span><span class="sim-node" id="let-block-bad-req">HTTP <b>0</b></span></p>
  </div>
  <div class="sim-card"><h3>${tx('So: <code>@let</code>','Do: <code>@let</code>')}</h3>
    <pre class="let-block-code">@let user = user$ | async;
{{ user?.name }}
{{ user?.email }}
{{ user?.city }}</pre>
    <dl class="let-block-view" id="let-block-good"></dl>
    <p class="sim-row"><span class="sim-node" id="let-block-good-subs">${tx('Abos','subscriptions')} <b>0</b></span><span class="sim-node" id="let-block-good-req">HTTP <b>0</b></span></p>
  </div>
</div>
<ul class="sim-log let-block-log" id="let-block-log" aria-label="${tx('Protokoll','Log')}"></ul>
<p class="demo-note">${tx('Probier: „Komponente anzeigen“ – links startet jede <code>async</code>-Pipe ihr eigenes Abo und damit einen eigenen HTTP-Request; die Felder kommen zu unterschiedlichen Zeiten. Rechts gibt es genau ein Abo. Lade dann einen anderen Nutzer: links wieder drei Requests.','Try: “Show component” – on the left every <code>async</code> pipe starts its own subscription and thus its own HTTP request; the fields arrive at different times. On the right there is exactly one subscription. Then load another user: three requests again on the left.')}</p>`,
  init(root){
    const {log,flash}=NG;
    const ul=$('#let-block-log',root);
    const users=[{name:'Anna Huber',email:'anna@example.com',city:'Graz'},{name:'Ben Maier',email:'ben@example.com',city:'Linz'},{name:'Cem Yilmaz',email:'cem@example.com',city:'Wien'}];
    let userId=0;const listeners=new Set();const timers=new Set();
    /* Mini-Observable wie userId$.pipe(switchMap(id => http.get(...))): kalt, jedes Abo holt selbst */
    const user$={subscribe(side,cb){
      let pending=null;
      const fetch=()=>{
        if(pending){clearTimeout(pending);timers.delete(pending)}
        st[side].req++;upd(side);flash($(`#let-block-${side}-req`,root));
        log(ul,`<span class="t">${side==='bad'?tx('links','left'):tx('rechts','right')}</span> GET /api/users/${userId+1}`);
        const t=setTimeout(()=>{timers.delete(t);pending=null;cb(users[userId])},250+Math.round(Math.random()*650));
        pending=t;timers.add(t);
      };
      listeners.add(fetch);fetch();
      return ()=>{listeners.delete(fetch);if(pending){clearTimeout(pending);timers.delete(pending)}};
    }};
    const st={bad:{subs:0,req:0,unsub:[]},good:{subs:0,req:0,unsub:[]}};
    const upd=side=>{$(`#let-block-${side}-subs b`,root).textContent=st[side].subs;$(`#let-block-${side}-req b`,root).textContent=st[side].req};
    const fields=[['name',tx('Name','Name')],['email','E-Mail'],['city',tx('Ort','City')]];
    const dl=side=>$(`#let-block-${side}`,root);
    const blank=side=>{dl(side).innerHTML=fields.map(([k,l])=>`<div><dt>${l}</dt><dd data-k="${k}">—</dd></div>`).join('')};
    function mount(){
      if(st.bad.subs||st.good.subs)return;
      blank('bad');blank('good');
      /* links: drei Pipes, drei Abos */
      fields.forEach(([k])=>{st.bad.subs++;st.bad.unsub.push(user$.subscribe('bad',u=>{const dd=$(`[data-k="${k}"]`,dl('bad'));dd.textContent=u[k];flash(dd)}))});
      /* rechts: ein @let, ein Abo */
      st.good.subs++;st.good.unsub.push(user$.subscribe('good',u=>{fields.forEach(([k])=>{const dd=$(`[data-k="${k}"]`,dl('good'));dd.textContent=u[k];flash(dd)})}));
      upd('bad');upd('good');
      flash($('#let-block-bad-subs',root));flash($('#let-block-good-subs',root));
    }
    function destroy(){
      ['bad','good'].forEach(s=>{st[s].unsub.splice(0).forEach(f=>f());st[s].subs=0;upd(s);dl(s).innerHTML=''});
      log(ul,`<span class="hl">${tx('zerstört','destroyed')}</span> ${tx('– die async-Pipes kündigen ihre Abos','– the async pipes unsubscribe')}`);
    }
    root.addEventListener('click',e=>{
      if(e.target.closest('#let-block-mount'))mount();
      if(e.target.closest('#let-block-destroy'))destroy();
      if(e.target.closest('#let-block-next')){
        if(!listeners.size){log(ul,`<span class="t">${tx('keine Abos – niemand lädt','no subscriptions – nobody loads')}</span>`);return}
        userId=(userId+1)%users.length;[...listeners].forEach(f=>f());
      }
    });
    log(ul,`<span class="t">${tx('Noch keine Komponente – noch kein Abo, noch kein Request.','No component yet – no subscription, no request.')}</span>`);
    return ()=>{timers.forEach(clearTimeout);listeners.clear()};
  },
  css:`.let-block-actions{margin-bottom:16px}.let-block-log{margin-top:16px}
.let-block-code{margin:0 0 10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.let-block-view{margin:0 0 10px;display:grid;gap:4px;min-height:84px}.let-block-view div{display:flex;gap:10px;flex-wrap:wrap}.let-block-view dt{font-weight:700;min-width:4.5rem}.let-block-view dd{margin:0;border-radius:4px;padding:0 4px}
.let-block-view dd.flash{background:var(--brand-soft);color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.let-block-view dd{transition:background .3s,color .3s}}`,
  bad:{code:`<h2>{{ (user$ | async)?.name }}</h2>
<p>{{ (user$ | async)?.email }}</p>
@if ((user$ | async)?.isAdmin) {
  <app-admin-tools />
}`,
    note:tx('Jede <code>async</code>-Pipe ist eine eigene Instanz mit eigenem Abo. Bei einem kalten Observable wie <code>HttpClient.get()</code> heißt das: drei Requests, drei Zeitpunkte, kurz inkonsistente Anzeige.','Every <code>async</code> pipe is its own instance with its own subscription. With a cold observable like <code>HttpClient.get()</code> that means three requests, three moments in time, briefly inconsistent display.')},
  good:{code:`@let user = user$ | async;

<h2>{{ user?.name }}</h2>
<p>{{ user?.email }}</p>
@if (user?.isAdmin) {
  <app-admin-tools />
}

@let fullPrice = price() * qty() * (1 + vat());
<p>{{ fullPrice | currency: 'EUR' }}</p>`,
    note:tx('Ein Abo, ein Wert, überall gleich. Auch lange Ausdrücke bekommen einen sprechenden Namen. Arbeitest du ohnehin mit Signals, ist ein <code>computed()</code> in der Klasse oft noch besser – das ist testbar und wiederverwendbar.','One subscription, one value, the same everywhere. Long expressions get a meaningful name too. If you work with signals anyway, a <code>computed()</code> in the class is often even better – it’s testable and reusable.')},
  do:tx(['<code>@let</code> nutzen, um ein <code>async</code>-Ergebnis einmal zu abonnieren und mehrfach zu lesen.','Lange Ausdrücke im Template benennen, damit das Template lesbar bleibt.','<code>@let</code> dort deklarieren, wo alle Verwender darunter liegen – also im gemeinsamen Eltern-Block.'],
        ['Use <code>@let</code> to subscribe to an <code>async</code> result once and read it several times.','Name long expressions in the template so it stays readable.','Declare <code>@let</code> where all its users are below it – i.e. in the shared parent block.']),
  dont:tx(['<code>@let</code> nicht neu zuweisen – das geht nicht; Zustand gehört in ein Signal in der Klasse.','Nicht vor der Deklaration lesen – <code>@let</code> wird nicht „gehoistet“.','Keine Geschäftslogik ins Template verlagern, nur weil <code>@let</code> es möglich macht – dafür ist <code>computed()</code> da.'],
        ['Don’t reassign <code>@let</code> – you can’t; state belongs in a signal in the class.','Don’t read it before the declaration – <code>@let</code> is not hoisted.','Don’t move business logic into the template just because <code>@let</code> makes it possible – that’s what <code>computed()</code> is for.']),
  why:tx('<p><code>@let</code> ist eine Deklaration im Template: Angular wertet den Ausdruck bei jeder Prüfung der View aus und speichert das Ergebnis unter dem Namen. Alle Stellen darunter lesen denselben Wert – bei einer Pipe gibt es also nur eine Pipe-Instanz und damit nur ein Abo.</p><p>Vorher gab es dafür nur Umwege wie <code>*ngIf="user$ | async as user"</code>, das bei falsy-Werten (0, leerer String) den ganzen Block ausblendet. <code>@let</code> blendet nichts aus, sondern benennt nur.</p>',
           '<p><code>@let</code> is a declaration in the template: Angular evaluates the expression every time the view is checked and stores the result under the name. Every place below reads the same value – with a pipe there is only one pipe instance and thus only one subscription.</p><p>Before, there were only workarounds like <code>*ngIf="user$ | async as user"</code>, which hides the whole block for falsy values (0, empty string). <code>@let</code> hides nothing, it only names.</p>'),
  test:{code:`it('requests the user only once', async () => {
  const http = TestBed.inject(HttpTestingController);
  const fixture = TestBed.createComponent(UserHeader);
  await fixture.whenStable();
  http.expectOne('/api/users/1').flush({ name: 'Anna' });
  await fixture.whenStable();
  expect(fixture.nativeElement.textContent).toContain('Anna');
  http.verify(); // fails if a second request was made
});`,note:tx('Mit <code>provideHttpClient()</code> und <code>provideHttpClientTesting()</code>: <code>expectOne()</code> schlägt fehl, wenn mehr als ein Request kommt.','With <code>provideHttpClient()</code> and <code>provideHttpClientTesting()</code>: <code>expectOne()</code> fails if more than one request arrives.')}
});

LESSONS.push({
  id:'pure-pipes', cat:'templates', order:60,
  title:tx('Pure Pipes statt Methoden im Template','Pure pipes instead of methods in templates'),
  short:tx('Eine Methode im Template läuft bei jeder Prüfung – eine pure Pipe oder ein computed() nur, wenn sich die Eingabe ändert.','A method in the template runs on every check – a pure pipe or a computed() only when the input changes.'),
  keys:'pipe pure impure methode method funktion function template performance transform pipetransform change detection',
  status:'stable',
  refs:[[tx('Angular-Doku: Change Detection mit Pipes','Angular docs: Change detection with pipes'),'https://angular.dev/guide/templates/pipes#change-detection-with-pipes'],
        [tx('Angular-Doku: Änderungen in Arrays und Objekten','Angular docs: Detecting change within arrays or objects'),'https://angular.dev/guide/templates/pipes#detecting-change-within-arrays-or-objects'],
        [tx('Styleguide: Keine komplexe Logik im Template','Style guide: Avoid overly complex logic in templates'),'https://angular.dev/style-guide#avoid-overly-complex-logic-in-templates']],
  rule:tx('Ein Methodenaufruf im Template (<code>{{ total(items) }}</code>) läuft bei <em>jeder</em> Prüfung der Komponente. Eine pure Pipe (<code>{{ items | total }}</code>) läuft nur, wenn sich ihre Eingabe per <code>===</code> geändert hat, ein <code>computed()</code> nur, wenn sich ein gelesenes Signal geändert hat. Beide setzen voraus, dass du Daten unveränderlich aktualisierst.','A method call in the template (<code>{{ total(items) }}</code>) runs on <em>every</em> check of the component. A pure pipe (<code>{{ items | total }}</code>) only runs when its input changed by <code>===</code>, a <code>computed()</code> only when a signal it reads changed. Both require you to update data immutably.'),
  apis:[['@Pipe','@Pipe({ name: string, pure?: boolean })',tx('Deklariert eine Pipe. Standard ist <code>pure: true</code>; <code>pure: false</code> läuft bei jeder Prüfung.','Declares a pipe. The default is <code>pure: true</code>; <code>pure: false</code> runs on every check.')],
        ['PipeTransform','transform(value, ...args)',tx('Die Methode, die Angular aufruft. Soll rein sein: gleiche Eingabe, gleiches Ergebnis.','The method Angular calls. Should be pure: same input, same result.')],
        ['computed()','computed(() => …)',tx('Die Alternative für Werte aus Signals – gemerkt und nur bei echten Änderungen neu berechnet.','The alternative for values from signals – memoised and only recalculated on real changes.')]],
  demo:`<div class="sim-row pure-pipes-actions">
  <button type="button" class="btn btn-secondary" id="pure-pipes-cd">${tx('Change Detection (anderes Event)','Change detection (other event)')}</button>
  <button type="button" class="btn btn-secondary" id="pure-pipes-cd10">${tx('10× Change Detection','10× change detection')}</button>
  <button type="button" class="btn btn-secondary" id="pure-pipes-add">${tx('Artikel hinzufügen (neues Array)','Add item (new array)')}</button>
  <button type="button" class="btn btn-secondary" id="pure-pipes-push">${tx('Artikel pushen (Mutation)','Push item (mutation)')}</button>
</div>
<p class="hint pure-pipes-real">${tx('Tatsächlich im Warenkorb','Actually in the cart')}: <b id="pure-pipes-real"></b> · ${tx('Prüfungen der Komponente','component checks')}: <b id="pure-pipes-checks">0</b></p>
<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Methode','Method')}</h3><code class="pure-pipes-expr">{{ total(items) }}</code>
    <p class="pure-pipes-val" id="pure-pipes-v-method"></p><p><span class="sim-node" id="pure-pipes-n-method">${tx('lief','ran')} <b>0</b>×</span></p></div>
  <div class="sim-card"><h3>${tx('Pure Pipe','Pure pipe')}</h3><code class="pure-pipes-expr">{{ items | total }}</code>
    <p class="pure-pipes-val" id="pure-pipes-v-pipe"></p><p><span class="sim-node" id="pure-pipes-n-pipe">${tx('lief','ran')} <b>0</b>×</span></p></div>
  <div class="sim-card"><h3>computed()</h3><code class="pure-pipes-expr">{{ total() }}</code>
    <p class="pure-pipes-val" id="pure-pipes-v-comp"></p><p><span class="sim-node" id="pure-pipes-n-comp">${tx('lief','ran')} <b>0</b>×</span></p></div>
</div>
<ul class="sim-log pure-pipes-log" id="pure-pipes-log" aria-label="${tx('Protokoll','Log')}"></ul>
<p class="demo-note">${tx('Probier: „10× Change Detection“ – die Methode läuft zehnmal, Pipe und <code>computed()</code> kein einziges Mal. Dann „Artikel pushen“: Die Methode zeigt die richtige Summe, Pipe und <code>computed()</code> merken nichts, weil die Referenz gleich blieb. „Artikel hinzufügen“ mit neuem Array bringt alle wieder in Einklang.','Try: “10× change detection” – the method runs ten times, the pipe and <code>computed()</code> not once. Then “Push item”: the method shows the right total, the pipe and <code>computed()</code> don’t notice anything because the reference stayed the same. “Add item” with a new array brings everyone back in sync.')}</p>`,
  init(root){
    const {signal,computed,log,flash}=NG;
    const fmt=v=>new Intl.NumberFormat(LOCALE,{style:'currency',currency:'EUR'}).format(v);
    const sum=a=>a.reduce((s,i)=>s+i.price,0);
    const goods=[{name:tx('Buch','Book'),price:12},{name:tx('Tasse','Mug'),price:8},{name:tx('Stift','Pen'),price:2.5},{name:tx('Heft','Notebook'),price:3}];
    let gi=0;
    let items=[{...goods[0]},{...goods[1]}];
    const sItems=signal(items,{name:'items'});
    const n={method:0,pipe:0,comp:0};let checks=0;
    const total=computed(()=>{n.comp++;return sum(sItems())},{name:'total'});
    /* Pure Pipe: Angular merkt sich die letzte Eingabe pro Pipe-Instanz */
    let lastArg,lastRes,hasLast=false;
    const pipe=a=>{if(hasLast&&a===lastArg)return lastRes;hasLast=true;lastArg=a;n.pipe++;return lastRes=sum(a)};
    const method=a=>{n.method++;return sum(a)};
    const ul=$('#pure-pipes-log',root);
    function cd(quiet){
      checks++;
      const before={...n};
      const vals={method:method(items),pipe:pipe(items),comp:total()};
      const real=sum(items);
      ['method','pipe','comp'].forEach(k=>{
        const v=$(`#pure-pipes-v-${k}`,root);v.textContent=fmt(vals[k]);
        v.classList.toggle('pure-pipes-stale',Math.abs(vals[k]-real)>1e-9);
        v.dataset.stale=Math.abs(vals[k]-real)>1e-9?tx('veraltet','stale'):'';
        $(`#pure-pipes-n-${k} b`,root).textContent=n[k];
        if(n[k]!==before[k])flash($(`#pure-pipes-n-${k}`,root));
      });
      $('#pure-pipes-real',root).textContent=`${items.length} ${tx('Artikel','items')}, ${fmt(real)}`;
      $('#pure-pipes-checks',root).textContent=checks;
      if(!quiet)log(ul,`<span class="t">${tx('Prüfung','check')} #${checks}</span> ${tx('Methode','method')} ${n.method-before.method?'✓':'–'} · pipe ${n.pipe-before.pipe?'✓':'–'} · computed ${n.comp-before.comp?'✓':'–'}`);
    }
    root.addEventListener('click',e=>{
      if(e.target.closest('#pure-pipes-cd'))cd();
      if(e.target.closest('#pure-pipes-cd10')){for(let i=0;i<9;i++)cd(true);cd();log(ul,`<span class="hl">10×</span> ${tx('geprüft – die Methode lief jedes Mal','checked – the method ran every time')}`)}
      if(e.target.closest('#pure-pipes-add')){const g=goods[gi++%goods.length];items=[...items,{...g}];sItems.set(items);log(ul,`<span class="t">items = [...items, ${esc(g.name)}]</span> ${tx('neue Referenz','new reference')}`);cd()}
      if(e.target.closest('#pure-pipes-push')){const g=goods[gi++%goods.length];items.push({...g});log(ul,`<span class="t">items.push(${esc(g.name)})</span> ${tx('gleiche Referenz – für Pipe und Signal unsichtbar','same reference – invisible to pipe and signal')}`);cd()}
    });
    cd(true);
  },
  css:`.pure-pipes-actions{margin-bottom:10px}.pure-pipes-real{margin:0 0 14px}.pure-pipes-log{margin-top:16px}
.pure-pipes-expr{display:inline-block;font-size:.8125rem;overflow-wrap:anywhere}
.pure-pipes-val{font-size:1.25rem;font-weight:700;margin:10px 0}
.pure-pipes-val.pure-pipes-stale{color:var(--danger)}.pure-pipes-val.pure-pipes-stale::after{content:" · " attr(data-stale);font-size:.8125rem}`,
  bad:{code:`@Component({
  template: \`
    <p>Total: {{ calculateTotal(items) }}</p>
    <p>Discount: {{ discountFor(user) }}</p>
  \`
})
export class Cart {
  items: Item[] = [];
  calculateTotal(items: Item[]) {
    return items.reduce((sum, i) => sum + i.price * i.qty, 0);
  }
}`,
    note:tx('Beide Methoden laufen bei jeder Prüfung der Komponente – bei Eager-Komponenten also nach praktisch jedem Event in der App. Ist die Berechnung teuer, merkt man das.','Both methods run on every check of the component – for eager components that means after practically every event in the app. If the calculation is expensive, you notice it.')},
  good:{code:`@Pipe({ name: 'total' })          // pure by default
export class TotalPipe implements PipeTransform {
  transform(items: readonly Item[]): number {
    return items.reduce((sum, i) => sum + i.price * i.qty, 0);
  }
}

// template: {{ items | total | currency: 'EUR' }}

// or, with signals, no pipe needed:
items = signal<readonly Item[]>([]);
total = computed(() =>
  this.items().reduce((sum, i) => sum + i.price * i.qty, 0));
add(item: Item) {
  this.items.update(list => [...list, item]);   // new array
}`,
    note:tx('Die Pipe rechnet nur, wenn eine neue Array-Referenz kommt; <code>computed()</code> nur, wenn das Signal neu gesetzt wurde. <code>readonly Item[]</code> sorgt dafür, dass TypeScript ein versehentliches <code>push()</code> meldet.','The pipe only calculates when a new array reference arrives; <code>computed()</code> only when the signal was set again. <code>readonly Item[]</code> makes TypeScript report an accidental <code>push()</code>.')},
  do:tx(['Formatierungen und Umrechnungen, die du in mehreren Templates brauchst, als pure Pipe schreiben.','Werte, die aus Signals entstehen, als <code>computed()</code> in der Klasse ablegen.','Arrays und Objekte unveränderlich aktualisieren (<code>[...list, x]</code>, <code>{...obj, a: 1}</code>).','Einfache Getter und Methoden ohne Rechenaufwand sind ok – teuer wird es bei Schleifen, Sortieren, Filtern.'],
        ['Write formatting and conversions you need in several templates as a pure pipe.','Put values that follow from signals into a <code>computed()</code> in the class.','Update arrays and objects immutably (<code>[...list, x]</code>, <code>{...obj, a: 1}</code>).','Trivial getters and methods are fine – it gets expensive with loops, sorting, filtering.']),
  dont:tx(['Nicht <code>pure: false</code> setzen, nur damit Mutationen erkannt werden – die Pipe läuft dann bei jeder Prüfung.','Keine Seiteneffekte in <code>transform()</code> (HTTP, Logging, Zustand ändern).','Keine teuren Berechnungen als Methode im Template aufrufen.'],
        ['Don’t set <code>pure: false</code> just so mutations are detected – the pipe then runs on every check.','No side effects in <code>transform()</code> (HTTP, logging, changing state).','Don’t call expensive calculations as a method in the template.']),
  why:tx('<p>Angular weiß nicht, was eine Methode im Template tut – sie könnte bei jedem Aufruf etwas anderes liefern. Darum ruft es sie bei jeder Prüfung der View auf. Eine pure Pipe verspricht dagegen: gleiche Eingabe, gleiches Ergebnis. Angular merkt sich die letzten Argumente jeder Pipe-Instanz und überspringt <code>transform()</code>, solange sie per <code>===</code> gleich sind.</p><p>Der Preis dafür ist Unveränderlichkeit: Ein <code>push()</code> ändert den Inhalt, aber nicht die Referenz – Pipe und Signal sehen „dasselbe Array“ und rechnen nicht neu. Ein neues Array ist billig und macht jede Änderung sichtbar.</p>',
           '<p>Angular doesn’t know what a method in the template does – it could return something different on every call. That’s why it calls it on every check of the view. A pure pipe, in contrast, promises: same input, same result. Angular remembers the last arguments of every pipe instance and skips <code>transform()</code> as long as they are equal by <code>===</code>.</p><p>The price is immutability: a <code>push()</code> changes the content but not the reference – pipe and signal see “the same array” and don’t recalculate. A new array is cheap and makes every change visible.</p>'),
  test:{code:`it('sums up the items', () => {
  const pipe = new TotalPipe();
  expect(pipe.transform([
    { price: 2, qty: 3 },
    { price: 5, qty: 1 },
  ])).toBe(11);
});`,note:tx('Eine pure Pipe ist eine einfache Klasse – ohne Abhängigkeiten testest du sie ganz ohne TestBed.','A pure pipe is a plain class – without dependencies you test it without TestBed at all.')}
});

LESSONS.push({
  id:'switch-block', cat:'templates', order:30,
  title:tx('Fallunterscheidung mit @switch','Branching with @switch'),
  short:tx('Ein Wert, mehrere Fälle: @case, gemeinsame Fälle, @default – und @default never für lückenlose Typprüfung.','One value, several cases: @case, shared cases, @default – and @default never for exhaustive type checking.'),
  keys:'switch case default never ngswitch exhaustive union typ type fallunterscheidung',
  since:'Angular 17', status:'stable',
  refs:[[tx('Angular-Doku: @switch','Angular docs: @switch'),'https://angular.dev/guide/templates/control-flow#conditionally-display-content-with-the-switch-block'],
        [tx('Angular-Doku: Exhaustive type checking','Angular docs: Exhaustive type checking'),'https://angular.dev/guide/templates/control-flow#exhaustive-type-checking']],
  rule:tx('Hängt die Anzeige an <em>einem</em> Wert mit mehreren möglichen Ausprägungen, nimm <code>@switch</code>. Verglichen wird mit <code>===</code>, es gibt kein Durchfallen und kein <code>break</code>. Stehen mehrere <code>@case</code> direkt hintereinander, teilen sie sich einen Block. Mit <code>@default never;</code> meldet der Compiler jeden Fall, den du vergessen hast.','When the display depends on <em>one</em> value with several possible variants, use <code>@switch</code>. It compares with <code>===</code>, there is no fall-through and no <code>break</code>. Several <code>@case</code> directly after each other share one block. With <code>@default never;</code> the compiler reports every case you forgot.'),
  apis:[['@switch','@switch (expr) { … }',tx('Wertet <code>expr</code> einmal aus und rendert nur den passenden Fall.','Evaluates <code>expr</code> once and renders only the matching case.')],
        ['@case','@case (value) { … }',tx('Wird gerendert, wenn <code>expr === value</code>. Mehrere <code>@case</code> hintereinander ohne eigenen Block teilen sich den nächsten Block.','Rendered when <code>expr === value</code>. Several <code>@case</code> in a row without their own block share the next block.')],
        ['@default','@default { … }',tx('Fallback, wenn kein Fall passt.','Fallback when no case matches.')],
        ['@default never','@default never;',tx('Kein Fallback, sondern eine Typprüfung: Deckt ein Union-Typ Werte ab, für die es kein <code>@case</code> gibt, schlägt der Build fehl.','Not a fallback but a type check: if a union type has values without an <code>@case</code>, the build fails.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Zahlungsart','Payment method')}</h3>
    <div id="switch-block-seg"></div>
    <label class="check-row"><input type="checkbox" id="switch-block-crypto"> ${tx('Typ um <code>\'crypto\'</code> erweitern','Add <code>\'crypto\'</code> to the type')}</label>
    <label class="check-row"><input type="checkbox" id="switch-block-never"> ${tx('<code>@default never;</code> statt <code>@default { … }</code>','<code>@default never;</code> instead of <code>@default { … }</code>')}</label>
    <h3 class="switch-block-h">${tx('Gerendert','Rendered')}</h3>
    <div class="switch-block-out" id="switch-block-out" aria-live="polite"></div>
  </div>
  <div class="sim-card"><h3>${tx('Template','Template')}</h3>
    <pre class="switch-block-code" id="switch-block-code"></pre>
    <h3>${tx('Compiler','Compiler')} <span class="sim-tag">ng build</span></h3>
    <p class="switch-block-tsc" id="switch-block-tsc"></p>
  </div>
</div>
<p class="demo-note">${tx('Probier: „Rechnung“ und „Vorkasse“ landen im selben Block. Erweitere dann den Typ um <code>\'crypto\'</code>: Mit <code>@default</code> merkt niemand etwas, der Fall landet still im Fallback. Mit <code>@default never;</code> bricht der Build ab und zeigt dir die Lücke.','Try: “Invoice” and “Prepayment” end up in the same block. Then add <code>\'crypto\'</code> to the type: with <code>@default</code> nobody notices, the case silently lands in the fallback. With <code>@default never;</code> the build fails and shows you the gap.')}</p>`,
  init(root){
    const segBox=$('#switch-block-seg',root),out=$('#switch-block-out',root),code=$('#switch-block-code',root),tsc=$('#switch-block-tsc',root);
    const names={card:tx('Karte','Card'),paypal:'PayPal',invoice:tx('Rechnung','Invoice'),prepay:tx('Vorkasse','Prepayment'),crypto:'Crypto'};
    const s={method:'card',crypto:false,never:false};
    function drawSeg(){
      const opts=['card','paypal','invoice','prepay'].concat(s.crypto?['crypto']:[]);
      if(!opts.includes(s.method))s.method='card';
      segBox.innerHTML=TPL.seg('switch-block-m',tx('method()','method()'),opts.map(o=>[o,names[o]]),s.method);
    }
    function render(){
      const groups=[
        {cases:['card'],body:'<app-card-form />',text:tx('Kartenformular','Card form')},
        {cases:['paypal'],body:'<app-paypal-button />',text:tx('PayPal-Button','PayPal button')},
        {cases:['invoice','prepay'],body:'<app-bank-details />',text:tx('Bankverbindung (gemeinsamer Block)','Bank details (shared block)')}
      ];
      const hit=groups.findIndex(g=>g.cases.includes(s.method));
      const lines=[`@switch (method()) {`];
      groups.forEach((g,i)=>{
        const on=i===hit?' class="switch-block-on"':'';
        g.cases.forEach((c,j)=>lines.push(`<span${on}>  @case ('${c}')${j===g.cases.length-1?' {':''}</span>`));
        lines.push(`<span${on}>    ${esc(g.body)}\n  }</span>`);
      });
      if(s.never)lines.push(`  @default never;`);
      else lines.push(`<span${hit<0?' class="switch-block-on"':''}>  @default {\n    ${esc('<p>Unknown method</p>')}\n  }</span>`);
      lines.push('}');
      code.innerHTML=lines.join('\n');
      const type=`type Method = 'card' | 'paypal' | 'invoice' | 'prepay'${s.crypto?" | 'crypto'":''};`;
      if(s.never&&s.crypto){
        tsc.className='switch-block-tsc switch-block-err';
        tsc.innerHTML=`<code>${esc(type)}</code><br>✗ ${tx('Build-Fehler','Build error')}: <code>${esc('Type \'"crypto"\' is not assignable to type \'never\'.')}</code>`;
        out.innerHTML=`<p class="hint">${tx('Kein Build – erst ein <code>@case (\'crypto\')</code> ergänzen.','No build – add a <code>@case (\'crypto\')</code> first.')}</p>`;
        return;
      }
      tsc.className='switch-block-tsc switch-block-ok';
      tsc.innerHTML=`<code>${esc(type)}</code><br>✓ ${tx('Build ok','Build ok')}${s.crypto&&!s.never?` – ${tx('obwohl <code>\'crypto\'</code> keinen eigenen Fall hat','although <code>\'crypto\'</code> has no case of its own')}`:''}`;
      out.innerHTML=hit<0?`<p><b>@default</b>: ${tx('Unbekannte Zahlungsart','Unknown method')}</p>`:`<p><b>@case (${groups[hit].cases.map(c=>`'${c}'`).join(') @case (')})</b></p><p>${groups[hit].text}</p>`;
    }
    root.addEventListener('change',e=>{
      if(e.target.name==='switch-block-m')s.method=e.target.value;
      if(e.target.id==='switch-block-crypto'){s.crypto=e.target.checked;if(s.crypto)s.method='crypto';drawSeg()}
      if(e.target.id==='switch-block-never')s.never=e.target.checked;
      render();
    });
    drawSeg();render();
  },
  css:`.switch-block-h{margin-top:12px!important}.switch-block-out{min-height:72px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px}.switch-block-out p{margin:0 0 4px}
.switch-block-code{margin:0 0 12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
.switch-block-code .switch-block-on{color:var(--ink);font-weight:700;background:var(--brand-soft)}
.switch-block-tsc{margin:0;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--line);overflow-wrap:anywhere;font-size:.875rem}
.switch-block-tsc.switch-block-ok{border-color:var(--success);background:var(--success-bg)}.switch-block-tsc.switch-block-err{border-color:var(--danger);color:var(--danger);font-weight:700}`,
  bad:{code:`<div [ngSwitch]="method">
  <app-card-form *ngSwitchCase="'card'" />
  <app-paypal-button *ngSwitchCase="'paypal'" />
  <app-bank-details *ngSwitchCase="'invoice'" />
  <app-bank-details *ngSwitchCase="'prepay'" />
  <p *ngSwitchDefault>Unknown method</p>
</div>`,
    note:tx('<code>NgSwitch</code> ist seit Angular 20 <em>deprecated</em>. Es braucht ein Wrapper-Element und Importe, gemeinsame Fälle musst du doppelt schreiben, und ein neuer Wert im Typ fällt still in den Default.','<code>NgSwitch</code> has been <em>deprecated</em> since Angular 20. It needs a wrapper element and imports, shared cases must be written twice, and a new value in the type silently falls into the default.')},
  good:{code:`type Method = 'card' | 'paypal' | 'invoice' | 'prepay';

@switch (method()) {
  @case ('card') { <app-card-form /> }
  @case ('paypal') { <app-paypal-button /> }
  @case ('invoice')
  @case ('prepay') { <app-bank-details /> }
  @default never;
}`,
    note:tx('Kein Wrapper, kein Import, gemeinsame Fälle ohne Kopie. <code>@default never;</code> macht aus einem vergessenen Fall einen Build-Fehler statt eines Bugs in Produktion.','No wrapper, no import, shared cases without copies. <code>@default never;</code> turns a forgotten case into a build error instead of a bug in production.')},
  do:tx(['<code>@switch</code> für Zustände und Varianten mit Union-Typen verwenden (<code>\'idle\' | \'loading\' | \'error\'</code>).','<code>@default never;</code> setzen, wenn der Typ alle Fälle abschließend beschreibt.','Fälle mit gleichem Inhalt direkt hintereinander schreiben.','Bei Objekt-Unions <code>@default never(state);</code> nutzen, um auf ein Unterscheidungsfeld zu schalten.'],
        ['Use <code>@switch</code> for states and variants with union types (<code>\'idle\' | \'loading\' | \'error\'</code>).','Add <code>@default never;</code> when the type describes all cases exhaustively.','Write cases with the same content directly after each other.','For object unions use <code>@default never(state);</code> to switch on a discriminating field.']),
  dont:tx(['Kein <code>break</code> erwarten oder brauchen – es gibt kein Durchfallen.','Nicht auf lose Gleichheit hoffen: <code>\'1\'</code> passt nicht zu <code>1</code>.','Keine langen <code>@if</code>-Ketten, die immer denselben Wert vergleichen.'],
        ['Don’t expect or need a <code>break</code> – there is no fall-through.','Don’t hope for loose equality: <code>\'1\'</code> doesn’t match <code>1</code>.','No long <code>@if</code> chains that keep comparing the same value.']),
  why:tx('<p><code>@switch</code> wertet den Ausdruck einmal aus und vergleicht ihn per <code>===</code> mit jedem <code>@case</code>. Nur der passende Block existiert im DOM; beim Wechsel wird die alte View zerstört und die neue erzeugt – genau wie bei <code>@if</code>.</p><p>Für die Typprüfung übersetzt der Template-Compiler den Block in ein TypeScript-<code>switch</code>. Bei <code>@default never;</code> weist er im Default-Zweig den Wert einer Variablen vom Typ <code>never</code> zu. Bleibt ein Wert des Union-Typs übrig, passt er nicht zu <code>never</code> – TypeScript meldet den Fehler beim Build.</p>',
           '<p><code>@switch</code> evaluates the expression once and compares it with every <code>@case</code> using <code>===</code>. Only the matching block exists in the DOM; on a change the old view is destroyed and the new one created – just like <code>@if</code>.</p><p>For type checking, the template compiler translates the block into a TypeScript <code>switch</code>. With <code>@default never;</code> it assigns the value to a variable of type <code>never</code> in the default branch. If a value of the union type is left over, it doesn’t fit <code>never</code> – TypeScript reports the error at build time.</p>'),
  test:{code:`it('shows bank details for prepayment', async () => {
  const fixture = TestBed.createComponent(Checkout);
  fixture.componentInstance.method.set('prepay');
  await fixture.whenStable();
  expect(fixture.nativeElement.querySelector('app-bank-details')).not.toBeNull();
});`,note:tx('Die Vollständigkeit prüft schon der Compiler – im Test reicht es, die Fälle mit eigenem Verhalten abzudecken.','Completeness is already checked by the compiler – the test only needs to cover the cases with their own behaviour.')}
});

  <div class="field ref-find"><label for="ref-q">${tx('API suchen','Search APIs')}</label><input class="input" id="ref-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ref-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${REF.title}"><table class="kb-table attrs"><caption class="sr-only">${REF.title}</caption><thead><tr><th scope="col">API</th><th scope="col">${tx('Form','Shape')}</th><th scope="col">${tx('Wozu','Purpose')}</th><th scope="col">${tx('Lektion','Lesson')}</th></tr></thead>
  <tbody>${rows.map(({a:[a,v,t],l})=>`<tr data-q="${esc(norm(`${a} ${v} ${t.replace(/<[^>]+>/g,'')} ${l.title}`))}"><td><code>${esc(a)}</code></td><td>${v?`<code>${esc(v)}</code>`:''}</td><td>${t}</td><td><a href="#${l.id}">${l.title}</a></td></tr>`).join('')}</tbody></table></div>
</article>`;
}
function refInit(root){
  const q=$('#ref-q',root),rows=$$('tbody tr',root),count=$('#ref-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${rows.length} Einträgen`,`${n} of ${rows.length} entries`):tx(`${rows.length} Einträge`,`${rows.length} entries`)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> ist keine Lektion. Vielleicht hat der Link einen Tippfehler.`,`There is no lesson at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zur Startseite','Go to start page')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Lektion suchen','Search lessons')}</button></div>
  </div></article>`;
}
const APP='Angular-Patterns';
let lastId=null,masterScroll=0;
function route(fromUser){
  cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  shell.dataset.view=overview?'master':'detail';
  let title;
  if(overview||id==='start'){currentId='start';view.innerHTML=startHTML();title=START.title}
  else if(id==='reference'){currentId=id;view.innerHTML=refHTML();cleanup.push(refInit(view));title=REF.title}
  else if(BY_ID[id]){
    const l=BY_ID[id];currentId=id;view.innerHTML=lessonHTML(l);title=l.title;
    const demo=$('.demo-body',view);
    if(demo){const c=l.init?.(demo);if(typeof c==='function')cleanup.push(c)}
  }
  else{currentId=null;view.innerHTML=notFoundHTML(id);title=tx('Nicht gefunden','Not found')}
  document.title=`${title} · ${APP}`;
  markActive(currentId);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`.item[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{detail.scrollTop=0;$('#lesson-title').focus({preventScroll:true})}
  if(!overview&&currentId)lastId=currentId;
}

/* ---------- Globale Ereignisse ---------- */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
view.addEventListener('change',e=>{
  if(e.target.id!=='learned-cb'||!BY_ID[currentId])return;
  const l=BY_ID[currentId];
  if(e.target.checked)learned.add(l.id);else learned.delete(l.id);
  store.set('learned',[...learned]);renderList();updateProgress();
  toast(e.target.checked?{msg:tx(`„${l.title}“ als gelernt markiert – ${learned.size} von ${LESSONS.length}.`,`“${l.title}” marked as learned – ${learned.size} of ${LESSONS.length}.`),type:'success',duration:3500}:{msg:tx('Markierung entfernt.','Mark removed.'),duration:3000});
});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Kürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&activeUndo&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){e.preventDefault();activeUndo.run()}
});

/* ---------- Start ---------- */
updateLangLink();
updateProgress();
renderList();
route(false);
})();
</script>
</body>
</html>
