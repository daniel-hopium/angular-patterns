  status:'stable',
  refs:[[tx('Angular-Doku: RouterLinkActive','Angular docs: RouterLinkActive'),'https://angular.dev/guide/routing/read-route-state#detect-active-current-route-with-routerlinkactive'],
        [tx('Angular-Doku: Nur bei exakter Übereinstimmung','Angular docs: Only on exact matches'),'https://angular.dev/guide/routing/read-route-state#only-apply-routerlinkactive-on-exact-route-matches'],
        [tx('Angular-Doku: isActive()','Angular docs: isActive()'),'https://angular.dev/guide/routing/read-route-state#check-if-a-url-is-active']],
  rule:tx('Navigiere mit <code>&lt;a routerLink&gt;</code> – das ist ein echter Link mit <code>href</code>, der ohne Neuladen navigiert. Markiere die aktuelle Seite mit <code>routerLinkActive</code> <strong>und</strong> <code>ariaCurrentWhenActive="page"</code>, damit Screenreader sie auch ansagen. Für die Startseite brauchst du <code>{ exact: true }</code>, sonst ist sie immer aktiv.',
          'Navigate with <code>&lt;a routerLink&gt;</code> – a real link with <code>href</code> that navigates without reloading. Mark the current page with <code>routerLinkActive</code> <strong>and</strong> <code>ariaCurrentWhenActive="page"</code> so screen readers announce it too. The home link needs <code>{ exact: true }</code>, otherwise it’s always active.'),
  apis:[['routerLink','routerLink="/products" · [routerLink]="[\'/products\', id]"',tx('Setzt <code>href</code> und navigiert per Router. Strg-/Mittelklick öffnet wie gewohnt einen neuen Tab.','Sets <code>href</code> and navigates via the router. Ctrl/middle click opens a new tab as usual.')],
        ['routerLinkActive','routerLinkActive="active"',tx('Klassen, solange die URL des Links aktiv ist – standardmäßig als Teilpfad („subset“).','Classes while the link’s URL is active – by default as a partial path (“subset”).')],
        ['routerLinkActiveOptions','{ exact: true } | Partial<IsActiveMatchOptions>',tx('<code>exact</code>: Pfad und Query-Parameter müssen genau passen.','<code>exact</code>: path and query params must match exactly.')],
        ['ariaCurrentWhenActive','\'page\' | \'step\' | \'location\' | \'date\' | \'time\' | true | false',tx('Setzt <code>aria-current</code>, solange der Link aktiv ist.','Sets <code>aria-current</code> while the link is active.')],
        ['isActive()','isActive(url, router, matchOptions?): Signal<boolean>',tx('Seit Angular 21.1: dieselbe Prüfung als Signal im TypeScript-Code (Standard: subset). Ersetzt das deprecated <code>router.isActive()</code>.','Since Angular 21.1: the same check as a signal in TypeScript code (default: subset). Replaces the deprecated <code>router.isActive()</code>.')]],
  demo:`<div class="sim-grid router-links-top">
  <div class="sim-card"><h3>${tx('Template','Template')}</h3>
    <label class="check-row"><input type="checkbox" id="router-links-exact"> <code>[routerLinkActiveOptions]="{ exact: true }"</code> ${tx('bei Home','on home')}</label>
    <label class="check-row"><input type="checkbox" id="router-links-aria" checked> <code>ariaCurrentWhenActive="page"</code></label>
    <pre class="router-links-dom" id="router-links-dom" role="region" aria-label="${tx('Gerendertes HTML','Rendered HTML')}" tabindex="0"></pre>
  </div>
  <div class="sim-card"><h3>${tx('Browser','Browser')}</h3>
    ${NGRT.chrome('router-links')}
    <p class="hint router-links-sr" id="router-links-sr" aria-live="polite"></p>
    <p class="router-links-sig" id="router-links-sig"></p>
  </div>
</div>
<p class="demo-note">${tx('Probier: Klick dich durch die Links (auch per Tab und Enter). Ohne <code>exact</code> bleibt „Home“ immer markiert, weil <code>/</code> Teil jedes Pfads ist. Auf <code>/products/42</code> ist „Produkte“ ebenfalls aktiv – so soll es für Bereiche sein. Nimm <code>ariaCurrentWhenActive</code> weg: Sehende sehen die Markierung, der Screenreader sagt nichts mehr.','Try: click through the links (also with Tab and Enter). Without <code>exact</code>, “Home” stays marked, because <code>/</code> is part of every path. On <code>/products/42</code>, “Products” is active too – that’s how it should be for sections. Remove <code>ariaCurrentWhenActive</code>: sighted users see the marker, the screen reader says nothing anymore.')}</p>`,
  init(root){
    const R=NGRT;
    const LINKS=[['/','Home'],['/products',tx('Produkte','Products')],['/products/42',tx('Produkt 42','Product 42')],['/about',tx('Über uns','About')]];
    const view=$('#router-links-view',root),url=$('#router-links-url',root),tab=$('#router-links-tab',root);
    let alive=true,curUrl='/';
    const routes=[{path:'',pathMatch:'full',component:'Home'},{path:'products',component:'ProductList'},{path:'products/:id',component:'ProductDetail'},{path:'about',component:'About'},{path:'**',component:'NotFound'}];
    /* Wie isActive(): subset = Link-Segmente sind Anfang der aktuellen; exact = gleich (Query hier leer) */
    const active=(link,exact)=>{const a=R.parse(link).segs,b=R.parse(curUrl).segs;return exact?a.join('/')===b.join('/'):a.every((s,i)=>b[i]===s)};
    const render=()=>{
      const exact=$('#router-links-exact',root).checked,aria=$('#router-links-aria',root).checked;
      const on=LINKS.map(([h],i)=>active(h,i===0&&exact));
      view.innerHTML=`<nav aria-label="${tx('Hauptmenü','Main')}"><ul class="ngrt-nav">${LINKS.map(([h,t],i)=>`<li><a class="router-links-a${on[i]?' active':''}" href="${h}"${on[i]&&aria?' aria-current="page"':''}>${t}</a></li>`).join('')}</ul></nav><div class="ngrt-page"><h4>${esc(tab.textContent)}</h4></div>`;
      $('#router-links-dom',root).textContent=`<nav aria-label="Main">\n${LINKS.map(([h,t],i)=>`  <a href="${h}"${on[i]?' class="active"':''}${on[i]&&aria?' aria-current="page"':''}>`).join('\n')}\n</nav>`;
      const cur=LINKS.filter((_,i)=>on[i]).map(([,t])=>t);
      $('#router-links-sr',root).textContent=tx(`Screenreader auf den aktiven Links: ${cur.map(t=>`„${t}, Link${aria?', aktuelle Seite':''}“`).join(' · ')||'—'}`,`Screen reader on the active links: ${cur.map(t=>`“${t}, link${aria?', current page':''}”`).join(' · ')||'—'}`);
      $('#router-links-sig',root).innerHTML=`<code>isActive('/products', router)()</code> → <b class="${active('/products',false)?'ngrt-ok':'ngrt-bad'}">${active('/products',false)}</b>`;
    };
    const router=R.create({routes,on:ev=>{if(!alive||ev.type!=='NavigationEnd')return;curUrl=ev.url;url.value=ev.url;tab.textContent=ev.state.name;render()}});
    view.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;e.preventDefault();router.navigate(a.getAttribute('href')).then(()=>{if(alive)$(`a[href="${a.getAttribute('href')}"]`,view)?.focus()})});
    $('#router-links-bar',root).addEventListener('submit',e=>{e.preventDefault();router.navigate(url.value)});
    root.addEventListener('change',render);
    router.navigate('/products/42');
    return ()=>{alive=false;router.cancelAll()};
  },
  css:`.router-links-top{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.router-links-dom{margin:12px 0 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);font:500 .8125rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.router-links-a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);color:var(--brand);font-weight:700;text-decoration:none;border:1.5px solid transparent}
.router-links-a:hover{background:var(--surface-2)}.router-links-a.active{border-color:var(--brand);background:var(--brand-soft);text-decoration:underline;text-underline-offset:4px}
.router-links-sr{margin:10px 0 0}.router-links-sig{margin:8px 0 0;font-size:.875rem;overflow-wrap:anywhere}`,
  bad:{code:`<a href="/products"
   [class.active]=
     "router.url === '/products'">
  Products
</a>
<a (click)="router.navigate(['/about'])">
  About
</a>`,
    note:tx('<code>href</code> ohne <code>routerLink</code> lädt die ganze App neu. Der Vergleich mit <code>router.url</code> scheitert an Unterseiten und Query-Parametern, und es fehlt <code>aria-current</code>. Ein <code>&lt;a&gt;</code> ohne <code>href</code> ist per Tastatur nicht erreichbar und für Screenreader kein Link.','<code>href</code> without <code>routerLink</code> reloads the whole app. Comparing with <code>router.url</code> fails on sub-pages and query params, and <code>aria-current</code> is missing. An <code>&lt;a&gt;</code> without <code>href</code> can’t be reached by keyboard and isn’t a link for screen readers.')},
  good:{code:`<nav aria-label="Main">
  <a routerLink="/"
     routerLinkActive="active"
     [routerLinkActiveOptions]=
       "{ exact: true }"
     ariaCurrentWhenActive="page">
    Home</a>
  <a routerLink="/products"
     routerLinkActive="active"
     ariaCurrentWhenActive="page">
    Products</a>
</nav>

// imports: [RouterLink, RouterLinkActive]`,
    note:tx('Echte Links, Markierung und <code>aria-current</code> kommen aus derselben Prüfung. „Products“ bleibt auf Unterseiten aktiv, „Home“ nur auf <code>/</code>.','Real links, the marker and <code>aria-current</code> come from the same check. “Products” stays active on sub-pages, “Home” only on <code>/</code>.')},
  do:tx(['Für Navigation immer <code>&lt;a routerLink&gt;</code>, für Aktionen <code>&lt;button&gt;</code>.','<code>routerLinkActive</code> und <code>ariaCurrentWhenActive="page"</code> immer zusammen setzen.','<code>{ exact: true }</code> für die Startseite und alle Links, deren Pfad Präfix anderer Links ist.','Im TypeScript-Code <code>isActive(url, router)</code> statt eigenem Vergleich mit <code>router.url</code>.'],
        ['Always use <code>&lt;a routerLink&gt;</code> for navigation, <code>&lt;button&gt;</code> for actions.','Always set <code>routerLinkActive</code> and <code>ariaCurrentWhenActive="page"</code> together.','<code>{ exact: true }</code> for the home link and every link whose path is a prefix of other links.','In TypeScript code use <code>isActive(url, router)</code> instead of your own comparison with <code>router.url</code>.']),
  dont:tx(['Kein <code>(click)="router.navigate()"</code> auf <code>div</code>, <code>span</code> oder <code>a</code> ohne <code>href</code> für normale Navigation.','Aktiv nicht nur per Farbe zeigen – Unterstreichung, Rahmen oder Fettung dazu (und <code>aria-current</code>).','Nicht <code>router.isActive()</code> verwenden – die Methode ist deprecated.'],
        ['No <code>(click)="router.navigate()"</code> on <code>div</code>, <code>span</code> or an <code>a</code> without <code>href</code> for regular navigation.','Don’t show “active” by colour only – add an underline, border or bold (and <code>aria-current</code>).','Don’t use <code>router.isActive()</code> – the method is deprecated.']),
  why:tx('<p><code>routerLink</code> erzeugt aus deinem Pfad ein echtes <code>href</code> und fängt nur den normalen Linksklick ab. Alles, was Nutzer von Links erwarten – Tab-Reihenfolge, „In neuem Tab öffnen“, Link kopieren, Ansage als „Link“ – funktioniert dadurch ohne Zusatzaufwand.</p><p><code>routerLinkActive</code> prüft nach jeder Navigation, ob die URL des Links zur aktuellen passt. Standard ist „subset“: <code>/products</code> ist auch auf <code>/products/42</code> aktiv – für Bereiche genau richtig, für <code>/</code> falsch, denn das ist Teil jeder URL. Mit <code>ariaCurrentWhenActive</code> landet dieselbe Information als <code>aria-current="page"</code> im Accessibility Tree; ohne sie ist die Markierung nur visuell.</p>',
           '<p><code>routerLink</code> turns your path into a real <code>href</code> and only intercepts the normal link click. Everything users expect from links – tab order, “open in new tab”, copy link, being announced as “link” – works without extra effort.</p><p><code>routerLinkActive</code> checks after every navigation whether the link’s URL matches the current one. The default is “subset”: <code>/products</code> is also active on <code>/products/42</code> – exactly right for sections, wrong for <code>/</code>, which is part of every URL. With <code>ariaCurrentWhenActive</code> the same information ends up as <code>aria-current="page"</code> in the accessibility tree; without it the marker is visual only.</p>'),
  test:{code:`it('marks the current link', async () => {
  TestBed.configureTestingModule({ providers: [provideRouter(routes)] });
  const harness = await RouterTestingHarness.create();
  await harness.navigateByUrl('/products/42');
  // AppNav is rendered by a routed component or created with TestBed.createComponent
  const nav = TestBed.createComponent(AppNav);
  await nav.whenStable();
  const link = nav.nativeElement.querySelector('a[href="/products"]');
  expect(link.getAttribute('aria-current')).toBe('page');
});`,note:tx('Teste das Ergebnis im DOM – Klasse und <code>aria-current</code> –, nicht die Direktive selbst.','Test the result in the DOM – class and <code>aria-current</code> – not the directive itself.')}
});

LESSONS.push({
  id:'route-resolvers', cat:'router', order:50,
  title:tx('Resolver – oder lieber in der Komponente laden?','Resolvers – or rather load in the component?'),
  short:tx('Ein ResolveFn hält die Navigation an, bis die Daten da sind. Oft ist eine resource in der Komponente die bessere Wahl.','A ResolveFn holds the navigation until the data is there. Often a resource in the component is the better choice.'),
  keys:'resolver resolve ResolveFn data laden loading httpResource resource navigation blockiert blocking withNavigationErrorHandler NavigationError RedirectCommand skeleton',
  status:'stable',
  refs:[[tx('Angular-Doku: Navigation und Ladezeit','Angular docs: Navigation loading considerations'),'https://angular.dev/guide/routing/data-resolvers#navigation-loading-considerations'],
        [tx('Angular-Doku: Fehler in Resolvern','Angular docs: Error handling in resolvers'),'https://angular.dev/guide/routing/data-resolvers#error-handling-in-resolvers'],
        [tx('API: ResolveFn','API: ResolveFn'),'https://angular.dev/api/router/ResolveFn']],
  rule:tx('Ein Resolver läuft <strong>nach</strong> den Guards und <strong>vor</strong> dem Anzeigen der Seite – der Klick bleibt so lange ohne sichtbare Wirkung, bis die Daten da sind. Nimm ihn nur für schnelle, unverzichtbare Daten. Sonst navigiere sofort und lade in der Komponente mit <code>httpResource()</code> oder <code>resource()</code>, mit Skeleton und Fehlerzustand.',
          'A resolver runs <strong>after</strong> the guards and <strong>before</strong> the page is shown – the click has no visible effect until the data is there. Only use it for fast, essential data. Otherwise navigate right away and load in the component with <code>httpResource()</code> or <code>resource()</code>, with a skeleton and an error state.'),
  apis:[['ResolveFn<T>','(route, state) => MaybeAsync<T | RedirectCommand>',tx('Liefert Daten für die Route. Ein <code>RedirectCommand</code> leitet stattdessen um.','Returns data for the route. A <code>RedirectCommand</code> redirects instead.')],
        ['resolve','{ path, resolve: { product: productResolver } }',tx('Das Ergebnis landet in <code>data</code> – und mit <code>withComponentInputBinding()</code> im Input <code>product</code>.','The result ends up in <code>data</code> – and with <code>withComponentInputBinding()</code> in the <code>product</code> input.')],
        ['withNavigationErrorHandler()','withNavigationErrorHandler((e: NavigationError) => unknown | RedirectCommand)',tx('Zentrale Stelle für Navigationsfehler, z. B. einen werfenden Resolver. Ein <code>RedirectCommand</code> macht aus dem Fehler eine Umleitung.','Central place for navigation errors, e.g. a throwing resolver. A <code>RedirectCommand</code> turns the error into a redirect.')],
        ['httpResource()','httpResource<T>(() => url)',tx('Stabil seit Angular 22: lädt reaktiv, sobald sich die URL ändert, mit <code>value()</code>, <code>isLoading()</code>, <code>error()</code>.','Stable since Angular 22: loads reactively whenever the URL changes, with <code>value()</code>, <code>isLoading()</code>, <code>error()</code>.')]],
  demo:`<div class="sim-card route-resolvers-ctl"><h3>${tx('Versuch','Experiment')}</h3>
  <div class="route-resolvers-opts">
    <label class="check-row"><input type="checkbox" id="route-resolvers-fail"> ${tx('API antwortet mit HTTP 500','API responds with HTTP 500')}</label>
    <label class="check-row"><input type="checkbox" id="route-resolvers-handler"> <code>withNavigationErrorHandler</code> → <code>RedirectCommand('/error')</code></label>
  </div>
  <div class="sim-row"><button type="button" class="btn btn-primary" id="route-resolvers-go">${tx('Produkt 42 öffnen (beide)','Open product 42 (both)')}</button><button type="button" class="btn btn-secondary" id="route-resolvers-home">${tx('Zurück zur Startseite','Back to home')}</button></div>
</div>
<div class="sim-grid route-resolvers-two">
  <div class="sim-card"><h3>${tx('A: mit Resolver','A: with resolver')}</h3>${NGRT.chrome('route-resolvers-a')}<div class="route-resolvers-busy" id="route-resolvers-busy-a" hidden><div class="ngrt-busy"></div></div><p class="route-resolvers-t" id="route-resolvers-t-a" aria-live="polite"></p></div>
  <div class="sim-card"><h3>${tx('B: httpResource in der Komponente','B: httpResource in the component')}</h3>${NGRT.chrome('route-resolvers-b')}<div class="route-resolvers-busy" id="route-resolvers-busy-b" hidden><div class="ngrt-busy"></div></div><p class="route-resolvers-t" id="route-resolvers-t-b" aria-live="polite"></p></div>
</div>
<p class="demo-note">${tx('Probier: Klick „Produkt 42 öffnen“ und beobachte beide Seiten. A bleibt über eine Sekunde auf der Startseite – nur der dünne Balken zeigt, dass etwas passiert. B zeigt sofort die Produktseite mit Skeleton. Schalte den Fehler ein: A bleibt ohne Handler auf der alten Seite hängen (NavigationError), B zeigt den Fehler dort, wo die Daten fehlen.','Try: click “Open product 42” and watch both sides. A stays on the home page for over a second – only the thin bar shows something is happening. B shows the product page right away with a skeleton. Turn on the error: without a handler A stays stuck on the old page (NavigationError), B shows the error where the data is missing.')}</p>`,
  init(root){
    const R=NGRT,MS=1200;
    const fail=()=>$('#route-resolvers-fail',root).checked;
    let t0=0,alive=true;const timers=[];
    const ms=()=>Math.round(performance.now()-t0);
    const page=(k,html)=>{$(`#route-resolvers-${k}-view`,root).innerHTML=html};
    const setUrl=(k,s)=>{$(`#route-resolvers-${k}-url`,root).value=s.url;$(`#route-resolvers-${k}-tab`,root).textContent=s.name};
    const productHTML=p=>`<div class="ngrt-page"><h4>${esc(p.name)}</h4><p>${esc(p.price)}</p></div>`;
    const P={name:tx('Wanderschuh „Gipfel“','Hiking boot “Summit”'),price:'€ 129,00'};
    const note=(k,t)=>{const p=$(`#route-resolvers-t-${k}`,root);p.textContent=t};
    const busy=(k,on)=>{$(`#route-resolvers-busy-${k}`,root).hidden=!on};
    /* A: Resolver hält die Navigation an */
    const productResolver=async()=>{await R.wait(MS);if(fail())throw new Error('HttpErrorResponse: 500 Internal Server Error');return P};
    const routesA=[{path:'',pathMatch:'full',component:'Home'},{path:'products/:id',component:'ProductDetail',resolve:{product:productResolver}},{path:'error',component:'ErrorPage'}];
    const ra=R.create({routes:routesA,onError:()=>$('#route-resolvers-handler',root).checked?R.redirectCommand('/error'):undefined,on:ev=>{
      if(!alive)return;
      if(ev.type==='NavigationStart')busy('a',true);
      if(ev.type==='NavigationEnd'){busy('a',false);setUrl('a',ev.state);
        if(ev.state.name==='ProductDetail'){page('a',productHTML(ev.state.data.product));note('a',tx(`Seite sichtbar nach ${ms()} ms – mit Daten.`,`Page visible after ${ms()} ms – with data.`))}
        else if(ev.state.name==='ErrorPage'){page('a',`<div class="ngrt-page"><h4>${tx('Da ging etwas schief','Something went wrong')}</h4></div>`);note('a',tx(`Fehler → Umleitung nach ${ms()} ms.`,`Error → redirect after ${ms()} ms.`))}
        else page('a',`<div class="ngrt-page"><h4>Home</h4></div>`)}
      if(ev.type==='NavigationError'){busy('a',false);note('a',tx(`NavigationError nach ${ms()} ms – du bleibst auf der Startseite, ohne Hinweis.`,`NavigationError after ${ms()} ms – you stay on the home page, without any hint.`))}
      if(ev.type==='NavigationCancel')busy('a',false);
    }});
    /* B: sofort navigieren, Daten in der Komponente laden */
    const routesB=[{path:'',pathMatch:'full',component:'Home'},{path:'products/:id',component:'ProductDetail'}];
    let loadId=0;
    const rb=R.create({routes:routesB,on:ev=>{
      if(!alive||ev.type!=='NavigationEnd')return;
      setUrl('b',ev.state);
      if(ev.state.name!=='ProductDetail'){loadId++;busy('b',false);page('b',`<div class="ngrt-page"><h4>Home</h4></div>`);return}
      const my=++loadId;
      page('b',`<div class="ngrt-page route-resolvers-skel" aria-busy="true"><span></span><span></span><p class="sr-only">${tx('Lädt …','Loading …')}</p></div>`);
      note('b',tx(`Seite sichtbar nach ${ms()} ms – Daten laden …`,`Page visible after ${ms()} ms – loading data …`));
      timers.push(setTimeout(()=>{
        if(!alive||my!==loadId)return;
        if(fail()){page('b',`<div class="ngrt-page"><h4>ProductDetail</h4><p class="ngrt-bad">${tx('Produkt konnte nicht geladen werden.','Could not load the product.')}</p></div>`);note('b',tx(`Fehler nach ${ms()} ms – angezeigt direkt auf der Seite.`,`Error after ${ms()} ms – shown right on the page.`))}
        else{page('b',productHTML(P));note('b',tx(`Daten da nach ${ms()} ms.`,`Data there after ${ms()} ms.`))}
      },MS));
    }});
    root.addEventListener('click',e=>{
      if(e.target.closest('#route-resolvers-go')){t0=performance.now();note('a','');note('b','');ra.navigate('/products/42');rb.navigate('/products/42')}
      if(e.target.closest('#route-resolvers-home')){note('a','');note('b','');ra.navigate('/');rb.navigate('/')}
    });
    ['a','b'].forEach(k=>$(`#route-resolvers-${k}-bar`,root).addEventListener('submit',e=>{e.preventDefault();t0=performance.now();(k==='a'?ra:rb).navigate($(`#route-resolvers-${k}-url`,root).value)}));
    ra.navigate('/');rb.navigate('/');
    return ()=>{alive=false;ra.cancelAll();rb.cancelAll();timers.forEach(clearTimeout)};
  },
  css:`.route-resolvers-opts{display:flex;flex-wrap:wrap;gap:0 20px;margin-bottom:8px}.route-resolvers-two{margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.route-resolvers-t{margin:10px 0 0;font-size:.875rem;font-weight:700;min-height:2.9em}
.route-resolvers-skel span{display:block;height:14px;border-radius:4px;background:var(--surface-2);margin:0 0 10px;border:1px solid var(--line)}
.route-resolvers-skel span:first-child{height:20px;width:70%}.route-resolvers-skel span:nth-child(2){width:40%}
@media (prefers-reduced-motion:no-preference){.route-resolvers-skel span{animation:route-resolvers-pulse 1s ease-in-out infinite alternate}}
@keyframes route-resolvers-pulse{to{opacity:.4}}`,
  bad:{code:`export const productResolver:
  ResolveFn<Product> = route =>
    inject(ProductApi).load(
      route.paramMap.get('id')!);

{ path: 'products/:id',
  component: ProductDetail,
  resolve: { product: productResolver } }
// slow API = dead click, no feedback;
// an error = NavigationError, user stuck`,
    note:tx('Bei einer langsamen API passiert nach dem Klick sekundenlang nichts Sichtbares. Wirft der Resolver, bricht die Navigation ab – ohne eigenen Handler bleibt der Nutzer ratlos auf der alten Seite.','With a slow API nothing visible happens for seconds after the click. If the resolver throws, the navigation is cancelled – without a handler of your own, the user is left puzzled on the old page.')},
  good:{code:`export class ProductDetail {
