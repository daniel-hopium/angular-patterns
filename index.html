<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Angular-Patterns</title>
<meta name="description" content="Modernes Angular zum Anfassen: Signals, Control Flow, RxJS, Forms und Router – jedes Muster mit „So nicht – so“ und einer Live-Simulation.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --anno:#A3135F; --anno-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --ph-bad:#A3A3A3;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#6D28D9; --brand-ink-l:#FFFFFF; --brand-soft-l:#F1EAFE;
  --brand-d:#C4B5FD; --brand-ink-d:#1E0B4B; --brand-soft-d:#221638;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --anno:#FF7AB8; --anno-ink:#2A0717;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --ph-bad:#555B64;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --anno:#FF7AB8; --anno-ink:#2A0717;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --ph-bad:#555B64;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Switch */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;background:transparent;border:0;border-radius:var(--radius-ctl);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.switch:hover{background:var(--surface-2)}
.track{width:42px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color .15s;flex:none}
.thumb{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch[aria-checked="true"] .track{background:var(--brand)}
.switch[aria-checked="true"] .thumb{transform:translateX(16px);background:var(--brand-ink)}

/* Segmented control */
.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-weight:700;padding:0;margin-bottom:8px}
.seg-opts{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface)}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:.9375rem}
.seg label:hover{background:var(--surface-2)}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.progress{display:grid;gap:6px;position:relative}
.progress-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>span{display:block;height:100%;width:var(--p,0%);background:var(--brand);transition:width .3s}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.lessons-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;position:relative}
.refs li{font:600 .75rem/1.2 var(--font-mono);padding:5px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--muted);background:var(--surface)}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:0;position:relative}
@container (min-width:620px){.numbers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.num{background:var(--surface);padding:14px 16px}
.num dt{font:600 1.0625rem/1.3 var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num dd{margin:5px 0 0;font-size:.875rem;color:var(--muted);line-height:1.4}
.demo{margin-top:40px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);position:relative}
.demo-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.lesson .demo-head h2{margin:0;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase}
.demo-head span{font-size:.875rem;color:var(--muted)}
.demo-body{padding:20px 18px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;min-width:0}
.demo-body h3{font:700 1rem/1.3 var(--font-body);margin:0 0 10px}
.demo-note{font-size:.875rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:40px;position:relative}
.dd{border-top:4px solid var(--success);padding-top:12px}
.dd.dont{border-top-color:var(--danger)}
.lesson .dd h2{display:flex;align-items:center;gap:8px;font:700 1rem/1.3 var(--font-body);margin:0 0 10px;color:var(--success)}
.lesson .dd.dont h2{color:var(--danger)}
.dd ul{margin:0;padding-left:1.15em;display:grid;gap:8px}
.prose p{margin:0 0 12px;max-width:68ch}
.here{margin-top:40px;padding:16px 18px 18px;background:var(--brand-soft);border-radius:var(--radius-lg);position:relative}
.lesson .here h2{margin:0 0 6px;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.here p{margin:0;max-width:68ch}
.learned{margin-top:32px;display:flex;align-items:center;gap:12px;padding:10px 16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);position:relative;min-height:56px}
.learned input{width:24px;height:24px;accent-color:var(--brand);margin:0;flex:none}
.learned label{font-weight:700;cursor:pointer;flex:1}
.learned .hint{display:block;font-weight:400}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Tags used in comparisons */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;margin:0 0 8px}
.tag .ic{width:18px;height:18px}
.tag-good{color:var(--success)}
.tag-bad{color:var(--danger)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.compare figure{margin:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);min-width:0}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.start-grid.sisters{margin-top:12px}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.anatomy{margin:0;padding-left:1.4em;display:grid;gap:6px}
.anatomy li::marker{font-family:var(--font-mono);color:var(--muted)}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chapters a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-weight:700}
.chapters a:hover{color:var(--brand)}
.chapters span{font-weight:400;color:var(--muted);font-family:var(--font-mono);font-size:.875rem;white-space:nowrap}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.kb-table{width:100%;border-collapse:collapse;font-size:.9375rem}
.kb-table th,.kb-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kb-table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}

/* ---------- Sprache ----------

  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
  wifioff:'<path d="M3 3l18 18M8.5 16.3a5 5 0 016.2-.6M5 12.6a10 10 0 014.6-2.6M19 12.6a10 10 0 00-2.4-1.8M2 8.8a15 15 0 014-2.5M22 8.8A15 15 0 0011.5 5M12 20h.01"/>'
};
const ic=(n,cls='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="ic ${cls}">${P[n]}</svg>`;

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.dataset.anno='Toast';
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label',tx('Meldung schließen','Close message'));closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} ${tx('mit Strg plus Z','with Ctrl plus Z')}.`:''),type==='error');
  return close;
}
function focusMainHeading(){const h=$('#lesson-title');if(h)h.focus({preventScroll:true})}

/* ---------- Kapitel ---------- */
const CHAPTERS=[
  {id:'signals',title:tx('Signals','Signals')},
  {id:'components',title:tx('Komponenten','Components')},
  {id:'templates',title:tx('Templates & Control Flow','Templates & control flow')},
  {id:'di',title:tx('Dependency Injection','Dependency injection')},
  {id:'rxjs',title:tx('RxJS & HTTP','RxJS & HTTP')},
  {id:'forms',title:tx('Forms','Forms')},
  {id:'router',title:tx('Router','Router')},
  {id:'perf',title:tx('Performance & Architektur','Performance & architecture')}
];
const LESSONS=[];
/* ---------- Mini-Signals für die Simulationen ----------
   Nachbau der Signal-Semantik von Angular, damit die Demos ohne Build laufen: computed() rechnet lazy und
   merkt sich das Ergebnis, effect() läuft gebündelt und asynchron (hier als Microtask), gleiche Werte
   (Object.is oder eigenes equal) lösen nichts aus. Kein Angular – nur so viel, wie zum Zeigen nötig ist. */
const NG=(()=>{
  let active=null,flushing=false;
  const listeners=new Set(),queue=new Set();
  const emit=(type,node,extra={})=>listeners.forEach(f=>{try{f({type,name:node.name,...extra})}catch(e){}});
  function track(n){if(active){active.deps.set(n,n.version);n.subs.add(active)}}
  function markDirty(n){for(const s of [...n.subs]){if(s.kind==='computed'){if(!s.dirty){s.dirty=true;markDirty(s)}}else schedule(s)}}
  function schedule(e){if(e.destroyed)return;queue.add(e);if(!flushing){flushing=true;queueMicrotask(flush)}}
  function flush(){flushing=false;const es=[...queue];queue.clear();es.forEach(e=>{if(!e.destroyed&&(e.first||changed(e)))runEffect(e)})}
  /* Hat sich eine Abhängigkeit wirklich geändert? Vorgelagerte computeds werden dabei erst nachgerechnet. */
  function changed(n){for(const [d,v] of n.deps){if(d.kind==='computed')refresh(d);if(d.version!==v)return true}return false}
  function run(n,fn){for(const d of n.deps.keys())d.subs.delete(n);n.deps=new Map();const prev=active;active=n;try{return fn()}finally{active=prev}}
  function refresh(c){
    if(c.init&&!c.dirty)return;
    if(c.init&&!changed(c)){c.dirty=false;return}
    c.dirty=false;
    let v,err=null;try{v=run(c,c.fn)}catch(e){err=e}
    const same=c.init&&!err&&!c.error&&c.equal(c.value,v);
    c.init=true;c.error=err;
    if(!same){c.value=v;c.version++}
    emit('compute',c,{value:v,same,error:err});
  }
  function runEffect(e){
    e.first=false;
    e.cleanups.splice(0).forEach(f=>f());
    run(e,()=>e.fn(f=>e.cleanups.push(f)));
    emit('effect',e);
  }
  function signal(value,{name='signal',equal=Object.is}={}){
    const n={kind:'signal',name,value,version:0,subs:new Set(),equal};
    const get=()=>{track(n);return n.value};
    get.set=v=>{if(n.equal(n.value,v)){emit('same',n,{value:v});return}n.value=v;n.version++;emit('set',n,{value:v});markDirty(n)};
    get.update=f=>get.set(f(n.value));
    get.asReadonly=()=>()=>get();
    get.node=n;
    return get;
  }
  function computed(fn,{name='computed',equal=Object.is}={}){
    const c={kind:'computed',name,fn,value:undefined,version:0,subs:new Set(),deps:new Map(),dirty:true,init:false,equal,error:null};
    const get=()=>{refresh(c);track(c);if(c.error)throw c.error;return c.value};
    get.node=c;
    return get;
  }
  function effect(fn,{name='effect'}={}){
    const e={kind:'effect',name,fn,deps:new Map(),cleanups:[],first:true,destroyed:false};
    schedule(e);
    return {destroy(){e.destroyed=true;e.cleanups.splice(0).forEach(f=>f());for(const d of e.deps.keys())d.subs.delete(e);queue.delete(e)}};
  }
  function untracked(fn){const prev=active;active=null;try{return fn()}finally{active=prev}}
  /* Beobachter für die Visualisierung: bekommt {type:'set'|'same'|'compute'|'effect', name, value, same} */
  const watch=f=>{listeners.add(f);return ()=>listeners.delete(f)};
  /* Kleine Helfer für Demos */
  const log=(ul,html,max=40)=>{const li=document.createElement('li');li.innerHTML=html;ul.append(li);while(ul.children.length>max)ul.firstElementChild.remove();ul.scrollTop=ul.scrollHeight};
  const flash=el=>{if(!el)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');clearTimeout(el._ft);el._ft=setTimeout(()=>el.classList.remove('flash'),reducedMotion()?300:900)};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Helfer für die Kapitel „Templates“ und „Performance“ ----------
   TPL.reconcile: Nachbau des Listen-Abgleichs von @for mit track. Knoten mit gleichem Schlüssel werden
   wiederverwendet (und nur verschoben, wenn nötig), neue Schlüssel erzeugen Knoten, fehlende werden zerstört.
   TPL.tree: Nachbau der Change Detection über einen Komponentenbaum – Dirty-Flag (Events, markForCheck,
   async-Pipe, neue Inputs), Refresh-Flag (Signal im Template) und die Unterscheidung „global“/„gezielt“,
   die Angular seit v17 für Signals nutzt. Kein Angular – nur so viel, wie die Demos zeigen. */
const TPL=(()=>{
  /* Längste aufsteigende Teilfolge: diese Knoten bleiben stehen, alle anderen werden verschoben */
  function lis(a){
    const p=a.slice(),r=[];
    for(let i=0;i<a.length;i++){
      let lo=0,hi=r.length;
      while(lo<hi){const m=(lo+hi)>>1;if(a[r[m]]<a[i])lo=m+1;else hi=m}
      if(lo>0)p[i]=r[lo-1];
      r[lo]=i;
    }
    let u=r.length,v=r[u-1];const out=new Set();
    while(u-->0){out.add(v);v=p[v]}
    return out;
  }
  /* container: Element; items: Array; key(item,i) → Schlüssel; create(item,i) → Element; update(el,item,i,n) */
  function reconcile(container,items,key,create,update){
    const old=container._tpl||[];
    const byKey=new Map();old.forEach((r,i)=>{r.oldIndex=i;byKey.set(r.key,r)});
    const next=[],st={created:0,moved:0,reused:0,destroyed:0,createdKeys:[],movedKeys:[]};
    items.forEach((item,i)=>{
      const k=key(item,i);
      let r=byKey.get(k);
      if(r){byKey.delete(k);r.fresh=false;st.reused++}
      else{r={key:k,el:create(item,i),fresh:true,oldIndex:-1};st.created++;st.createdKeys.push(k)}
      next.push(r);
    });
    byKey.forEach(r=>{r.el.remove();st.destroyed++});
    const reusedIdx=[],reusedPos=[];
    next.forEach((r,i)=>{if(!r.fresh){reusedIdx.push(r.oldIndex);reusedPos.push(i)}});
    const keep=new Set([...lis(reusedIdx)].map(j=>reusedPos[j]));
    for(let i=next.length-1;i>=0;i--){
      const r=next[i],after=next[i+1]?.el||null;
      if(r.fresh||!keep.has(i)){
        if(!r.fresh){st.moved++;st.movedKeys.push(r.key)}
        container.insertBefore(r.el,after);
      }
    }
    next.forEach((r,i)=>update(r.el,items[i],i,items.length,r.fresh));
    container._tpl=next;
    return st;
  }
  /* ---------- Change-Detection-Baum ---------- */
  function tree(spec,parent=null){
    const n={name:spec.name,label:spec.label||spec.name,parent,strategy:spec.strategy||'onpush',dirty:false,refresh:false,hasChild:false,checks:0,children:[]};
    n.children=(spec.children||[]).map(c=>tree(c,n));
    return n;
  }
  const walk=(n,f)=>{f(n);n.children.forEach(c=>walk(c,f))};
  const find=(root,name)=>{let hit=null;walk(root,n=>{if(n.name===name)hit=n});return hit};
  /* Event im Template, markForCheck(), async-Pipe: Komponente UND alle Vorfahren werden dirty */
  function markViewDirty(n){for(let x=n;x;x=x.parent)x.dirty=true}
  /* Signal im Template geändert: nur diese Komponente wird neu gerendert, Vorfahren werden nur durchlaufen */
  function markSignal(n){n.refresh=true;for(let x=n.parent;x;x=x.parent)x.hasChild=true}
  /* ApplicationRef.tick(): beforeRefresh(n) läuft, bevor die Kinder dran sind (dort setzt die Demo neue Inputs) */
  function tick(root,beforeChildren){
    const checked=[],visited=[];
    function detect(n,mode){
      visited.push(n);
      const should=(mode==='global'&&(n.strategy==='eager'||n.dirty))||n.refresh;
      if(should){
        n.checks++;checked.push(n);
        beforeChildren?.(n);
        n.dirty=false;n.refresh=false;n.hasChild=false;
        n.children.forEach(c=>detect(c,'global'));
      }else if(n.hasChild){
        n.hasChild=false;
        n.children.forEach(c=>detect(c,'targeted'));
      }
    }
    detect(root,'global');
    return {checked,visited};
  }
  /* Segmented Control (Radiogruppe) im Stil der App */
  const seg=(name,legend,opts,checked)=>`<fieldset class="seg"><legend>${legend}</legend><div class="seg-opts">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}"${v===checked?' checked':''}>${l}</label>`).join('')}</div></fieldset>`;
  return {reconcile,tree,walk,find,markViewDirty,markSignal,tick,seg};
})();

  init(root){

    note:tx('Drei klassische Timing-Fehler auf einmal: Input zu früh gelesen, <code>effect()</code> außerhalb des Injection Context, DOM-Zugriff in einem Hook, der auch auf dem Server läuft.','Three classic timing mistakes at once: input read too early, <code>effect()</code> outside the injection context, DOM access in a hook that also runs on the server.')},
  good:{code:`export class UserCard {

}`,
    note:tx('Alles Registrieren passiert im Konstruktor, ausgeführt wird zur richtigen Zeit: der Effect nach dem Setzen der Inputs, der Chart-Aufbau nach dem ersten Rendern und nur im Browser, das Aufräumen beim Zerstören. <code>ngOnInit</code> brauchst du nur noch für Logik, die einmalig mit den ersten Input-Werten laufen soll.','All registering happens in the constructor, execution happens at the right time: the effect after the inputs are set, the chart setup after the first render and only in the browser, the cleanup on destroy. You only need <code>ngOnInit</code> for logic that should run once with the first input values.')},
  do:tx(['<code>inject()</code> als Feld-Initialisierer statt Konstruktor-Parameter.','<code>afterNextRender</code> für einmalige DOM-Arbeit (Bibliothek initialisieren, Fokus setzen, messen) – mit <code>write</code>/<code>read</code>-Phasen.','<code>DestroyRef.onDestroy</code> nutzen, wenn Aufräumen neben dem Anlegen stehen soll – auch in Services und Hilfsfunktionen.','Für Observables <code>takeUntilDestroyed()</code> (siehe Kapitel RxJS).'],
        ['Use <code>inject()</code> as a field initializer instead of constructor parameters.','Use <code>afterNextRender</code> for one-off DOM work (initialise a library, set focus, measure) – with <code>write</code>/<code>read</code> phases.','Use <code>DestroyRef.onDestroy</code> when cleanup should sit next to setup – also in services and helper functions.','For observables use <code>takeUntilDestroyed()</code> (see the RxJS chapter).']),
  dont:tx(['Keine Inputs im Konstruktor lesen – Pflicht-Inputs werfen dort NG0950.','Kein <code>effect()</code>, <code>inject()</code> oder <code>afterNextRender()</code> in <code>ngOnInit</code> oder Methoden ohne <code>injector</code>-Option.','Kein DOM-Zugriff in <code>ngOnInit</code> oder <code>ngAfterViewInit</code>, wenn die App auch serverseitig rendert.','<code>afterRender</code> gibt es nicht mehr – seit Angular 20 heißt es <code>afterEveryRender</code>, und meist ist <code>afterRenderEffect</code> die bessere Wahl.'],
        ['Don’t read inputs in the constructor – required inputs throw NG0950 there.','No <code>effect()</code>, <code>inject()</code> or <code>afterNextRender()</code> in <code>ngOnInit</code> or methods without the <code>injector</code> option.','No DOM access in <code>ngOnInit</code> or <code>ngAfterViewInit</code> if the app also renders on the server.','<code>afterRender</code> no longer exists – since Angular 20 it’s called <code>afterEveryRender</code>, and <code>afterRenderEffect</code> is usually the better choice.']),
  why:tx('<p>Beim Erzeugen läuft zuerst der Konstruktor – Angular hat die Instanz gebaut, aber das Template des Elternteils hat noch keine Werte hineingeschrieben. Danach setzt die Change Detection des Elternteils die Inputs und ruft <code>ngOnChanges</code>/<code>ngOnInit</code> auf; Effects der Komponente laufen im selben Durchgang, bevor ihr eigenes Template geprüft wird. Erst wenn die ganze Anwendung gerendert ist, kommen <code>afterNextRender</code> und <code>afterRenderEffect</code> – und auch nur im Browser, weil es auf dem Server kein echtes DOM gibt.</p><p>Die Render-Phasen (<code>earlyRead</code>, <code>write</code>, <code>mixedReadWrite</code>, <code>read</code>) bündeln DOM-Lese- und -Schreibzugriffe aller Komponenten, damit der Browser das Layout nicht ständig neu berechnen muss. <code>DestroyRef</code> ersetzt <code>ngOnDestroy</code> nicht, macht Aufräumen aber dort möglich, wo etwas angelegt wird.</p>',
           '<p>On creation the constructor runs first – Angular has built the instance, but the parent’s template hasn’t written any values into it yet. Then the parent’s change detection sets the inputs and calls <code>ngOnChanges</code>/<code>ngOnInit</code>; the component’s effects run in the same pass, before its own template is checked. Only when the whole application has rendered do <code>afterNextRender</code> and <code>afterRenderEffect</code> follow – and only in the browser, because there is no real DOM on the server.</p><p>The render phases (<code>earlyRead</code>, <code>write</code>, <code>mixedReadWrite</code>, <code>read</code>) batch DOM reads and writes of all components, so the browser doesn’t have to recalculate layout constantly. <code>DestroyRef</code> doesn’t replace <code>ngOnDestroy</code>, but it makes cleanup possible right where something is set up.</p>'),
  test:{code:`it('cleans up its timer on destroy', () => {
  vi.useFakeTimers();
  const users = { ping: vi.fn() };
  TestBed.configureTestingModule({ providers: [{ provide: UserService, useValue: users }] });

  const fixture = TestBed.createComponent(UserCard);
  fixture.componentRef.setInput('userId', 7);
  fixture.destroy();                       // runs the DestroyRef callbacks

  vi.advanceTimersByTime(60_000);
  expect(users.ping).not.toHaveBeenCalled();
  vi.useRealTimers();
});`,note:tx('Mit den Fake-Timern von Vitest prüfst du, dass nach <code>fixture.destroy()</code> nichts mehr läuft – ganz ohne zone.js.','With Vitest’s fake timers you check that nothing runs after <code>fixture.destroy()</code> – without zone.js.')}
});

LESSONS.push({
  id:'content-projection', cat:'components', order:40,
  title:tx('Content Projection mit ng-content','Content projection with ng-content'),
  short:tx('Komponenten mit Slots: ng-content mit select verteilt den Inhalt des Elternteils, Fallback-Inhalt füllt leere Slots.','Components with slots: ng-content with select distributes the parent’s content, fallback content fills empty slots.'),
  keys:'ng-content content projection slot select fallback ngprojectas projektion karte card inhalt',
  status:'stable',
  refs:[[tx('Angular-Doku: Mehrere Platzhalter','Angular docs: Multiple content placeholders'),'https://angular.dev/guide/components/content-projection#multiple-content-placeholders'],
        [tx('Angular-Doku: Fallback content','Angular docs: Fallback content'),'https://angular.dev/guide/components/content-projection#fallback-content'],
        [tx('Angular-Doku: Caveats','Angular docs: Caveats'),'https://angular.dev/guide/components/content-projection#caveats']],
  rule:tx('Statt Texte und Buttons als Inputs durchzureichen, lass den Elternteil Markup <em>hineinlegen</em>: <code>&lt;ng-content /&gt;</code> ist der Platzhalter, <code>select</code> macht benannte Slots. Jeder Knoten landet im ersten Slot, dessen Selektor passt, sonst im Slot ohne <code>select</code>. Inhalt zwischen <code>&lt;ng-content&gt;…&lt;/ng-content&gt;</code> erscheint, wenn der Slot leer bleibt.','Instead of passing texts and buttons down as inputs, let the parent <em>put markup in</em>: <code>&lt;ng-content /&gt;</code> is the placeholder, <code>select</code> creates named slots. Each node lands in the first slot whose selector matches, otherwise in the slot without <code>select</code>. Content between <code>&lt;ng-content&gt;…&lt;/ng-content&gt;</code> shows when the slot stays empty.'),
  apis:[['<ng-content />','<ng-content />',tx('Standard-Slot: nimmt alles, was keinem anderen Slot zugeordnet ist.','Default slot: takes everything not assigned to another slot.')],
        ['select','<ng-content select="[card-title]" />',tx('Benannter Slot per CSS-Selektor: Element, Attribut, Klasse oder Kombinationen davon.','Named slot via CSS selector: element, attribute, class or combinations.')],
        ['Fallback','<ng-content select="h3">Untitled</ng-content>',tx('Statischer Ersatzinhalt, wenn nichts in den Slot projiziert wird (seit Angular 18).','Static replacement content when nothing is projected into the slot (since Angular 18).')],
        ['ngProjectAs','<ng-container ngProjectAs="[card-title]">',tx('Lässt ein Element für die Zuordnung als etwas anderes gelten – nur statische Werte.','Makes an element count as something else for matching – static values only.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Inhalt vom Elternteil','Content from the parent')}</h3>
    <div class="content-projection-src">
      <label class="check-row"><input type="checkbox" data-k="title" checked> <span><code>&lt;h3 card-title&gt;</code></span></label>
      <label class="check-row"><input type="checkbox" data-k="text" checked> <span><code>&lt;p&gt;</code> ${tx('Text','text')}</span></label>
      <label class="check-row"><input type="checkbox" data-k="fine"> <span><code>&lt;p class="fine"&gt;</code></span></label>
      <label class="check-row"><input type="checkbox" data-k="actions" checked> <span><code>&lt;app-card-actions&gt;</code></span></label>
    </div>
    <label class="check-row content-projection-def"><input type="checkbox" id="content-projection-def" checked> <span>${tx('Karte hat Standard-Slot <code>&lt;ng-content /&gt;</code>','Card has default slot <code>&lt;ng-content /&gt;</code>')}</span></label>
  </div>
  <div class="sim-card"><h3>${tx('Gerenderte Karte','Rendered card')}</h3>
    <div class="content-projection-card" id="content-projection-card"></div>
  </div>
  <div class="sim-card"><h3>${tx('Zuordnung','Matching')}</h3>
    <pre class="content-projection-tpl" id="content-projection-tpl"></pre>
    <ul class="sim-log" id="content-projection-log" aria-label="${tx('Zuordnung der Knoten','Node matching')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Nimm den Titel weg – der Fallback „Ohne Titel“ erscheint. Nimm den Standard-Slot weg: Die Absätze passen zu keinem Selektor mehr und werden gar nicht gerendert. Die Aktionen landen immer unten, egal in welcher Reihenfolge der Elternteil sie schreibt.','Try: remove the title – the fallback “Untitled” appears. Remove the default slot: the paragraphs no longer match any selector and aren’t rendered at all. The actions always end up at the bottom, no matter in which order the parent writes them.')}</p>`,
  init(root){
    const {log}=NG;
    const ul=$('#content-projection-log',root);
    /* Inhalt des Elternteils in Quellreihenfolge (Aktionen bewusst vor dem Text) */
    const NODES=[
      {k:'title',tag:'h3',attrs:['card-title'],cls:[],src:'<h3 card-title>',html:tx('Angebot der Woche','Deal of the week')},
      {k:'actions',tag:'app-card-actions',attrs:[],cls:[],src:'<app-card-actions>',html:`<span class="btn btn-primary">${tx('Kaufen','Buy')}</span>`},
      {k:'text',tag:'p',attrs:[],cls:[],src:'<p>',html:tx('Kaffeebohnen aus Kolumbien, frisch geröstet.','Coffee beans from Colombia, freshly roasted.')},
      {k:'fine',tag:'p',attrs:[],cls:['fine'],src:'<p class="fine">',html:tx('Solange der Vorrat reicht.','While stocks last.')}
    ];
    /* Mini-Selektor wie in Angular: Element, [Attribut] oder .klasse */
    const matches=(n,sel)=>sel.startsWith('[')?n.attrs.includes(sel.slice(1,-1)):sel.startsWith('.')?n.cls.includes(sel.slice(1)):n.tag===sel;
    const render=()=>{
      const on=new Set($$('.content-projection-src input:checked',root).map(i=>i.dataset.k));
      const hasDef=$('#content-projection-def',root).checked;
      const slots=[{sel:'[card-title]',fallback:tx('Ohne Titel','Untitled'),items:[]},{sel:null,items:[]},{sel:'app-card-actions',items:[]}];
      if(!hasDef)slots.splice(1,1);
      ul.innerHTML='';
      NODES.filter(n=>on.has(n.k)).forEach(n=>{
        const slot=slots.find(s=>s.sel&&matches(n,s.sel))||slots.find(s=>!s.sel);
        if(slot){slot.items.push(n);log(ul,`${esc(n.src)} → <span class="hl">${slot.sel?`select="${esc(slot.sel)}"`:'&lt;ng-content /&gt;'}</span>`)}
        else log(ul,`${esc(n.src)} → <span class="content-projection-lost">${tx('kein passender Slot – nicht gerendert','no matching slot – not rendered')}</span>`);
      });
      const part=(s,cls)=>{
        if(!s)return '';
        const body=s.items.length?s.items.map(n=>`<${n.tag==='app-card-actions'?'div':n.tag} class="content-projection-${n.k}">${n.html}</${n.tag==='app-card-actions'?'div':n.tag}>`).join(''):(s.fallback?`<span class="content-projection-fb">${s.fallback}</span>`:'');
        return `<div class="content-projection-slot ${cls}"><span class="content-projection-lbl">${s.sel?esc(s.sel):'default'}</span>${body}</div>`;
      };
      $('#content-projection-card',root).innerHTML=part(slots.find(s=>s.sel==='[card-title]'),'')+part(slots.find(s=>!s.sel),'')+part(slots.find(s=>s.sel==='app-card-actions'),'');
      $('#content-projection-tpl',root).textContent=`<header>\n  <ng-content select="[card-title]">\n    ${tx('Ohne Titel','Untitled')}\n  </ng-content>\n</header>${hasDef?'\n<ng-content />':''}\n<footer>\n  <ng-content select="app-card-actions" />\n</footer>`;
    };
    root.addEventListener('change',render);
    render();
  },
  css:`.content-projection-src{display:grid;gap:2px}.content-projection-def{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.content-projection-card{border:1.5px solid var(--line-strong);border-radius:var(--radius-lg);padding:8px;display:grid;gap:8px}.content-projection-slot{position:relative;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);padding:22px 10px 8px;min-height:44px}.content-projection-lbl{position:absolute;top:3px;left:8px;font:600 .6875rem/1.2 var(--font-mono);color:var(--brand)}.content-projection-slot h3{margin:0;font-size:1.0625rem}.content-projection-slot p{margin:0 0 6px}.content-projection-fine{font-size:.8125rem;color:var(--muted)}.content-projection-fb{color:var(--muted);font-style:italic}.content-projection-tpl{margin:0 0 10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);font:500 .75rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}.content-projection-lost{color:var(--danger)}`,
  bad:{code:`@Component({
  selector: 'app-card',
  template: \`
    <h3>{{ title() }}</h3>
    <p>{{ text() }}</p>
    @if (buttonLabel()) {
      <button (click)="action.emit()">{{ buttonLabel() }}</button>
    }
  \`,
})
export class Card {
  title = input('');
  text = input('');
  buttonLabel = input<string>();
  action = output();
}`,
    note:tx('Jede neue Variante (Icon im Titel, zweiter Button, Link statt Button) braucht einen weiteren Input. Die Karte wird zum Formular aus Strings, und der Elternteil verliert die Kontrolle über sein Markup.','Every new variant (icon in the title, second button, link instead of button) needs another input. The card turns into a form of strings, and the parent loses control of its markup.')},
  good:{code:`@Component({
  selector: 'app-card',
  template: \`
    <header><ng-content select="[card-title]">Untitled</ng-content></header>
    <ng-content />
    <footer><ng-content select="app-card-actions" /></footer>
  \`,
})
export class Card {}

// parent:
// <app-card>
//   <h3 card-title>Deal of the week</h3>
//   <p>Coffee beans from Colombia.</p>
//   <app-card-actions><button (click)="buy()">Buy</button></app-card-actions>
// </app-card>`,
    note:tx('Die Karte bestimmt Rahmen und Reihenfolge, der Elternteil den Inhalt – inklusive eigener Bindungen und Events, die in <em>seinem</em> Kontext laufen.','The card decides frame and order, the parent the content – including its own bindings and events, which run in <em>its</em> context.')},
  do:tx(['Slots für Layout-Komponenten: Karte, Dialog, Panel, Listeneintrag.','Selektoren über Attribute (<code>[card-title]</code>) oder eigene Elemente wählen – das liest sich im Elternteil klar.','Genau einen Standard-Slot ohne <code>select</code> vorsehen, wenn beliebiger Inhalt erlaubt ist.'],
        ['Use slots for layout components: card, dialog, panel, list item.','Pick selectors via attributes (<code>[card-title]</code>) or own elements – that reads clearly in the parent.','Provide exactly one default slot without <code>select</code> if arbitrary content is allowed.']),
  dont:tx(['<code>&lt;ng-content&gt;</code> nicht in <code>@if</code>/<code>@for</code> legen: Der Inhalt wird trotzdem immer erzeugt, auch wenn der Slot versteckt ist, und er lässt sich nicht mehrfach rendern. Für bedingten Inhalt ein <code>TemplateRef</code> übergeben.','Keine dynamischen Werte in <code>select</code> oder <code>ngProjectAs</code> – beides ist statisch.','Nicht erwarten, dass projizierte Komponenten ohne Slot „irgendwo“ auftauchen – ohne passenden Slot werden sie nicht gerendert.'],
        ['Don’t put <code>&lt;ng-content&gt;</code> inside <code>@if</code>/<code>@for</code>: the content is always created anyway, even if the slot is hidden, and it can’t be rendered multiple times. For conditional content, pass a <code>TemplateRef</code>.','No dynamic values in <code>select</code> or <code>ngProjectAs</code> – both are static.','Don’t expect projected components without a slot to show up “somewhere” – without a matching slot they aren’t rendered.']),
  why:tx('<p>Projizierter Inhalt gehört zur View des <strong>Elternteils</strong>: Er wird dort erzeugt, seine Bindungen lesen die Signals des Elternteils, und die Kind-Komponente verschiebt nur die fertigen DOM-Knoten an die Stelle ihres Platzhalters. Die Zuordnung zu den Slots passiert beim Kompilieren anhand der Selektoren – darum sind sie statisch.</p><p>Daraus folgt auch die wichtigste Einschränkung: Das Kind kann Inhalt nicht „bei Bedarf“ erzeugen oder mehrfach rendern. Genau dafür gibt es <code>ng-template</code> mit <code>contentChild(TemplateRef)</code> und <code>ngTemplateOutlet</code>.</p>',
           '<p>Projected content belongs to the <strong>parent’s</strong> view: it’s created there, its bindings read the parent’s signals, and the child component only moves the finished DOM nodes to the location of its placeholder. The assignment to slots happens at compile time based on the selectors – that’s why they’re static.</p><p>This leads to the most important limitation: the child can’t create content “on demand” or render it multiple times. That’s exactly what <code>ng-template</code> with <code>contentChild(TemplateRef)</code> and <code>ngTemplateOutlet</code> are for.</p>'),
  test:{code:`@Component({
  imports: [Card],
  template: \`<app-card><p>Body</p></app-card>\`,
})
class Host {}

it('shows the fallback title and projects the body', async () => {
  const fixture = TestBed.createComponent(Host);
  await fixture.whenStable();
  const el: HTMLElement = fixture.nativeElement;
  expect(el.querySelector('header')?.textContent).toContain('Untitled');
  expect(el.textContent).toContain('Body');
});`,note:tx('Projektion testest du über eine kleine Host-Komponente, die Inhalt hineinlegt – genau wie ein echter Elternteil.','You test projection via a small host component that puts content in – just like a real parent.')}
});

LESSONS.push({
  id:'host-bindings', cat:'components', order:50,
  title:tx('Das Host-Element: host statt @HostBinding','The host element: host instead of @HostBinding'),
  short:tx('Attribute, Klassen und Listener am eigenen Element gehören in die host-Metadaten – @HostBinding und @HostListener gibt es nur noch aus Kompatibilitätsgründen.','Attributes, classes and listeners on the component’s own element belong in the host metadata – @HostBinding and @HostListener only remain for backwards compatibility.'),
  keys:'host hostbinding hostlistener host element attr class style listener document:keydown window:resize role aria tabindex',
  status:'stable',
  refs:[[tx('Angular-Doku: Binding to the host element','Angular docs: Binding to the host element'),'https://angular.dev/guide/components/host-elements#binding-to-the-host-element'],
        [tx('Angular-Doku: @HostBinding und @HostListener','Angular docs: The @HostBinding and @HostListener decorators'),'https://angular.dev/guide/components/host-elements#the-hostbinding-and-hostlistener-decorators'],
        [tx('Angular-Doku: Binding collisions','Angular docs: Binding collisions'),'https://angular.dev/guide/components/host-elements#binding-collisions']],
  rule:tx('Das Element <code>&lt;app-switch&gt;</code> selbst ist das Host-Element. Seine Rolle, ARIA-Zustände, Klassen und Listener deklarierst du im <code>host</code>-Objekt von <code>@Component</code> – mit derselben Syntax wie im Template. Die Doku sagt klar: immer <code>host</code> bevorzugen; die Dekoratoren existieren nur noch für Abwärtskompatibilität.','The element <code>&lt;app-switch&gt;</code> itself is the host element. Declare its role, ARIA states, classes and listeners in the <code>host</code> object of <code>@Component</code> – with the same syntax as in the template. The docs are clear: always prefer <code>host</code>; the decorators only exist for backwards compatibility.'),
  apis:[['host: { attr: \'value\' }','role: \'switch\'',tx('Statisches Attribut am Host.','Static attribute on the host.')],
        ['[attr.x] / [class.x] / [style.x]','\'[attr.aria-checked]\': \'on()\'',tx('Dynamische Bindung – der Ausdruck läuft im Kontext der Komponente. <code>null</code> entfernt ein Attribut.','Dynamic binding – the expression runs in the component’s context. <code>null</code> removes an attribute.')],
        ['(event)','\'(keydown.space)\': \'toggle()\'',tx('Listener am Host, inklusive Tasten-Modifier.','Listener on the host, including key modifiers.')],
        ['(document:… / window:… / body:…)','\'(document:keydown.escape)\': \'close()\'',tx('Globaler Listener, wird mit der Komponente automatisch entfernt.','Global listener, removed automatically with the component.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Die Komponente im DOM','The component in the DOM')}</h3>
    <p class="host-bindings-stage"><app-switch id="host-bindings-el"><span class="host-bindings-knob" aria-hidden="true"></span> ${tx('Dunkelmodus','Dark mode')}</app-switch></p>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="host-bindings-dis">${tx('Elternteil: disabled umschalten','Parent: toggle disabled')}</button>
      <button type="button" class="btn btn-secondary" id="host-bindings-esc">${tx('Escape im Dokument auslösen','Dispatch Escape on document')}</button>
    </div>
    <p class="hint">${tx('Das Element ist selbst bedienbar: Klick, Leertaste, Enter.','The element itself is operable: click, space, enter.')}</p>
  </div>
  <div class="sim-card"><h3>${tx('Inspektor: Host-Element','Inspector: host element')}</h3>
    <pre class="host-bindings-dom" id="host-bindings-dom"></pre>
    <ul class="sim-log" id="host-bindings-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Schalte per Tastatur um und beobachte <code>aria-checked</code> und die Klasse. Mit <code>disabled</code> verschwindet das Element aus der Tab-Reihenfolge, und <code>aria-disabled</code> erscheint – bei <code>false</code> wird es dank <code>|| null</code> ganz entfernt. Escape wirkt über den <code>document:</code>-Listener, egal wo der Fokus ist.','Try: toggle with the keyboard and watch <code>aria-checked</code> and the class. With <code>disabled</code> the element leaves the tab order and <code>aria-disabled</code> appears – on <code>false</code> it’s removed entirely thanks to <code>|| null</code>. Escape works via the <code>document:</code> listener, wherever the focus is.')}</p>`,
  init(root){
    const {signal,effect,untracked,log,flash}=NG;
    const el=$('#host-bindings-el',root),ul=$('#host-bindings-log',root),dom=$('#host-bindings-dom',root);
    const on=signal(false,{name:'on'}),disabled=signal(false,{name:'disabled'});
    /* host: statische Attribute einmal setzen */
    el.setAttribute('role','switch');
    const setAttr=(n,v)=>{if(v===null||v===undefined)el.removeAttribute(n);else el.setAttribute(n,String(v))};
    /* host: dynamische Bindungen – wie ein Template-Update nach jeder Signal-Änderung */
    const bindings=effect(()=>{
      setAttr('aria-checked',on());
      setAttr('aria-disabled',disabled()||null);
      setAttr('tabindex',disabled()?-1:0);
      el.classList.toggle('is-on',on());el.classList.toggle('is-disabled',disabled());
      const attrs=[...el.attributes].filter(a=>a.name!=='id').map(a=>`\n  ${a.name}="${a.value}"`).join('');
      dom.textContent=`<app-switch${attrs}>`;
      flash(dom);
    },{name:'host bindings'});
    const toggle=src=>{if(untracked(disabled)){log(ul,`${src} → toggle() – ${tx('disabled, nichts passiert','disabled, nothing happens')}`);return}on.update(v=>!v);log(ul,`${src} → <span class="hl">toggle()</span> → on = ${untracked(on)}`)};
    /* host: Listener */
    const onClick=()=>toggle('(click)');
    const onKey=e=>{if(e.key===' '){e.preventDefault();toggle('(keydown.space)')}else if(e.key==='Enter')toggle('(keydown.enter)')};
    const onDocKey=e=>{if(e.key==='Escape'&&untracked(on)){on.set(false);log(ul,`<span class="hl">(document:keydown.escape)</span> → on = false`)}};
    el.addEventListener('click',onClick);el.addEventListener('keydown',onKey);
    document.addEventListener('keydown',onDocKey);
    root.addEventListener('click',e=>{
      if(e.target.closest('#host-bindings-dis')){disabled.update(v=>!v);log(ul,`${tx('Input','input')} disabled ← ${untracked(disabled)}`)}
      if(e.target.closest('#host-bindings-esc'))document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));
    });
    return ()=>{bindings.destroy();document.removeEventListener('keydown',onDocKey)};
  },
  css:`.host-bindings-stage{margin:0 0 12px}#host-bindings-el{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px 6px 6px;border:1.5px solid var(--line-strong);border-radius:999px;cursor:pointer;user-select:none;font-weight:700}#host-bindings-el:focus-visible{outline:3px solid var(--brand);outline-offset:2px}.host-bindings-knob{width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line-strong);position:relative}.host-bindings-knob::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--muted)}#host-bindings-el.is-on .host-bindings-knob{background:var(--brand-soft);border-color:var(--brand)}#host-bindings-el.is-on .host-bindings-knob::after{left:21px;background:var(--brand)}#host-bindings-el.is-disabled{opacity:.55;cursor:not-allowed}@media (prefers-reduced-motion:no-preference){.host-bindings-knob::after{transition:left .2s}}.host-bindings-dom{margin:0 0 10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);font:500 .8125rem/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}.host-bindings-dom.flash{border-color:var(--brand)}`,
  bad:{code:`export class Switch {
  @Input() disabled = false;
  @HostBinding('attr.role') role = 'switch';
  @HostBinding('attr.aria-checked') on = false;
  @HostBinding('class.is-on') get isOn() { return this.on; }

  @HostListener('click') toggle() { this.on = !this.on; }
  @HostListener('document:keydown.escape') close() { this.on = false; }
}`,
    note:tx('Funktioniert, ist aber über die Klasse verstreut und an Felder gebunden, die keine Signals sind. Die Doku nennt die Dekoratoren ausdrücklich nur noch für Abwärtskompatibilität – veraltet (<code>@deprecated</code>) sind sie in Angular 22 aber nicht.','Works, but it’s scattered across the class and bound to fields that aren’t signals. The docs explicitly keep the decorators only for backwards compatibility – but in Angular 22 they aren’t deprecated (<code>@deprecated</code>).')},
  good:{code:`@Component({
  selector: 'app-switch',
  host: {
    role: 'switch',
    '[attr.aria-checked]': 'on()',
    '[attr.aria-disabled]': 'disabled() || null',
    '[attr.tabindex]': 'disabled() ? -1 : 0',
    '[class.is-on]': 'on()',
    '(click)': 'toggle()',
    '(keydown.space)': 'toggle(); $event.preventDefault()',
    '(keydown.enter)': 'toggle()',
    '(document:keydown.escape)': 'on.set(false)',
  },
  template: \`<span class="knob"></span><ng-content />\`,
})
export class Switch {
  on = model(false);
  disabled = input(false, { transform: booleanAttribute });

  toggle() {
    if (!this.disabled()) this.on.update(v => !v);
  }
}`,
    note:tx('Alles, was am Host passiert, steht an einer Stelle und liest Signals. Kein Wrapper-<code>&lt;button&gt;</code> nötig – das Host-Element trägt Rolle, Zustand und Tastaturbedienung selbst.','Everything that happens on the host is in one place and reads signals. No wrapper <code>&lt;button&gt;</code> needed – the host element carries role, state and keyboard handling itself.')},
  do:tx(['ARIA-Rolle und -Zustände am Host setzen, wenn die Komponente selbst das bedienbare Element ist.','Mit <code>|| null</code> Attribute entfernen statt <code>"false"</code> hineinzuschreiben, wo die Anwesenheit zählt.','Globale Listener (<code>document:</code>, <code>window:</code>) über <code>host</code> anmelden – sie werden mit der Komponente automatisch entfernt.'],
        ['Set ARIA role and states on the host when the component itself is the operable element.','Use <code>|| null</code> to remove attributes instead of writing <code>"false"</code> where presence matters.','Register global listeners (<code>document:</code>, <code>window:</code>) via <code>host</code> – they’re removed automatically with the component.']),
  dont:tx(['Keine neuen <code>@HostBinding</code>/<code>@HostListener</code> schreiben.','Nicht per <code>ElementRef.nativeElement.setAttribute()</code> am eigenen Host herumschreiben – das umgeht Angular und SSR.','Nicht vergessen: Ein Host mit <code>role</code> und Klick-Listener braucht auch <code>tabindex</code> und Tastatur-Listener.'],
        ['Don’t write new <code>@HostBinding</code>/<code>@HostListener</code>.','Don’t write to your own host via <code>ElementRef.nativeElement.setAttribute()</code> – that bypasses Angular and SSR.','Don’t forget: a host with <code>role</code> and a click listener also needs <code>tabindex</code> and keyboard listeners.']),
  why:tx('<p>Host-Bindungen werden wie Template-Bindungen kompiliert und bei jeder Change Detection der Komponente geprüft. Liest der Ausdruck Signals, weiß Angular genau, wann sich etwas ändern kann. Weil das <code>host</code>-Objekt Teil der Metadaten ist, sieht man auf einen Blick, was die Komponente mit ihrem eigenen Element macht – auch ohne die Klasse zu lesen.</p><p>Setzt der Elternteil dasselbe Attribut oder dieselbe Eigenschaft, gilt eine Regel: Statische Werte der Instanz schlagen statische Host-Werte, dynamische schlagen statische, und bei zwei dynamischen gewinnt die Host-Bindung der Komponente.</p>',
           '<p>Host bindings are compiled like template bindings and checked on every change detection of the component. If the expression reads signals, Angular knows exactly when something can change. Because the <code>host</code> object is part of the metadata, you can see at a glance what the component does to its own element – without reading the class.</p><p>If the parent sets the same attribute or property, there’s a rule: static instance values beat static host values, dynamic beats static, and between two dynamic ones the component’s host binding wins.</p>'),
  test:{code:`it('reflects the state on the host element', async () => {
  const fixture = TestBed.createComponent(Switch);
  const host: HTMLElement = fixture.nativeElement;
  await fixture.whenStable();
  expect(host.getAttribute('role')).toBe('switch');
  expect(host.getAttribute('aria-checked')).toBe('false');

  host.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));
  await fixture.whenStable();
  expect(host.getAttribute('aria-checked')).toBe('true');
  expect(host.classList).toContain('is-on');
});`,note:tx('<code>fixture.nativeElement</code> <em>ist</em> das Host-Element – Attribute und Listener prüfst du direkt daran.','<code>fixture.nativeElement</code> <em>is</em> the host element – you check attributes and listeners directly on it.')}
});

LESSONS.push({
  id:'model-inputs', cat:'components', order:30,
  title:tx('Zwei-Wege-Bindung mit model()','Two-way binding with model()'),
  short:tx('model() ist ein schreibbarer Input: Das Kind setzt ihn, Angular meldet es über valueChange, und [(value)] hält den Elternteil synchron.','model() is a writable input: the child sets it, Angular reports it via valueChange, and [(value)] keeps the parent in sync.'),
  keys:'model two-way binding zwei-wege [()] banana in a box valuechange model.required modelsignal input output',
  since:'Angular 17.2', status:'stable',
  refs:[[tx('Angular-Doku: Two-way binding between components','Angular docs: Two-way binding between components'),'https://angular.dev/guide/templates/two-way-binding#two-way-binding-between-components'],
        [tx('Angular-Doku: Model inputs','Angular docs: Model inputs'),'https://angular.dev/guide/components/inputs#model-inputs'],
        [tx('Angular-Doku: Wann model inputs?','Angular docs: When to use model inputs'),'https://angular.dev/guide/components/inputs#when-to-use-model-inputs']],
  rule:tx('Soll ein Kind einen Wert <em>ändern</em>, den der Elternteil besitzt (Slider, Toggle, Datumsauswahl), deklariere ihn mit <code>model()</code>. Das ist Input und Output in einem: <code>value</code> kommt herein, jedes <code>value.set()</code> im Kind feuert <code>valueChange</code>, und <code>[(value)]="signal"</code> schreibt es zurück.','If a child should <em>change</em> a value the parent owns (slider, toggle, date picker), declare it with <code>model()</code>. It’s input and output in one: <code>value</code> comes in, every <code>value.set()</code> in the child fires <code>valueChange</code>, and <code>[(value)]="signal"</code> writes it back.'),
  apis:[['model(initial)','model<T>(initial?: T, { alias?, debugName? }): ModelSignal<T>',tx('Schreibbares Signal + Input <code>value</code> + Output <code>valueChange</code>.','Writable signal + input <code>value</code> + output <code>valueChange</code>.')],
        ['model.required()','model.required<T>(): ModelSignal<T>',tx('Der Elternteil muss binden; Lesen vor dem Setzen wirft NG0952.','The parent must bind; reading before it’s set throws NG0952.')],
        ['[(value)]','[(value)]="volume"',tx('„Banana in a box“: <code>[value]="volume()"</code> plus <code>(valueChange)="volume.set($event)"</code> in einem. Das Signal <em>ohne</em> Aufrufklammern binden.','“Banana in a box”: <code>[value]="volume()"</code> plus <code>(valueChange)="volume.set($event)"</code> in one. Bind the signal <em>without</em> parentheses.')]],
  demo:`<div class="sim-card model-inputs-top"><h3>${tx('Eltern-Template','Parent template')}</h3>
  <div class="seg model-inputs-seg" role="group" aria-label="${tx('Art der Bindung','Binding kind')}">
    <button type="button" class="btn btn-secondary model-inputs-mode" data-m="two" aria-pressed="true">[(value)]="volume"</button>
    <button type="button" class="btn btn-secondary model-inputs-mode" data-m="one" aria-pressed="false">[value]="volume()"</button>
  </div>
</div>
<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Elternteil','Parent')}</h3>
    <p class="model-inputs-val">volume() = <span class="sim-node" id="model-inputs-n-p"><b id="model-inputs-p">50</b></span></p>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="model-inputs-pdown">volume − 10</button>
      <button type="button" class="btn btn-secondary" id="model-inputs-pup">volume + 10</button>
    </div>
  </div>
  <div class="sim-card"><h3>VolumeSlider <span class="hint">(${tx('Kind','child')})</span></h3>
    <p class="model-inputs-val">value() = <span class="sim-node" id="model-inputs-n-c"><b id="model-inputs-c">50</b></span></p>
    <div class="model-inputs-bar" aria-hidden="true"><span id="model-inputs-bar"></span></div>
    <div class="sim-row">
      <button type="button" class="btn btn-secondary" id="model-inputs-cdown">value.update(v => v − 5)</button>
      <button type="button" class="btn btn-secondary" id="model-inputs-cup">value.update(v => v + 5)</button>
    </div>
  </div>
  <div class="sim-card"><h3>${tx('Was Angular tut','What Angular does')}</h3>
    <ul class="sim-log" id="model-inputs-log" aria-label="${tx('Protokoll','Log')}"></ul>
  </div>
</div>
<p class="demo-note">${tx('Probier: Mit <code>[(value)]</code> bleiben beide Seiten gleich, egal wer ändert. Schalte auf <code>[value]</code> und ändere im Kind: Nur das Kind weicht ab – bis der Elternteil seinen Wert ändert und damit den lokalen Wert überschreibt.','Try: with <code>[(value)]</code> both sides stay equal, no matter who changes. Switch to <code>[value]</code> and change in the child: only the child deviates – until the parent changes its value and thereby overwrites the local one.')}</p>`,
  init(root){
    const {signal,effect,untracked,log,flash}=NG;
    const ul=$('#model-inputs-log',root);
    let twoWay=true;
    const volume=signal(50,{name:'volume'});
    /* Kleines Modell von model(): schreibbares Signal, set() feuert valueChange nur bei neuem Wert */
    const value=signal(50,{name:'value'});
    const valueChange=[];
    const modelSet=v=>{v=Math.max(0,Math.min(100,v));if(Object.is(untracked(value),v))return;value.set(v);log(ul,`${tx('Kind','child')}: value.set(${v}) → <span class="hl">valueChange.emit(${v})</span>`);valueChange.forEach(l=>l(v))};
    /* Bindung Eltern → Kind: schreibt das Input-Signal direkt, ohne valueChange */
    const down=effect(()=>{const v=volume();untracked(()=>{if(!Object.is(value(),v)){value.set(v);log(ul,`${tx('Eltern → Kind','parent → child')}: <span class="hl">input</span> value ← ${v}`)}})},{name:'binding'});
    /* Bindung Kind → Eltern, nur bei [(value)] */
    valueChange.push(v=>{if(twoWay){log(ul,`${tx('Elternteil','parent')}: volume.set(${v}) ${tx('durch','via')} [( )]`);volume.set(v)}else log(ul,`<span class="t">${tx('niemand hört auf valueChange','nobody listens to valueChange')}</span>`)});
    const view=effect(()=>{
      const p=volume(),c=value();
      $('#model-inputs-p',root).textContent=p;$('#model-inputs-c',root).textContent=c;
      $('#model-inputs-bar',root).style.width=c+'%';
    },{name:'view'});
    let lastP=50,lastC=50;
    const flashes=effect(()=>{const p=volume(),c=value();if(p!==lastP)flash($('#model-inputs-n-p',root));if(c!==lastC)flash($('#model-inputs-n-c',root));lastP=p;lastC=c},{name:'flash'});
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.classList.contains('model-inputs-mode')){twoWay=b.dataset.m==='two';$$('.model-inputs-mode',root).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));log(ul,twoWay?tx('Bindung: [(value)] – zwei Wege','binding: [(value)] – two ways'):tx('Bindung: [value] – nur nach unten','binding: [value] – downward only'))}
      if(b.id==='model-inputs-pdown')volume.update(v=>Math.max(0,v-10));
      if(b.id==='model-inputs-pup')volume.update(v=>Math.min(100,v+10));
      if(b.id==='model-inputs-cdown')modelSet(untracked(value)-5);
      if(b.id==='model-inputs-cup')modelSet(untracked(value)+5);
    });
    return ()=>{down.destroy();view.destroy();flashes.destroy()};
  },
  css:`.model-inputs-top{margin-bottom:16px}.model-inputs-mode{font-family:var(--font-mono);font-size:.8125rem}.model-inputs-mode[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}.model-inputs-seg{display:flex;flex-wrap:wrap;gap:8px}.model-inputs-val{margin:0 0 10px;font-family:var(--font-mono)}.model-inputs-bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:0 0 12px;overflow:hidden}.model-inputs-bar span{display:block;height:100%;background:var(--brand)}@media (prefers-reduced-motion:no-preference){.model-inputs-bar span{transition:width .25s}}`,
  bad:{code:`export class VolumeSlider {
  @Input() value = 0;
  @Output() valueChange = new EventEmitter<number>();

  change(v: number) {
    this.value = v;              // local copy …
    this.valueChange.emit(v);    // … and the event, kept in sync by hand
  }
}

// parent: <app-volume-slider [(value)]="volume" />`,
    note:tx('So hat man Zwei-Wege-Bindung vor <code>model()</code> gebaut. Es funktioniert noch, aber Wert und Ereignis müssen von Hand zusammenpassen – vergisst man das <code>emit</code>, driften Kind und Eltern auseinander.','That’s how two-way binding was built before <code>model()</code>. It still works, but value and event have to be kept in sync by hand – forget the <code>emit</code> and child and parent drift apart.')},
  good:{code:`export class VolumeSlider {
  value = model(0);            // input "value" + output "valueChange"

  change(v: number) {
    this.value.set(v);         // updates locally AND notifies the parent
  }
}

// parent:
volume = signal(50);
// <app-volume-slider [(value)]="volume" />`,
    note:tx('Ein Feld, eine Wahrheit. <code>set()</code> mit gleichem Wert feuert nichts. Der Elternteil kann ein Signal oder eine einfache Eigenschaft binden.','One field, one truth. <code>set()</code> with the same value fires nothing. The parent can bind a signal or a plain property.')},
  do:tx(['<code>model()</code> für UI-Bausteine, die einen Wert bearbeiten: Slider, Switch, Tabs (aktiver Tab), Datumsauswahl.','Im Elternteil das Signal ohne Aufruf binden: <code>[(value)]="volume"</code>.','Für Formulare mit Validierung lieber Angular Forms nehmen – <code>model()</code> ist kein Ersatz für ein <code>FormControl</code>.'],
        ['Use <code>model()</code> for UI pieces that edit a value: slider, switch, tabs (active tab), date picker.','In the parent, bind the signal without calling it: <code>[(value)]="volume"</code>.','For forms with validation prefer Angular forms – <code>model()</code> isn’t a replacement for a <code>FormControl</code>.']),
  dont:tx(['Nicht <code>[(value)]="volume()"</code> schreiben – das bindet einen Wert, keinen beschreibbaren Ort.','Nicht <code>model()</code> nehmen, wenn das Kind den Wert nie ändert – dann ist es ein <code>input()</code>.','Nicht erwarten, dass eine einseitige Bindung <code>[value]</code> lokale Änderungen „festhält“: Ändert der Elternteil, gewinnt er.'],
        ['Don’t write <code>[(value)]="volume()"</code> – that binds a value, not a writable place.','Don’t use <code>model()</code> if the child never changes the value – then it’s an <code>input()</code>.','Don’t expect a one-way binding <code>[value]</code> to “hold on” to local changes: if the parent changes, it wins.']),
  why:tx('<p>Ein <code>ModelSignal</code> ist zugleich <code>WritableSignal</code>, Input-Signal und Output. Schreibt der Elternteil über die Bindung, landet der Wert direkt im Signal – ohne Ereignis. Schreibt das Kind mit <code>set()</code> oder <code>update()</code>, wird der Wert gespeichert und <em>nur bei einer echten Änderung</em> <code>valueChange</code> gefeuert. <code>[(value)]</code> ist Syntaxzucker, der genau dieses Ereignis in das gebundene Signal zurückschreibt.</p><p>Damit gibt es eine Quelle der Wahrheit pro Seite, und die Richtung bleibt klar: Der Elternteil besitzt den Zustand, das Kind darf ihn über einen definierten Kanal ändern. Mit einseitiger Bindung wird daraus ein lokal änderbarer Input – praktisch, aber meist ist dann <code>linkedSignal()</code> ehrlicher.</p>',
           '<p>A <code>ModelSignal</code> is a <code>WritableSignal</code>, an input signal and an output at the same time. When the parent writes via the binding, the value lands directly in the signal – without an event. When the child writes with <code>set()</code> or <code>update()</code>, the value is stored and <code>valueChange</code> fires <em>only on a real change</em>. <code>[(value)]</code> is syntactic sugar that writes exactly this event back into the bound signal.</p><p>That gives one source of truth per side, and the direction stays clear: the parent owns the state, the child may change it through a defined channel. With one-way binding it becomes a locally changeable input – handy, but then <code>linkedSignal()</code> is usually more honest.</p>'),
  test:{code:`it('reports changes to the parent', () => {
  const fixture = TestBed.createComponent(VolumeSlider);
  fixture.componentRef.setInput('value', 50);
  const changes: number[] = [];
  fixture.componentInstance.value.subscribe(v => changes.push(v));

  fixture.componentInstance.change(55);
  fixture.componentInstance.change(55);     // same value → no event
  expect(changes).toEqual([55]);
  expect(fixture.componentInstance.value()).toBe(55);
});`,note:tx('Ein <code>ModelSignal</code> ist auch ein <code>OutputRef</code> – mit <code>subscribe()</code> hörst du direkt auf <code>valueChange</code>.','A <code>ModelSignal</code> is also an <code>OutputRef</code> – with <code>subscribe()</code> you listen to <code>valueChange</code> directly.')}
});

LESSONS.push({
  id:'signal-inputs', cat:'components', order:10,
  title:tx('Signal-Inputs mit input()','Signal inputs with input()'),
  short:tx('Inputs sind schreibgeschützte Signals: input(), input.required(), transform und alias – statt @Input() mit Settern und ngOnChanges.','Inputs are read-only signals: input(), input.required(), transform and alias – instead of @Input() with setters and ngOnChanges.'),
  keys:'input input.required signal input transform booleanattribute numberattribute alias @input required pflicht ngonchanges ng8008 ng0950',
  since:'Angular 17.1', status:'stable',
  refs:[[tx('Angular-Doku: Inputs lesen','Angular docs: Reading inputs'),'https://angular.dev/guide/components/inputs#reading-inputs'],
        [tx('Angular-Doku: Input transforms','Angular docs: Input transforms'),'https://angular.dev/guide/components/inputs#input-transforms'],
        [tx('Angular-Doku: Input aliases','Angular docs: Input aliases'),'https://angular.dev/guide/components/inputs#input-aliases']],
  rule:tx('Deklariere Inputs mit <code>input()</code> oder <code>input.required()</code>. Du bekommst ein Signal, das nur der Elternteil schreibt – im Kind liest du es, leitest mit <code>computed()</code> ab und reagierst ohne <code>ngOnChanges</code>. Umwandlungen wie „Attribut vorhanden = <code>true</code>“ gehören in <code>transform</code>.','Declare inputs with <code>input()</code> or <code>input.required()</code>. You get a signal only the parent writes – in the child you read it, derive with <code>computed()</code> and react without <code>ngOnChanges</code>. Conversions like “attribute present = <code>true</code>” belong in <code>transform</code>.'),
  apis:[['input(initial)','input<T>(initial: T, { alias?, transform?, debugName? }): InputSignal<T>',tx('Optionaler Input mit Startwert. <code>input&lt;T&gt;()</code> ohne Startwert ist <code>T | undefined</code>.','Optional input with an initial value. <code>input&lt;T&gt;()</code> without one is <code>T | undefined</code>.')],
        ['input.required()','input.required<T>({ alias?, transform? }): InputSignal<T>',tx('Pflicht-Input: fehlt die Bindung, meldet der Compiler NG8008. Lesen vor dem ersten Setzen wirft NG0950.','Required input: if the binding is missing, the compiler reports NG8008. Reading before it’s first set throws NG0950.')],
        ['transform','(value: TransformT) => T',tx('Reine Funktion, die jeden gebundenen Wert umwandelt. Eingebaut: <code>booleanAttribute</code>, <code>numberAttribute</code>.','Pure function that converts every bound value. Built in: <code>booleanAttribute</code>, <code>numberAttribute</code>.')],
        ['alias','{ alias: \'publicName\' }',tx('Anderer Name im Template als in der Klasse – selten nötig, z. B. bei Kollision mit DOM-Eigenschaften.','A different name in the template than in the class – rarely needed, e.g. on collision with DOM properties.')]],
  demo:`<div class="sim-grid">
  <div class="sim-card"><h3>${tx('Eltern-Template','Parent template')}</h3>
    <pre class="signal-inputs-tpl" id="signal-inputs-tpl"></pre>
    <div class="sim-row">
      <button type="button" class="btn btn-primary" id="signal-inputs-more">amount + 1</button>
